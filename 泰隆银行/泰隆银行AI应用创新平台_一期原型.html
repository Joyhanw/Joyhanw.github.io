
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泰隆银行 · AI应用创新平台</title>
<style>
/* ============ 全局变量 ============ */
:root{
  --primary:#1A66FF;
  --primary-dark:#0F47C7;
  --primary-light:#E8F0FF;
  --success:#00B42A;
  --warning:#FF7D00;
  --danger:#F53F3F;
  --info:#722ED1;
  --text-1:#1D2129;
  --text-2:#4E5969;
  --text-3:#86909C;
  --text-4:#C9CDD4;
  --bg-page:#F2F3F5;
  --bg-card:#FFFFFF;
  --border:#E5E6EB;
  --border-light:#F0F1F3;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow:0 2px 8px rgba(0,0,0,.06);
  --shadow-lg:0 8px 24px rgba(0,0,0,.12);
  --radius:8px;
  --radius-sm:6px;
  --radius-lg:12px;
  --sidebar-w:220px;
  --header-h:56px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;
  background:var(--bg-page);color:var(--text-1);font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
ul{list-style:none}
input,textarea,select{font-family:inherit;font-size:13px;outline:none}

/* ============ 布局 ============ */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.layout{display:flex;flex:1;overflow:hidden}
.header{
  height:var(--header-h);background:#0F2B46;color:#fff;
  display:flex;align-items:center;padding:0 20px;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:100;
}
.logo{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;letter-spacing:.5px}
.logo .logo-icon{
  width:30px;height:30px;background:linear-gradient(135deg,#1A66FF,#00D4FF);
  border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:bold;
}
.logo .sub{font-size:11px;color:rgba(255,255,255,.6);font-weight:400;margin-left:4px}
.header-nav{display:flex;gap:24px;margin-left:40px;flex:1}
.header-nav a{color:rgba(255,255,255,.7);font-size:13px;padding:6px 0;position:relative;transition:.2s;cursor:pointer}
.header-nav a:hover{color:#fff}
.header-nav a.active{color:#fff}
.header-nav a.active::after{content:'';position:absolute;bottom:-19px;left:0;right:0;height:2px;background:#1A66FF}
.header-right{display:flex;align-items:center;gap:16px}
.env-tag{background:rgba(0,180,42,.15);color:#5BFF8A;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid rgba(0,180,42,.3)}
.user-dropdown{position:relative}
.user-info{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:.2s}
.user-info:hover{background:rgba(255,255,255,.1)}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#FF7D00,#FFB400);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff}
.user-name{font-size:13px}
.user-role{font-size:11px;color:rgba(255,255,255,.6)}
.role-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:220px;background:#fff;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:6px;z-index:1000;display:none}
.role-menu.open{display:block}
.role-menu-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;transition:.15s}
.role-menu-item:hover{background:#F2F3F5}
.role-menu-item.active{background:#E8F0FF}
.role-menu-item .rmi-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;flex-shrink:0}
.role-menu-item .rmi-name{font-size:13px;color:var(--text-1);font-weight:500}
.role-menu-item .rmi-role{font-size:11px;color:var(--text-3)}
.role-menu-item .rmi-check{margin-left:auto;color:var(--primary);font-size:14px;visibility:hidden}
.role-menu-item.active .rmi-check{visibility:visible}
/* 通知下拉 */
.notif-dropdown{position:relative}
.notif-badge{position:absolute;top:-2px;right:-4px;background:#F53F3F;color:#fff;font-size:9px;padding:1px 5px;border-radius:10px;min-width:16px;text-align:center;border:2px solid #1D2129;font-weight:600}
.notif-menu{position:absolute;top:calc(100% + 6px);right:0;width:340px;background:#fff;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.16);z-index:1000;display:none;overflow:hidden}
.notif-menu.open{display:block}
.notif-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border-light)}
.notif-head-title{font-size:13px;font-weight:600;color:var(--text-1)}
.notif-head-action{font-size:11px;color:var(--primary);cursor:pointer}
.notif-list{max-height:360px;overflow-y:auto}
.notif-item{display:flex;gap:10px;padding:12px 14px 12px 18px;border-bottom:1px solid var(--border-light);cursor:pointer;transition:.15s;position:relative}
.notif-item:hover{background:#F7F8FA}
.notif-item.unread::before{content:'';position:absolute;left:6px;top:18px;width:4px;height:4px;border-radius:50%;background:var(--danger)}
.notif-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0}
.notif-body{flex:1;min-width:0}
.notif-title{font-size:13px;color:var(--text-1);font-weight:500;line-height:1.4}
.notif-item.unread .notif-title{font-weight:600}
.notif-desc{font-size:11px;color:var(--text-3);margin-top:3px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notif-time{font-size:10px;color:var(--text-4);margin-top:4px}
.notif-foot{text-align:center;padding:10px;font-size:12px;color:var(--text-3);cursor:pointer;border-top:1px solid var(--border-light)}
.notif-foot:hover{color:var(--primary)}
.icon-btn{color:rgba(255,255,255,.7);font-size:16px;padding:4px;border-radius:4px;transition:.2s;cursor:pointer}
.icon-btn:hover{color:#fff;background:rgba(255,255,255,.1)}
.sidebar{width:var(--sidebar-w);background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:#E5E6EB;border-radius:2px}
.menu-group{padding:8px 0;border-bottom:1px solid var(--border-light)}
.menu-group-title{font-size:11px;color:var(--text-3);padding:8px 16px 4px;letter-spacing:1px;text-transform:uppercase}
.menu-item{display:flex;align-items:center;gap:10px;padding:9px 16px;color:var(--text-2);font-size:13px;cursor:pointer;transition:.15s;border-left:2px solid transparent}
.menu-item:hover{background:var(--primary-light);color:var(--primary)}
.menu-item.active{background:var(--primary-light);color:var(--primary);font-weight:500;border-left-color:var(--primary)}
.menu-item .mi-icon{font-size:15px;width:18px;text-align:center}
.menu-item .mi-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
.main{flex:1;overflow-y:auto;background:var(--bg-page)}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:#D0D0D0;border-radius:3px}
.page{padding:20px 24px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-title{font-size:18px;font-weight:600;color:var(--text-1)}
.page-sub{font-size:12px;color:var(--text-3);margin-top:2px}

/* 通用组件 */
.card{background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow-sm);border:1px solid var(--border-light)}
.card-head{padding:14px 18px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:14px;font-weight:600;color:var(--text-1)}
.card-body{padding:18px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-sm);font-size:13px;background:#fff;color:var(--text-2);border:1px solid var(--border);transition:.15s;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-ghost{background:transparent;border:none;color:var(--primary)}
.btn-ghost:hover{background:var(--primary-light)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-lg{padding:10px 22px;font-size:14px}
.tag{display:inline-flex;align-items:center;padding:2px 8px;font-size:11px;border-radius:4px;line-height:1.5}
.tag-primary{background:var(--primary-light);color:var(--primary)}
.tag-success{background:#E8FFEA;color:var(--success)}
.tag-warning{background:#FFF7E8;color:var(--warning)}
.tag-danger{background:#FFECE8;color:var(--danger)}
.tag-info{background:#F2EDFF;color:var(--info)}
.tag-gray{background:#F2F3F5;color:var(--text-3)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:var(--radius);padding:18px;border:1px solid var(--border-light);position:relative;overflow:hidden;transition:.2s}
.stat-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.stat-card .sc-icon{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.stat-card .sc-label{font-size:12px;color:var(--text-3);margin-bottom:8px}
.stat-card .sc-value{font-size:24px;font-weight:600;color:var(--text-1);line-height:1.2}
.stat-card .sc-trend{font-size:11px;margin-top:6px;display:flex;align-items:center;gap:3px}
.trend-up{color:var(--success)}
.trend-down{color:var(--danger)}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{background:#FAFBFC;color:var(--text-3);font-weight:500;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border-light);font-size:12px;white-space:nowrap}
.table td{padding:11px 12px;border-bottom:1px solid var(--border-light);color:var(--text-2)}
.table tr:hover td{background:#FAFBFC}
.table tr:last-child td{border-bottom:none}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search-input{width:240px;padding:7px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff}
.search-input:focus{border-color:var(--primary)}
.select{padding:7px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;color:var(--text-2);cursor:pointer}

/* 工作台 */
.welcome-bar{background:linear-gradient(135deg,#1A66FF 0%,#0F47C7 100%);border-radius:var(--radius-lg);padding:24px;color:#fff;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;position:relative;overflow:hidden}
.welcome-bar::before{content:'';position:absolute;right:-40px;top:-40px;width:240px;height:240px;background:radial-gradient(circle,rgba(255,255,255,.15) 0%,transparent 70%);border-radius:50%}
.welcome-bar .wb-title{font-size:20px;font-weight:600;margin-bottom:6px}
.welcome-bar .wb-sub{font-size:13px;color:rgba(255,255,255,.8)}
.welcome-bar .wb-actions{display:flex;gap:10px;position:relative;z-index:1}
.welcome-bar .btn{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.3)}
.welcome-bar .btn:hover{background:rgba(255,255,255,.3);border-color:rgba(255,255,255,.5);color:#fff}
.quick-entry{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.qe-card{background:#fff;border-radius:var(--radius);padding:20px;border:1px solid var(--border-light);cursor:pointer;transition:.2s;display:flex;align-items:center;gap:14px}
.qe-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--primary)}
.qe-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.qe-text .qe-title{font-size:14px;font-weight:600;color:var(--text-1);margin-bottom:2px}
.qe-text .qe-desc{font-size:12px;color:var(--text-3)}
.notice-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border-light)}
.notice-item:last-child{border-bottom:none}
.notice-dot{width:6px;height:6px;border-radius:50%;background:var(--primary);margin-top:6px;flex-shrink:0}
.notice-dot.read{background:var(--text-4)}
.notice-content{flex:1}
.notice-title{font-size:13px;color:var(--text-1);margin-bottom:2px}
.notice-time{font-size:11px;color:var(--text-3)}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.app-card{background:#fff;border-radius:var(--radius);padding:16px;border:1px solid var(--border-light);cursor:pointer;transition:.2s}
.app-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.app-card .ac-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.app-card .ac-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.app-card .ac-name{font-size:14px;font-weight:600;color:var(--text-1)}
.app-card .ac-ver{font-size:11px;color:var(--text-3)}
.app-card .ac-desc{font-size:12px;color:var(--text-2);margin-bottom:10px;line-height:1.5;height:36px;overflow:hidden}
.app-card .ac-foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text-3)}

/* AI助手 */
.ai-fab{position:fixed;right:24px;bottom:96px;width:52px;height:52px;background:linear-gradient(135deg,#1A66FF,#722ED1);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;cursor:pointer;box-shadow:0 8px 24px rgba(26,102,255,.4);z-index:1000;transition:.2s}
.ai-fab:hover{transform:scale(1.08)}
.ai-panel{position:fixed;right:24px;bottom:96px;width:380px;height:580px;background:#fff;border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.2);z-index:1001;display:none;flex-direction:column;overflow:hidden;animation:slideUp .25s ease}
.ai-panel.open{display:flex}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.ai-head{background:linear-gradient(135deg,#1A66FF,#722ED1);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.ai-head .ah-info{display:flex;align-items:center;gap:10px}
.ai-head .ah-avatar{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:16px}
.ai-head .ah-name{font-size:14px;font-weight:600}
.ai-head .ah-status{font-size:11px;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:4px}
.ai-head .ah-status::before{content:'';width:6px;height:6px;background:#5BFF8A;border-radius:50%}
.ai-head .ah-close{cursor:pointer;font-size:18px;padding:4px}
.ai-body{flex:1;overflow-y:auto;padding:16px;background:#F7F8FA}
.ai-body::-webkit-scrollbar{width:4px}
.ai-body::-webkit-scrollbar-thumb{background:#D0D0D0;border-radius:2px}
.ai-msg{margin-bottom:14px;display:flex;gap:8px}
.ai-msg.user{flex-direction:row-reverse}
.ai-msg .am-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.ai-msg.bot .am-avatar{background:linear-gradient(135deg,#1A66FF,#722ED1)}
.ai-msg.user .am-avatar{background:linear-gradient(135deg,#FF7D00,#FFB400)}
.ai-msg .am-bubble{max-width:75%;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.6}
.ai-msg.bot .am-bubble{background:#fff;border:1px solid var(--border-light);color:var(--text-1);border-top-left-radius:2px}
.ai-msg.user .am-bubble{background:var(--primary);color:#fff;border-top-right-radius:2px}
.ai-typing{display:inline-flex;gap:3px;padding:4px 0}
.ai-typing span{width:6px;height:6px;background:#C9CDD4;border-radius:50%;animation:typing 1.2s infinite}
.ai-typing span:nth-child(2){animation-delay:.2s}
.ai-typing span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.ai-quick{padding:10px 12px;border-top:1px solid var(--border-light);background:#fff}
.ai-quick-title{font-size:11px;color:var(--text-3);margin-bottom:6px}
.ai-quick-list{display:flex;flex-wrap:wrap;gap:6px}
.ai-quick-item{font-size:11px;padding:4px 10px;background:var(--primary-light);color:var(--primary);border-radius:12px;cursor:pointer;transition:.15s}
.ai-quick-item:hover{background:var(--primary);color:#fff}
.ai-input{padding:12px;border-top:1px solid var(--border-light);background:#fff;display:flex;gap:8px}
.ai-input textarea{flex:1;border:1px solid var(--border);border-radius:8px;padding:8px 10px;resize:none;height:40px;font-size:13px}
.ai-input textarea:focus{border-color:var(--primary)}
.ai-send{width:40px;background:var(--primary);color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:.15s}
.ai-send:hover{background:var(--primary-dark)}
.req-card-inline{background:#F8F9FF;border:1px solid #D6E4FF;border-radius:8px;padding:12px;margin-top:8px;font-size:12px}
.req-card-inline .rci-title{font-weight:600;color:var(--primary);margin-bottom:8px;font-size:13px}
.req-card-inline .rci-row{margin-bottom:6px}
.req-card-inline .rci-label{color:var(--text-3);margin-right:6px}
.req-card-inline .rci-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.req-card-inline .rci-tag{background:#fff;border:1px solid var(--border);padding:1px 6px;border-radius:3px;font-size:11px}

/* 抽屉 */
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;animation:fade .2s}
.drawer-mask.open{display:block}
.drawer{position:fixed;right:0;top:0;bottom:0;width:720px;background:#fff;z-index:201;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:16px 20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;background:#FAFBFC}
.drawer-title{font-size:16px;font-weight:600}
.drawer-close{font-size:20px;color:var(--text-3);cursor:pointer;padding:4px}
.drawer-close:hover{color:var(--text-1)}
.drawer-body{flex:1;overflow-y:auto;padding:20px}
.drawer-body::-webkit-scrollbar{width:6px}
.drawer-body::-webkit-scrollbar-thumb{background:#D0D0D0;border-radius:3px}
.drawer-foot{padding:14px 20px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:10px;background:#FAFBFC}
.detail-section{margin-bottom:24px}
.detail-section:last-child{margin-bottom:0}
.detail-section-title{font-size:14px;font-weight:600;color:var(--text-1);margin-bottom:12px;padding-left:10px;border-left:3px solid var(--primary)}
.detail-row{display:flex;padding:8px 0;border-bottom:1px solid var(--border-light)}
.detail-row:last-child{border-bottom:none}
.detail-label{width:100px;color:var(--text-3);font-size:13px;flex-shrink:0}
.detail-value{flex:1;color:var(--text-1);font-size:13px}
.phone-mock{width:180px;height:360px;background:#1D2129;border-radius:22px;padding:8px;flex-shrink:0;position:relative;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.phone-notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:60px;height:16px;background:#1D2129;border-radius:0 0 10px 10px;z-index:2}
.phone-screen{width:100%;height:100%;background:#F2F3F5;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.ps-statusbar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px 4px;font-size:9px;color:#1D2129;background:#fff}
.ps-header{padding:8px 12px;background:#fff;font-size:12px;font-weight:600;color:#1D2129;border-bottom:1px solid #F0F1F3;text-align:center}
.ps-body{flex:1;overflow-y:auto;padding:8px}
.ps-search{background:#fff;border-radius:6px;padding:5px 8px;font-size:10px;color:#86909C;margin-bottom:6px}

.dash-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}

.dash-controls{display:flex;gap:10px;align-items:center}

.kpi-card .kpi-label{font-size:12px;color:rgba(255,255,255,.6);margin-bottom:10px}
.kpi-card .kpi-value{font-size:28px;font-weight:700;color:#fff;font-family:'DIN Alternate','Helvetica Neue',sans-serif;letter-spacing:1px}

.kpi-trend.up{color:#5BFF8A}
.kpi-trend.down{color:#FF6B6B}
.chart-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}
.chart-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:18px}

.chart-card .ch-title .ch-legend{display:flex;gap:14px;font-size:11px;font-weight:400;color:rgba(255,255,255,.6)}
.chart-card .ch-legend span{display:flex;align-items:center;gap:4px}
.chart-card .ch-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.trend-chart{height:220px;position:relative}
.donut-wrap{display:flex;align-items:center;justify-content:center;height:220px;position:relative}
.donut-center{position:absolute;text-align:center}
.donut-center .dc-value{font-size:24px;font-weight:700;color:#fff}
.donut-center .dc-label{font-size:11px;color:rgba(255,255,255,.5)}
.rank-list{padding:0}
.rank-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.rank-item:last-child{border-bottom:none}
.rank-num{width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.rank-num.top1{background:linear-gradient(135deg,#FFD700,#FFA500);color:#000}
.rank-num.top2{background:linear-gradient(135deg,#C0C0C0,#A0A0A0);color:#000}
.rank-num.top3{background:linear-gradient(135deg,#CD7F32,#A0522D);color:#fff}
.rank-num.other{background:rgba(255,255,255,.1);color:rgba(255,255,255,.6)}
.rank-info{flex:1;min-width:0}
.rank-name{font-size:13px;color:#fff;margin-bottom:2px}
.rank-meta{font-size:11px;color:rgba(255,255,255,.4)}
.rank-value{font-size:14px;font-weight:600;color:#5BFF8A;font-family:'DIN Alternate',sans-serif}
.matrix-wrap{padding:10px 0}
.matrix{display:grid;grid-template-columns:80px 1fr;gap:0;font-size:11px}
.matrix-y{display:flex;flex-direction:column;justify-content:space-between;padding:10px 0;color:rgba(255,255,255,.5)}
.matrix-y div{text-align:right;padding-right:8px}
.matrix-area{position:relative;height:240px;border-left:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1)}
.matrix-x{display:flex;justify-content:space-between;padding:6px 0 0;color:rgba(255,255,255,.5)}
.matrix-dot{position:absolute;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;transition:.2s;color:#fff;font-weight:600;transform:translate(-50%,50%)}
.matrix-dot:hover{transform:translate(-50%,50%) scale(1.2);z-index:10}
.risk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.risk-item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:14px}
.risk-item .ri-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.risk-item .ri-name{font-size:13px;color:#fff}
.risk-item .ri-level{font-size:11px;padding:2px 8px;border-radius:4px}
.risk-item .ri-value{font-size:20px;font-weight:600;color:#fff;margin-bottom:4px}
.risk-item .ri-desc{font-size:11px;color:rgba(255,255,255,.5)}

/* 模态框 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:none;align-items:center;justify-content:center;animation:fade .2s}
.modal-mask.open{display:flex}
.modal{background:#fff;border-radius:var(--radius-lg);width:480px;max-width:90vw;max-height:85vh;display:flex;flex-direction:column;animation:modalIn .25s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:15px;font-weight:600}
.modal-close{font-size:20px;color:var(--text-3);cursor:pointer}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:8px;background:#FAFBFC}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px}
.form-label .req{color:var(--danger)}
.form-input,.form-select,.form-textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:#fff}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--primary)}
.form-textarea{resize:vertical;min-height:70px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1D2129;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none;align-items:center;gap:8px}
.toast.show{display:flex;animation:toastIn .25s}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.warning{background:var(--warning)}

.role-switch-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role-switch-item{padding:14px;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:10px}
.role-switch-item:hover{border-color:var(--primary);background:var(--primary-light)}
.role-switch-item.active{border-color:var(--primary);background:var(--primary-light)}
.role-switch-item .rsi-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600}

@media (max-width:1200px){
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .quick-entry{grid-template-columns:repeat(2,1fr)}
  .app-grid{grid-template-columns:repeat(2,1fr)}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .chart-grid{grid-template-columns:1fr}
}

function $(s){return document.querySelector(s)}
function showToast(msg, type='info'){
  const t=$('#toast');
  t.textContent=msg;
  t.className='toast show '+type;
  setTimeout(()=>t.className='toast',2500);
}
function getStatusTag(status){
  const map={
    '待审核':'tag-warning','已发布':'tag-success','生成中':'tag-info','方案规划':'tag-primary',
    '需求澄清':'tag-gray','测试验证':'tag-info','已上线':'tag-success','已下线':'tag-gray',
    '运行中':'tag-success','异常':'tag-danger','待处理':'tag-warning','处理中':'tag-info',
    '暂不处理':'tag-gray','已生效':'tag-success','已停用':'tag-gray','缺口':'tag-danger',
    '评估中':'tag-primary','孵化中':'tag-info','已孵化':'tag-success','暂缓':'tag-gray',
    '通过':'tag-success','驳回':'tag-danger','已认证':'tag-success','培训中':'tag-info','待培训':'tag-gray','培训完成':'tag-success',
    'L1':'tag-success','L2':'tag-warning','L3':'tag-danger','停用':'tag-gray','启用':'tag-success',
  };
  return `<span class="tag ${map[status]||'tag-gray'}">${status}</span>`;
}
function getGreeting(){
  const h=new Date().getHours();
  if(h<6) return '凌晨好';
  if(h<9) return '早上好';
  if(h<12) return '上午好';
  if(h<14) return '中午好';
  if(h<18) return '下午好';
  return '晚上好';
}

function renderSidebar(){
  const role=ROLES[currentRole];
  let html='';
  role.menus.forEach(g=>{
    html+=`<div class="menu-group"><div class="menu-group-title">${g.group}</div>`;
    g.items.forEach(it=>{
      html+=`<div class="menu-item ${currentPage===it.id?'active':''}" onclick="navigate('${it.id}')">
        <span class="mi-icon">${it.icon}</span><span>${it.name}</span>
        ${it.badge?`<span class="mi-badge">${it.badge}</span>`:''}
      </div>`;
    });
    html+='</div>';
  });
  $('#sidebar').innerHTML=html;
}
function renderHeader(){
  const r=ROLES[currentRole];
  $('#userAvatar').textContent=r.avatar;
  $('#userName').textContent=r.name;
  $('#userRole').textContent=r.role;
  const colors={cm:'#FF7D00',owner:'#1A66FF',tech:'#00B42A',ops:'#722ED1',admin:'#F53F3F'};
  const roleNames={cm:'客户经理',owner:'业务Owner',tech:'总行科技',ops:'平台运营',admin:'管理员'};
  $('#roleMenu').innerHTML=Object.keys(ROLES).map(k=>`
    <div class="role-menu-item ${currentRole===k?'active':''}" onclick="switchRole('${k}')">
      <div class="rmi-avatar" style="background:${colors[k]}">${ROLES[k].avatar}</div>
      <div><div class="rmi-name">${ROLES[k].name}</div><div class="rmi-role">${roleNames[k]} · ${ROLES[k].role.split(' · ')[1]||''}</div></div>
      <span class="rmi-check">✓</span>

}

function toggleNotif(e){
  if(e) e.stopPropagation();
  const menu=$('#notifMenu');
  const isOpen=menu.classList.contains('open');
  if(isOpen){
    menu.classList.remove('open');
    return;
  }
  // 渲染通知列表
  menu.innerHTML=`
    <div class="notif-head">
      <div class="notif-head-title">消息提醒</div>
      <div class="notif-head-action" onclick="markAllRead()">全部已读</div>
    </div>
    <div class="notif-list">
      ${NOTIFICATIONS.map(n=>`
        <div class="notif-item ${n.unread?'unread':''}">
          <div class="notif-icon" style="background:${n.color}">${n.icon}</div>
          <div class="notif-body">
            <div class="notif-title">${n.title}</div>
            <div class="notif-desc">${n.desc}</div>
            <div class="notif-time">${n.time}</div>
          </div>
        </div>`).join('')}
    </div>
    <div class="notif-foot" onclick="showToast('已加载全部消息','info')">查看全部消息</div>`;
  menu.classList.add('open');
}
function markAllRead(){
  NOTIFICATIONS.forEach(n=>n.unread=false);
  $('#notifBadge').style.display='none';
  toggleNotif({stopPropagation:()=>{}});
  setTimeout(()=>toggleNotif({stopPropagation:()=>{}}),10);
  showToast('已全部标记为已读','success');
}
function navigate(page){
  currentPage=page;
  renderSidebar();

}
function switchRole(role){
  currentRole=role;
  currentPage = role==='admin' ? 'admin-dash' : role==='owner' ? 'audit' : role==='ops' || role==='tech' ? (ROLES[role].menus[0].items[0].id) : 'home';
  $('#roleMenu').classList.remove('open');
  renderHeader();
  renderSidebar();
  renderPage();
}

function sendAI(){
  const input=$('#aiInput');
  const text=input.value.trim();
  if(!text) return;
  $('#aiBody').innerHTML+=`<div class="ai-msg user"><div class="am-avatar">${ROLES[currentRole].avatar}</div><div class="am-bubble">${text}</div></div>`;
  input.value='';
  $('#aiBody').scrollTop=$('#aiBody').scrollHeight;
  // 打字动效
  const typingId='typing-'+Date.now();
  $('#aiBody').innerHTML+=`<div class="ai-msg bot" id="${typingId}"><div class="am-avatar">🤖</div><div class="am-bubble"><div class="ai-typing"><span></span><span></span><span></span></div></div></div>`;
  $('#aiBody').scrollTop=$('#aiBody').scrollHeight;
  setTimeout(()=>{
    const t=document.getElementById(typingId);
    if(t) t.remove();
    // 如果正在流程中，继续推进
    if(aiStep>0&&aiStep<AI_FLOW.length){
      const flow=AI_FLOW[aiStep];
      showAIResponse(flow);
      aiStep++;
      return;
    }
    // 匹配预设流程
    if(text.includes('拜访')||text.includes('登记')){
      const flow=AI_FLOW[0];
      showAIResponse(flow);
      aiStep=1;

/* 生成缺口能力工单，返回生成数量 */
function generateGapOrders(r){
  const missing=r.caps.filter(c=>!c.has);
  if(missing.length===0) return 0;
  const baseNum=DATA.gaps.length;
  missing.forEach((c,i)=>{
    const gapId='GAP-'+String(baseNum+i+1).padStart(3,'0');
    DATA.gaps.unshift({id:gapId, cap:c.n, source:'需求自动发现', from:r.id, priority:'高', status:'待处理', date:'2024-08-05'});
  });
  // 更新科技部菜单角标
  const gapMenu=document.querySelector('[data-page="gap-order"] .menu-badge');
  if(gapMenu) gapMenu.textContent=DATA.gaps.filter(g=>g.status==='待处理').length;
  return missing.length;
}

  // 根据需求名称匹配场景
  const n=r.name;
  previewScene=n.includes('拜访')?'visit':n.includes('活动')?'event':n.includes('理财')?'finance':n.includes('满意度')?'survey':'visit';
  previewTab=0;
  previewReqId=id;
  renderPreview(r);
  $('#previewMask').classList.add('open');
}
function renderPreview(r){
  const pages=PREVIEW_PAGES[previewScene];
  const page=pages[previewTab];
  const sceneLabels={visit:'客户拜访管理',event:'活动报名',finance:'理财到期',survey:'满意度调查'};
  $('#previewTitle').textContent='小程序预览 · '+r.name;
  $('#previewTabs').innerHTML=pages.map((p,i)=>`<button class="pv-tab ${i===previewTab?'active':''}" onclick="switchPreviewTab(${i})">${p.tab}</button>`).join('');
  $('#previewPageHeader').textContent=page.title;
  $('#previewTabbar').innerHTML=pages.map((p,i)=>`<span style="color:${i===previewTab?'var(--primary)':'#86909C'};font-weight:${i===previewTab?'600':'400'}">${p.tab}</span>`).join('');
  let body='';
  if(page.type==='list'){
    body=`<div class="pv-search">🔍 搜索</div>${page.items.map(it=>`<div class="pv-card"><div class="pv-card-icon" style="background:${it.color}">${it.icon}</div><div class="pv-card-text"><div class="pv-card-title">${it.name}</div><div class="pv-card-sub">${it.sub}</div></div></div>`).join('')}`;
  }else if(page.type==='form'){
    body=page.fields.map(f=>`<div class="pv-form-group"><label class="pv-form-label">${f.label}</label>${f.type==='select'?`<select class="pv-form-select">${f.options.map(o=>`<option>${o}</option>`).join('')}</select>`:f.type==='textarea'?`<textarea class="pv-form-textarea" placeholder="${f.placeholder||'请输入'}"></textarea>`:`<input class="pv-form-input" placeholder="${f.placeholder||'请输入'}">`}</div>`).join('')+'<button class="pv-submit-btn">提交</button>';
  }else if(page.type==='report'){
    body=`<div class="pv-stats-row">${page.stats.map(s=>`<div class="pv-stat"><div class="pv-stat-value">${s.value}</div><div class="pv-stat-label">${s.label}</div></div>`).join('')}</div><div class="pv-chart-placeholder">📊 趋势图表区域</div><div class="pv-chart-placeholder">📋 详细数据表格</div>`;
  }else if(page.type==='qrcode'){
    body=`<div style="text-align:center;padding:30px 0"><div class="pv-qrcode">▦</div><div style="margin-top:12px;font-size:13px;color:#1D2129;font-weight:500">扫码签到</div><div style="font-size:11px;color:#86909C;margin-top:4px">请使用微信扫一扫</div></div>`;
  }else if(page.type==='profile'){
    body=`<div class="pv-profile"><div class="pv-avatar">${page.name[0]}</div><div class="pv-profile-name">${page.name}</div><div class="pv-profile-role">${page.role}</div></div><div class="pv-stats-row">${page.stats.map(s=>`<div class="pv-stat"><div class="pv-stat-value">${s.value}</div><div class="pv-stat-label">${s.label}</div></div>`).join('')}</div>`;
  }
  $('#previewBody').innerHTML=body;
  $('#previewFooter').innerHTML=`<button class="btn btn-sm" style="background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.1)" onclick="closePreview()">关闭</button>
    <span style="color:rgba(255,255,255,.4);font-size:11px;margin-left:auto">${sceneLabels[previewScene]} · ${page.tab}页 · v1.0.0</span>`;
}
function switchPreviewTab(i){previewTab=i;const r=DATA.requirements.find(x=>x.id===previewReqId);if(r)renderPreview(r);}
function closePreview(){$('#previewMask').classList.remove('open');}

/* ============ 初始化 ============ */
renderHeader();
renderSidebar();
renderPage();
</script>
</body>
</html>
