
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泰隆银行 · AI应用创新平台</title>
<style>
/* ============ 全局变量 ============ */
:root{
  --primary:#1A66FF;
  --primary-dark:#0F47C7;
  --primary-light:#E8F0FF;
  --success:#00B42A;
  --warning:#FF7D00;
  --danger:#F53F3F;
  --info:#722ED1;
  --text-1:#1D2129;
  --text-2:#4E5969;
  --text-3:#86909C;
  --text-4:#C9CDD4;
  --bg-page:#F2F3F5;
  --bg-card:#FFFFFF;
  --border:#E5E6EB;
  --border-light:#F0F1F3;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow:0 2px 8px rgba(0,0,0,.06);
  --shadow-lg:0 8px 24px rgba(0,0,0,.12);
  --radius:8px;
  --radius-sm:6px;
  --radius-lg:12px;
  --sidebar-w:220px;
  --header-h:56px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;
  background:var(--bg-page);color:var(--text-1);font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
ul{list-style:none}
input,textarea,select{font-family:inherit;font-size:13px;outline:none}

/* ============ 布局 ============ */
.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.layout{display:flex;flex:1;overflow:hidden}
.header{
  height:var(--header-h);background:#0F2B46;color:#fff;
  display:flex;align-items:center;padding:0 20px;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:100;
}
.logo{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;letter-spacing:.5px}
.logo .logo-icon{
  width:30px;height:30px;background:linear-gradient(135deg,#1A66FF,#00D4FF);
  border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:bold;
}
.logo .sub{font-size:11px;color:rgba(255,255,255,.6);font-weight:400;margin-left:4px}
.header-nav{display:flex;gap:24px;margin-left:40px;flex:1}
.header-nav a{color:rgba(255,255,255,.7);font-size:13px;padding:6px 0;position:relative;transition:.2s;cursor:pointer}
.header-nav a:hover{color:#fff}
.header-nav a.active{color:#fff}
.header-nav a.active::after{content:'';position:absolute;bottom:-19px;left:0;right:0;height:2px;background:#1A66FF}
.header-right{display:flex;align-items:center;gap:16px}
.env-tag{background:rgba(0,180,42,.15);color:#5BFF8A;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid rgba(0,180,42,.3)}
.user-dropdown{position:relative}
.user-info{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:.2s}
.user-info:hover{background:rgba(255,255,255,.1)}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#FF7D00,#FFB400);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff}
.user-name{font-size:13px}
.user-role{font-size:11px;color:rgba(255,255,255,.6)}
.role-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:220px;background:#fff;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:6px;z-index:1000;display:none}
.role-menu.open{display:block}
.role-menu-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;transition:.15s}
.role-menu-item:hover{background:#F2F3F5}
.role-menu-item.active{background:#E8F0FF}
.role-menu-item .rmi-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;flex-shrink:0}
.role-menu-item .rmi-name{font-size:13px;color:var(--text-1);font-weight:500}
.role-menu-item .rmi-role{font-size:11px;color:var(--text-3)}
.role-menu-item .rmi-check{margin-left:auto;color:var(--primary);font-size:14px;visibility:hidden}
.role-menu-item.active .rmi-check{visibility:visible}
/* 通知下拉 */
.notif-dropdown{position:relative}
.notif-badge{position:absolute;top:-2px;right:-4px;background:#F53F3F;color:#fff;font-size:9px;padding:1px 5px;border-radius:10px;min-width:16px;text-align:center;border:2px solid #1D2129;font-weight:600}
.notif-menu{position:absolute;top:calc(100% + 6px);right:0;width:340px;background:#fff;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.16);z-index:1000;display:none;overflow:hidden}
.notif-menu.open{display:block}
.notif-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border-light)}
.notif-head-title{font-size:13px;font-weight:600;color:var(--text-1)}
.notif-head-action{font-size:11px;color:var(--primary);cursor:pointer}
.notif-list{max-height:360px;overflow-y:auto}
.notif-item{display:flex;gap:10px;padding:12px 14px 12px 18px;border-bottom:1px solid var(--border-light);cursor:pointer;transition:.15s;position:relative}
.notif-item:hover{background:#F7F8FA}
.notif-item.unread::before{content:'';position:absolute;left:6px;top:18px;width:4px;height:4px;border-radius:50%;background:var(--danger)}
.notif-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0}
.notif-body{flex:1;min-width:0}
.notif-title{font-size:13px;color:var(--text-1);font-weight:500;line-height:1.4}
.notif-item.unread .notif-title{font-weight:600}
.notif-desc{font-size:11px;color:var(--text-3);margin-top:3px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notif-time{font-size:10px;color:var(--text-4);margin-top:4px}
.notif-foot{text-align:center;padding:10px;font-size:12px;color:var(--text-3);cursor:pointer;border-top:1px solid var(--border-light)}
.notif-foot:hover{color:var(--primary)}
.icon-btn{color:rgba(255,255,255,.7);font-size:16px;padding:4px;border-radius:4px;transition:.2s;cursor:pointer}
.icon-btn:hover{color:#fff;background:rgba(255,255,255,.1)}
.sidebar{width:var(--sidebar-w);background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;overflow-x:visible;transition:width .2s;position:relative}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:#E5E6EB;border-radius:2px}
.sidebar.collapsed{width:56px}
.sidebar.collapsed .menu-group-title,.sidebar.collapsed .menu-item span:not(.mi-icon):not(.mi-badge),.sidebar.collapsed .sidebar-brand-text{display:none}
.sidebar.collapsed .menu-item{justify-content:center;padding:9px 0}
.sidebar.collapsed .mi-badge{display:none}
.sidebar.collapsed .sidebar-brand{padding:14px 0;justify-content:center;gap:0}
.sidebar.collapsed .sidebar-toggle{position:absolute;right:4px;top:14px;width:20px;height:20px;background:#fff;border:1px solid var(--border-light);box-shadow:0 2px 6px rgba(0,0,0,.08);z-index:10;margin-left:0}
.sidebar-toggle{margin-left:auto;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-3);font-size:14px;transition:.15s;user-select:none;border-radius:6px;flex-shrink:0}
.sidebar-toggle:hover{color:var(--primary);background:var(--primary-light)}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border-light);font-weight:700;font-size:15px;color:var(--text-1)}
.sidebar-brand-icon{width:28px;height:28px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.menu-group{padding:8px 0;border-bottom:1px solid var(--border-light)}
.menu-group-title{font-size:11px;color:var(--text-3);padding:8px 16px 4px;letter-spacing:1px;text-transform:uppercase}
.menu-item{display:flex;align-items:center;gap:10px;padding:9px 16px;color:var(--text-2);font-size:13px;cursor:pointer;transition:.15s;border-left:2px solid transparent}
.menu-item:hover{background:var(--primary-light);color:var(--primary)}
.menu-item.active{background:var(--primary-light);color:var(--primary);font-weight:500;border-left-color:var(--primary)}
.menu-item .mi-icon{font-size:15px;width:18px;text-align:center}
.menu-item .mi-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
.main{flex:1;overflow-y:auto;background:var(--bg-page)}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:#D0D0D0;border-radius:3px}
.page{padding:20px 24px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-title{font-size:18px;font-weight:600;color:var(--text-1)}
.page-sub{font-size:12px;color:var(--text-3);margin-top:2px}

/* 通用组件 */
.card{background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow-sm);border:1px solid var(--border-light)}
.card-head{padding:14px 18px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:14px;font-weight:600;color:var(--text-1)}
.card-body{padding:18px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-sm);font-size:13px;background:#fff;color:var(--text-2);border:1px solid var(--border);transition:.15s;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
.btn-warning{background:var(--warning);color:#fff;border-color:var(--warning)}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-ghost{background:transparent;border:none;color:var(--primary)}
.btn-ghost:hover{background:var(--primary-light)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-lg{padding:10px 22px;font-size:14px}
.tag{display:inline-flex;align-items:center;padding:2px 8px;font-size:11px;border-radius:4px;line-height:1.5}
.tag-primary{background:var(--primary-light);color:var(--primary)}
.tag-success{background:#E8FFEA;color:var(--success)}
.tag-warning{background:#FFF7E8;color:var(--warning)}
.tag-danger{background:#FFECE8;color:var(--danger)}
.tag-info{background:#F2EDFF;color:var(--info)}
.tag-gray{background:#F2F3F5;color:var(--text-3)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:var(--radius);padding:18px;border:1px solid var(--border-light);position:relative;overflow:hidden;transition:.2s}
.stat-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.stat-card .sc-icon{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.stat-card .sc-label{font-size:12px;color:var(--text-3);margin-bottom:8px}
.stat-card .sc-value{font-size:24px;font-weight:600;color:var(--text-1);line-height:1.2}
.stat-card .sc-trend{font-size:11px;margin-top:6px;display:flex;align-items:center;gap:3px}
.trend-up{color:var(--success)}
.trend-down{color:var(--danger)}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{background:#FAFBFC;color:var(--text-3);font-weight:500;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border-light);font-size:12px;white-space:nowrap}
.table td{padding:11px 12px;border-bottom:1px solid var(--border-light);color:var(--text-2)}
.table tr:hover td{background:#FAFBFC}
.table tr:last-child td{border-bottom:none}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search-input{width:240px;padding:7px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff}
.search-input:focus{border-color:var(--primary)}
.select{padding:7px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;color:var(--text-2);cursor:pointer}

/* 工作台 */
.welcome-bar{background:linear-gradient(135deg,#1A66FF 0%,#0F47C7 100%);border-radius:var(--radius-lg);padding:24px;color:#fff;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;position:relative;overflow:hidden}
.welcome-bar::before{content:'';position:absolute;right:-40px;top:-40px;width:240px;height:240px;background:radial-gradient(circle,rgba(255,255,255,.15) 0%,transparent 70%);border-radius:50%}
.welcome-bar .wb-title{font-size:20px;font-weight:600;margin-bottom:6px}
.welcome-bar .wb-sub{font-size:13px;color:rgba(255,255,255,.8)}
.welcome-bar .wb-actions{display:flex;gap:10px;position:relative;z-index:1}
.welcome-bar .btn{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.3)}
.welcome-bar .btn:hover{background:rgba(255,255,255,.3);border-color:rgba(255,255,255,.5);color:#fff}
.quick-entry{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.qe-card{background:#fff;border-radius:var(--radius);padding:20px;border:1px solid var(--border-light);cursor:pointer;transition:.2s;display:flex;align-items:center;gap:14px}
.qe-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--primary)}
.qe-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.qe-text .qe-title{font-size:14px;font-weight:600;color:var(--text-1);margin-bottom:2px}
.qe-text .qe-desc{font-size:12px;color:var(--text-3)}
.notice-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border-light)}
.notice-item:last-child{border-bottom:none}
.notice-dot{width:6px;height:6px;border-radius:50%;background:var(--primary);margin-top:6px;flex-shrink:0}
.notice-dot.read{background:var(--text-4)}
.notice-content{flex:1}
.notice-title{font-size:13px;color:var(--text-1);margin-bottom:2px}
.notice-time{font-size:11px;color:var(--text-3)}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.app-card{background:#fff;border-radius:var(--radius);padding:16px;border:1px solid var(--border-light);cursor:pointer;transition:.2s}
.app-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.app-card .ac-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.app-card .ac-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
.app-card .ac-name{font-size:14px;font-weight:600;color:var(--text-1)}
.app-card .ac-ver{font-size:11px;color:var(--text-3)}
.app-card .ac-desc{font-size:12px;color:var(--text-2);margin-bottom:10px;line-height:1.5;height:36px;overflow:hidden}
.app-card .ac-foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text-3)}

/* ===== AI助手 - 全新布局 ===== */
.ai-layout{display:flex;height:100%;background:var(--bg-page);position:relative}
/* 左侧导航栏 */
.ai-nav{width:200px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .25s ease;flex-shrink:0;z-index:10}
.ai-nav.collapsed{width:56px}
.ai-nav-toggle{position:absolute;top:12px;right:-12px;width:24px;height:24px;background:#fff;border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;color:var(--text-3);z-index:11;box-shadow:var(--shadow-sm);transition:.2s}
.ai-nav-toggle:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.ai-nav-new{padding:12px}
.ai-nav-new-btn{width:100%;padding:10px 14px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.15s;white-space:nowrap;overflow:hidden}
.ai-nav-new-btn:hover{background:var(--primary-dark)}
.ai-nav.collapsed .ai-nav-new-btn{padding:10px;justify-content:center}
.ai-nav.collapsed .ai-nav-new-btn span{display:none}
.ai-nav-menu{flex:1;padding:4px 8px;overflow-y:auto}
.ai-nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text-2);transition:.1s;white-space:nowrap;overflow:hidden;margin-bottom:2px;position:relative}
.ai-nav-item:hover{background:var(--primary-light);color:var(--primary)}
.ai-nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:500}
.ai-nav-item-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center}
.ai-nav.collapsed .ai-nav-item{justify-content:center;padding:10px}
.ai-nav.collapsed .ai-nav-item span.label{display:none}
.ai-nav-item-badge{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:#F2F3F5;color:var(--text-3);font-size:10px;padding:1px 6px;border-radius:999px;min-width:18px;text-align:center}
.ai-nav.collapsed .ai-nav-item-badge{display:none}
.ai-nav-item-setting{border-top:1px solid var(--border-light);margin-top:8px;padding-top:8px}
/* 首页中间区域 */
.ai-home-main{flex:1;display:flex;flex-direction:column;align-items:center;overflow:hidden;padding:80px 48px 24px;height:100%}
.ai-title{font-size:36px;font-weight:700;color:var(--text-1);text-align:center;margin-bottom:10px;letter-spacing:-1px;line-height:1.35}
.ai-title .highlight{color:var(--primary)}
.ai-subtitle{font-size:15px;color:var(--text-3);text-align:center;margin-bottom:28px;line-height:1.6}
/* 大输入框 - 参考截图增大 */
.ai-input-area{width:100%;max-width:760px;margin-bottom:24px}
.ai-input-big{width:100%;min-height:180px;border:1.5px solid var(--border);border-radius:24px;padding:28px 32px 72px;font-size:17px;font-family:inherit;resize:none;line-height:1.9;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.04);transition:.2s;color:var(--text-1)}
.ai-input-big:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.ai-input-big::placeholder{color:var(--text-4)}
.ai-input-tools{display:flex;align-items:center;justify-content:space-between;padding:0 12px;margin-top:-54px;position:relative;margin-bottom:0}
.ai-input-tools-left{display:flex;align-items:center;gap:4px}
.ai-tool-btn{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:8px;font-size:13px;color:var(--text-2);cursor:pointer;border:none;background:none;transition:.1s;font-family:inherit}
.ai-tool-btn:hover{background:var(--primary-light);color:var(--primary)}
.ai-input-tools-right{display:flex;align-items:center;gap:8px}
.ai-model-select{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:8px;font-size:12px;color:var(--text-2);cursor:pointer;border:1px solid var(--border);background:#fff;transition:.1s;font-family:inherit}
.ai-model-select:hover{border-color:var(--primary);color:var(--primary)}
.ai-generate-btn{display:flex;align-items:center;gap:6px;padding:10px 24px;border-radius:12px;background:var(--primary);color:#fff;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:.15s;font-family:inherit;box-shadow:0 2px 8px rgba(26,102,255,.3)}
.ai-generate-btn:hover{background:var(--primary-dark);transform:scale(1.02)}
.ai-generate-btn:disabled{background:var(--text-4);color:#fff;cursor:not-allowed;transform:none;box-shadow:none}
/* 推荐提示词卡片 - 参考截图 */
.ai-quick-start{width:100%;max-width:680px;margin-bottom:28px}
.ai-quick-start-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ai-qs-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;transition:.2s;text-align:left}
.ai-qs-card:hover{border-color:var(--primary);box-shadow:0 4px 16px rgba(26,102,255,.1);transform:translateY(-2px)}
.ai-qs-card-icon{font-size:24px;margin-bottom:8px}
.ai-qs-card-name{font-size:13px;font-weight:600;color:var(--text-1);margin-bottom:3px}
.ai-qs-card-desc{font-size:11px;color:var(--text-3);line-height:1.4}
/* Tab区域 */
.ai-tabs-section{width:100%;max-width:1100px;flex:1;display:flex;flex-direction:column;min-height:0}
.ai-tabs-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.ai-tabs{display:flex;gap:0;border-bottom:1px solid var(--border)}
.ai-tab{padding:10px 20px;font-size:15px;font-weight:500;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s;display:flex;align-items:center;gap:6px}
.ai-tab:hover{color:var(--text-1)}
.ai-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.ai-tab-count{font-size:12px;color:var(--text-4);font-weight:400}
.ai-tab.active .ai-tab-count{color:var(--text-3)}
.ai-tabs-actions{display:flex;align-items:center;gap:10px}
.ai-search-box{display:flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--text-3);background:#fff;cursor:pointer}
.ai-search-box:hover{border-color:var(--primary)}
.ai-view-all{font-size:13px;color:var(--text-3);cursor:pointer;padding:7px 0}
.ai-view-all:hover{color:var(--text-1)}
/* 分类标签 */
.ai-cat-filters{display:flex;gap:8px;flex-wrap:wrap}
.ai-filter-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ai-filter-bar .ai-cat-filters{margin-bottom:0}
.ai-cat-filter{padding:6px 16px;border-radius:999px;font-size:13px;color:var(--text-2);cursor:pointer;border:1px solid var(--border);background:#fff;transition:.1s;font-family:inherit}
.ai-cat-filter:hover{border-color:var(--primary);color:var(--primary)}
.ai-cat-filter.active{background:var(--primary);color:#fff;border-color:var(--primary)}
/* 应用大卡片网格 */
.ai-big-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.ai-tabs-content{flex:1;overflow-y:auto;padding-bottom:20px}
.ai-big-card{border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s;position:relative;border:1px solid var(--border);background:#fff}
.ai-big-card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(26,102,255,.12);border-color:var(--primary)}
.ai-big-card-cover{height:120px;display:flex;align-items:center;justify-content:center;font-size:48px;position:relative}
.ai-big-card-cover .hot-tag{position:absolute;top:10px;left:10px;padding:3px 8px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;font-size:10px;font-weight:600;backdrop-filter:blur(4px)}
.ai-big-card-body{padding:12px 14px;background:#fff}
.ai-big-card-name{font-size:14px;font-weight:600;color:var(--text-1);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-big-card-meta{font-size:11px;color:var(--text-3)}
/* 我的应用简洁卡片 */
.ai-my-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.ai-my-card{border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s;position:relative;border:1px solid var(--border);background:#fff}
.ai-my-card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(26,102,255,.12);border-color:var(--primary)}
.ai-my-card-cover{height:120px;display:flex;align-items:center;justify-content:center;font-size:48px}
.ai-my-card-body{padding:12px 14px;background:#fff}
.ai-my-card-name{font-size:14px;font-weight:600;color:var(--text-1);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-my-card-meta{font-size:11px;color:var(--text-3);display:flex;gap:8px}
/* ===== 画布详情页 ===== */
.ai-canvas-layout{display:flex;height:100%;background:var(--bg-page);position:relative}
.ai-canvas-layout .ai-nav{width:56px}
.ai-canvas-layout .ai-nav .ai-nav-new-btn span,.ai-canvas-layout .ai-nav .ai-nav-item span.label{display:none}
.ai-canvas-layout .ai-nav .ai-nav-item{justify-content:center;padding:10px}
.ai-canvas-layout .ai-nav .ai-nav-new-btn{padding:10px;justify-content:center}
.ai-canvas-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ai-canvas-topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}
.ai-canvas-topbar-left{display:flex;align-items:center;gap:12px}
.ai-canvas-back{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:8px;font-size:13px;color:var(--text-2);cursor:pointer;border:1px solid var(--border);background:#fff;transition:.1s;font-family:inherit}
.ai-canvas-back:hover{border-color:var(--primary);color:var(--primary)}
.ai-canvas-topbar-title{font-size:15px;font-weight:600;color:var(--text-1);display:flex;align-items:center;gap:8px}
.ai-canvas-topbar-title .ver{font-size:12px;color:var(--text-3);font-weight:400}
.ai-canvas-topbar-right{display:flex;gap:8px;align-items:center}
.ai-canvas-topbar-btn{padding:7px 16px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text-2);transition:.15s;display:inline-flex;align-items:center;gap:4px;font-family:inherit}
.ai-canvas-topbar-btn:hover{border-color:var(--primary);color:var(--primary)}
.ai-canvas-topbar-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.ai-canvas-device-tabs{display:flex;align-items:center;background:var(--bg-page);border-radius:8px;padding:3px;margin-right:8px}
.ai-canvas-device{font-size:12px;color:var(--text-3);padding:5px 12px;border-radius:6px;cursor:pointer;transition:.15s;user-select:none}
.ai-canvas-device:hover{color:var(--text-1)}
.ai-canvas-device.active{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ai-canvas-topbar-btn.primary:hover{background:var(--primary-dark)}
.ai-canvas-topbar-btn.danger{color:var(--danger);border-color:#FECACA}
.ai-canvas-topbar-btn.danger:hover{background:#FEF2F2}
/* 画布区域 */
.ai-canvas-area{flex:1;overflow-x:auto;overflow-y:auto;padding:32px;display:flex;flex-direction:column;align-items:center}
.ai-canvas-frame{width:100%;min-width:max-content;min-height:500px;border-radius:20px;background:#fff;position:relative;transition:.3s}
.ai-canvas-frame.loading{border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,var(--primary),#7DB4FF,var(--primary),#7DB4FF) border-box;background-size:300% 100%;animation:borderFlow 2s linear infinite}
@keyframes borderFlow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.ai-canvas-frame.done{border:1px solid var(--border);box-shadow:0 4px 24px rgba(26,102,255,.08)}
.ai-canvas-frame.editing{border:1px dashed var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.ai-canvas-loading-center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:500px;gap:24px}
.ai-canvas-loading-spinner{width:64px;height:64px;border:4px solid var(--border-light);border-top-color:var(--primary);border-radius:50%;animation:aiSpin .8s linear infinite}
@keyframes aiSpin{to{transform:rotate(360deg)}}
.ai-canvas-loading-text{font-size:18px;font-weight:600;color:var(--text-1)}
.ai-canvas-loading-step{font-size:13px;color:var(--text-3)}
/* 代码运行模拟终端（亮色系，嵌入AI对话框） */
.ai-code-runner{width:100%;background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:4px;box-shadow:0 4px 16px rgba(26,102,255,.06)}
.ai-code-runner-head{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#F8FAFF;border-bottom:1px solid var(--border-light)}
.ai-code-runner-dot{width:8px;height:8px;border-radius:50%}
.ai-code-runner-title{font-size:11px;color:var(--text-3);margin-left:6px;font-family:'SF Mono',Consolas,monospace}
.ai-code-runner-body{padding:10px 12px;font-family:'SF Mono',Consolas,Monaco,monospace;font-size:11.5px;line-height:1.85;color:var(--text-2);max-height:260px;overflow-y:auto;background:#FBFCFE}
.ai-code-runner-body::-webkit-scrollbar{width:5px}
.ai-code-runner-body::-webkit-scrollbar-thumb{background:rgba(26,102,255,.15);border-radius:3px}
.ai-code-line{white-space:pre;opacity:0;animation:codeLineIn .25s ease forwards}
.ai-code-line .kw{color:#7C3AED}
.ai-code-line .fn{color:#1A66FF}
.ai-code-line .str{color:#059669}
.ai-code-line .cmt{color:#9CA3AF}
.ai-code-line .cmt.warn{color:#D97706}
.ai-code-line .cmt.ok{color:#059669}
.ai-code-line .var{color:#B45309}
@keyframes codeLineIn{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:translateX(0)}}
/* 缺口通知（嵌入AI对话框消息流，非阻塞） */
.ai-gap-notify{width:100%;background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;overflow:hidden;animation:gapNotifyIn .3s ease}
@keyframes gapNotifyIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.ai-gap-notify-head{display:flex;align-items:center;gap:8px;padding:12px 14px 4px}
.ai-gap-notify-icon{font-size:18px}
.ai-gap-notify-title{font-size:13px;font-weight:600;color:var(--text-1)}
.ai-gap-notify-body{padding:2px 14px 6px;font-size:12px;color:var(--text-2);line-height:1.6}
.ai-gap-notify-list{padding:0 14px 8px}
.ai-gap-notify-item{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11.5px;color:#92400E}
.ai-gap-notify-item::before{content:'⚠️';font-size:10px}
.ai-gap-notify-actions{display:flex;gap:8px;padding:0 14px 12px;justify-content:flex-end}
.ai-gap-notify-actions .btn-sm{padding:5px 12px;font-size:12px;border-radius:8px}
/* 预览区 */
.ai-preview-header{text-align:center;margin-bottom:24px}
.ai-preview-header-name{font-size:20px;font-weight:700;color:var(--text-1);margin-bottom:4px}
.ai-preview-header-desc{font-size:13px;color:var(--text-3)}
.ai-preview-caps{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.ai-preview-caps span{font-size:11px;padding:4px 10px;border-radius:6px;background:#F3F3F0;color:var(--text-2)}
.ai-preview-caps span.ok{background:#F0FDF4;color:#166534}
.ai-preview-caps span.warn{background:#FFF6E5;color:#92400E}
.ai-preview-level{margin-top:10px;font-size:12px;padding:5px 14px;border-radius:8px;display:inline-block}
.ai-preview-level.l1{background:#F0FDF4;color:#166534}
.ai-preview-level.l2{background:#FFF6E5;color:#92400E}
/* 预览页平铺不换行 */
.ai-preview-pages{display:flex;gap:20px;flex-wrap:nowrap;justify-content:center;padding-bottom:8px}
/* 小程序预览页 - 通用 */
.ai-mini-page{width:280px;flex-shrink:0;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 32px rgba(26,102,255,.1);border:1px solid var(--border)}
.ai-mp-statusbar{display:flex;justify-content:space-between;padding:8px 16px 4px;font-size:11px;color:var(--text-1)}
.ai-mp-header{padding:10px 16px;font-size:15px;font-weight:600;color:var(--text-1);text-align:center;border-bottom:1px solid var(--border-light)}
.ai-mp-body{padding:12px;min-height:340px;background:#FAFAF7}
.ai-mp-tabbar{display:flex;justify-content:space-around;padding:8px 0;background:#fff;border-top:1px solid var(--border-light);font-size:11px;color:var(--text-3)}
.ai-mp-tabbar .tab-active{color:var(--primary);font-weight:600}
.ai-mp-search{background:#F3F3F0;border-radius:10px;padding:8px 12px;font-size:12px;color:var(--text-3);margin-bottom:10px}
.ai-mp-list-item{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.03);cursor:pointer;transition:.15s}
.ai-mp-list-item:hover{border:1px solid var(--primary);box-shadow:0 2px 8px rgba(26,102,255,.1)}
.ai-mp-item-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;flex-shrink:0}
.ai-mp-item-name{font-size:13px;font-weight:500;color:var(--text-1)}
.ai-mp-item-sub{font-size:11px;color:var(--text-3);margin-top:2px}
.ai-mp-form-group{margin-bottom:10px}
.ai-mp-form-label{font-size:12px;color:var(--text-2);margin-bottom:4px;display:block;padding-left:2px}
.ai-mp-form-input{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text-1);background:#fff}
.ai-mp-form-select{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text-1);background:#fff}
.ai-mp-form-textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text-1);background:#fff;min-height:60px;resize:none}
.ai-mp-submit{width:100%;padding:12px;border-radius:12px;background:var(--primary);color:#fff;border:none;font-size:14px;font-weight:500;cursor:pointer;margin-top:8px}
.ai-mp-stats{display:flex;gap:8px;margin-bottom:10px}
.ai-mp-stat{flex:1;background:#fff;border-radius:12px;padding:12px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.03)}
.ai-mp-stat-val{font-size:22px;font-weight:700;color:var(--text-1)}
.ai-mp-stat-lbl{font-size:11px;color:var(--text-3);margin-top:2px}
.ai-mp-chart-block{background:#fff;border-radius:12px;padding:16px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.03);margin-bottom:8px;font-size:12px;color:var(--text-3);min-height:60px;display:flex;align-items:center;justify-content:center}
.ai-mp-profile{text-align:center;padding:16px 0}
.ai-mp-avatar{width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 8px;font-weight:600}
.ai-mp-profile-name{font-size:15px;font-weight:600;color:var(--text-1)}
.ai-mp-profile-role{font-size:12px;color:var(--text-3);margin-top:2px}
.ai-mp-qrcode{text-align:center;padding:30px 0}
.ai-mp-qrcode-box{width:120px;height:120px;background:#F3F3F0;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:48px;margin:0 auto 12px}
/* 可编辑元素高亮 */
.ai-editable{cursor:pointer;transition:.15s;position:relative;border-radius:8px;padding:4px;margin:-4px}
.ai-editable:hover{background:var(--primary-light);box-shadow:0 0 0 2px var(--primary)}
.ai-editable.selected{background:var(--primary-light);box-shadow:0 0 0 2px var(--primary)}
/* 右下角AI标识 */
.ai-canvas-fab{position:absolute;right:28px;bottom:28px;width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;box-shadow:0 8px 32px rgba(26,102,255,.4);z-index:100;transition:.2s;border:none}
.ai-canvas-fab:hover{transform:scale(1.08);box-shadow:0 12px 40px rgba(26,102,255,.5)}
.ai-canvas-chat{position:absolute;right:28px;bottom:96px;width:460px;max-height:80vh;background:#fff;border-radius:16px;box-shadow:0 16px 48px rgba(26,102,255,.18);border:1px solid var(--border);z-index:101;display:none;flex-direction:column;overflow:hidden}
.ai-canvas-chat.open{display:flex}
.ai-canvas-chat-head{padding:14px 16px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between}
.ai-canvas-chat-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.ai-canvas-chat-close{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;opacity:.85;padding:0}
.ai-canvas-chat-close:hover{opacity:1}
.ai-canvas-chat-msgs{padding:14px;height:560px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;background:#FAFAF7}
.ai-canvas-chat-msg{display:flex;max-width:88%}
.ai-canvas-chat-msg.bot{align-self:flex-start}
.ai-canvas-chat-msg.user{align-self:flex-end}
.ai-canvas-chat-bubble{padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.6}
.ai-canvas-chat-msg.bot .ai-canvas-chat-bubble{background:#fff;color:var(--text-1);border:1px solid var(--border);border-bottom-left-radius:4px}
.ai-canvas-chat-msg.user .ai-canvas-chat-bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.ai-canvas-chat-think{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);font-style:italic}
.ai-canvas-chat-think-dot{width:6px;height:6px;border-radius:50%;background:var(--primary);animation:thinkPulse 1.2s ease infinite}
@keyframes thinkPulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.ai-canvas-chat-input{padding:10px 12px;border-top:1px solid var(--border-light);display:flex;gap:8px;background:#fff}
.ai-canvas-chat-input textarea{flex:1;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px;resize:none;min-height:50px;font-family:inherit;max-height:120px}
.ai-canvas-chat-input textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-light)}
.ai-canvas-chat-send{width:50px;height:50px;border-radius:10px;background:var(--primary);color:#fff;border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.ai-canvas-chat-send:hover{background:var(--primary-dark)}
/* 模板详情弹窗 */
.ai-tpl-body{display:grid;grid-template-columns:280px 1fr;min-height:300px}
.ai-tpl-preview{background:linear-gradient(135deg,var(--primary-light),#EAF6EE);padding:24px;display:flex;align-items:center;justify-content:center}
.ai-tpl-preview-card{width:200px;background:#fff;border-radius:16px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.ai-tpl-info{padding:24px 28px;display:flex;flex-direction:column;overflow-y:auto;max-height:60vh}
.ai-tpl-info h2{font-size:22px;margin:0 0 8px;color:var(--text-1)}
.ai-tpl-info p{color:var(--text-3);line-height:1.7;margin:0 0 16px;font-size:13px}
.ai-tpl-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.ai-tpl-tag{padding:5px 10px;border-radius:999px;background:var(--primary-light);color:var(--primary);font-size:12px}
.ai-tpl-features{font-size:13px;color:var(--text-2);line-height:2;margin-bottom:16px}
/* 元素编辑弹窗 */
.ai-edit-pop{position:absolute;z-index:200;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.15);padding:14px 16px;width:280px;display:none}
.ai-edit-pop.open{display:block}
.ai-edit-pop-head{font-size:13px;font-weight:600;color:var(--text-1);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.ai-edit-pop-close{cursor:pointer;color:var(--text-3);font-size:16px}
.ai-edit-pop-close:hover{color:var(--text-1)}
.ai-edit-pop-field{margin-bottom:10px}
.ai-edit-pop-label{font-size:12px;color:var(--text-2);margin-bottom:4px;display:block}
.ai-edit-pop-input{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--text-1);font-family:inherit;box-sizing:border-box}
.ai-edit-pop-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-light)}
.ai-edit-pop-tip{font-size:11px;color:var(--text-3);margin-top:6px;line-height:1.5}
.ai-edit-pop-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
/* 应用预览弹窗 */
.app-preview-modal .modal-body{padding:0;overflow-y:auto}
.app-preview-wrap{display:flex;background:#F3F3F0;min-height:460px}
.app-preview-phone{width:300px;background:#222;padding:20px 0;display:flex;justify-content:center;align-items:flex-start;flex-shrink:0}
.app-preview-info{flex:1;padding:24px 28px;background:#fff;overflow-y:auto;min-width:0}
.app-preview-info h3{font-size:18px;margin:0 0 8px;color:var(--text-1)}
.app-preview-info .desc{font-size:13px;color:var(--text-3);margin-bottom:16px;line-height:1.6}
.app-preview-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.app-preview-meta-item{background:#FAFAF7;border-radius:10px;padding:12px}
.app-preview-meta-label{font-size:11px;color:var(--text-3);margin-bottom:4px}
.app-preview-meta-value{font-size:14px;font-weight:600;color:var(--text-1)}
/* 发布成功弹窗 */
.ai-publish-body{text-align:center;padding:28px 32px}
.ai-publish-icon{font-size:56px;margin-bottom:12px}
.ai-publish-body h3{font-size:22px;margin:0 0 8px;color:var(--text-1)}
.ai-publish-body p{font-size:14px;color:var(--text-3);margin:0 0 20px}
.ai-publish-info{background:#FAFAF7;border-radius:12px;padding:16px;text-align:left;margin-bottom:20px}

/* ============ 管理驾驶舱 - 深色炫酷 ============ */

.dash-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.dash-title{font-size:22px;font-weight:600;color:#fff;letter-spacing:1px}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}

.form-group{margin-bottom:14px}

function getStatusTag(status){

let aiGenTimer=null,aiStepTimer=null,aiResumeGen=null;
function aiSend(){
  const input=document.getElementById('aiHomeInput')||document.getElementById('aiInput');
  if(!input) return;
  const text=input.value.trim();
  if(!text) return;
  input.value='';
  aiState.generating=true;
  aiState.codeGen=true;
  aiState.view='canvas';
  aiState.navCollapsed=true;
  aiState.chatOpen=true;
  aiState.loadingStep=0;
  aiState.codeLines=[];
  aiState.gapNotify=null;
  aiState.gapSent=false;
  aiState.chatMsgs=[{role:'bot',text:'你好！我是AI助手，告诉我你想做什么，我帮你直接生成业务应用。'},{role:'user',text},{role:'bot',text:'好的，正在为你生成应用，代码生成过程如下：'}];
  renderPage();
  let scene='default',caps=[],gaps=[];
  if(text.includes('拜访')||text.includes('客户')){
    scene='visit';caps=[{n:'客户信息查询',has:true},{n:'地图定位',has:true},{n:'OCR识别',has:false}];gaps=caps.filter(c=>!c.has).map(c=>c.n);
  }else if(text.includes('活动')||text.includes('报名')||text.includes('签到')){
    scene='event';caps=[{n:'短信通知',has:true},{n:'二维码生成',has:true}];
  }else if(text.includes('理财')||text.includes('到期')||text.includes('提醒')){
    scene='finance';caps=[{n:'短信通知',has:true},{n:'产品查询',has:true}];
  }else if(text.includes('满意度')||text.includes('调查')||text.includes('问卷')){
    scene='survey';caps=[{n:'问卷引擎',has:true},{n:'数据分析',has:false}];gaps=caps.filter(c=>!c.has).map(c=>c.n);
  }else{caps=[{n:'数据表格',has:true},{n:'表单组件',has:true}];}
  aiState.result={scene,caps,gaps,gapSent:false};
  const steps=['理解需求中...','分析业务场景...','匹配平台能力...','发现能力缺口...','生成页面结构...','组装小程序...'];
  let stepIdx=0;
  function runStep(){
    if(stepIdx<steps.length){
      aiState.loadingStep=stepIdx;
      appendCodeLines(stepIdx,gaps);
      if(stepIdx===3&&gaps.length>0&&!aiState.gapSent){
        aiState.gapSent=true;
        aiState.chatMsgs.push({role:'bot',type:'gap',gaps:gaps.slice(),sent:null});
      }
      renderPage();
      scrollChatToBottom();
      stepIdx++;
      aiStepTimer=setTimeout(runStep,900);
    }else{
      finishGen();
    }
  }
  function finishGen(){
    aiState.generating=false;
    aiState.codeGen=false;
    aiState.loadingStep=0;
    aiState.chatMsgs.push({role:'bot',text:'应用已生成完成，请查看右侧预览页面。'});
    renderPage();
    scrollChatToBottom();
  }
  runStep();
}

    </div>`,()=>{

    style.textContent='.promote-type.active{background:rgba(26,102,255,.08);border-color:var(--primary);color:var(--primary)}';
    document.head.appendChild(style);
  },50);

function quickAskModify(q){
  $('#aiInput').value=q;
  sendAIModify();
}
function sendAIModify(){
  const input=$('#aiInput');
  const text=input.value.trim();
  if(!text) return;
  const a=aiModifyApp;
  if(!a){sendAI();return}
  $('#aiBody').innerHTML+=`<div class="ai-msg user"><div class="am-avatar">${ROLES[currentRole].avatar}</div><div class="am-bubble">${text}</div></div>`;
  input.value='';
  $('#aiBody').scrollTop=$('#aiBody').scrollHeight;
  // 打字动效
  const typingId='typing-'+Date.now();
  $('#aiBody').innerHTML+=`<div class="ai-msg bot" id="${typingId}"><div class="am-avatar">🤖</div><div class="am-bubble"><div class="ai-typing"><span></span><span></span><span></span></div></div></div>`;
  $('#aiBody').scrollTop=$('#aiBody').scrollHeight;
  setTimeout(()=>{
    const t=document.getElementById(typingId);
    if(t) t.remove();
    showAIModifyResponse(text,a);
  },900);
}
function showAIModifyResponse(text,a){
  // 生成修改方案
  const newVer='v'+(parseFloat(a.ver.replace('v',''))+0.1).toFixed(1);
  const modifyPlan=generateModifyPlan(text,a);
  // 创建一条新的需求记录（关联应用，走修改流程）
  const newId='REQ-2024-'+String(DATA.requirements.length+1).padStart(3,'0');
  const newReq={
    id:newId,
    name:a.name+'（修改）',
    level:a.level||'L2',
    status:'方案规划',
    owner:'陈小白',
    date:'2024-08-05',
    desc:modifyPlan.desc,
    user:a.user||'客户经理',
    scope:modifyPlan.scope,
    fields:modifyPlan.fields,
    caps:a.caps||[{n:'客户信息查询',has:true},{n:'地图定位',has:true}],
    modifyFromApp:a.id,
    modifyFromVer:a.ver,
    modifyToVer:newVer,
    modifyNote:text,
  };
  DATA.requirements.unshift(newReq);
  aiCreatedReqId=newId;
  const missingCaps=(a.caps||[]).filter(c=>!c.has);
  const hasGap=missingCaps.length>0;
  let html=`<div class="ai-msg bot"><div class="am-avatar">🤖</div><div class="am-bubble">
    好的，我已基于 <strong>${a.name}</strong>（${a.ver}）分析你的修改需求。<br><br>
    <div style="background:#F7F8FA;padding:10px 12px;border-radius:6px;font-size:12px;line-height:1.8;margin:8px 0">
      <div style="font-weight:600;color:var(--primary);margin-bottom:4px">📝 修改方案</div>
      <div><strong>修改目标</strong>：${text}</div>
      <div><strong>变更类型</strong>：${modifyPlan.type}</div>
      <div><strong>影响范围</strong>：${modifyPlan.impact}</div>
      <div><strong>新版本</strong>：${a.ver} → <strong style="color:var(--success)">${newVer}</strong></div>
    </div>
    <div style="margin-top:8px">
      <div style="font-weight:600;margin-bottom:4px">🔧 方案详情</div>
      ${modifyPlan.steps.map((s,i)=>`<div>${i+1}. ${s}</div>`).join('')}
    </div>
    ${hasGap?`<div style="margin-top:8px;padding:8px 10px;background:rgba(255,125,0,.08);border:1px solid rgba(255,125,0,.3);border-radius:6px;font-size:11px;color:var(--warning)">
      ⚠️ 检测到 ${missingCaps.length} 项能力缺口，发布后将自动生成缺口工单
    </div>`:''}
    <div style="margin-top:10px;display:flex;gap:6px">
      <button class="btn btn-sm btn-primary" onclick="closeAIAndOpenReq('${newId}')">查看详情并继续</button>
      <button class="btn btn-sm" onclick="showToast('修改方案已保存','success')">保存方案</button>
    </div>
  </div></div>`;
  $('#aiBody').innerHTML+=html;
  $('#aiBody').scrollTop=$('#aiBody').scrollHeight;
}
function generateModifyPlan(text,a){
  const t=text.toLowerCase();
  if(t.includes('导出')){
    return {type:'功能新增',impact:'新增导出按钮 + 后端导出接口',desc:'在'+a.name+'中新增数据导出功能，支持Excel/CSV格式导出',scope:[...(a.scope||['列表','详情']), '数据导出'],fields:['导出范围','导出格式','时间筛选'],steps:['在列表页新增「导出」按钮','后端新增导出接口，支持按时间范围筛选','前端调用接口并下载文件','增加导出权限校验']};
  }else if(t.includes('表单')||t.includes('登记')){
    return {type:'交互优化',impact:'表单字段调整 + 校验规则更新',desc:'优化'+a.name+'的表单交互体验，简化填写流程',scope:a.scope||['列表','表单'],fields:['优化字段排序','智能默认值','必填校验'],steps:['分析现有表单字段使用情况','优化字段顺序和分组','增加智能默认值填充','完善必填项校验提示']};
  }else if(t.includes('图表')||t.includes('统计')){
    return {type:'功能新增',impact:'新增统计图表页面',desc:'为'+a.name+'新增统计图表页面，可视化展示关键指标',scope:[...(a.scope||['列表']), '统计图表'],fields:['统计维度','时间范围','图表类型'],steps:['设计统计图表页面布局','后端新增统计聚合接口','前端集成ECharts图表','支持时间维度切换']};
  }else{
    return {type:'问题修复',impact:'修复已知问题 + 性能优化',desc:'修复'+a.name+'的已知问题并进行性能优化',scope:a.scope||['列表','详情'],fields:['问题定位','修复方案','验证用例'],steps:['复现并定位已知问题','修复相关代码逻辑','进行回归测试验证','性能优化与代码审查']};
  }
}

function createReqFromTemplate(id){

  if(!m) return;
  const newId='REQ-2024-'+String(DATA.requirements.length+1).padStart(3,'0');
  // 模板的应用配置
  const tplConfigs={
    'M-001':{scope:['拜访登记','拜访报告','客户画像'],fields:['客户姓名','拜访时间','拜访目的'],caps:[{n:'客户信息查询',has:true},{n:'地图定位',has:true},{n:'OCR识别',has:false}]},
    'M-002':{scope:['活动列表','在线报名','签到'],fields:['活动名称','报名人','手机号'],caps:[{n:'短信通知',has:true},{n:'二维码生成',has:true}]},
    'M-003':{scope:['材料上传','AI预审','风险提示'],fields:['贷款编号','客户姓名','材料类型'],caps:[{n:'OCR识别',has:false},{n:'风控模型',has:true}]},
    'M-005':{scope:['问卷生成','调查提交','分析报告'],fields:['评分','建议','客户编号'],caps:[{n:'问卷引擎',has:true},{n:'数据分析',has:false}]},
    'M-008':{scope:['培训计划','签到管理','考核统计'],fields:['培训名称','参训人','签到时间'],caps:[{n:'通知推送',has:true}]},
  };
  const cfg=tplConfigs[id]||{scope:['列表','详情','表单'],fields:['名称','时间','状态'],caps:[{n:'基础能力',has:true}]};
  const newReq={
    id:newId,
    name:m.name+'（基于模板）',

    status:'需求澄清',

  const noteEl=$('#auditNote');
  const note=noteEl?noteEl.value:'';
  if(result==='驳回'&&!note){showToast('驳回时必须填写审核意见','error');return}
  const a=DATA.audits.find(x=>x.id===id);
  if(a){
    a.status=result==='通过'?'已通过':'已驳回';
    a.auditNote=note;
    // 记录审核日志（支持多条）
    if(!a.auditLogs) a.auditLogs=[];
    const now=new Date();
    const pad=n=>String(n).padStart(2,'0');
    a.auditLogs.push({
      result:result,
      auditor:currentRole==='owner'?'张明远':'当前管理员',
      time:`2024-08-0${6} ${pad(now.getHours())}:${pad(now.getMinutes())}`,
      note:note||'审核通过'
    });
    const req=DATA.requirements.find(r=>r.name===a.name);
    if(req){
      if(result==='通过'){
        if(a.type==='需求审核'){
          req.status='方案规划';
          req.auditStage=null;
          if(req.fromScene){
            const sc=DATA.scenes.find(x=>x.id===req.fromScene);
            if(sc){sc.status='孵化中';sc.assignee=req.owner}
          }
        }else if(a.type==='发布审核'){
          req.status='已发布';
          req.auditStage=null;
          if(req.fromScene){
            const sc=DATA.scenes.find(x=>x.id===req.fromScene);
            if(sc){sc.status='已孵化'}
          }
        }else if(a.type==='下线审核'){
          req.status='已下线';
          req.auditStage=null;
          const app=DATA.apps.find(ap=>ap.name===req.name);
          if(app){app.status='已下线'}
        }
      }else if(result==='驳回'){
        rejectAudit(req.id,note);
      }
    }
  }
  closeDrawer();
  showToast(`审核${result} · 已通知申请人`,result==='通过'?'success':'error');
  renderPage();
}

function passAudit(id){
  const r=DATA.requirements.find(x=>x.id===id);
  if(!r) return;
  if(r.auditStage==='requirement'){
    // 需求审核通过 → 进入方案规划，同步场景池状态
    r.status='方案规划';
    r.auditStage=null;
    // 需求方创建的需求：关联场景进入孵化中
    if(r.fromScene){
      const sc=DATA.scenes.find(x=>x.id===r.fromScene);
      if(sc){
        sc.status='孵化中';
        sc.assignee=r.owner;
      }
    }
    showToast('需求审核通过！可开始生成方案','success');
    closeDrawer();
    setTimeout(()=>openReqDetail(id),100);
  }else{
    // 发布审核通过 → 已发布
    r.status='已发布';
    r.auditStage=null;
    const gaps=generateGapOrders(r);
    // 同步场景池状态为已孵化
    if(r.fromScene){
      const sc=DATA.scenes.find(x=>x.id===r.fromScene);
      if(sc){
        sc.status='已孵化';
        sc.linkedApp=r.linkedApp||(DATA.apps.find(a=>a.name===r.name)?.id);

    closeDrawer();
    setTimeout(()=>publishSuccess(id),200);
  }
}

function rejectAudit(id,reason){

  r.status='已驳回';
  r.auditStage=null;
  r.rejectReason=reason||'审核未通过';
  // 同步场景池状态为已驳回
  if(r.fromScene){

    if(sc){
      sc.status='已驳回';

/* 生成缺口能力工单，返回生成数量 */
function generateGapOrders(r){
  const missing=r.caps.filter(c=>!c.has);
  if(missing.length===0) return 0;
  const baseNum=DATA.gaps.length;
  missing.forEach((c,i)=>{
    const gapId='GAP-'+String(baseNum+i+1).padStart(3,'0');
    DATA.gaps.unshift({id:gapId, cap:c.n, source:'需求自动发现', from:r.id, priority:'高', status:'待处理', date:'2024-08-05'});
  });
  // 更新科技部菜单角标
  const gapMenu=document.querySelector('[data-page="gap-order"] .menu-badge');
  if(gapMenu) gapMenu.textContent=DATA.gaps.filter(g=>g.status==='待处理').length;
  return missing.length;
}

      oldVer=a.ver;
      a.ver=r.modifyToVer;

  const gapList=DATA.gaps.filter(g=>g.from===r.id);

    {tab:'首页',title:'理财到期提醒',type:'list',items:[{icon:'💰',name:'稳健理财2024-001',sub:'8月15日到期 · ¥50万',color:'#FF7D00'},{icon:'💰',name:'安享系列',sub:'8月22日到期 · ¥30万',color:'#1A66FF'},{icon:'💰',name:'灵活宝',sub:'9月01日到期 · ¥20万',color:'#00B42A'}]},
    {tab:'提醒',title:'到期提醒',type:'report',stats:[{label:'本周到期',value:'8'},{label:'待提醒',value:'3'}]},
    {tab:'推荐',title:'续期推荐',type:'list',items:[{icon:'📈',name:'稳健理财2024-002',sub:'预期年化 4.2%',color:'#00B42A'},{icon:'📈',name:'安享系列Pro',sub:'预期年化 4.5%',color:'#1A66FF'}]},
    {tab:'我的',title:'我的',type:'profile',name:'陈小白',role:'客户经理 · 城东支行',stats:[{label:'已提醒',value:'42'},{label:'续期成功',value:'18'}]},
  ],
  survey:[
    {tab:'首页',title:'满意度调查',type:'list',items:[{icon:'📝',name:'2024Q3客户满意度',sub:'已收集 128 份',color:'#1A66FF'},{icon:'📝',name:'服务体验调查',sub:'已收集 56 份',color:'#00B42A'}]},
    {tab:'问卷',title:'满意度问卷',type:'form',fields:[{label:'整体满意度',type:'select',options:['非常满意','满意','一般','不满意']},{label:'建议',type:'textarea'}]},
    {tab:'报告',title:'分析报告',type:'report',stats:[{label:'平均分',value:'4.6'},{label:'参与人数',value:'184'}]},
    {tab:'我的',title:'我的',type:'profile',name:'陈小白',role:'客户经理 · 城东支行',stats:[{label:'已发起',value:'12'},{label:'已收集',value:'184'}]},
  ],
};
let previewScene='visit';
let previewTab=0;
let previewReqId=null;
function openPreview(id){
  const r=DATA.requirements.find(x=>x.id===id);
  if(!r) return;
  // 根据需求名称匹配场景
  const n=r.name;
  previewScene=n.includes('拜访')?'visit':n.includes('活动')?'event':n.includes('理财')?'finance':n.includes('满意度')?'survey':'visit';
  previewTab=0;
  previewReqId=id;
  renderPreview(r);
  $('#previewMask').classList.add('open');
}
function renderPreview(r){
  const pages=PREVIEW_PAGES[previewScene];
  const page=pages[previewTab];
  const sceneLabels={visit:'客户拜访管理',event:'活动报名',finance:'理财到期',survey:'满意度调查'};
  $('#previewTitle').textContent='小程序预览 · '+r.name;
  $('#previewTabs').innerHTML=pages.map((p,i)=>`<button class="pv-tab ${i===previewTab?'active':''}" onclick="switchPreviewTab(${i})">${p.tab}</button>`).join('');
  $('#previewPageHeader').textContent=page.title;
  $('#previewTabbar').innerHTML=pages.map((p,i)=>`<span style="color:${i===previewTab?'var(--primary)':'#86909C'};font-weight:${i===previewTab?'600':'400'}">${p.tab}</span>`).join('');
  let body='';
  if(page.type==='list'){
    body=`<div class="pv-search">🔍 搜索</div>${page.items.map(it=>`<div class="pv-card"><div class="pv-card-icon" style="background:${it.color}">${it.icon}</div><div class="pv-card-text"><div class="pv-card-title">${it.name}</div><div class="pv-card-sub">${it.sub}</div></div></div>`).join('')}`;
  }else if(page.type==='form'){
    body=page.fields.map(f=>`<div class="pv-form-group"><label class="pv-form-label">${f.label}</label>${f.type==='select'?`<select class="pv-form-select">${f.options.map(o=>`<option>${o}</option>`).join('')}</select>`:f.type==='textarea'?`<textarea class="pv-form-textarea" placeholder="${f.placeholder||'请输入'}"></textarea>`:`<input class="pv-form-input" placeholder="${f.placeholder||'请输入'}">`}</div>`).join('')+'<button class="pv-submit-btn">提交</button>';
  }else if(page.type==='report'){
    body=`<div class="pv-stats-row">${page.stats.map(s=>`<div class="pv-stat"><div class="pv-stat-value">${s.value}</div><div class="pv-stat-label">${s.label}</div></div>`).join('')}</div><div class="pv-chart-placeholder">📊 趋势图表区域</div><div class="pv-chart-placeholder">📋 详细数据表格</div>`;
  }else if(page.type==='qrcode'){
    body=`<div style="text-align:center;padding:30px 0"><div class="pv-qrcode">▦</div><div style="margin-top:12px;font-size:13px;color:#1D2129;font-weight:500">扫码签到</div><div style="font-size:11px;color:#86909C;margin-top:4px">请使用微信扫一扫</div></div>`;
  }else if(page.type==='profile'){
    body=`<div class="pv-profile"><div class="pv-avatar">${page.name[0]}</div><div class="pv-profile-name">${page.name}</div><div class="pv-profile-role">${page.role}</div></div><div class="pv-stats-row">${page.stats.map(s=>`<div class="pv-stat"><div class="pv-stat-value">${s.value}</div><div class="pv-stat-label">${s.label}</div></div>`).join('')}</div>`;
  }
  $('#previewBody').innerHTML=body;
  $('#previewFooter').innerHTML=`<button class="btn btn-sm" style="background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.1)" onclick="closePreview()">关闭</button>
    <span style="color:rgba(255,255,255,.4);font-size:11px;margin-left:auto">${sceneLabels[previewScene]} · ${page.tab}页 · v1.0.0</span>`;
}
function switchPreviewTab(i){previewTab=i;const r=DATA.requirements.find(x=>x.id===previewReqId);if(r)renderPreview(r);}
function closePreview(){$('#previewMask').classList.remove('open');}

/* ============ 初始化 ============ */
renderHeader();
renderSidebar();
renderPage();
</script>
</body>
