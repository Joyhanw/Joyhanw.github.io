<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泰隆银行项目</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            color: #1a1d2e;
            min-height: 100vh;
        }

        /* ===== 顶部蓝色背景 ===== */
        .header {
            background: linear-gradient(135deg, #0f111e, #1a1d2e);
            padding: 48px 0 40px;
            color: #fff;
            text-align: center;
        }
        .header h1 {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* ===== 卡片样式 ===== */
        .card-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card {
            background: #ffffff;
            border-radius: 14px;
            padding: 28px 24px;
            border: 1px solid #e8eaef;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            display: block;
            color: inherit;
        }
        .card:hover {
            border-color: #4f6ef7;
            box-shadow: 0 8px 30px rgba(79, 110, 247, 0.13);
            transform: translateY(-3px);
        }
        .card .icon {
            font-size: 30px;
            margin-bottom: 12px;
        }
        .card .name {
            font-size: 17px;
            font-weight: 600;
            color: #0f111e;
            line-height: 1.4;
        }
        .card .tag {
            display: inline-block;
            margin-top: 8px;
            font-size: 11px;
            padding: 2px 14px;
            border-radius: 12px;
            background: #eef1ff;
            color: #4f6ef7;
        }
        .card .tag-green {
            background: #ecfdf5;
            color: #16a34a;
        }
        .card .tag-purple {
            background: #f5f3ff;
            color: #7c3aed;
        }
        .card .tag-orange {
            background: #fffbeb;
            color: #d97706;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .container {
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 主内容 ===== -->
    <div class="header">
        <h1>泰隆银行项目</h1>
    </div>

    <div class="container">
        <div class="card-grid">

            <!-- 卡片 1：POC 效果验证 -->
            <a href="泰隆银行AI应用生成POC_框架.html" class="card">
                <div class="icon" style="color:#8b5cf6;"><i class="fas fa-flask"></i></div>
                <div class="name">泰隆银行 AI 应用生成 POC 效果验证</div>
                <span class="tag tag-purple"><i class="fas fa-vial"></i> 验证</span>
            </a>

            <!-- 卡片 2：一期原型 -->
            <a href="泰隆银行AI应用创新平台_一期原型.html" class="card">
                <div class="icon" style="color:#22c55e;"><i class="fas fa-robot"></i></div>
                <div class="name">泰隆银行 AI 应用创新平台 一期原型</div>
                <span class="tag tag-green"><i class="fas fa-pen-ruler"></i> 原型</span>
            </a>

            <!-- 卡片 3：蓝图方案 -->
            <a href="泰隆银行AI应用创新平台_蓝图方案.html" class="card">
                <div class="icon" style="color:#f59e0b;"><i class="fas fa-sitemap"></i></div>
                <div class="name">泰隆银行 AI 应用创新平台 蓝图方案</div>
                <span class="tag tag-orange"><i class="fas fa-project-diagram"></i> 蓝图</span>
            </a>

        </div>
    </div>

</body>
</html>
