<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>唯安的项目集合</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .card {
            max-width: 900px;
            width: 100%;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 40px 32px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 32px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }
        .sub {
            color: #94a3b8;
            margin-bottom: 32px;
            font-size: 14px;
            border-left: 3px solid #3b82f6;
            padding-left: 12px;
        }
        .project-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .project-item {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
        }
        .project-item:hover {
            background: rgba(255,255,255,0.08);
            transform: translateX(4px);
            border-color: rgba(59,130,246,0.4);
        }
        .project-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            text-decoration: none;
            color: #e2e8f0;
        }
        .project-name {
            font-weight: 500;
            font-size: 18px;
        }
        .project-arrow {
            color: #3b82f6;
            font-size: 20px;
            opacity: 0.7;
        }
        .project-item:hover .project-arrow {
            opacity: 1;
            transform: translateX(4px);
            transition: all 0.2s;
        }
        .project-docs {
            padding: 0 20px 16px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 0;
        }
        .doc-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #94a3b8;
            font-size: 13px;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,0.03);
            transition: all 0.2s;
        }
        .doc-link:hover {
            color: #60a5fa;
            background: rgba(96,165,250,0.15);
        }
        .footer-note {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
            font-size: 12px;
            color: #475569;
            text-align: center;
        }
        @media (max-width: 600px) {
            .card { padding: 24px 20px; }
            .project-link { padding: 12px 16px; }
            .project-name { font-size: 15px; }
            .project-docs { padding: 0 16px 12px 16px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📁 唯安的项目集合</h1>
        <div class="sub">交互演示 · 持续更新</div>
        <div class="project-list">

            <!-- ========== 项目1：骨科AI ========== -->
            <div class="project-item">
                <a class="project-link" href="/骨科AI/骨科AI医院平台整体框架讨论稿.html" target="_blank">
                    <span class="project-name">🏥 骨科AI医院平台整体框架讨论稿</span>
                    <span class="project-arrow">→</span>
                </a>
                <div class="project-docs">
                    <a class="doc-link" href="/骨科AI/骨科医院AI员工系统.pdf" target="_blank">📄 骨科医院AI员工系统（PDF）</a>
                </div>
            </div>

            <!-- ========== 项目2：海牛工作台 ========== -->
            <div class="project-item">
                <a class="project-link" href="/海牛工作台/海牛工作台2.0讨论稿.html" target="_blank">
                    <span class="project-name">⚙️ 海牛工作台2.0讨论稿</span>
                    <span class="project-arrow">→</span>
                </a>
                <div class="project-docs">
                    <!-- 如果海牛工作台也有配套文档，在这里加链接 -->
                </div>
            </div>

            <!-- ========== 后续新增项目模板 ========== -->
            <!-- 
            <div class="project-item">
                <a class="project-link" href="/项目文件夹/你的文件.html" target="_blank">
                    <span class="project-name">📌 新项目名称</span>
                    <span class="project-arrow">→</span>
                </a>
                <div class="project-docs">
                    <a class="doc-link" href="/项目文件夹/配套文档.md" target="_blank">📄 配套文档</a>
                </div>
            </div>
            -->

        </div>
        <div class="footer-note">
            💡 点击项目卡片在新标签页打开原型 | 点击下方文档链接查看配套资料
        </div>
    </div>
</body>
</html>
