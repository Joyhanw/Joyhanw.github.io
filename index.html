<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>唯安的项目集合</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            padding: 32px 24px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 32px;
            text-align: center;
        }
        .header h1 {
            font-size: 32px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }
        .header .sub {
            color: #94a3b8;
            font-size: 14px;
        }
        .project-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 20px;
            overflow: hidden;
        }
        .project-card:hover {
            border-color: rgba(59,130,246,0.3);
        }
        .project-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        .project-header:hover {
            background: rgba(255,255,255,0.03);
        }
        .project-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .project-icon {
            font-size: 24px;
        }
        .project-name {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }
        .toggle-icon {
            color: #60a5fa;
            font-size: 16px;
        }
        .project-content {
            padding: 0 20px 16px 20px;
            display: none;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .project-card.expanded .project-content {
            display: block;
        }
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }
        .file-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.2s;
            color: #e2e8f0;
        }
        .file-item:hover {
            background: rgba(59,130,246,0.12);
            transform: translateX(4px);
        }
        .file-icon {
            font-size: 18px;
            width: 28px;
            text-align: center;
        }
        .file-name {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
        }
        .file-arrow {
            color: #3b82f6;
            opacity: 0.6;
            font-size: 14px;
        }
        .file-item:hover .file-arrow {
            opacity: 1;
            transform: translateX(3px);
            transition: all 0.2s;
        }
        .empty-tip {
            color: #6b7280;
            font-size: 13px;
            padding: 16px 0;
            text-align: center;
        }
        .footer-note {
            margin-top: 32px;
            padding-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #475569;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        @media (max-width: 600px) {
            body { padding: 20px 16px; }
            .project-header { padding: 12px 16px; }
            .project-name { font-size: 16px; }
            .project-content { padding: 0 16px 12px 16px; }
            .file-item { padding: 8px 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📁 唯安的项目集合</h1>
            <div class="sub">点击项目标题展开/收起 · 点击文件在新标签页打开</div>
        </div>

        <div id="project-list"></div>

        <div class="footer-note">
            💡 提示：点击项目标题展开文件列表
        </div>
    </div>

    <script>
        const projects = [
            {
                id: 1,
                name: "数字员工",
                icon: "🤖",
                files: [
                    { name: "MCPUI-Ai生成.html", path: "/数字员工/MCPUI-Ai生成.html", icon: "🖥️" }
                ]
            },
            {
                id: 2,
                name: "海牛工作台",
                icon: "⚙️",
                files: [
                    { name: "海牛工作台2.0讨论稿.html", path: "/海牛工作台/海牛工作台2.0讨论稿.html", icon: "🖥️" }
                ]
            },
            {
                id: 3,
                name: "骨科AI",
                icon: "🏥",
                files: [
                    { name: "骨科AI医院平台整体框架讨论稿.html", path: "/骨科AI/骨科AI医院平台整体框架讨论稿.html", icon: "🖥️" },
                    { name: "骨科医院AI员工系统.pdf", path: "/骨科AI/骨科医院AI员工系统.pdf", icon: "📄" }
                ]
            }
        ];

        function renderProjects() {
            const container = document.getElementById('project-list');
            container.innerHTML = '';

            projects.forEach(project => {
                let filesHtml = '';
                if (project.files && project.files.length > 0) {
                    filesHtml = `
                        <div class="file-list">
                            ${project.files.map(file => `
                                <a class="file-item" href="${file.path}" target="_blank">
                                    <span class="file-icon">${file.icon}</span>
                                    <span class="file-name">${file.name}</span>
                                    <span class="file-arrow">→</span>
                                </a>
                            `).join('')}
                        </div>
                    `;
                } else {
                    filesHtml = '<div class="empty-tip">暂无文件</div>';
                }

                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <div class="project-header">
                        <div class="project-title">
                            <span class="project-icon">${project.icon}</span>
                            <span class="project-name">${project.name}</span>
                        </div>
                        <span class="toggle-icon">▶</span>
                    </div>
                    <div class="project-content">
                        ${filesHtml}
                    </div>
                `;

                const header = card.querySelector('.project-header');
                const toggleIcon = header.querySelector('.toggle-icon');

                header.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isExpanded = card.classList.contains('expanded');
                    if (isExpanded) {
                        card.classList.remove('expanded');
                        toggleIcon.textContent = '▶';
                    } else {
                        card.classList.add('expanded');
                        toggleIcon.textContent = '▼';
                    }
                });

                container.appendChild(card);
            });
        }

        renderProjects();
    </script>
</body>
</html>
