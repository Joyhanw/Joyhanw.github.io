<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的原型项目</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .card {
            max-width: 800px;
            width: 100%;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 40px 32px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 32px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }
        .sub {
            color: #94a3b8;
            margin-bottom: 32px;
            font-size: 14px;
            border-left: 3px solid #3b82f6;
            padding-left: 12px;
        }
        .project-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .project-item {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .project-item:hover {
            background: rgba(255,255,255,0.08);
            transform: translateX(4px);
            border-color: rgba(59,130,246,0.4);
        }
        .project-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            text-decoration: none;
            color: #e2e8f0;
        }
        .project-name {
            font-weight: 500;
            font-size: 18px;
        }
        .project-arrow {
            color: #3b82f6;
            font-size: 20px;
            opacity: 0.7;
        }
        .project-item:hover .project-arrow {
            opacity: 1;
            transform: translateX(4px);
            transition: all 0.2s;
        }
        .footer-note {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
            font-size: 12px;
            color: #475569;
            text-align: center;
        }
        @media (max-width: 600px) {
            .card { padding: 24px 20px; }
            .project-link { padding: 12px 16px; }
            .project-name { font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📁 海牛AI 原型集合</h1>
        <div class="sub">产品经理 · 交互演示 · 持续更新</div>
        <div class="project-list">
            <div class="project-item">
                <a class="project-link" href="/骨科AI/骨科AI医院平台整体框架讨论稿.html">
                    <span class="project-name">🏥 骨科AI医院平台整体框架讨论稿</span>
                    <span class="project-arrow">→</span>
                </a>
            </div>
            <!-- 后续新增项目复制下面这一块，修改 href 和 项目名称即可 -->
            <!--
            <div class="project-item">
                <a class="project-link" href="/你的文件夹/你的文件.html">
                    <span class="project-name">📄 新项目名称</span>
                    <span class="project-arrow">→</span>
                </a>
            </div>
            -->
        </div>
        <div class="footer-note">
            💡 提示：点击项目卡片即可跳转查看 · 所有链接均为 GitHub Pages 直链
        </div>
    </div>
</body>
</html>
