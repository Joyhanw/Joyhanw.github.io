<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>唯安的项目集合</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            padding: 48px 24px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 32px;
            font-weight: 600;
            color: #fff;
        }
        .project-card {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 12px;
            overflow: hidden;
            transition: all 0.2s;
        }
        .project-card:hover {
            border-color: rgba(59,130,246,0.3);
            background: rgba(255,255,255,0.05);
        }
        .project-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            cursor: pointer;
            user-select: none;
        }
        .project-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .project-icon {
            font-size: 22px;
        }
        .project-name {
            font-size: 17px;
            font-weight: 500;
            color: #e2e8f0;
        }
        .toggle-icon {
            color: #60a5fa;
            font-size: 14px;
            transition: transform 0.2s;
        }
        .project-content {
            display: none;
            border-top: 1px solid rgba(255,255,255,0.06);
            padding: 12px 16px;
        }
        .project-card.expanded .project-content {
            display: block;
        }
        .file-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .file-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            text-decoration: none;
            color: #94a3b8;
            transition: all 0.2s;
        }
        .file-item:hover {
            background: rgba(59,130,246,0.1);
            color: #e2e8f0;
        }
        .file-icon {
            font-size: 16px;
            width: 24px;
        }
        .file-name {
            flex: 1;
            font-size: 14px;
        }
        .file-arrow {
            color: #3b82f6;
            font-size: 12px;
            opacity: 0.5;
        }
        .file-item:hover .file-arrow {
            opacity: 1;
        }
        @media (max-width: 600px) {
            body { padding: 32px 20px; }
            .project-header { padding: 12px 16px; }
            .project-name { font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📁 唯安的项目集合</h1>
        </div>

        <div id="project-list"></div>
    </div>

    <script>
        const projects = [
            {
                id: 1,
                name: "数字员工",
                icon: "🤖",
                files: [
                    { name: "数字员工-Ai生成.html", path: "/数字员工/数字员工-Ai生成.html", icon: "🖥️" }
                ]
            },
            {
                id: 2,
                name: "海牛工作台",
                icon: "⚙️",
                files: [
                    { name: "海牛工作台2.0讨论稿.html", path: "/海牛工作台/海牛工作台2.0讨论稿.html", icon: "🖥️" }
                ]
            },
            {
                id: 3,
                name: "骨科AI",
                icon: "🏥",
                files: [
                    { name: "骨科AI医院平台整体框架讨论稿.html", path: "/骨科AI/骨科AI医院平台整体框架讨论稿.html", icon: "🖥️" },
                    { name: "一期功能清单", path: "https://docs.qq.com/sheet/DWUJHbkVub1JYeWhs?tab=BB08J2", icon: "📊" }
                ]
            },
            {
                id: 4,
                name: "宁波天使投资",
                icon: "🏛️",
                files: [
                    { name: "功能清单", path: "https://docs.qq.com/sheet/DWXVPeFVIRm1LTXVS?tab=BB08J2", icon: "📊" }
                ]
            }
        ];

        function renderProjects() {
            const container = document.getElementById('project-list');
            container.innerHTML = '';

            projects.forEach(project => {
                const filesHtml = project.files.map(file => `
                    <a class="file-item" href="${file.path}" target="_blank">
                        <span class="file-icon">${file.icon}</span>
                        <span class="file-name">${file.name}</span>
                        <span class="file-arrow">→</span>
                    </a>
                `).join('');

                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <div class="project-header">
                        <div class="project-title">
                            <span class="project-icon">${project.icon}</span>
                            <span class="project-name">${project.name}</span>
                        </div>
                        <span class="toggle-icon">▶</span>
                    </div>
                    <div class="project-content">
                        <div class="file-list">${filesHtml}</div>
                    </div>
                `;

                const header = card.querySelector('.project-header');
                const toggleIcon = header.querySelector('.toggle-icon');

                header.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isExpanded = card.classList.contains('expanded');
                    if (isExpanded) {
                        card.classList.remove('expanded');
                        toggleIcon.textContent = '▶';
                    } else {
                        card.classList.add('expanded');
                        toggleIcon.textContent = '▼';
                    }
                });

                container.appendChild(card);
            });
        }

        renderProjects();
    </script>
</body>
</html>
