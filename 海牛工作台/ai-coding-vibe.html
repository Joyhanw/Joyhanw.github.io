<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Coding · Vibe Coding</title>
<style>
:root{
  --primary:#1A66FF;--primary-dark:#0F47C7;--primary-light:#E8F0FF;
  --success:#00B42A;--warning:#FF7D00;--danger:#F53F3F;
  --text-1:#1D2129;--text-2:#4E5969;--text-3:#86909C;--text-4:#C9CDD4;
  --bg-page:#F2F3F5;--border:#E5E6EB;--border-light:#EEF0F3;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow:0 2px 10px rgba(0,0,0,.06);
  --shadow-lg:0 12px 40px rgba(0,0,0,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg-page);color:var(--text-1);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:13px;outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#D8DADF;border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ===== 登录页 ===== */
.login-page{position:fixed;inset:0;z-index:1000;background:linear-gradient(160deg,#0F2B46,#123A60 55%,#1A66FF 130%);display:flex;align-items:center;justify-content:center}
.login-page::before{content:'';position:absolute;right:-120px;top:-120px;width:480px;height:480px;background:radial-gradient(circle,rgba(26,102,255,.35) 0%,transparent 70%);border-radius:50%}
.login-page::after{content:'';position:absolute;left:-160px;bottom:-160px;width:520px;height:520px;background:radial-gradient(circle,rgba(0,212,255,.18) 0%,transparent 70%);border-radius:50%}
.login-card{position:relative;width:400px;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:40px 36px;z-index:1}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo-icon{width:56px;height:56px;border-radius:14px;margin:0 auto 12px;background:linear-gradient(135deg,#1A66FF,#00D4FF);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;box-shadow:0 8px 20px rgba(26,102,255,.3)}
.login-logo-title{font-size:20px;font-weight:700;color:var(--text-1)}
.login-logo-sub{font-size:12px;color:var(--text-3);margin-top:4px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px}
.form-input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#FAFBFC;transition:.2s}
.form-input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--primary-light)}
.login-btn{width:100%;padding:12px;border-radius:8px;background:var(--primary);color:#fff;font-size:15px;font-weight:600;margin-top:6px;transition:.2s}
.login-btn:hover{background:var(--primary-dark)}
.login-tip{text-align:center;font-size:12px;color:var(--text-4);margin-top:16px}
.login-tip strong{color:var(--primary);font-weight:500}

/* ===== 主布局 ===== */
.app{display:none;flex-direction:column;height:100vh;overflow:hidden}
.app.ready{display:flex}
.header{height:56px;background:#0F2B46;color:#fff;flex-shrink:0;display:flex;align-items:center;padding:0 20px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:100}
.logo{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;letter-spacing:.5px}
.logo-icon{width:30px;height:30px;background:linear-gradient(135deg,#1A66FF,#00D4FF);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold}
.logo .sub{font-size:11px;color:rgba(255,255,255,.6);font-weight:400;margin-left:2px}
.header-nav{display:flex;gap:28px;margin-left:48px;flex:1}
.header-nav a{color:rgba(255,255,255,.7);font-size:14px;padding:8px 2px;position:relative;transition:.2s;cursor:pointer}
.header-nav a:hover{color:#fff}
.header-nav a.active{color:#fff;font-weight:500}
.header-nav a.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:#1A66FF;border-radius:2px}
.header-right{display:flex;align-items:center;gap:16px}
.env-tag{background:rgba(0,180,42,.15);color:#5BFF8A;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid rgba(0,180,42,.3)}
.user-info{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:.2s}
.user-info:hover{background:rgba(255,255,255,.1)}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#FF7D00,#FFB400);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;flex-shrink:0}
.user-name{font-size:13px;font-weight:500;line-height:1.2}


.user-info{position:relative}
.user-arrow{font-size:10px;color:rgba(255,255,255,.5);margin-left:-2px}
.user-menu{display:none;position:absolute;top:42px;right:0;width:150px;background:#fff;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);border:1px solid var(--border);overflow:hidden;z-index:500;animation:upIn .18s ease}
.user-menu.open{display:block}
@keyframes upIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.user-menu-item{padding:10px 14px;font-size:12.5px;color:var(--text-1);cursor:pointer;display:flex;align-items:center;gap:8px}
.user-menu-item:hover{background:var(--primary-light);color:var(--primary)}
.user-menu-item.logout:hover{background:#FFECE8;color:var(--danger)}
.user-menu-divider{height:1px;background:var(--border-light);margin:4px 0}

/* ===== 首页 ===== */
.main{flex:1;overflow-y:auto;background:var(--bg-page)}

/* ===== 生成页 ===== */
.gen-layout{display:flex;height:calc(100vh - 56px);overflow:hidden}
.gen-main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-page)}
.gen-topbar{height:52px;background:#fff;border-bottom:1px solid var(--border-light);flex-shrink:0;display:flex;align-items:center;padding:0 16px;gap:12px}
.gen-topbar-left{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--text-2);font-size:13px;padding:5px 10px;border-radius:6px;transition:.15s}
.gen-topbar-left:hover{background:var(--primary-light);color:var(--primary)}
.gen-topbar-title{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden}
.gen-topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}

.gen-btn{padding:6px 14px;border-radius:6px;font-size:12.5px;color:var(--text-2);border:1px solid var(--border);background:#fff;transition:.15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.gen-btn:hover{border-color:var(--primary);color:var(--primary)}
.gen-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.gen-btn.primary:hover{background:var(--primary-dark);color:#fff}
.loading-spinner{width:44px;height:44px;border:4px solid var(--primary-light);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-main{font-size:16px;font-weight:600;color:var(--text-1)}
.loading-step{font-size:13px;color:var(--text-3);background:#fff;padding:5px 14px;border-radius:20px;box-shadow:var(--shadow-sm)}
.idle-ico{font-size:52px}

/* 小程序壳（轻量预览 — 黑色粗边框备用版本已移除） */
@keyframes popIn{from{opacity:.5;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}







.red{color:var(--danger);margin-left:2px}
.qr-dot{width:30px;height:30px;background:var(--primary);border-radius:6px;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700}
.st-registered{background:var(--primary-light);color:var(--primary)}
.st-checked{background:#E8FFEA;color:var(--success)}
.st-canceled{background:#F2F3F5;color:var(--text-3)}
.empty-ico{font-size:40px;margin-bottom:8px}

/* PC壳 */
.pc-shell{width:100%;max-width:800px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.12);border:1px solid var(--border);animation:popIn .35s ease;flex-shrink:0}
.pc-browser-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#F2F3F5;border-bottom:1px solid var(--border-light)}
.pc-dot{width:10px;height:10px;border-radius:50%}
.pc-url{flex:1;background:#fff;border-radius:6px;padding:4px 12px;font-size:11px;color:var(--text-3);margin-left:8px}
.pc-layout{display:flex;min-height:460px}
.pc-sidebar{width:160px;background:#0F2B46;padding:16px 0;flex-shrink:0}
.pc-sidebar-logo{color:#fff;font-size:14px;font-weight:700;padding:0 16px 16px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:12px}
.pc-menu-item{padding:10px 16px;color:rgba(255,255,255,.65);font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:8px}
.pc-menu-item.active{background:var(--primary);color:#fff}
.pc-main{flex:1;background:#F7F8FA;padding:18px;overflow-x:auto}
.pc-main-title{font-size:16px;font-weight:600;margin-bottom:14px}
.pc-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.pc-stat{background:#fff;border-radius:8px;padding:14px;box-shadow:var(--shadow-sm)}
.pc-stat-label{font-size:11px;color:var(--text-3);margin-bottom:4px}
.pc-stat-value{font-size:22px;font-weight:700}
.pc-table{width:100%;background:#fff;border-radius:8px;overflow:hidden;box-shadow:var(--shadow-sm);border-collapse:collapse}
.pc-table th{background:#FAFBFC;font-size:11px;color:var(--text-3);text-align:left;padding:9px 12px;border-bottom:1px solid var(--border-light);font-weight:500;white-space:nowrap}
.pc-table td{padding:9px 12px;font-size:12px;color:var(--text-2);border-bottom:1px solid var(--border-light);white-space:nowrap}
.pc-table tr:last-child td{border-bottom:none}
.pc-tag{font-size:10px;padding:2px 8px;border-radius:4px;display:inline-block}

/* 右侧对话 */
.gen-chat-head{background:#0F2B46;color:#fff;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.gen-chat-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.gen-chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;background:#FAFAF7}
.gen-chat-msg{display:flex;gap:8px;max-width:100%}
.gen-chat-msg.user{flex-direction:row-reverse}
.gen-chat-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px}
.gen-chat-bubble{padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.65;max-width:88%;word-break:break-word}
.gen-chat-msg.bot .gen-chat-bubble{background:#fff;color:var(--text-1);border:1px solid var(--border);border-bottom-left-radius:4px}
.gen-chat-msg.user .gen-chat-bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px}





.req-label{width:64px;color:var(--text-3);flex-shrink:0}
.req-value{color:var(--text-1);flex:1}





.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 12px;border-radius:6px;font-size:12.5px;background:#fff;color:var(--text-2);border:1px solid var(--border);transition:.15s;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark);color:#fff}



.gen-chat-input{padding:10px 12px;border-top:1px solid var(--border-light);display:flex;gap:8px;background:#fff;flex-shrink:0}
.gen-chat-input textarea{flex:1;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px;resize:none;min-height:44px;max-height:110px;font-family:inherit;background:#FAFBFC}
.gen-chat-input textarea:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-light);background:#fff}
.gen-chat-send{width:44px;height:44px;border-radius:10px;background:var(--primary);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.gen-chat-send:hover{background:var(--primary-dark)}

/* 浮动对话按钮 */

/* 我的应用 */
.app-page{padding:24px;max-width:1100px;margin:0 auto}
.app-page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.app-page-title{font-size:20px;font-weight:700;color:var(--text-1)}
.app-page-sub{font-size:12px;color:var(--text-3);margin-top:4px}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.app-card{background:#fff;border-radius:12px;padding:18px;border:1px solid var(--border-light);cursor:pointer;transition:.2s}
.app-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--primary)}
.app-card-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.app-card-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.app-card-name{font-size:15px;font-weight:600;color:var(--text-1)}
.app-card-ver{font-size:11px;color:var(--text-3);margin-top:2px}
.app-card-desc{font-size:12.5px;color:var(--text-2);line-height:1.6;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.app-card-bottom{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border-light)}
.app-card-status{font-size:11px;padding:2px 10px;border-radius:10px}
.st-launched{background:#E8FFEA;color:var(--success)}
.st-generating{background:var(--primary-light);color:var(--primary)}

/* .icon-btn removed — replaced by platform tag */
.app-empty{text-align:center;padding:60px 20px;color:var(--text-3)}
.empty-icon{font-size:48px;margin-bottom:12px}

/* 通用标签 */
.tag{display:inline-flex;align-items:center;padding:2px 8px;font-size:11px;border-radius:4px;line-height:1.6}
.tag-success{background:#E8FFEA;color:var(--success)}
.tag-primary{background:var(--primary-light);color:var(--primary)}
.tag-warning{background:#FFF7E8;color:var(--warning)}
.tag-gray{background:#F2F3F5;color:var(--text-3)}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none;align-items:center;justify-content:center}
.modal-mask.open{display:flex}
.modal{background:#fff;border-radius:12px;width:460px;max-width:92vw;max-height:85vh;display:flex;flex-direction:column;animation:modalIn .25s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-title{font-size:15px;font-weight:600}
.modal-close{font-size:20px;color:var(--text-3);cursor:pointer;padding:4px}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:10px;background:#FAFBFC;flex-shrink:0}
.modal-foot .btn{padding:8px 20px;font-size:13px}
.form-select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;appearance:auto}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-12px);background:#1D2129;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.warning{background:var(--warning)}

@media (max-width:1200px){.gen-chat{width:360px}}
@media (max-width:960px){.gen-chat{width:320px}}


/* 平铺详情页（）*/
.tile-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 12px 4px}
.tile-detail{background:#fff;border-radius:10px;padding:12px;border:1px solid var(--border-light);box-shadow:var(--shadow-sm)}
.tile-detail .td-icon{font-size:18px;margin-bottom:6px}
.tile-detail .td-label{font-size:10px;color:var(--text-3)}
.tile-detail .td-value{font-size:12.5px;font-weight:600;color:var(--text-1);margin-top:2px}
.tile-detail-big{grid-column:1/3;background:#fff;border-radius:10px;padding:12px;border:1px solid var(--border-light);box-shadow:var(--shadow-sm)}
.tile-detail-big .td-desc{font-size:12px;color:var(--text-2);line-height:1.6}
.tile-detail-act{grid-column:1/3;display:flex;gap:8px}
.tile-detail-act button{flex:1;padding:10px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:.2s}
.tile-detail-act .td-btn-primary{background:var(--primary);color:#fff}
.tile-detail-act .td-btn-default{background:#F2F3F5;color:var(--text-1)}

/* ===== 首页大输入区 + 示例需求 ===== */
.home-wrap{max-width:820px;margin:0 auto;padding:48px 24px 40px}
.home-title{font-size:30px;font-weight:700;color:var(--text-1);text-align:center}
.home-sub{font-size:14px;color:var(--text-3);text-align:center;margin:10px 0 24px}
.input-area{background:#fff;border-radius:22px;box-shadow:0 4px 20px rgba(0,0,0,.06);border:1px solid var(--border-light);padding:14px;transition:.2s}
.input-area:focus-within{border-color:var(--primary);box-shadow:0 6px 24px rgba(26,102,255,.14)}
.input-big{width:100%;border:none;resize:none;font-size:16px;line-height:1.7;padding:16px;min-height:150px;max-height:220px;background:transparent}
.input-big::placeholder{color:var(--text-4)}
.input-tools{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 2px;border-top:1px solid var(--border-light);margin-top:6px}
.input-tools-left{display:flex;align-items:center;gap:6px}
.tool-btn{padding:6px 10px;border-radius:6px;font-size:12.5px;color:var(--text-3);transition:.15s;display:flex;align-items:center;gap:4px;background:transparent;border:1px solid transparent}
.tool-btn:hover{background:var(--primary-light);color:var(--primary)}
.send-arrow{width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0;box-shadow:0 2px 8px rgba(26,102,255,.3);border:none;cursor:pointer;line-height:1}
.send-arrow:hover{background:var(--primary-dark)}
.send-arrow:disabled{background:#C9D7F0;box-shadow:none;cursor:not-allowed}
.home-platform-select{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--border-light);width:fit-content}
.home-platform-select span{padding:8px 18px;font-size:14px;cursor:pointer;color:var(--text-2);transition:.15s;user-select:none;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.home-platform-select span:hover{color:var(--primary)}
.home-platform-select span.active{color:var(--primary);font-weight:600;border-bottom-color:var(--primary)}
.home-tool-divider{width:1px;height:16px;background:var(--border);margin:0 4px}
.home-model-select{padding:5px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:12px;color:var(--text-2);appearance:auto;cursor:pointer;transition:.15s;max-width:160px}
.home-model-select:hover{border-color:var(--primary);color:var(--primary)}
.input-tools-right{display:flex;align-items:center;gap:10px}



/* ===== 需求说明书页：加宽 + 结构化文档 ===== */


/* ===== 平铺预览：轻量白底容器 ===== */
@keyframes tileIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== Vibe Coding 嵌入版新增样式 ===== */
/* 工作区骨架 */
.wc-body{flex:1;display:flex;overflow:hidden}
/* 面包屑（深色顶栏） */
.header .crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.55)}
.header .crumb a{color:rgba(255,255,255,.55);cursor:pointer;transition:.15s}
.header .crumb a:hover{color:#fff}
.header .crumb .sep{color:rgba(255,255,255,.3)}
.header .crumb .cur{color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.crumb-mid{flex:1;display:flex;justify-content:center;min-width:0}
/* 需求状态 / 版本 */
.st-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 10px;border-radius:10px;white-space:nowrap}
.st-chip i{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* AI 提炼应用名称：去掉口语前缀，取第一个分句 */
function aiNameFromText(text){
  let t=String(text||'').replace(/^(帮我|请帮我|我想|我要|麻烦|请)?(做一个|做个|开发一个|开发个|制作一个|搭一个)?(一个)?/,'').trim();
  t=t.split(/[，。；,;：:]/)[0].trim();
  if(!t)t=String(text||'').split(/[，。；,;：:]/)[0].trim();
  if(t.length>12)t=t.slice(0,12);
  return t||'未命名应用';
}
function startReqFromHome(){
  const i=$('vcHomeInput');
  const text=((i&&i.value)||state.homeInput||'').trim();
  if(!text){showToast('请描述你的需求','info');return;}
  state.homeInput=VC_HOME_DEFAULT;state.reqDraft='';
  state.phase='ws';state.stage='analyze';state.appTab=0;
  state.reqName=aiNameFromText(text);
  /* 免追问：直接进入统一工作区，AI 自动分析需求 */
  state.convMsgs=[
    {role:'user',text},
    {role:'ai',text:`好的，已理解你的需求「${state.reqName}」。\n正在分析需求，整理应用目标、使用角色、核心功能与业务规则，稍后生成需求说明卡。`},
  ];
  state.convLoading=true;state.convLoadingText='正在分析需求…';
  renderApp();scrollConv();
  setTimeout(generateReqDoc,2000);
}

function generateReqDoc(){

  state.reqDoc=JSON.parse(JSON.stringify(tpl));

  state.reqDoc.name=state.reqName;/* 应用名称全局统一 */
  normalizeReqDoc();
  state.stage='chat';state.convLoading=false;
  state.convMsgs.push({role:'ai',text:'✅ 需求分析完成，以下是结构化需求说明卡。你可以继续补充或调整需求（例如：增加活动审核功能、报名人数设置上限），我会同步更新卡片；确认无误后，发送「立即生成」开始创建应用。'});
  state.convMsgs.push({type:'reqcard'});
  state.reqDraft='立即生成';/* 沟通阶段预填，一键发送 */
  renderWs();scrollConv();
}

function applyReqSupplement(text){
  const r=state.reqDoc;
  const added=[];const removedPending=[];
  const addFunc=f=>{if(!(r.funcs||[]).includes(f)){r.funcs.push(f);added.push('核心功能 +「'+f+'」');}};
  const addRule=ru=>{r.rules=r.rules||[];if(!r.rules.includes(ru)){r.rules.push(ru);added.push('关键规则 +「'+ru+'」');}};
  const dropPending=k=>{(r.pending||[]).slice().forEach(p=>{if(p.includes(k)){r.pending=r.pending.filter(x=>x!==p);removedPending.push(p);}});};
  if(/审核/.test(text)){addFunc('活动审核管理');addRule('⚡ 新增活动需审核通过后对外发布');}
  if(/签到/.test(text)){addFunc('二维码签到');}
  if(/上限|限额/.test(text)){addRule('⚡ 报名人数上限：500人/场');dropPending('上限');}
  if(/月度|按月|统计周期/.test(text)){addRule('⚡ 支持按月度统计查看数据');dropPending('统计周期');}
  if(/导出/.test(text)){addFunc('数据导出');}
  if(/布局|样式|风格|颜色/.test(text)){addRule('⚡ 页面要求：'+(text.length>26?text.slice(0,26)+'…':text));}
  const short=text.length>20?text.slice(0,20)+'…':text;
  if(added.length){
    state.convMsgs.push({role:'ai',text:'好的，已结合历史沟通更新需求理解，需求说明卡已更新：\n'+added.map(a=>'· '+a).join('\n')+(removedPending.length?'\n· 待确认事项 -「'+removedPending.join('」「')+'」已确认':'')});
  }else{
    const ru='⚡ '+short;
    r.rules=r.rules||[];
    if(!r.rules.includes(ru)){r.rules.push(ru);}
    state.convMsgs.push({role:'ai',text:'好的，已记录你的补充「'+short+'」，并同步更新到需求说明卡。'});
  }
  state.convMsgs.push({type:'reqcard'});
  state.reqDraft='立即生成';
  renderWs();scrollConv();
  showToast('需求说明卡已更新','success');
}

/* ===== MD 编辑（沿用现有编辑体验；保存后同步重建 HTML）===== */
function detectScene(text){
  if(text.includes('看板')||text.includes('转化率')||text.includes('数据统计')||text.includes('统计分析'))return 'board';
  if(text.includes('报名')||text.includes('活动')||text.includes('签到'))return 'event';
  if(text.includes('拜访')||text.includes('客户'))return 'visit';
  if(text.includes('项目')||text.includes('任务')||text.includes('后台'))return 'pm';
  return 'board';
}

function renderMsg(m){
  if(m.type==='reqcard'){return `<div class="gen-chat-msg ai"><div class="gen-chat-avatar" style="background:#1A66FF">🤖</div><div class="gen-chat-bubble">${reqCardHTML()}</div></div>`;}
  if(m.type==='req')return '';
  const avatar=`<div class="gen-chat-avatar" style="${m.role==='user'?'background:linear-gradient(135deg,#FF7D00,#FFB400)':'background:#1A66FF'}">${m.role==='user'?'我':'🤖'}</div>`;
  const smallCls=m.small?' style="font-size:12px"':'';
  return `<div class="gen-chat-msg ${m.role}">${avatar}<div class="gen-chat-bubble"${smallCls}>${m.text||''}</div></div>`;
}

function reqCardHTML(){
  const r=state.reqDoc;if(!r)return '';
  const row=(k,v)=>`<div class="rc-row"><span class="rc-k">${k}</span><span class="rc-v">${v}</span></div>`;
  const list=(k,arr)=>`<div class="rc-row"><span class="rc-k">${k}</span><span class="rc-v">${(arr&&arr.length)?arr.map(x=>`<div class="rc-line">${x}</div>`).join(''):'—'}</span></div>`;
  const sec=r.sections||{};
  return `<div class="req-card-lite">
    <div class="rc-title">📄 ${escapeHtml(r.name)} · 需求说明卡</div>
    ${row('应用目标',escapeHtml(sec.overview||'—'))}
    ${row('使用角色',escapeHtml(sec.users||r.user||'—'))}
    ${list('核心功能',(r.funcs||[]).map(escapeHtml))}
    ${list('业务流程',String(sec.flow||'').split('→').map(x=>x.trim()).filter(Boolean).map(escapeHtml))}
    ${list('关键规则',(r.rules||[]).map(escapeHtml))}
    ${list('待确认事项',(r.pending||[]).map(escapeHtml))}
  </div>`;
}

function statusMeta(){
  if(state.stage==='analyze')return{cls:'st-analyze',text:'需求分析中'};
  if(state.stage==='generating')return{cls:'st-gen',text:'应用生成中'};
  if(state.stage==='done'&&state.wbStatus==='done')return{cls:'st-done',text:'已发布'};
  return{cls:'st-done',text:'已完成'};
}
function renderWs(){
  const b=$('wcBody');
  const st=statusMeta();
  const ph=state.stage==='analyze'?'AI 正在分析需求，可先输入补充信息…'
    :state.stage==='generating'?'正在生成应用，请稍候…'
    :state.stage==='done'?'描述修改意见，Enter 发送，例如「增加筛选条件」…'
    :'继续补充或调整需求；确认无误后发送「立即生成」开始创建应用…';
  b.innerHTML=`<div class="ws-page">
    <div class="ws-topbar">
      <div class="ws-topbar-left">
        <button class="ws-back" onclick="goWorkbench()">← 返回项目集</button>
        <span class="ws-name" id="wsNameText" title="点击修改应用名称" onclick="editAppName()">📄 ${escapeHtml(state.reqName)}</span>
        <span class="ws-edit" title="修改应用名称" onclick="editAppName()">✏</span>
      </div>
      <div class="ws-topbar-right">
        ${state.stage!=='chat'?`<span class="ws-status ${st.cls}">${st.text}</span>`:''}
        ${state.currentApp?'<button class="gen-btn primary" onclick="publishApp()">🚀 发布</button>':''}
      </div>
    </div>
    <div class="ws-split" id="wsSplit">
      <div class="ws-canvas" id="wsCanvasL">${canvasViewHTML()}</div>
      <div class="ws-divider" onmousedown="dividerDown(event)" title="拖拽调整分栏比例"><span class="ws-divider-handle"></span></div>
      <div class="ws-chat">
        <div class="gen-chat-head"><div class="gen-chat-title">🤖 AI助手</div></div>
        <div class="gen-chat-msgs" id="genChatMsgs">${state.convMsgs.map(renderMsg).join('')}${state.convLoading?convLoadingHTML():''}</div>
        <div class="gen-chat-input">
          <button class="chat-attach" title="上传参考资料（作为对话上下文）" onclick="mockUpload()">📎</button>
          <textarea id="wsChatInput" placeholder="${ph}" rows="1" oninput="state.reqDraft=this.value" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();wsChatSend()}">${escapeHtml(state.reqDraft||'')}</textarea>
          <button class="gen-chat-send" onclick="wsChatSend()">➤</button>
        </div>
      </div>
    </div>
  </div>`;
  applySplit();
}
function canvasViewHTML(){
  if(state.modifying&&state.currentApp)return `<div class="app-wrap">${appInteractiveHTML()}</div><div class="mod-overlay">🔄 正在修改中</div>`;
  if(state.stage==='generating')return genProgressHTML();
  if(state.currentApp)return `<div class="app-wrap">${appInteractiveHTML()}</div>`;
  return canvasEmptyHTML();
}
function canvasEmptyHTML(){
  return `<div class="canvas-empty"><div class="ce-ico">🪄</div><div class="ce-t">应用将在这里生成</div><div class="ce-d">请在右侧与 AI 完善需求，发送「立即生成」后开始创建应用</div></div>`;
}
function genProgressHTML(){
  const i=state.genStep;
  return `<div class="gen-progress"><div class="gp-head"><div class="loading-spinner"></div><div class="loading-main">正在生成应用：${escapeHtml(state.reqName)}</div></div>
    <div class="gp-steps">${GEN_STEPS.map((s,j)=>`<div class="gp-step ${j<i?'done':j===i?'active':''}"><span class="gp-ico">${j<i?'✅':j===i?'⏳':'○'}</span>${s}</div>`).join('')}</div></div>`;
}
function appInteractiveHTML(){
  const app=state.currentApp;
  const pages=APP_PAGES[app.scene]||BOARD_PAGES;
  const i=Math.min(state.appTab||0,pages.length-1);
  if(state.platform==='pc'){
    return `<div class="pc-shell" style="max-width:none">
      <div class="pc-browser-bar"><span class="pc-dot" style="background:#F53F3F"></span><span class="pc-dot" style="background:#FF7D00"></span><span class="pc-dot" style="background:#00B42A"></span>
        <span class="pc-url">https://app.hainiu.com/${app.scene} · ${escapeHtml(app.name)}</span></div>
      <div class="pc-layout">
        <div class="pc-sidebar"><div class="pc-sidebar-logo">${app.icon} ${escapeHtml(app.name)}</div>
          ${pages.map((p,j)=>`<div class="pc-menu-item${j===i?' active':''}" onclick="setAppTab(${j})">${p.icon} ${p.title}</div>`).join('')}
        </div>
        <div class="pc-main"><div class="pc-main-title">${pages[i].icon} ${pages[i].title}</div>${pages[i].body}</div>
      </div></div>`;
  }
  return `<div class="phone-shell">
    <div class="phone-top">${app.icon} ${escapeHtml(app.name)}</div>
    <div class="phone-body">${pages[i].body}</div>
    <div class="phone-tabbar">${pages.map((p,j)=>`<div class="phone-tab${j===i?' active':''}" onclick="setAppTab(${j})"><span class="pi">${p.icon}</span><span>${p.title}</span></div>`).join('')}</div>
  </div>`;
}
function setAppTab(i){
  state.appTab=i;
  const el=$('wsCanvasL');
  if(el)el.innerHTML=canvasViewHTML();
}
function clampSplit(p){return Math.max(40,Math.min(65,p));}
function applySplit(){const c=$('wsCanvasL');if(c)c.style.width=state.splitPct+'%';}
function dividerDown(e){
  e.preventDefault();
  const move=ev=>{const r=$('wsSplit').getBoundingClientRect();state.splitPct=clampSplit((ev.clientX-r.left)/r.width*100);applySplit();};
  const up=()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);document.body.style.cursor='';};
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',up);
  document.body.style.cursor='col-resize';
}
function wsChatSend(){
  const inp=$('wsChatInput');
  const text=((inp&&inp.value)||'').trim();
  if(!text)return;
  inp.value='';state.reqDraft='';
  state.convMsgs.push({role:'user',text});
  if(state.convLoading){state.convMsgs.push({role:'ai',text:'收到，正在结合你的补充一起分析需求。'});renderWs();scrollConv();return;}
  if(GEN_TRIGGER_RE.test(text)){startGeneration();return;}
  if(state.stage==='generating'){state.convMsgs.push({role:'ai',text:'⏳ 正在生成应用，请稍候；完成后可直接继续提出修改意见。'});renderWs();scrollConv();return;}
  if(GEN_ASK_RE.test(text)){state.convMsgs.push({role:'ai',text:'可以！当前需求说明卡已完整。确认无误请回复「立即生成」，我将开始创建应用；如需继续调整，直接告诉我即可。'});renderWs();scrollConv();return;}
  if(state.stage==='done'){applyAppModify(text);return;}
  applyReqSupplement(text);
}
function startGeneration(){
  if(state.stage==='generating'||state.stage==='done')return;
  state.stage='generating';state.generating=true;state.genStep=0;state.modifying=false;
  if(state.wbReqId){state.wbStatus='developing';wbSync();}/* 已点击立即生成 → 开发中 */
  state.convMsgs.push({role:'ai',text:'🚀 收到「立即生成」指令，开始创建应用「'+state.reqName+'」。'});
  const rounds=state.convMsgs.filter(m=>m.role==='user').length;
  const ctx=['首页原始需求','需求说明卡'];
  if(rounds>1)ctx.splice(1,0,(rounds-1)+' 轮沟通补充');
  if(state.uploadFiles.length)ctx.push(state.uploadFiles.length+' 份参考资料');
  state.convMsgs.push({role:'ai',text:'📦 开发上下文：'+ctx.join(' + '),small:true});
  renderWs();scrollConv();
  let i=0;
  state.genTimer=setInterval(()=>{
    i++;
    if(i<GEN_STEPS.length){state.genStep=i;state.convMsgs.push({role:'ai',text:GEN_STEPS[i],small:true});renderWs();scrollConv();}
    else{clearInterval(state.genTimer);finishGeneration();}
  },750);
}
function finishGeneration(){
  state.generating=false;state.genStep=0;
  const sc=(state.reqDoc&&state.reqDoc.scene)||detectScene(state.reqName);
  state.currentApp=buildApp(sc);
  state.stage='done';
  state.convMsgs.push({role:'ai',text:'🎉 应用已生成完成！左侧画布可以直接点击交互查看各个页面。'});
  state.convMsgs.push({role:'ai',text:'你可以继续用自然语言描述修改意见（例如：把标题颜色改蓝、增加筛选条件），我会同步更新应用。',small:true});
  renderWs();scrollConv();
}
function buildApp(sc){
  const tpl=SCENES[sc]||SCENES.board;
  return {id:'APP-DEV',name:state.reqDoc?state.reqDoc.name:state.reqName,icon:tpl.icon,color:tpl.color,
    desc:(state.reqDoc.funcs||[]).map((f,i)=>(i+1)+'. '+f).join('；'),scene:sc,date:genTime().slice(0,10),platform:state.platform};
}
function normalizeReqDoc(){
  const r=state.reqDoc;if(!r)return;
  const sec=r.sections=r.sections||{};
  r.rules=(sec.rules||'').split('\n').filter(Boolean);
  r.pending=(r.pending||[]).slice();
}
function applyAppModify(text){
  const short=text.length>24?text.slice(0,24)+'…':text;
  let ack;
  if(/颜色|样式|风格|布局/.test(text))ack='好的，已按反馈调整页面样式与布局，左侧画布即为最新效果。';
  else if(/筛选|过滤|条件/.test(text))ack='已增加数据筛选能力，可在应用内按条件过滤查看。';
  else if(/字段/.test(text))ack='已更新数据字段配置，相关页面已同步。';
  else if(/导出/.test(text))ack='已支持数据导出，可在应用内直接操作。';
  else ack='好的，修改需求「'+short+'」已记录并更新到应用，左侧画布可查看最新效果；可继续提出调整意见。';
  state.convMsgs.push({role:'ai',text:ack});
  state.modifying=true;renderWs();scrollConv();
  setTimeout(()=>{state.modifying=false;
    state.convMsgs.push({role:'ai',text:'✅ 应用已按反馈更新完成。'});
    renderWs();scrollConv();},1200);
}


function openModal(title,body,confirmFn,hideFooter){
  $('modalTitle').textContent=title;
  $('modalBody').innerHTML=body;
  if(hideFooter){$('modalFoot').style.display='none';}else{
    $('modalFoot').style.display='flex';
    $('modalFoot').innerHTML=`<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" id="modalConfirmBtn">确定</button>`;
    $('modalConfirmBtn').onclick=()=>{const r=confirmFn?confirmFn():true;if(r!==false)closeModal();};
  }
  const mb=$('modalMask');if(mb)mb.classList.add('open');
}
function closeModal(){$('modalMask').classList.remove('open');}

let toastTimer=null;
function showToast(msg,type='info',dur=2000){
  const t=$('toast');
  t.className='toast show '+type;
  t.innerHTML=msg||'';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),dur);
}

/* ===== 发布：同步需求状态为「已发布」===== */
function publishApp(){
  state.wbStatus='done';
  wbSync();
  renderWs();/* 顶栏状态胶囊同步为「已发布」 */
  showToast('应用已发布 ✨ 工作台需求状态已更新为「已发布」','success');
}

/* ===== 海牛工作台联动入口 =====
   ?entry=new&id=xx  新建需求 → 需求输入首页（新的需求沟通会话）
   ?entry=req&id=xx  需求详情 → 所有状态（草稿/开发中/已发布）统一进需求沟通态，继续跟AI沟通
   无参数直接打开 = 原默认首页 */
function vcEntry(){
  const qs=new URLSearchParams(location.search);
  const entry=qs.get('entry');
  const id=qs.get('id');
  let req=null;
  if(id){try{req=JSON.parse(localStorage.getItem('hn_vc_req_'+id)||'null');}catch(e){}}
  enterVibe();
  if(id)state.wbReqId=id;
  if(req)state.wbStatus=req.status||'draft';
  if(entry==='req'&&req){openReqFromWB(req);}
  else if(entry==='new'){showToast('需求记录已创建（草稿），描述你的需求开始沟通','info',2600);}
}
function openReqFromWB(req){
  state.reqName=req.name||'未命名需求';
  state.wbStatus=req.status||'draft';/* 状态胶囊与载入需求一致（已发布→已发布） */
  const sc=detectScene(req.name);
  const tpl=SCENES[sc];
  state.reqDoc=JSON.parse(JSON.stringify(tpl));
  state.reqDoc.scene=sc;state.reqDoc.name=state.reqName;
  normalizeReqDoc();
  state.convLoading=false;state.phase='ws';state.appTab=0;
  state.currentApp=null;state.modifying=false;state.generating=false;state.genTimer=null;
  /* 草稿=沟通态（画布空白可续聊）；开发中/已发布=直接展示已生成应用画布 */
  const stMsg={
    draft:'✅ 已载入「'+state.reqName+'」的需求沟通记录与需求说明卡。可继续对话补充需求，确认后发送「立即生成」创建应用。',
    developing:'✅ 已载入「'+state.reqName+'」的需求沟通记录，该需求已进入开发。左侧画布为已生成的应用，可继续对话沟通或直接提出修改意见。',
    done:'✅ 已载入「'+state.reqName+'」的需求沟通记录，该需求已发布应用。左侧画布为已生成的应用，可继续对话迭代优化。'
  };
  state.convMsgs=[
    {role:'ai',text:stMsg[req.status]||stMsg.draft},
    {type:'reqcard'},
  ];
  if(req.status==='developing'||req.status==='done'){
    state.stage='done';
    state.currentApp=buildApp(sc);
  }else{
    state.stage='chat';
    state.reqDraft='立即生成';/* 沟通阶段预填，一键发送 */
  }
  renderApp();scrollConv();
}

vcEntry();</script>
