<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Coding · Vibe Coding</title>
<style>
:root{
  --primary:#1A66FF;--primary-dark:#0F47C7;--primary-light:#E8F0FF;
  --success:#00B42A;--warning:#FF7D00;--danger:#F53F3F;
  --text-1:#1D2129;--text-2:#4E5969;--text-3:#86909C;--text-4:#C9CDD4;
  --bg-page:#F2F3F5;--border:#E5E6EB;--border-light:#EEF0F3;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow:0 2px 10px rgba(0,0,0,.06);
  --shadow-lg:0 12px 40px rgba(0,0,0,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg-page);color:var(--text-1);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:13px;outline:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#D8DADF;border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ===== 登录页 ===== */
.login-page{position:fixed;inset:0;z-index:1000;background:linear-gradient(160deg,#0F2B46,#123A60 55%,#1A66FF 130%);display:flex;align-items:center;justify-content:center}
.login-page::before{content:'';position:absolute;right:-120px;top:-120px;width:480px;height:480px;background:radial-gradient(circle,rgba(26,102,255,.35) 0%,transparent 70%);border-radius:50%}
.login-page::after{content:'';position:absolute;left:-160px;bottom:-160px;width:520px;height:520px;background:radial-gradient(circle,rgba(0,212,255,.18) 0%,transparent 70%);border-radius:50%}
.login-card{position:relative;width:400px;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:40px 36px;z-index:1}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo-icon{width:56px;height:56px;border-radius:14px;margin:0 auto 12px;background:linear-gradient(135deg,#1A66FF,#00D4FF);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;box-shadow:0 8px 20px rgba(26,102,255,.3)}
.login-logo-title{font-size:20px;font-weight:700;color:var(--text-1)}
.login-logo-sub{font-size:12px;color:var(--text-3);margin-top:4px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px}
.form-input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#FAFBFC;transition:.2s}
.form-input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--primary-light)}
.login-btn{width:100%;padding:12px;border-radius:8px;background:var(--primary);color:#fff;font-size:15px;font-weight:600;margin-top:6px;transition:.2s}
.login-btn:hover{background:var(--primary-dark)}
.login-tip{text-align:center;font-size:12px;color:var(--text-4);margin-top:16px}
.login-tip strong{color:var(--primary);font-weight:500}

/* ===== 主布局 ===== */
.app{display:none;flex-direction:column;height:100vh;overflow:hidden}
.app.ready{display:flex}
.header{height:56px;background:#0F2B46;color:#fff;flex-shrink:0;display:flex;align-items:center;padding:0 20px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:100}
.logo{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;letter-spacing:.5px}
.logo-icon{width:30px;height:30px;background:linear-gradient(135deg,#1A66FF,#00D4FF);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold}
.logo .sub{font-size:11px;color:rgba(255,255,255,.6);font-weight:400;margin-left:2px}
.header-nav{display:flex;gap:28px;margin-left:48px;flex:1}
.header-nav a{color:rgba(255,255,255,.7);font-size:14px;padding:8px 2px;position:relative;transition:.2s;cursor:pointer}
.header-nav a:hover{color:#fff}
.header-nav a.active{color:#fff;font-weight:500}
.header-nav a.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:#1A66FF;border-radius:2px}
.header-right{display:flex;align-items:center;gap:16px}
.env-tag{background:rgba(0,180,42,.15);color:#5BFF8A;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid rgba(0,180,42,.3)}
.user-info{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:.2s}
.user-info:hover{background:rgba(255,255,255,.1)}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#FF7D00,#FFB400);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;flex-shrink:0}
.user-name{font-size:13px;font-weight:500;line-height:1.2}


.user-info{position:relative}
.user-arrow{font-size:10px;color:rgba(255,255,255,.5);margin-left:-2px}
.user-menu{display:none;position:absolute;top:42px;right:0;width:150px;background:#fff;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);border:1px solid var(--border);overflow:hidden;z-index:500;animation:upIn .18s ease}
.user-menu.open{display:block}
@keyframes upIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.user-menu-item{padding:10px 14px;font-size:12.5px;color:var(--text-1);cursor:pointer;display:flex;align-items:center;gap:8px}
.user-menu-item:hover{background:var(--primary-light);color:var(--primary)}
.user-menu-item.logout:hover{background:#FFECE8;color:var(--danger)}
.user-menu-divider{height:1px;background:var(--border-light);margin:4px 0}

/* ===== 首页 ===== */
.main{flex:1;overflow-y:auto;background:var(--bg-page)}

/* ===== 生成页 ===== */
.gen-layout{display:flex;height:calc(100vh - 56px);overflow:hidden}
.gen-main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-page)}
.gen-topbar{height:52px;background:#fff;border-bottom:1px solid var(--border-light);flex-shrink:0;display:flex;align-items:center;padding:0 16px;gap:12px}
.gen-topbar-left{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--text-2);font-size:13px;padding:5px 10px;border-radius:6px;transition:.15s}
.gen-topbar-left:hover{background:var(--primary-light);color:var(--primary)}
.gen-topbar-title{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden}
.gen-topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}

.gen-btn{padding:6px 14px;border-radius:6px;font-size:12.5px;color:var(--text-2);border:1px solid var(--border);background:#fff;transition:.15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.gen-btn:hover{border-color:var(--primary);color:var(--primary)}
.gen-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.gen-btn.primary:hover{background:var(--primary-dark);color:#fff}
.gen-canvas-area{flex:1;overflow:auto;padding:32px;display:flex;align-items:flex-start;justify-content:center}
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px}
.loading-spinner{width:44px;height:44px;border:4px solid var(--primary-light);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-main{font-size:16px;font-weight:600;color:var(--text-1)}
.loading-step{font-size:13px;color:var(--text-3);background:#fff;padding:5px 14px;border-radius:20px;box-shadow:var(--shadow-sm)}
.idle-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px}
.idle-ico{font-size:52px}

/* 小程序壳（轻量预览 — 黑色粗边框备用版本已移除） */
.mp-preview-shell{width:375px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.08);border:1px solid var(--border-light);animation:popIn .35s ease;flex-shrink:0}
@keyframes popIn{from{opacity:.5;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.mp-status-bar{display:flex;justify-content:space-between;padding:10px 22px;background:#F9FAFB;font-size:11px;color:var(--text-1);font-weight:600;border-bottom:1px solid var(--border-light)}
.mp-body{min-height:560px;background:#F7F8FA;padding-bottom:64px}
.mp-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--border-light)}
.mp-nav-title{font-size:16px;font-weight:600}
.mp-nav-right{display:flex;gap:14px;color:var(--text-2)}
.mp-search{padding:10px 16px}
.mp-search-bar{background:#fff;border-radius:8px;padding:0 12px;display:flex;align-items:center;gap:8px;border:1px solid var(--border)}
.mp-search-bar input{border:none;padding:9px 0;font-size:13px;flex:1;background:transparent}
.mp-banner{padding:0 16px}
.mp-banner-box{background:linear-gradient(135deg,#FF7D00,#FFB400);border-radius:12px;padding:18px;color:#fff;margin:12px 0;position:relative;overflow:hidden}
.mp-banner-box::after{content:'';position:absolute;right:-20px;top:-20px;width:110px;height:110px;background:radial-gradient(circle,rgba(255,255,255,.25) 0%,transparent 70%);border-radius:50%}
.mp-banner-title{font-size:18px;font-weight:600;position:relative;z-index:1}
.mp-banner-sub{font-size:12px;opacity:.85;margin-top:4px;position:relative;z-index:1}
.mp-section-title{font-size:14px;font-weight:600;color:var(--text-1);padding:12px 16px 8px}
.mp-list{padding:0 16px;display:flex;flex-direction:column;gap:10px}
.mp-card{background:#fff;border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow-sm);cursor:pointer;transition:.15s;border:1px solid transparent}
.mp-card:hover{border-color:var(--primary)}
.mp-card-icon{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.mp-card-content{flex:1;min-width:0}
.mp-card-name{font-size:14px;font-weight:600;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-card-meta{font-size:11px;color:var(--text-3);margin-top:4px}
.mp-card-status{font-size:11px;display:inline-block}
.mp-card-right{color:var(--text-4);font-size:18px;flex-shrink:0}







.mp-form{padding:4px 16px}
.mp-form-group{margin-bottom:12px}
.mp-form-label{font-size:12.5px;color:var(--text-1);font-weight:500;margin-bottom:6px;display:block}
.red{color:var(--danger);margin-left:2px}
.mp-form-input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:13px;appearance:auto}
.mp-form-input:focus{border-color:var(--primary)}
.mp-form-input::placeholder{color:var(--text-4)}
.mp-submit-btn{display:block;width:calc(100% - 32px);margin:18px auto 8px;padding:12px;border-radius:10px;background:var(--primary);color:#fff;font-size:15px;font-weight:600;text-align:center;transition:.2s}
.mp-submit-btn:hover{background:var(--primary-dark)}
.mp-qrcode{text-align:center;padding:26px 20px}
.mp-qrcode-box{width:150px;height:150px;margin:0 auto 16px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;position:relative}
.mp-qrcode-box::before{content:'';position:absolute;inset:5px;border-radius:4px;background:repeating-linear-gradient(0deg,#1D2129 0,#1D2129 2px,transparent 2px,transparent 6px);background-size:100% 6px;opacity:.14}
.qr-dot{width:30px;height:30px;background:var(--primary);border-radius:6px;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700}
.mp-qrcode-tip{font-size:15px;font-weight:600;color:var(--text-1);margin-bottom:6px}
.mp-qrcode-sub{font-size:12px;color:var(--text-3)}
.mp-qrcode-time{font-size:11px;color:var(--text-4);margin-top:8px}
.mp-mine-list{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.mp-mine-item{background:#fff;border-radius:12px;padding:14px;box-shadow:var(--shadow-sm)}
.mp-mine-item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mp-mine-item-name{font-size:14px;font-weight:600}
.mp-mine-item-status{font-size:11px;padding:2px 10px;border-radius:10px}
.st-registered{background:var(--primary-light);color:var(--primary)}
.st-checked{background:#E8FFEA;color:var(--success)}
.st-canceled{background:#F2F3F5;color:var(--text-3)}
.mp-mine-item-info{font-size:12px;color:var(--text-3)}
.mp-mine-item-code{font-size:11px;font-family:monospace;color:var(--text-2);margin-top:6px;background:#FAFBFC;padding:4px 8px;border-radius:4px;display:inline-block}
.mp-empty{text-align:center;padding:50px 20px;color:var(--text-3)}
.empty-ico{font-size:40px;margin-bottom:8px}
.mp-tabbar{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border-light);display:flex;z-index:50}
.mp-tabbar span{flex:1;text-align:center;padding:8px 0 10px;font-size:11px;color:var(--text-3);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:.15s;user-select:none}
.mp-tabbar span .tab-ico{font-size:18px}
.mp-tabbar span.tab-active{color:var(--primary);font-weight:500}
.mp-back-btn{padding:10px 16px;display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text-2);cursor:pointer;width:fit-content}
.mp-back-btn:hover{color:var(--primary)}
.phone-body-wrap{position:relative}

/* PC壳 */
.pc-shell{width:100%;max-width:800px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.12);border:1px solid var(--border);animation:popIn .35s ease;flex-shrink:0}
.pc-browser-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#F2F3F5;border-bottom:1px solid var(--border-light)}
.pc-dot{width:10px;height:10px;border-radius:50%}
.pc-url{flex:1;background:#fff;border-radius:6px;padding:4px 12px;font-size:11px;color:var(--text-3);margin-left:8px}
.pc-layout{display:flex;min-height:460px}
.pc-sidebar{width:160px;background:#0F2B46;padding:16px 0;flex-shrink:0}
.pc-sidebar-logo{color:#fff;font-size:14px;font-weight:700;padding:0 16px 16px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:12px}
.pc-menu-item{padding:10px 16px;color:rgba(255,255,255,.65);font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:8px}
.pc-menu-item.active{background:var(--primary);color:#fff}
.pc-main{flex:1;background:#F7F8FA;padding:18px;overflow-x:auto}
.pc-main-title{font-size:16px;font-weight:600;margin-bottom:14px}
.pc-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.pc-stat{background:#fff;border-radius:8px;padding:14px;box-shadow:var(--shadow-sm)}
.pc-stat-label{font-size:11px;color:var(--text-3);margin-bottom:4px}
.pc-stat-value{font-size:22px;font-weight:700}
.pc-table{width:100%;background:#fff;border-radius:8px;overflow:hidden;box-shadow:var(--shadow-sm);border-collapse:collapse}
.pc-table th{background:#FAFBFC;font-size:11px;color:var(--text-3);text-align:left;padding:9px 12px;border-bottom:1px solid var(--border-light);font-weight:500;white-space:nowrap}
.pc-table td{padding:9px 12px;font-size:12px;color:var(--text-2);border-bottom:1px solid var(--border-light);white-space:nowrap}
.pc-table tr:last-child td{border-bottom:none}
.pc-tag{font-size:10px;padding:2px 8px;border-radius:4px;display:inline-block}

/* 右侧对话 */
.gen-chat{width:420px;background:#fff;border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .25s,opacity .25s;overflow:hidden}
.gen-chat.closed{width:0;opacity:0;border:none}
.gen-chat-head{background:#0F2B46;color:#fff;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.gen-chat-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.gen-chat-close{font-size:20px;color:rgba(255,255,255,.7);cursor:pointer;padding:4px 6px;border-radius:4px;transition:.15s;line-height:1}
.gen-chat-close:hover{background:rgba(255,255,255,.15);color:#fff}
.gen-chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;background:#FAFAF7}
.gen-chat-msg{display:flex;gap:8px;max-width:100%}
.gen-chat-msg.user{flex-direction:row-reverse}
.gen-chat-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px}
.gen-chat-bubble{padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.65;max-width:88%;word-break:break-word}
.gen-chat-msg.bot .gen-chat-bubble{background:#fff;color:var(--text-1);border:1px solid var(--border);border-bottom-left-radius:4px}
.gen-chat-msg.user .gen-chat-bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px}





.req-label{width:64px;color:var(--text-3);flex-shrink:0}
.req-value{color:var(--text-1);flex:1}





.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 12px;border-radius:6px;font-size:12.5px;background:#fff;color:var(--text-2);border:1px solid var(--border);transition:.15s;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark);color:#fff}



.gen-chat-input{padding:10px 12px;border-top:1px solid var(--border-light);display:flex;gap:8px;background:#fff;flex-shrink:0}
.gen-chat-input textarea{flex:1;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px;resize:none;min-height:44px;max-height:110px;font-family:inherit;background:#FAFBFC}
.gen-chat-input textarea:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-light);background:#fff}
.gen-chat-send{width:44px;height:44px;border-radius:10px;background:var(--primary);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.gen-chat-send:hover{background:var(--primary-dark)}

/* 浮动对话按钮 */
.chat-fab{position:fixed;bottom:24px;right:24px;width:46px;height:46px;border-radius:50%;background:var(--primary);color:#fff;font-size:19px;box-shadow:0 4px 14px rgba(26,102,255,.4);display:none;align-items:center;justify-content:center;cursor:pointer;z-index:300;transition:.2s}
.chat-fab.show{display:flex}
.chat-fab:hover{background:var(--primary-dark);transform:scale(1.08)}

/* 我的应用 */
.app-page{padding:24px;max-width:1100px;margin:0 auto}
.app-page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.app-page-title{font-size:20px;font-weight:700;color:var(--text-1)}
.app-page-sub{font-size:12px;color:var(--text-3);margin-top:4px}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.app-card{background:#fff;border-radius:12px;padding:18px;border:1px solid var(--border-light);cursor:pointer;transition:.2s}
.app-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--primary)}
.app-card-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.app-card-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.app-card-name{font-size:15px;font-weight:600;color:var(--text-1)}
.app-card-ver{font-size:11px;color:var(--text-3);margin-top:2px}
.app-card-desc{font-size:12.5px;color:var(--text-2);line-height:1.6;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.app-card-bottom{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border-light)}
.app-card-status{font-size:11px;padding:2px 10px;border-radius:10px}
.st-launched{background:#E8FFEA;color:var(--success)}
.st-generating{background:var(--primary-light);color:var(--primary)}

/* .icon-btn removed — replaced by platform tag */
.app-empty{text-align:center;padding:60px 20px;color:var(--text-3)}
.empty-icon{font-size:48px;margin-bottom:12px}

/* 通用标签 */
.tag{display:inline-flex;align-items:center;padding:2px 8px;font-size:11px;border-radius:4px;line-height:1.6}
.tag-success{background:#E8FFEA;color:var(--success)}
.tag-primary{background:var(--primary-light);color:var(--primary)}
.tag-warning{background:#FFF7E8;color:var(--warning)}
.tag-gray{background:#F2F3F5;color:var(--text-3)}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none;align-items:center;justify-content:center}
.modal-mask.open{display:flex}
.modal{background:#fff;border-radius:12px;width:460px;max-width:92vw;max-height:85vh;display:flex;flex-direction:column;animation:modalIn .25s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-title{font-size:15px;font-weight:600}
.modal-close{font-size:20px;color:var(--text-3);cursor:pointer;padding:4px}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:10px;background:#FAFBFC;flex-shrink:0}
.modal-foot .btn{padding:8px 20px;font-size:13px}
.form-select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;appearance:auto}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-12px);background:#1D2129;color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.warning{background:var(--warning)}

@media (max-width:1200px){.gen-chat{width:360px}}
@media (max-width:960px){.gen-chat{width:320px}}


/* 平铺详情页（）*/
.tile-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 12px 4px}
.tile-detail{background:#fff;border-radius:10px;padding:12px;border:1px solid var(--border-light);box-shadow:var(--shadow-sm)}
.tile-detail .td-icon{font-size:18px;margin-bottom:6px}
.tile-detail .td-label{font-size:10px;color:var(--text-3)}
.tile-detail .td-value{font-size:12.5px;font-weight:600;color:var(--text-1);margin-top:2px}
.tile-detail-big{grid-column:1/3;background:#fff;border-radius:10px;padding:12px;border:1px solid var(--border-light);box-shadow:var(--shadow-sm)}
.tile-detail-big .td-desc{font-size:12px;color:var(--text-2);line-height:1.6}
.tile-detail-act{grid-column:1/3;display:flex;gap:8px}
.tile-detail-act button{flex:1;padding:10px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:.2s}
.tile-detail-act .td-btn-primary{background:var(--primary);color:#fff}
.tile-detail-act .td-btn-default{background:#F2F3F5;color:var(--text-1)}

/* ===== 首页大输入区 + 示例需求 ===== */
.home-wrap{max-width:820px;margin:0 auto;padding:48px 24px 40px}
.home-title{font-size:30px;font-weight:700;color:var(--text-1);text-align:center}
.home-sub{font-size:14px;color:var(--text-3);text-align:center;margin:10px 0 24px}
.input-area{background:#fff;border-radius:22px;box-shadow:0 4px 20px rgba(0,0,0,.06);border:1px solid var(--border-light);padding:14px;transition:.2s}
.input-area:focus-within{border-color:var(--primary);box-shadow:0 6px 24px rgba(26,102,255,.14)}
.input-big{width:100%;border:none;resize:none;font-size:16px;line-height:1.7;padding:16px;min-height:150px;max-height:220px;background:transparent}
.input-big::placeholder{color:var(--text-4)}
.input-tools{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 2px;border-top:1px solid var(--border-light);margin-top:6px}
.input-tools-left{display:flex;align-items:center;gap:6px}
.tool-btn{padding:6px 10px;border-radius:6px;font-size:12.5px;color:var(--text-3);transition:.15s;display:flex;align-items:center;gap:4px;background:transparent;border:1px solid transparent}
.tool-btn:hover{background:var(--primary-light);color:var(--primary)}
.send-arrow{width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0;box-shadow:0 2px 8px rgba(26,102,255,.3);border:none;cursor:pointer;line-height:1}
.send-arrow:hover{background:var(--primary-dark)}
.send-arrow:disabled{background:#C9D7F0;box-shadow:none;cursor:not-allowed}
.home-platform-select{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--border-light);width:fit-content}
.home-platform-select span{padding:8px 18px;font-size:14px;cursor:pointer;color:var(--text-2);transition:.15s;user-select:none;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.home-platform-select span:hover{color:var(--primary)}
.home-platform-select span.active{color:var(--primary);font-weight:600;border-bottom-color:var(--primary)}
.home-tool-divider{width:1px;height:16px;background:var(--border);margin:0 4px}
.home-model-select{padding:5px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:12px;color:var(--text-2);appearance:auto;cursor:pointer;transition:.15s;max-width:160px}
.home-model-select:hover{border-color:var(--primary);color:var(--primary)}
.input-tools-right{display:flex;align-items:center;gap:10px}
.reqdoc-optl{color:var(--text-3)}


.reqdoc-conv{display:flex;flex-direction:column;gap:12px}
.reqdoc-conv-msg{display:flex;gap:10px;max-width:100%}
.reqdoc-conv-msg.user{flex-direction:row-reverse}
.reqdoc-conv-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;color:#fff}
.reqdoc-conv-avatar.user{background:linear-gradient(135deg,#FF7D00,#FFB400)}
.reqdoc-conv-avatar.ai{background:var(--primary)}
.reqdoc-conv-bubble{padding:12px 16px;border-radius:14px;font-size:14px;line-height:1.7;max-width:88%;word-break:break-word}
.reqdoc-conv-msg.user .reqdoc-conv-bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.reqdoc-conv-msg.ai .reqdoc-conv-bubble{background:#fff;color:var(--text-1);border:1px solid var(--border);border-bottom-left-radius:4px}

/* ===== 需求说明书页：加宽 + 结构化文档 ===== */
.reqdoc-page{max-width:960px;margin:0 auto;padding:24px 24px 180px;display:flex;flex-direction:column;gap:14px}
.reqdoc-card{background:#fff;border-radius:12px;border:1px solid var(--border-light);box-shadow:var(--shadow);overflow:hidden;animation:popIn .35s ease}
.reqdoc-head{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border-light)}
.reqdoc-title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600}
.reqdoc-actions .btn{padding:6px 16px;font-size:12.5px}
.reqdoc-body{padding:24px 28px}
.reqdoc-doc-section{margin-bottom:22px}
.reqdoc-doc-section:last-child{margin-bottom:0}
.reqdoc-doc-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--text-1);margin-bottom:8px}
.reqdoc-doc-h .no{width:20px;height:20px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:600}
.reqdoc-doc-p{font-size:13.5px;line-height:1.9;color:var(--text-2)}

.reqdoc-doc-line{display:flex;align-items:baseline;gap:8px;font-size:13.5px;line-height:2;color:var(--text-2)}
.reqdoc-doc-line .dot{width:5px;height:5px;border-radius:50%;background:var(--primary);flex-shrink:0;align-self:center}
.reqdoc-editor{border:none;border-radius:0;padding:24px 28px;font-size:13.5px;line-height:1.9;resize:vertical;width:100%;min-height:420px;background:#fff;font-family:inherit;outline:none}
.reqdoc-editor:focus{box-shadow:inset 0 0 0 2px var(--primary);border-radius:12px}
.reqdoc-gen-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:#FAFBFC;border-top:1px solid var(--border-light)}
.reqdoc-gen-hint{font-size:12.5px;color:var(--text-3);display:flex;align-items:center;gap:6px}
.reqdoc-gen-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 36px;border-radius:10px;background:var(--primary);color:#fff;font-size:14.5px;font-weight:600;transition:.2s;box-shadow:0 4px 14px rgba(26,102,255,.3)}
.reqdoc-gen-btn:hover{background:var(--primary-dark);box-shadow:0 6px 20px rgba(26,102,255,.4)}
.reqdoc-chat-bar{position:fixed;bottom:0;left:0;right:0;padding:14px 24px;background:#fff;border-top:1px solid var(--border-light);display:flex;gap:10px;align-items:flex-end;z-index:50;box-shadow:0 -4px 16px rgba(0,0,0,.05)}
.reqdoc-chat-input{flex:1;border:1px solid var(--border);border-radius:16px;padding:16px 18px;font-size:14px;resize:none;min-height:100px;max-height:140px;font-family:inherit;background:#fff;outline:none;transition:.2s;line-height:1.7;box-sizing:border-box}
.reqdoc-chat-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.reqdoc-chat-send{width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;border:none;cursor:pointer;box-shadow:0 2px 8px rgba(26,102,255,.3)}
.reqdoc-chat-send:hover{background:var(--primary-dark)}
.reqdoc-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:360px;gap:16px}

/* ===== 平铺预览：轻量白底容器 ===== */
.tiled-grid{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;align-items:flex-start;padding:8px}
.tiled-label{text-align:center;font-size:16px;font-weight:600;color:var(--text-1);margin-bottom:20px}
.tiled-mini{flex:0 0 auto;width:280px;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.06);border:1px solid var(--border);background:#fff;transition:.2s;animation:tileIn .3s ease}
.tiled-mini:hover{box-shadow:0 8px 28px rgba(0,0,0,.1)}
@keyframes tileIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tiled-mini-bar{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:#F7F8FA;border-bottom:1px solid var(--border-light);font-size:11px;color:var(--text-3)}
.tiled-mini-title{padding:12px 14px;font-size:14px;font-weight:600;border-bottom:1px solid var(--border-light)}
.tiled-mini-body{padding:12px 14px;min-height:110px;font-size:12.5px;color:var(--text-2);line-height:1.7}
.tiled-mini-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #F5F6F7}
.tiled-mini-item:last-child{border-bottom:none}
.tiled-mini-item-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.tiled-mini-stat{text-align:center;padding:8px}
.tiled-mini-stat-val{font-size:18px;font-weight:700;color:var(--text-1)}
.tiled-mini-stat-lbl{font-size:10px;color:var(--text-3);margin-top:2px}
.tiled-qr{text-align:center;padding:12px}
.tiled-qr-box{width:72px;height:72px;margin:0 auto 8px;background:repeating-linear-gradient(0deg,#1D2129 0,#1D2129 2px,transparent 2px,transparent 5px);background-size:100% 5px;opacity:.15}
.tiled-qr-tip{font-size:11px;font-weight:600;color:var(--text-1)}
.tiled-pc{width:320px}
.tiled-pc-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#F2F3F5;border-bottom:1px solid var(--border-light)}
.tiled-pc-url{flex:1;background:#fff;border-radius:4px;padding:2px 8px;font-size:10px;color:var(--text-3);margin-left:4px}

/* ===== Vibe Coding 嵌入版新增样式 ===== */
/* 工作区骨架 */
.wc-body{flex:1;display:flex;overflow:hidden}
.wc-rail{width:48px;background:#fff;border-right:1px solid var(--border-light);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px;flex-shrink:0}
.rail-btn{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--text-3);cursor:pointer;transition:.15s;position:relative}
.rail-btn:hover{background:var(--primary-light);color:var(--primary)}
.rail-btn.active{background:var(--primary-light);color:var(--primary)}
.rail-tip{position:absolute;left:44px;top:50%;transform:translateY(-50%);background:#1D2129;color:#fff;font-size:11px;padding:3px 8px;border-radius:4px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;z-index:400}
.rail-btn:hover .rail-tip{opacity:1}
/* 面包屑（深色顶栏） */
.header .crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.55)}
.header .crumb a{color:rgba(255,255,255,.55);cursor:pointer;transition:.15s}
.header .crumb a:hover{color:#fff}
.header .crumb .sep{color:rgba(255,255,255,.3)}
.header .crumb .cur{color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.crumb-mid{flex:1;display:flex;justify-content:center;min-width:0}
/* 需求状态 / 版本 */
.st-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 10px;border-radius:10px;white-space:nowrap}
.st-chip i{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.st-chip.req{background:rgba(26,102,255,.18);color:#8FB6FF}
.st-chip.req i{background:#8FB6FF}
.st-chip.dev{background:rgba(0,180,42,.15);color:#5BFF8A}
.st-chip.dev i{background:#5BFF8A}
.ver-tag{font-size:11px;color:rgba(255,255,255,.55);background:rgba(255,255,255,.1);padding:2px 8px;border-radius:4px;white-space:nowrap}
/* 文件面板（秒哒式列表） */
.file-panel{width:264px;background:#fff;border-right:1px solid var(--border-light);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;animation:panelIn .18s ease}
@keyframes panelIn{from{width:0;opacity:0}to{width:264px;opacity:1}}
.file-panel-head{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--border-light);flex-shrink:0}
.file-panel-head .t{font-size:13px;font-weight:600;color:var(--text-1)}
.file-collapse{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-3);cursor:pointer;font-size:14px}
.file-collapse:hover{background:var(--primary-light);color:var(--primary)}
.file-groups{flex:1;overflow-y:auto;padding:4px 8px 16px}
.file-group-title{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text-3);padding:12px 6px 5px;font-weight:500}
.file-group-add{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-3);font-size:14px;line-height:1}
.file-group-add:hover{background:var(--primary-light);color:var(--primary)}
.file-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;transition:.12s;margin-bottom:2px}
.file-item:hover{background:#F7F8FA}
.file-item.active{background:var(--primary-light)}
.file-item .fi-ico{width:24px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;letter-spacing:.2px}
.fi-ico.t-md{background:#E8F0FF;color:#1A66FF}
.fi-ico.t-html{background:#FFF7E8;color:#D25F00}
.fi-ico.t-pdf{background:#FFECE8;color:#F53F3F}
.fi-ico.t-doc{background:#E8F0FF;color:#1A66FF}
.fi-ico.t-xls{background:#E8FFEA;color:#00B42A}
.fi-ico.t-img{background:#F5F0FF;color:#722ED1}
.fi-ico.t-code{background:#F2F3F5;color:#4E5969}
.fi-ico.t-css{background:#E8F0FF;color:#1A66FF}
.fi-ico.t-js{background:#FFF7E8;color:#B8860B}
.fi-ico.t-sql{background:#E8FFEA;color:#00B42A}
.file-item .fi-name{flex:1;font-size:12.5px;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-item.active .fi-name{color:var(--primary);font-weight:500}
.file-empty{padding:10px 8px;font-size:11.5px;color:var(--text-4);line-height:1.6}
/* 需求沟通阶段布局 */
.req-layout{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.req-center{flex:1;display:flex;flex-direction:column;overflow:hidden}
.req-chat-scroll{flex:1;overflow-y:auto}
.req-chat-inner{max-width:860px;margin:0 auto;padding:24px 24px 30px;display:flex;flex-direction:column;gap:12px}
.reqdoc-conv-bubble{white-space:pre-line}
.req-chatbar{padding:12px 24px 16px;background:#fff;border-top:1px solid var(--border-light);display:flex;gap:10px;align-items:flex-end;flex-shrink:0}
.req-devbar{display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:9px 24px;background:#FAFBFC;border-top:1px solid var(--border-light);flex-shrink:0}
.req-devbar .hint{font-size:12.5px;color:var(--text-3)}
/* MD 文件视图 */
.md-view{flex:1;overflow-y:auto;padding:16px;display:flex}
.md-view .reqdoc-card{flex:1;display:flex;flex-direction:column;overflow:hidden;align-self:flex-start;min-height:calc(100% - 0px)}
.md-view .reqdoc-body{flex:1}
/* HTML 需求说明书预览 */
.rdoc-view{flex:1;overflow-y:auto;background:var(--bg-page);padding:18px}
.rdoc-toolbar{max-width:900px;margin:0 auto 12px;display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--border-light);border-radius:10px;padding:9px 16px}
.rdoc-toolbar .tt{font-size:13px;font-weight:600;color:var(--text-1);display:flex;align-items:center;gap:8px}
.rdoc-toolbar .tt .ro{font-size:10.5px;font-weight:400;color:var(--text-3);background:#F2F3F5;border-radius:4px;padding:1px 6px}
.rdoc-paper{max-width:900px;margin:0 auto;background:#fff;border:1px solid var(--border-light);border-radius:4px;padding:44px 52px;box-shadow:var(--shadow-sm)}
/* 代码预览（开发文件 · 只读演示） */
.code-pre{background:#0F2B46;color:#D5DBE5;font-family:'SF Mono',Consolas,monospace;font-size:12px;line-height:1.7;padding:16px;border-radius:8px;overflow:auto;max-height:54vh;white-space:pre}

/* ===== 页面一：AI应用需求输入首页（居中极简，参考产品截图）===== */
.vc-home{flex:1;display:flex;flex-direction:column;justify-content:center;background:
  radial-gradient(600px 420px at 8% 30%,rgba(26,102,255,.10),transparent 65%),
  radial-gradient(560px 420px at 96% 82%,rgba(0,212,255,.10),transparent 65%),
  radial-gradient(700px 500px at 50% 0%,rgba(26,102,255,.06),transparent 70%),
  linear-gradient(180deg,#F7F9FF,#F2F5FB);overflow-y:auto;position:relative}
.vc-back{position:absolute;top:20px;left:20px;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;background:rgba(255,255,255,.75);border:1px solid var(--border-light);color:var(--text-2);font-size:13px;cursor:pointer;transition:.15s;backdrop-filter:blur(4px);z-index:10}
.vc-back:hover{color:var(--primary);border-color:var(--primary);background:#fff}
.vc-home-inner{width:100%;max-width:760px;margin:0 auto;padding:24px;display:flex;flex-direction:column}
.vc-brand{display:flex;align-items:center;justify-content:center;gap:14px}
.vc-logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#2B7BFF,#1A66FF);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;box-shadow:0 8px 22px rgba(26,102,255,.35);font-weight:800}
.vc-title{font-size:34px;font-weight:700;color:var(--text-1);letter-spacing:.5px}
.vc-sub{margin-top:14px;text-align:center;font-size:14px;color:#86909C;letter-spacing:2px}
.vc-chips{margin:7vh 0 18px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.vc-chip{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:18px;background:#fff;border:1px solid var(--border-light);box-shadow:var(--shadow-sm);font-size:13px;color:var(--text-2);cursor:pointer;transition:.15s}
.vc-chip:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px);box-shadow:0 4px 14px rgba(26,102,255,.12)}
.vc-input-card{background:#fff;border:1px solid #D9E4F5;border-radius:18px;box-shadow:0 8px 30px rgba(26,102,255,.08),0 0 0 4px rgba(26,102,255,.03);transition:.2s}
.vc-input-card:focus-within{border-color:var(--primary);box-shadow:0 10px 36px rgba(26,102,255,.14),0 0 0 4px rgba(26,102,255,.07)}
.vc-input{width:100%;border:none;outline:none;resize:none;font-size:15px;line-height:1.8;padding:18px 20px 6px;min-height:110px;max-height:220px;background:transparent;font-family:inherit;color:var(--text-1)}
.vc-input::placeholder{color:var(--text-4)}
.vc-tools{display:flex;align-items:center;gap:8px;padding:10px 14px 14px}
.vc-plus{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-3);cursor:pointer;transition:.15s;border:none;background:transparent}
.vc-plus:hover{background:var(--primary-light);color:var(--primary)}
.vc-pill{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:18px;font-size:13px;color:var(--text-2);background:#fff;border:1px solid var(--border);cursor:pointer;transition:.15s;white-space:nowrap}
.vc-pill:hover{border-color:var(--primary);color:var(--primary)}
.vc-pill.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:500}
.vc-send{margin-left:auto;width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;transition:.2s;box-shadow:0 2px 10px rgba(26,102,255,.35)}
.vc-send:hover{background:var(--primary-dark);transform:translateY(-1px)}
.vc-send:disabled{background:#D5DEF0;box-shadow:none;cursor:not-allowed;transform:none}

/* ===== 工作区顶栏（无面包屑：左返回，右应用名）===== */
.ws-topbar{height:52px;background:#fff;border-bottom:1px solid var(--border-light);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.ws-back{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;color:var(--text-2);font-size:13px;cursor:pointer;transition:.15s;border:1px solid transparent;background:transparent}
.ws-back:hover{color:var(--primary);background:var(--primary-light)}
.ws-topbar-right{display:flex;align-items:center;gap:10px;min-width:0}
.ws-name{font-size:14px;font-weight:600;color:var(--text-1);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
.ws-name:hover{color:var(--primary)}
.ws-edit{font-size:12px;color:var(--text-3);cursor:pointer;padding:4px;border-radius:6px}
.ws-edit:hover{background:var(--primary-light);color:var(--primary)}
.ws-idle{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px}
.ws-hint{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#fff;border:1px solid var(--border-light);border-radius:14px;padding:36px 44px;box-shadow:var(--shadow-sm);text-align:center}
.ws-hint-ico{font-size:40px}
.ws-hint-t{font-size:16px;font-weight:600;color:var(--text-1)}
.ws-hint-sub{font-size:12.5px;color:var(--text-3);line-height:1.7}
.ws-hint-btns{display:flex;gap:10px;margin-top:6px}
.gen-chat-bubble{white-space:pre-line}
.rail-sep{width:24px;height:1px;background:var(--border-light);margin:2px 0}

/* ===== 进入 Vibe Coding（模拟海牛工作台 · 项目集详情 · 新增需求）===== */
const VC_HOME_DEFAULT='帮我做一个营销活动看板，支持活动数据统计、参与人数、转化率分析及活动效果对比';
const VC_HOME_PLACEHOLDER='例如：'+VC_HOME_DEFAULT+'……';
function enterVibe(){
  state.phase='home';state.centerView='';state.filesOpen=false;state.activeFile=null;
  state.reqName='未命名应用';state.docReady=false;state.reqState='viewing';state.reqVer='V1.0';
  state.uploadFiles=[];state.devFiles=[];state.currentApp=null;state.chatOpen=true;
  state.convMsgs=[];state.homeInput=VC_HOME_DEFAULT;state.reqDraft='';state.devDraft='';
  renderApp();
}
function renderHome(){
  $('wcBody').innerHTML=`<div class="vc-home">
    <button class="vc-back" onclick="leaveHome()">← 返回</button>
    <div class="vc-home-inner">
      <div class="vc-input-card">
        <textarea class="vc-input" id="vcHomeInput" placeholder="${VC_HOME_PLACEHOLDER}" oninput="onHomeInputChange()">${escapeHtml(state.homeInput||'')}</textarea>
        <div class="vc-tools">
          <button class="vc-plus" title="上传参考资料" onclick="showToast('支持上传 PDF / Word / Excel / 图片参考资料（演示）','info')">＋</button>
          <span class="vc-pill ${state.platform==='pc'?'active':''}" onclick="selPlatform('pc')">🖥️ PC应用</span>
          <span class="vc-pill ${state.platform==='mp'?'active':''}" onclick="selPlatform('mp')">📱 小程序应用</span>
          <span class="vc-pill ${state.platform==='h5'?'active':''}" onclick="selPlatform('h5')">🌐 H5应用</span>
          <button class="vc-send" id="vcHomeSend" ${state.homeInput&&state.homeInput.trim()?'':'disabled'} title="生成" onclick="startReqFromHome()">↑</button>
        </div>
      </div>
    </div>
  </div>`;
}
function onHomeInputChange(){
  const i=$('vcHomeInput');
  state.homeInput=i?i.value:'';
  const b=$('vcHomeSend');
  if(b)b.disabled=!state.homeInput.trim();
}
function selPlatform(pf){
  state.platform=pf;
  renderHome();
  showToast('已切换至'+({pc:'PC应用',mp:'小程序应用',h5:'H5应用'})[pf],'info',1200);
}
/* AI 提炼应用名称：去掉口语前缀，取第一个分句 */
function aiNameFromText(text){
  let t=String(text||'').replace(/^(帮我|请帮我|我想|我要|麻烦|请)?(做一个|做个|开发一个|开发个|制作一个|搭一个)?(一个)?/,'').trim();
  t=t.split(/[，。；,;：:]/)[0].trim();
  if(!t)t=String(text||'').split(/[，。；,;：:]/)[0].trim();
  if(t.length>12)t=t.slice(0,12);
  return t||'未命名应用';
}
function startReqFromHome(){
  const i=$('vcHomeInput');
  const text=((i&&i.value)||state.homeInput||'').trim();
  if(!text){showToast('请描述你的需求','info');return;}
  state.homeInput=VC_HOME_DEFAULT;state.reqDraft='';
  state.phase='req';
  state.centerView='';state.filesOpen=false;state.activeFile=null;
  state.reqName=aiNameFromText(text);
  state.docReady=false;state.reqState='viewing';
  /* 免追问：确认需求后直接生成说明书，对话在上、分析状态在下 */
  state.convMsgs=[
    {role:'user',text},
    {role:'ai',text:`好的，已理解你的需求「${state.reqName}」。\n正在为你生成《需求说明书》（MD + HTML），生成后将直接展示在中间工作区。`},
  ];
  state.convLoading=true;state.convLoadingText='正在梳理需求，生成《需求说明书》（MD + HTML）…';
  renderApp();scrollConv();
  setTimeout(generateReqDoc,2000);
}
function leaveHome(){
  const i=$('vcHomeInput');
  const v=i?i.value.trim():'';
  /* 预填示例句不算未提交输入，改过才需要离开确认 */
  if(v&&v!==VC_HOME_DEFAULT){
    openModal('离开确认','<div style="font-size:13px;line-height:1.9">你输入的需求内容尚未提交，离开后将丢失。<br>确定返回海牛工作台项目集列表吗？</div>',()=>{goWorkbench();return true;});
  }else{
    goWorkbench();
  }
}
/* ===== 返回海牛工作台：同步需求名称与状态后跳转 ===== */
const WB_PAGE='ai-coding.html';
function wbSync(){
  try{
    if(!state.wbReqId)return;
    localStorage.setItem('hn_vc_req_'+state.wbReqId,JSON.stringify({id:state.wbReqId,name:state.reqName,status:state.wbStatus||'draft'}));
  }catch(e){}
}
function goWorkbench(){wbSync();location.href=WB_PAGE;}

function genTime(){const d=new Date();const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ===== 渲染总入口（三阶段统一：无面包屑，返回逻辑一致）===== */
function renderApp(){
  const hd=$('appHeader');
  if(hd)hd.style.display='none';
  if(state.phase==='home'){renderHome();updateFab();return;}
  if(state.phase==='req'){renderReqWs();updateFab();return;}
  renderGen();updateFab();
}
/* ===== 需求阶段工作区（三态动态布局）=====
   生成中：中间=生成进度提示，对话框(消息+输入)在页面底部
   默认态（首次生成需求卡）：中间=需求说明卡，对话框(消息+输入)在页面底部
   文件查看态：点MD/HTML → 文件在正中间画布区，对话框(含说明卡)在右侧栏
   开发态：点立即开发 → 画布+右侧对话框（renderGen） */
function renderReqWs(){
  const b=$('wcBody');
  const fileOpen=!!state.activeFile;
  const flowHTML=state.convMsgs.map(renderMsg).join('')+(state.convLoading?convLoadingHTML():'');
  const ph=state.activeFile==='md'?'针对《需求说明书.md》输入修改意见，Enter 发送…'
    :state.activeFile==='html'?'针对《需求说明书.html》输入修改意见，Enter 发送…'
    :'继续描述你的修改需求，例如“增加附件上传，去掉审批流程”…';
  const chatInputHTML=`<textarea id="reqdocChatInput" placeholder="${ph}" rows="1" oninput="state.reqDraft=this.value" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();reqChatSend()}">${escapeHtml(state.reqDraft||'')}</textarea>
      <button class="gen-chat-send" onclick="reqChatSend()">➤</button>`;
  b.innerHTML=`<aside class="wc-rail">${railBtn('file','📄','文件',state.filesOpen)}</aside>
  ${state.filesOpen?filePanelHTML():''}
  <div class="gen-main">
    <div class="ws-topbar">
      <button class="ws-back" onclick="goWorkbench()">← 返回项目集</button>
      <div class="ws-topbar-right">
        <span class="ws-name" id="wsNameText" title="点击修改应用名称" onclick="editAppName()">📄 ${escapeHtml(state.reqName)}</span>
        <span class="ws-edit" title="修改应用名称" onclick="editAppName()">✏</span>
      </div>
    </div>
    ${fileOpen?wsCenterHTML()
      :`<div class="req-flow" id="genChatMsgs"><div class="req-flow-inner">${flowHTML}</div></div>`}
    ${fileOpen?'':`<div class="dock-chat">
      <div class="gen-chat-input">${chatInputHTML}</div>
    </div>`}
  </div>
  ${fileOpen?`<div class="gen-chat" id="genChatPanel">
    <div class="gen-chat-head">
      <div class="gen-chat-title">🤖 AI助手 <span style="font-size:11px;opacity:.7;font-weight:400">需求分析</span></div>
    </div>
    <div class="gen-chat-msgs" id="genChatMsgs">${flowHTML}</div>
    <div class="gen-chat-input">${chatInputHTML}</div>
  </div>`:''}`;
}
function wsCenterHTML(){
  if(state.centerView==='html')return htmlViewHTML();
  return mdViewHTML();
}
function railBtn(id,icon,tip,active){
  return `<div class="rail-btn${active?' active':''}" id="rail-${id}" onclick="onRailClick('${id}')">${icon}<span class="rail-tip">${tip}</span></div>`;
}
function onRailClick(id){
  if(id==='back'){goWorkbench();return;}
  if(state.phase==='req'){toggleFiles(!state.filesOpen);return;}
  if(id==='canvas'){state.centerView='canvas';state.activeFile=null;state.filesOpen=false;renderGen();return;}
  if(id==='file'){toggleFiles(!state.filesOpen);return;}
}
function toggleFiles(open){
  state.filesOpen=open;
  if(state.phase==='req'){
    /* 需求阶段：收起列表 = 关闭文件，恢复默认态（说明书居中 + 对话回底部） */
    if(!open){state.activeFile=null;state.centerView='';}
    renderApp();
  }else{
    if(!open&&state.centerView!=='canvas'){state.centerView='canvas';state.activeFile=null;}
    renderGen();
  }
}

/* ===== 文件面板（对话生成 / 个人上传 / 开发生成文件）===== */
function convFiles(){
  return state.docReady?[
    {id:'md',name:'需求说明书.md',type:'t-md'},
    {id:'html',name:'需求说明书.html',type:'t-html'},
  ]:[];
}
function filePanelHTML(){
  const uf=state.uploadFiles,df=state.devFiles,cf=convFiles();
  return `<aside class="file-panel">
    <div class="file-panel-head"><span class="t">文件</span><span class="file-collapse" title="收起文件列表" onclick="toggleFiles(false)">«</span></div>
    <div class="file-groups">
      <div class="file-group-title"><span>对话生成</span></div>
      ${cf.length?cf.map(fileItemHTML).join(''):'<div class="file-empty">AI 生成《需求说明书》后，MD 与 HTML 文件将出现在这里</div>'}
      <div class="file-group-title"><span>上传资料</span><span class="file-group-add" title="上传文件" onclick="mockUpload()">＋</span></div>
      ${uf.length?uf.map(fileItemHTML).join(''):'<div class="file-empty">支持 PDF / Word / Excel / 图片等业务资料</div>'}
      <div class="file-group-title"><span>开发生成文件</span></div>
      ${df.length?df.map(fileItemHTML).join(''):`<div class="file-empty">${state.phase==='dev'?'开发完成后，前端 / 后端 / 数据库文件将出现在这里':'点击「立即开发」后，代码文件将出现在这里'}</div>`}
    </div>
  </aside>`;
}
function fileItemHTML(f){
  return `<div class="file-item${state.activeFile===f.id?' active':''}" onclick="openFile('${f.id}')"><span class="fi-ico ${f.type}">${fiText(f.type)}</span><span class="fi-name">${f.name}</span></div>`;
}
function fiText(t){
  return {'t-md':'MD','t-html':'H','t-pdf':'PDF','t-doc':'DOC','t-xls':'XLS','t-img':'IMG','t-code':'</>','t-css':'CSS','t-js':'JS','t-sql':'SQL'}[t]||'·';
}
function openFile(id){
  if(id==='md'||id==='html'){
    state.activeFile=id;state.centerView=id;
    /* 需求阶段打开文件 → 文件查看态：列表展开 + 对话流(含说明卡)切换右侧栏 */
    if(state.phase==='req'){state.filesOpen=true;}
    refreshCenter();return;
  }
  const f=state.uploadFiles.find(x=>x.id===id);
  if(f){
    state.activeFile=id;refreshCenter();
    openModal('附件信息',`<div style="font-size:13px;line-height:2"><div><b>${f.name}</b></div><div style="color:var(--text-3);font-size:12.5px">大小：${f.size}</div><div style="color:var(--text-3);font-size:12.5px;margin-top:6px">上传资料将作为需求沟通的参考资料（一期预留）</div></div>`,null,true);
    return;
  }
  const d=state.devFiles.find(x=>x.id===id);
  if(d){
    state.activeFile=id;refreshCenter();
    openModal('📄 '+d.name,`<pre class="code-pre">${escapeHtml(d.code)}</pre><div style="font-size:11.5px;color:var(--text-3);margin-top:8px">开发生成文件 · 只读演示（实际由开发工具打开）</div>`,null,true);
  }
}
function mockUpload(){
  const tpl=MOCK_UPLOADS[state.uploadFiles.length%MOCK_UPLOADS.length];
  const f={id:'up-'+(state.uploadFiles.length+1),name:tpl.name,type:tpl.type,size:(Math.round((0.2+Math.random()*2)*10)/10)+' MB'};
  state.uploadFiles.push(f);
  showToast('已上传 '+f.name+'（演示）','success');
  refreshCenter();
}
function refreshCenter(){
  if(state.phase==='req')renderApp();else renderGen();
}
/* 关闭文件：恢复默认态（需求阶段列表收缩+对话流回中间；开发阶段回画布） */
function closeFile(){
  state.activeFile=null;
  if(state.phase==='req'){state.centerView='';state.filesOpen=false;renderApp();}
  else{state.centerView='canvas';renderGen();}
}
function convLoadingHTML(){
  return `<div class="gen-chat-msg ai"><div class="gen-chat-avatar" style="background:#1A66FF">🤖</div><div class="gen-chat-bubble" style="display:flex;align-items:center;gap:10px"><span class="loading-spinner" style="width:16px;height:16px;border-width:2.5px"></span><span style="color:var(--text-2)">${state.convLoadingText||'正在生成《需求说明书》…'}</span></div></div>`;
}
function scrollConv(){
  setTimeout(()=>{const el=$('genChatMsgs');if(el)el.scrollTop=el.scrollHeight;},50);
}

    <div class="reqdoc-head">

    </div>

      <p class="reqdoc-doc-p">${sec.overview||''}</p></div>

      <div class="reqdoc-doc-line"><span class="dot"></span><span>${(r.funcs||[]).join('、')}</span></div>

      ${(sec.fields||[]).map(f=>`<div class="reqdoc-doc-line"><span class="dot"></span><span><strong>${f.name}</strong>（${f.type}，<span class="${f.req==='是'?'':'reqdoc-optl'}">${f.req==='是'?'必填':'选填'}</span>）${f.note?`<span style="color:var(--text-3)">— ${f.note}</span>`:''}</span></div>`).join('')}</div>

function reqDocBodyHTML(){
  const r=state.reqDoc;if(!r)return '';
  const s=r.sections||{};
  const ch=[];
  ch.push({t:'项目背景与建设目标',h:`<p class="rd-p">${s.overview||''}</p>`});
  ch.push({t:'用户角色与使用场景',h:`<p class="rd-p">${s.users||r.user||''}</p>`});
  ch.push({t:'业务流程',h:`<ol>${(s.flow||'').split('\n').filter(Boolean).map(x=>`<li>${x.replace(/^[①②③④⑤⑥⑦⑧⑨⑩]\s*/,'')}</li>`).join('')}</ol>`});
  ch.push({t:'功能模块说明',h:`<ul>${(r.funcs||[]).map(f=>`<li>${f}</li>`).join('')}</ul>`});
  ch.push({t:'页面结构及页面功能说明',h:`<ul>${(s.pages||'').split('\n').filter(Boolean).map(x=>`<li>${x}</li>`).join('')}</ul>`});
  ch.push({t:'关键交互规则',h:`<ul>${(s.rules||'').split('\n').filter(Boolean).map(x=>`<li>${x.replace(/^⚡\s*/,'')}</li>`).join('')}</ul>`});
  ch.push({t:'数据字段及数据关系',h:`<table class="rd-table"><tr><th style="width:130px">字段名称</th><th style="width:100px">类型</th><th style="width:60px">必填</th><th>说明</th></tr>${(s.fields||[]).map(f=>`<tr><td>${f.name}</td><td>${f.type}</td><td>${f.req==='是'?'是':'否'}</td><td>${f.note||'—'}</td></tr>`).join('')}</table>`});

/* ===== MD 主文件生成与回写（MD 为可编辑主文件，HTML 由其同步生成）===== */
function buildReqMD(){
  const r=state.reqDoc;if(!r)return '';
  const s=r.sections||{};
  return `# ${r.name}

**目标用户**：${r.user||'—'}
**文档版本**：${state.reqVer}
**生成时间**：${genTime()}

## 一、项目背景与建设目标
${s.overview||''}

## 二、用户角色与使用场景
${s.users||''}

## 三、业务流程
${(s.flow||'').split('\n').filter(Boolean).map(x=>'- '+x).join('\n')}

## 四、功能模块说明
${(r.funcs||[]).map((f,i)=>`${i+1}. ${f}`).join('\n')}

## 五、页面结构及页面功能说明
${(s.pages||'').split('\n').filter(Boolean).map(x=>'- '+x).join('\n')}

## 六、关键交互规则
${(s.rules||'').split('\n').filter(Boolean).map(x=>'- '+x.replace(/^⚡\s*/,'')).join('\n')}

## 七、数据字段及数据关系
| 字段名称 | 类型 | 必填 | 说明 |
|---|---|---|---|
${(s.fields||[]).map(f=>`| ${f.name} | ${f.type} | ${f.req==='是'?'是':'否'} | ${f.note||'—'} |`).join('\n')}

## 八、本期边界（暂不实现）
${(s.notImpl||'').split('\n').filter(Boolean).map(x=>'- '+x).join('\n')}

## 九、验收标准
${(s.acceptance||'').split('\n').filter(Boolean).map(x=>'- '+x.replace(/^✅\s*/,'')).join('\n')}`;
}

function parseReqMD(m){
  const r=state.reqDoc;if(!r)return;
  const lines=String(m||'').split('\n');
  const n=m.match(/^#\s+(.+)$/m);if(n)r.name=n[1].trim();
  const u=m.match(/\*\*目标用户\*\*：(.+)/);if(u)r.user=u[1].trim();
  const fi=lines.findIndex(l=>l.includes('功能模块说明'));
  if(fi>-1){
    const fs=[];
    for(let i=fi+1;i<lines.length;i++){
      const t=lines[i].trim();
      if(/^##\s/.test(t))break;
      const mm=t.match(/^\d+\.\s*(.+)$/);
      if(mm)fs.push(mm[1]);
    }
    if(fs.length)r.funcs=fs;
  }
}
/* ===== 需求沟通对话（说明书生成后持续更新；生成中的留言不重复触发生成）===== */
function reqChatSend(){
  const inp=$('reqdocChatInput');
  const text=inp?inp.value.trim():'';
  if(!text){showToast('请输入需求内容','info');return;}
  if(inp)inp.value='';
  state.reqDraft='';
  state.convMsgs.push({role:'user',text});
  /* 不关闭正在查看的文档：AI 上下文与用户当前预览关联 */
  if(!state.docReady){
    if(state.convLoading){renderApp();scrollConv();return;}
    state.convLoading=true;state.convLoadingText='正在梳理需求，生成《需求说明书》（MD + HTML）…';
    renderApp();scrollConv();
    setTimeout(generateReqDoc,1600);
  }else{
    applyReqSupplement(text);
  }
}

function generateReqDoc(){
  const allText=state.convMsgs.filter(m=>m.role==='user').map(m=>m.text).join('；');
  const sc=detectScene(allText);
  const tpl=SCENES[sc];
  state.reqDoc=JSON.parse(JSON.stringify(tpl));
  state.reqDoc.scene=sc;
  state.reqDoc.name=state.reqName;/* 应用名称全局统一：以进入时 AI 提炼的名称为准 */
  state.reqFullText=buildReqMD();
  state.docReady=true;
  state.reqState='viewing';
  state.convLoading=false;
  /* 需求说明卡内嵌对话流：对话在上、卡片在下，后续补充消息继续排在卡片后 */
  state.centerView='';state.activeFile=null;
  state.convMsgs.push({role:'ai',text:'✅ 《需求说明书》已生成（MD + HTML），点击下方卡片可打开文件查看；确认无误后点击卡片底部「立即开发」。'});
  state.convMsgs.push({type:'reqcard'});
  renderApp();scrollConv();
}

function applyReqSupplement(text){
  const r=state.reqDoc;
  r.funcs=Array.from(new Set([...(r.funcs||[]),text]));
  r.sections=r.sections||{};
  r.sections.pages=(r.sections.pages||'')+'\n'+text+'（由对话补充）';
  state.reqFullText=buildReqMD();
  const ctx=state.centerView==='html'?'（针对你正在查看的《需求说明书.html》）':state.centerView==='md'?'（针对你正在编辑的《需求说明书.md》）':'';
  state.convMsgs.push({role:'ai',text:`${ctx}已将补充需求纳入说明书：\n· 「${text.length>20?text.slice(0,20)+'…':text}」已写入功能模块与页面说明\n· 需求说明书.md 与 需求说明书.html 已同步更新`});
  renderApp();scrollConv();
  showToast('MD 与 HTML 已同步更新','success');
}

function detectScene(text){
  if(text.includes('看板')||text.includes('转化率')||text.includes('数据统计')||text.includes('统计分析'))return 'board';
  if(text.includes('报名')||text.includes('活动')||text.includes('签到'))return 'event';
  if(text.includes('拜访')||text.includes('客户'))return 'visit';
  if(text.includes('项目')||text.includes('任务')||text.includes('后台'))return 'pm';
  return 'board';
}

function genApp(){
  state.generating=true;state.genStarted=true;state.genStep=0;
  if(state.reqFullText){state.chatMsgs.push({role:'bot',text:'📋 需求说明书.html 已随上下文传入本次开发对话',small:true});}
  renderGen();
  const steps=['🏗️ 理解需求中...','🔍 分析业务场景...','🔌 匹配平台能力...','📄 生成页面结构...','🧩 组装业务功能...','✅ 应用完成中...'];
  showStepsBar(steps,0);
  let step=0;
  const t=setInterval(()=>{
    step++;
    if(step<steps.length){
      state.genStep=step;showStepsBar(steps,step);updateGenLoading();
      state.chatMsgs.push({role:'bot',text:steps[step],small:true});
      renderChat();
    }
    else{clearInterval(t);finishGenApp();}
  },750);
}

function showStepsBar(s,idx){
  const stepsEl=document.getElementById('genStepsBar');
  if(!stepsEl)return;
  stepsEl.innerHTML=s.map(function(st,i){return '<span'+(i<idx?' class="done"':i===idx?' class="active"':'')+'>'+st+'</span>';}).join('');
}

  state.chatMsgs.push({role:'user',text});

function openModal(title,body,confirmFn,hideFooter){
  $('modalTitle').textContent=title;
  $('modalBody').innerHTML=body;
  if(hideFooter){$('modalFoot').style.display='none';}else{
    $('modalFoot').style.display='flex';
    $('modalFoot').innerHTML=`<button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" id="modalConfirmBtn">确定</button>`;
    $('modalConfirmBtn').onclick=()=>{const r=confirmFn?confirmFn():true;if(r!==false)closeModal();};
  }
  const mb=$('modalMask');if(mb)mb.classList.add('open');
}
function closeModal(){$('modalMask').classList.remove('open');}

let toastTimer=null;
function showToast(msg,type='info',dur=2000){
  const t=$('toast');
  t.className='toast show '+type;
  t.innerHTML=msg||'';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),dur);
}

}

/* ===== 海牛工作台联动入口 =====
   ?entry=new&id=xx  新建需求 → 需求输入首页（新的需求沟通会话）
   ?entry=req&id=xx  需求详情 → 草稿=需求沟通（说明书已生成）；开发中/已发布=生成应用详情页
   无参数直接打开 = 原默认首页 */
function vcEntry(){
  const qs=new URLSearchParams(location.search);
  const entry=qs.get('entry');
  const id=qs.get('id');
  let req=null;
  if(id){try{req=JSON.parse(localStorage.getItem('hn_vc_req_'+id)||'null');}catch(e){}}
  enterVibe();
  if(id)state.wbReqId=id;
  if(req)state.wbStatus=req.status||'draft';
  if(entry==='req'&&req){openReqFromWB(req);}
  else if(entry==='new'){showToast('需求记录已创建（草稿），描述你的需求开始沟通','info',2600);}
}
function openReqFromWB(req){
  state.reqName=req.name||'未命名需求';
  const sc=detectScene(req.name);
  const tpl=SCENES[sc];
  state.reqDoc=JSON.parse(JSON.stringify(tpl));
  state.reqDoc.scene=sc;
  state.reqDoc.name=state.reqName;
  state.reqFullText=buildReqMD();
  state.docReady=true;state.reqState='viewing';state.convLoading=false;
  state.phase='req';state.centerView='';state.filesOpen=false;state.activeFile=null;
  state.convMsgs=[
    {role:'ai',text:'✅ 已载入「'+state.reqName+'」的需求沟通记录，《需求说明书》（MD + HTML）已生成。可继续对话补充需求，确认后点击卡片底部「立即开发」。'},
    {type:'reqcard'},
  ];
  if(req.status==='developing'||req.status==='done'){
    state.phase='dev';state.centerView='canvas';state.filesOpen=false;state.activeFile=null;state.chatOpen=true;state.devDraft='';
    const app={id:'APP-DEV',name:state.reqName,icon:tpl.icon,color:tpl.color,ver:'v1.0.0',status:'已上线',
      desc:state.reqDoc.funcs.map((f,i)=>(i+1)+'. '+f).join('；'),scene:sc,date:genTime().slice(0,10),platform:state.platform};
    state.currentApp=app;
    state.devFiles=DEV_FILE_TPL.map(f=>Object.assign({},f));
    state.chatMsgs=[
      {role:'user',text:'需求已确认，开始开发'},
      {role:'bot',text:'✅ 《需求说明书》（MD + HTML）已保存'},
      {role:'bot',text:'🤖 需求上下文已传递给开发智能体：《'+state.reqName+' 需求说明书》（'+state.reqVer+'）。<span style="color:var(--primary);cursor:pointer" onclick="showReqCtx()">展开摘要</span>'},
      {role:'bot',text:'🚀 开发完成，可继续提出修改意见或点击右上角「发布」。'},
    ];
  }
  renderApp();scrollConv();
}
vcEntry();
</script>
