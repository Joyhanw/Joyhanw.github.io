<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>河南AMC项目</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f6fa;
            color: #1a1d2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            padding: 20px;
        }
        .title {
            font-size: 28px;
            font-weight: 700;
            color: #0f111e;
            margin-bottom: 30px;
            text-align: center;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 30px 24px;
            border: 1px solid #e5e7ec;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: block;
            color: inherit;
        }
        .card:hover {
            border-color: #4f6ef7;
            box-shadow: 0 8px 24px rgba(79, 110, 247, 0.1);
            transform: translateY(-2px);
        }
        .card .name {
            font-size: 18px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="title">河南AMC项目</div>
        <a href="河南AMC_AI能力管理平台v1.0.html" class="card">
            <div class="name">河南AMC AI能力管理平台v1.0原型</div>
        </a>
    </div>

</body>
</html>
