<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>河南AMC项目 - 项目中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f6fa;
            color: #1a1d2e;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #0f111e, #1a1d2e);
            padding: 40px 0 30px;
            color: #fff;
            text-align: center;
        }
        .header h1 {
            font-size: 32px;
            font-weight: 700;
        }
        .header h1 i {
            color: #4f6ef7;
            margin-right: 10px;
        }
        .header p {
            color: #9ca3af;
            margin-top: 6px;
            font-size: 14px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #4f6ef7;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }
        .project-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px 20px;
            border: 1px solid #e5e7ec;
            transition: all 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .project-card:hover {
            border-color: #4f6ef7;
            box-shadow: 0 8px 24px rgba(79, 110, 247, 0.1);
            transform: translateY(-2px);
        }
        .project-card .icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 12px;
        }
        .project-card .name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .project-card .desc {
            font-size: 13px;
            color: #6b7280;
            line-height: 1.5;
        }
        .project-card .tag {
            display: inline-block;
            margin-top: 8px;
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 4px;
            background: #eef1ff;
            color: #4f6ef7;
        }
        .project-card .tag-prd {
            background: #fef3c7;
            color: #d97706;
        }
        .project-card .tag-doc {
            background: #dbeafe;
            color: #2563eb;
        }
        .icon-blue {
            background: #eef1ff;
            color: #4f6ef7;
        }
        .icon-green {
            background: #ecfdf5;
            color: #22c55e;
        }
        .icon-purple {
            background: #f5f3ff;
            color: #7c3aed;
        }
        .icon-orange {
            background: #fffbeb;
            color: #f59e0b;
        }
        .footer {
            text-align: center;
            padding: 30px 0 20px;
            color: #9ca3af;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fas fa-landmark"></i>河南AMC项目</h1>
        <p>AI能力管理平台 · 产品文档 · 原型设计</p>
    </div>

    <div class="container">
        <a href="https://joyhanw.github.io/" class="back-link" onclick="window.history.back();return false;">
            <i class="fas fa-arrow-left"></i> 返回项目列表
        </a>

        <div class="project-grid">
            <!-- 卡片 1：AI能力管理平台v1.0 -->
            <a href="河南AMC AI能力管理平台v1.0.html" class="project-card">
                <div class="icon icon-blue"><i class="fas fa-robot"></i></div>
                <div class="name">河南AMC AI能力管理平台 v1.0</div>
                <div class="desc">企业AI能力管理平台主页面 · 运营驾驶舱 · Skill管理 · 连接器管理</div>
                <span class="tag"><i class="fas fa-file-code"></i> 原型</span>
            </a>

            <!-- 卡片 2：PRD文档 -->
            <a href="河南AMC AI能力管理平台v1.0PRD.html" class="project-card">
                <div class="icon icon-orange"><i class="fas fa-file-alt"></i></div>
                <div class="name">PRD 产品需求文档</div>
                <div class="desc">河南AMC AI能力管理平台 v1.0 完整PRD文档</div>
                <span class="tag tag-prd"><i class="fas fa-clipboard-list"></i> PRD</span>
            </a>

            <!-- 卡片 3：功能清单 -->
            <a href="河南AMC AI能力管理平台v1.0功能清单.html" class="project-card">
                <div class="icon icon-green"><i class="fas fa-list-check"></i></div>
                <div class="name">功能清单</div>
                <div class="desc">平台全部功能模块清单 · 优先级 · 说明</div>
                <span class="tag tag-doc"><i class="fas fa-table"></i> 文档</span>
            </a>
        </div>

        <div class="footer">
            <p>📌 点击卡片查看详情 · 河南资产管理有限公司</p>
        </div>
    </div>

</body>
</html>
