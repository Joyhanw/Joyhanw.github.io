var OPERATORS = ['等于','不等于','包含于','不包含于','大于','大于等于','小于','小于等于','为空','不为空'];

function onDbConnChange(prefix, isEdit) {
  var connId = document.getElementById(prefix + 'Conn').value;
  if (!connId) return;
  var conn = DB_CONNECTORS.find(function(x){return x.id===connId;});
  if (!conn) return;
  var oldConnId = prefix === 'np' ? window._npDbConnId : window._epDbConnId;
  if (oldConnId && oldConnId !== connId && !isEdit) {
    var hasTools = document.querySelectorAll('#' + prefix + 'ToolsTags .tag').length > 0;
    if (hasTools && !confirm('\u5207\u6362\u6570\u636E\u5E93\u8FDE\u63A5\u5668\u540E\uFF0C\u5F53\u524D\u5DF2\u9009\u5DE5\u5177\u53CA\u6570\u636E\u6743\u9650\u914D\u7F6E\u5C06\u88AB\u6E05\u7A7A\uFF0C\u662F\u5426\u7EE7\u7EED\uFF1F')) {
      document.getElementById(prefix + 'Conn').value = oldConnId;
      return;
    }
  }
  if (prefix === 'np') window._npDbConnId = connId;
  else window._epDbConnId = connId;
  var tools = conn.tools || [];
  var toolsHtml = '';
  tools.forEach(function(t, i){
    toolsHtml += '<label style="display:flex;align-items:center;gap:8px;padding:6px 8px;cursor:pointer;font-size:13px">' +
      '<input type="checkbox" class="' + prefix + '-tool-cb" value="' + t.name + '" onchange="onToolCheckChange(\'' + prefix + '\')" style="width:14px;height:14px;accent-color:var(--primary);cursor:pointer"> ' +
      '<span>' + t.name + '</span>' +
      '<span style="font-size:11px;color:var(--text-muted)">' + t.desc + '</span></label>';
  });
  document.getElementById(prefix + 'ToolsList').innerHTML = toolsHtml;
  var hint = document.getElementById(prefix + 'ToolsHint');
  if (hint) hint.style.display = 'none';
  if (isEdit && prefix === 'ep' && window._epToolPerms) {
    var checkedTools = window._epToolPerms.map(function(tp){ return tp.toolName; });
    document.querySelectorAll('.ep-tool-cb').forEach(function(cb){
      if (checkedTools.indexOf(cb.value) >= 0) cb.checked = true;
    });
    renderToolPermCards('ep', window._epToolPerms);
  }
}

function onToolCheckChange(prefix) {
  var selected = [];
  document.querySelectorAll('.' + prefix + '-tool-cb:checked').forEach(function(cb){ selected.push({toolName:cb.value}); });
  var tagsHtml = selected.map(function(t){
    return '<span class="tag tag-blue" style="font-size:10px;padding:3px 8px">' + t.toolName +
      ' <span style="cursor:pointer;margin-left:3px" onclick="removeToolTag(\'' + prefix + '\',\'' + t.toolName + '\')">\u00D7</span></span>';
  }).join('');
  document.getElementById(prefix + 'ToolsTags').innerHTML = tagsHtml;
  if (selected.length === 0) {
    document.getElementById(prefix + 'ToolPerms').style.display = 'none';
    return;
  }
  document.getElementById(prefix + 'ToolPerms').style.display = '';
  var existingPerms = (prefix === 'ep' ? (window._epToolPerms || []) : (window._npToolPerms || []));
  var connId = document.getElementById(prefix + 'Conn').value;
  var conn = DB_CONNECTORS.find(function(x){return x.id===connId;});
  var newPerms = [];
  selected.forEach(function(t){
    var existing = existingPerms.find(function(e){ return e.toolName === t.toolName; });
    if (existing) {
      newPerms.push({toolName:t.toolName, tables:existing.tables, rowFilters:(existing.rowFilters||[]).map(function(r){return {table:r.table, field:r.field||'', operator:r.operator||'\u7B49\u4E8E', value:r.value||''};})});
    } else {
      newPerms.push({toolName:t.toolName, tables:'', rowFilters:[]});
    }
  });
  if (prefix === 'np') window._npToolPerms = newPerms;
  else window._epToolPerms = newPerms;
  renderToolPermCards(prefix, newPerms);
}

function removeToolTag(prefix, toolName) {
  document.querySelectorAll('.' + prefix + '-tool-cb').forEach(function(cb){
    if (cb.value === toolName) { cb.checked = false; }
  });
  onToolCheckChange(prefix);
}

function renderToolPermCards(prefix, perms) {
  var html = '';
  perms.forEach(function(p, idx){
    var connId = document.getElementById(prefix + 'Conn').value;
    var conn = DB_CONNECTORS.find(function(x){return x.id===connId;});
    var tool = conn ? conn.tools.find(function(t){return t.name===p.toolName;}) : null;
    var knownTables = tool && tool.tables ? tool.tables : [];
    var knownFields = [];
    if (tool && tool.fields && p.tables) {
      var tableList = (p.tables || '').split(',').map(function(t){return t.trim();}).filter(function(t){return t;});
      tableList.forEach(function(tb){
        if (tool.fields[tb]) {
          tool.fields[tb].forEach(function(f){
            if (knownFields.indexOf(f) < 0) knownFields.push(f);
          });
        }
      });
    }
    var tableOpts = knownTables.map(function(t){ return '<option value="'+t+'">'+t+'</option>'; }).join('');

      var fieldsForTable = [];
      if (knownFields.length > 0) {
        fieldsForTable = knownFields;
      } else if (tool && tool.fields && rf.table && tool.fields[rf.table]) {
        fieldsForTable = tool.fields[rf.table];
      }
      var fieldOpts = fieldsForTable.map(function(f){ return '<option value="'+f+'">'+f+'</option>'; }).join('');

        // Field - flat input
        '<div><input class="form-control" value="' + (rf.field||'') + '" placeholder="\u5B57\u6BB5\u540D" style="font-size:11px;padding:3px 5px;width:100%" onchange="updateRowFilterSimple(\'\'+prefix+\'\','+idx+','+fi+',\'field\',this.value)"></div>' +// Operator
        '<div><select class="form-control" style="font-size:11px;padding:3px 5px;width:100%" onchange="updateRowFilterSimple(\''+prefix+'\','+idx+','+fi+',\'operator\',this.value);renderToolPermCards(\''+prefix+'\',(prefix===\'np\'?window._npToolPerms:window._epToolPerms))">' +
        opOpts.replace('value="'+rf.operator+'"', 'value="'+rf.operator+'" selected') + '</select></div>' +
        // Value (hidden for empty operators)
        (isOperatorEmpty ?
        '<div style="font-size:11px;color:var(--text-muted);padding:4px 6px">\u2014</div>' :
        '<div><input class="form-control" value="' + (rf.value||'') + '" placeholder="\u56FA\u5B9A\u503C\u6216{\{user.xxx\}}" style="font-size:11px;padding:3px 5px;width:100%;font-family:monospace" onchange="updateRowFilterSimple(\''+prefix+'\','+idx+','+fi+',\'value\',this.value)"></div>') +
        // Delete
        '<div><button class="btn btn-ghost btn-xs" onclick="this.closest(\'.perm-filter-row\').remove();removeRowFilter(\''+prefix+'\','+idx+','+fi+')" style="padding:2px 4px"><i class="fas fa-xmark" style="font-size:12px;color:var(--text-muted)"></i></button></div>' +
        '</div>'
    });
    
    html += '<div class="perm-tool-card" style="border:1px solid var(--border-light);border-radius:8px;margin-bottom:8px;overflow:hidden">' +
      '<div class="perm-tool-hd" style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:#f9fafb;cursor:pointer;font-size:13px;font-weight:500" onclick="var b=this.nextElementSibling;var a=this.querySelector(\'.perm-arrow\');if(b){b.style.display=b.style.display===\'none\'?\'\':\'none\';if(a)a.textContent=b.style.display===\'none\'?\'\u25B6\':\'\u25BC\';}">' +
      '<span class="perm-arrow" style="font-size:10px;color:var(--text-muted);width:14px">\u25BC</span>' + p.toolName + '</div>' +
      '<div class="perm-tool-body" style="padding:10px 14px">' +
      '<div class="form-group" style="margin-bottom:8px"><label style="font-size:12px">\u8868\u767D\u540D\u5355</label>' +
      '<input class="form-control" id="' + prefix + '_tb_' + idx + '" value="' + p.tables + '" placeholder="\u591A\u4E2A\u8868\u540D\u4F7F\u7528\u82F1\u6587\u9017\u53F7\u5206\u9694" style="font-size:12px;padding:5px 8px" onchange="updateTableWhitelist(\''+prefix+'\','+idx+',this.value);renderToolPermCards(\''+prefix+'\',(prefix===\'np\'?window._npToolPerms:window._epToolPerms))">' +
      '<div style="font-size:10px;color:var(--text-muted);margin-top:2px">\u591A\u4E2A\u8868\u540D\u4F7F\u7528\u82F1\u6587\u9017\u53F7\u5206\u9694\uFF1B\u7559\u7A7A\u8868\u793A\u4E0D\u9650\u5236\u3002</div></div>' +
      '<div style="margin-bottom:4px"><label style="font-size:12px;margin-bottom:2px;display:block;font-weight:500">\u884C\u8FC7\u6EE4\u89C4\u5219</label></div>' +

      '</div></div>';
  });
  document.getElementById(prefix + 'ToolPermCards').innerHTML = html;
}

function addRowFilterRow(prefix, permIdx) {
  var perms = prefix === 'np' ? window._npToolPerms : window._epToolPerms;
  if (!perms || !perms[permIdx]) return;
  if (!perms[permIdx].rowFilters) perms[permIdx].rowFilters = [];
  perms[permIdx].rowFilters.push({table:'', field:'', operator:'\u7B49\u4E8E', value:''});
  renderToolPermCards(prefix, perms);
}

function updateTableWhitelist(prefix, permIdx, val) {
  var perms = prefix === 'np' ? window._npToolPerms : window._epToolPerms;
  if (perms && perms[permIdx]) perms[permIdx].tables = val;
}

function updateRowFilterSimple(prefix, permIdx, fi, field, val) {
  var perms = prefix === 'np' ? window._npToolPerms : window._epToolPerms;
  if (!perms || !perms[permIdx]) return;
  if (!perms[permIdx].rowFilters) perms[permIdx].rowFilters = [];
  while (perms[permIdx].rowFilters.length <= fi) perms[permIdx].rowFilters.push({table:'', field:'', operator:'\u7B49\u4E8E', value:''});
  perms[permIdx].rowFilters[fi][field] = val;
}

function removeRowFilter(prefix, permIdx, fi) {
  var perms = prefix === 'np' ? window._npToolPerms : window._epToolPerms;
  if (perms && perms[permIdx] && perms[permIdx].rowFilters) {
    perms[permIdx].rowFilters.splice(fi, 1);
  }
}

function confirmNewPolicy() {
  var name = document.getElementById('npName').value.trim();

  var connId = document.getElementById('npConn').value;
  if (!connId) { showToast('\u8BF7\u9009\u62E9\u6570\u636E\u5E93\u8FDE\u63A5\u5668','','w'); return; }
  var selectedTools = [];
  document.querySelectorAll('.np-tool-cb:checked').forEach(function(cb){ selectedTools.push(cb.value); });
  if (selectedTools.length === 0) { showToast('\u8BF7\u9009\u62E9\u81F3\u5C11\u4E00\u4E2A\u5DE5\u5177','','w'); return; }
  var conn = DB_CONNECTORS.find(function(x){return x.id===connId;});

  var toolPerms = [];

  var newId = 'POL-DB-' + String(DB_POLICIES.length + 1).padStart(3,'0');
  DB_POLICIES.push({
    id: newId, name:name, scope:'\u666E\u901A\u5458\u5DE5', connectorId:connId, connectorName:conn?conn.name:'', status:status,
    toolPerms: toolPerms
  });
  window._npToolPerms = null;
  closeModal();
  renderPermissions();
  showToast('\u521B\u5EFA\u6210\u529F','\u7B56\u7565\u300C'+name+'\u300D\u5DF2\u521B\u5EFA','s');
}

    '<button class="btn btn-sm btn-primary" onclick="confirmToolSelection(\''+prefix+'\')" style="font-size:11px;padding:4px 10px">确认选择（'+tools.length+'）</button>' +
    '<button class="btn btn-sm btn-ghost" onclick="collapseAllTools(\''+prefix+'\')" style="font-size:11px;padding:4px 8px">收起</button></div>' +
    '<div id="'+prefix+'ToolList" style="max-height:300px;overflow-y:auto;border:1px solid var(--border-light);border-radius:6px">';
  tools.forEach(function(tool, i){
    var paramPermHtml = buildParamPermArea(prefix, tool, i);
    html += '<div class="disc-tool-row" id="'+prefix+'_tr_'+i+'" style="border-bottom:1px solid var(--border-light)">' +
      '<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer" onclick="toggleToolExpand(\''+prefix+'\','+i+')">' +
      '<input type="checkbox" id="'+prefix+'_tk_'+i+'" checked onclick="event.stopPropagation();updateToolCount(\''+prefix+'\')" style="width:14px;height:14px;accent-color:var(--primary);cursor:pointer">' +
      '<span style="flex:1;font-size:13px;font-weight:500">'+tool.name+'</span>' +
      '<span class="tag '+(tool.method==='GET'?'tag-green':tool.method==='POST'?'tag-blue':tool.method==='PUT'?'tag-yellow':tool.method==='DELETE'?'tag-red':'tag-gray')+'" style="font-size:9px;padding:1px 5px">'+tool.method+'</span>' +
      '<span style="font-size:11px;color:var(--text-muted);font-family:monospace">'+tool.path+'</span>' +
      '<span style="font-size:11px;color:var(--text-secondary);flex:0 0 auto;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+tool.desc+'</span>' +
      '<button class="btn btn-ghost btn-xs" onclick="event.stopPropagation();showToast(\'测试\',\'工具调用成功\',\'s\')" style="padding:2px 6px;font-size:10px"><i class="fas fa-play"></i></button>' +
      '<span style="font-size:10px;color:var(--text-muted);width:12px;text-align:center" id="'+prefix+'_exp_'+i+'"><i class="fas fa-chevron-down"></i></span></div>' +
      paramPermHtml + '</div>';
  });
  html += '</div>';
  return html;
}

function discoverToolsNew() {
  var url = document.getElementById('cnBaseURL').value.trim();
  if (!url) { showToast('请先填写基本URL','','w'); return; }
  var btn = document.getElementById('cnDiscoverBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在解析...'; }
  setTimeout(function(){
    window._cnDiscoveredTools = DEMO_TOOLS.slice();
    var html = buildNewToolListHtml('cn', window._cnDiscoveredTools);
    var area = document.getElementById('cnToolListArea');
    if (area) { area.style.display = ''; area.innerHTML = html; }
    var empty = document.getElementById('cnEmptyTools');
    if (empty) empty.style.display = 'none';
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-magnifying-glass"></i> 从 OpenAPI 自动发现工具'; }
    showToast('解析完成','共发现 '+DEMO_TOOLS.length+' 个工具','s');
  }, 800);
}

function discoverToolsEdit() {
  var url = document.getElementById('enBaseURL').value.trim();
  if (!url) { showToast('请先填写基本URL','','w'); return; }
  var btn = document.getElementById('editDiscoverBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在解析...'; }
  setTimeout(function(){
    // Preserve existing selections and param configs
    var oldSelections = {};
    if (window._editDiscoveredTools) {
      window._editDiscoveredTools.forEach(function(t, i){
        var cb = document.getElementById('edit_tk_' + i);
        oldSelections[t.name] = {selected: cb ? cb.checked : t.selected, pv: t._pv || {}, removed: t._removed || []};
      });
    }
    window._editDiscoveredTools = DEMO_TOOLS.slice().map(function(t){
      var old = oldSelections[t.name];
      var tool = {name:t.name, method:t.method, path:t.path, desc:t.desc, params:t.params, selected: old ? old.selected : true};
      tool._pv = old ? (old.pv || {}) : {};
      tool._removed = old ? (old.removed || []) : [];
      return tool;
    });
    var html = buildEditToolListHtml('edit', window._editDiscoveredTools);
    var area = document.getElementById('editToolListArea');
    if (area) { area.style.display = ''; area.innerHTML = html; }
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-magnifying-glass"></i> 重新发现工具'; }
    showToast('解析完成','共发现 '+DEMO_TOOLS.length+' 个工具','s');
  }, 800);
}

function showEditReDiscoverHint() {
  var area = document.getElementById('editToolListArea');
  if (!area) return;
  // Add a small hint if tools were already discovered
  if (window._editDiscoveredTools && window._editDiscoveredTools.length > 0) {
    var hint = document.getElementById('editRediscoverHint');
    if (!hint) {
      var h = document.createElement('div');
      h.id = 'editRediscoverHint';
      h.style.cssText = 'margin-top:6px;padding:6px 10px;background:var(--warning-bg);border-radius:4px;font-size:11px;color:#d97706';
      h.innerHTML = '<i class="fas fa-circle-info"></i> 连接配置已变更，建议重新发现工具。';
      area.parentNode.insertBefore(h, area);
    }
  }
}

function toggleToolExpand(prefix, idx) {
  var area = document.getElementById(prefix + '_pp_' + idx);
  var arrow = document.getElementById(prefix + '_exp_' + idx);
  if (area) {
    var isOpen = area.style.display !== 'none';
    area.style.display = isOpen ? 'none' : '';
    if (arrow) arrow.innerHTML = isOpen ? '<i class="fas fa-chevron-down"></i>' : '<i class="fas fa-chevron-up"></i>';
  }
}

function searchToolsList(prefix, q) {
  var list = document.getElementById(prefix + 'ToolList');
  if (!list) return;
  var rows = list.querySelectorAll('.disc-tool-row');
  rows.forEach(function(row){
    row.style.display = row.textContent.indexOf(q) >= 0 ? '' : 'none';
  });
}

function selectAllTools(prefix) {
  var list = document.getElementById(prefix + 'ToolList');
  if (!list) return;
  var visible = list.querySelectorAll('.disc-tool-row:not([style*="display: none"])');
  visible.forEach(function(row){
    var cb = row.querySelector('input[type="checkbox"]');
    if (cb) cb.checked = true;
  });
  updateToolCount(prefix);
}

function deselectAllTools(prefix) {
  var list = document.getElementById(prefix + 'ToolList');
  if (!list) return;
  var visible = list.querySelectorAll('.disc-tool-row:not([style*="display: none"])');
  visible.forEach(function(row){
    var cb = row.querySelector('input[type="checkbox"]');
    if (cb) cb.checked = false;
  });
  updateToolCount(prefix);
}

function collapseAllTools(prefix) {
  var list = document.getElementById(prefix + 'ToolList');
  if (!list) return;
  var allAreas = list.querySelectorAll('[id^="'+prefix+'_pp_"]');
  allAreas.forEach(function(area){ area.style.display = 'none'; });
  var allArrows = list.querySelectorAll('[id^="'+prefix+'_exp_"]');
  allArrows.forEach(function(a){ a.innerHTML = '<i class="fas fa-chevron-down"></i>'; });
}

function updateToolCount(prefix) {
  var list = document.getElementById(prefix + 'ToolList');
  if (!list) return;
  var total = 0, selected = 0;
  var rows = list.querySelectorAll('.disc-tool-row');
  rows.forEach(function(row){
    total++;
    var cb = row.querySelector('input[type="checkbox"]');
    if (cb && cb.checked) selected++;
  });
  // Update the header text
  var container = list.parentNode;
  var header = container ? container.querySelector('div[style*="font-size:12px;color:var(--text-muted)"]') : null;
  if (header) header.textContent = '发现 ' + total + ' 个工具 · 已选 ' + selected;
  // Update confirm button text
  var confirmBtn = container ? container.querySelector('.btn-primary') : null;
  if (confirmBtn) confirmBtn.innerHTML = '确认选择（'+selected+'）';
}

function confirmToolSelection(prefix) {
  var list = document.getElementById(prefix + 'ToolList');
  if (!list) return;
  var total = 0, selected = 0;
  var rows = list.querySelectorAll('.disc-tool-row');
  rows.forEach(function(row){
    total++;
    var cb = row.querySelector('input[type="checkbox"]');
    if (cb && cb.checked) selected++;
  });
  showToast('选择已确认','已选择 '+selected+'/'+total+' 个工具','s');
  // Update the header to reflect confirmed state
  var container = list.parentNode;
  var header = container ? container.querySelector('div[style*="font-size:12px;color:var(--text-muted)"]') : null;
  if (header) {
    header.innerHTML = '发现 ' + total + ' 个工具 · 已选 ' + selected + ' <span style="color:var(--success);font-weight:500">✓ 已确认</span>';
  }
}

// ===== REST API PARAM PERMISSIONS =====
function toolParamsState(prefix, toolIdx) {
  var tools = prefix === 'cn' ? window._cnDiscoveredTools : window._editDiscoveredTools;
  var tool = tools[toolIdx];
  if (!tool._pv) tool._pv = {};
  if (!tool._removed) tool._removed = [];
  return tool;
}

function buildParamPermArea(prefix, tool, toolIdx) {
  toolParamsState(prefix, toolIdx);
  var html = '<div class="param-perm-area" id="'+prefix+'_pp_'+toolIdx+'" style="display:none;padding:8px 12px 8px 36px;background:#f9fafb;border-top:1px solid var(--border-light)">' +
    '<div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">参数权限</div>' +
    '<div style="font-size:10px;color:var(--text-muted);margin-bottom:6px;line-height:1.4">配置该工具调用时允许使用的参数值。未配置参数值时，不限制该参数的取值。</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1.5fr 28px;gap:6px;padding:0 2px;font-size:10px;color:var(--text-muted);margin-bottom:4px"><div>参数名</div><div>参数值</div><div></div></div>' +
    '<div id="'+prefix+'_prlist_'+toolIdx+'">';
  (tool.params || []).forEach(function(p){
    if (tool._removed.indexOf(p.name) >= 0) return;
    html += buildParamRow(prefix, tool, toolIdx, p);
  });
  html += '</div>' +
    '<div style="margin-top:2px"><button class="btn btn-text btn-xs" onclick="addParamRow(\''+prefix+'\','+toolIdx+')"><i class="fas fa-plus"></i> 添加参数</button></div></div>';
  return html;
}

function buildParamRow(prefix, tool, toolIdx, p) {
  var used = [];
  (tool.params || []).forEach(function(pp){ if (pp.name !== p.name && tool._removed.indexOf(pp.name) < 0) used.push(pp.name); });
  var opts = '<option value="">请选择参数...</option>' + (tool.params||[]).map(function(pp){
    var sel = pp.name === p.name ? ' selected' : '';
    var dis = used.indexOf(pp.name) >= 0 ? ' disabled' : '';
    return '<option value="'+pp.name+'"'+sel+dis+'>'+pp.name+'</option>';
  }).join('');
  var val = tool._pv[p.name] || '';
  return '<div class="param-row" style="display:grid;grid-template-columns:1fr 1.5fr 28px;gap:6px;margin-bottom:4px;align-items:center">' +
    '<select class="form-control" style="font-size:11px;padding:3px 5px;width:100%" onchange="onParamSel(\''+prefix+'\','+toolIdx+',\''+p.name+'\',this.value)">'+opts+'</select>' +
    '<input class="form-control" value="'+val+'" placeholder="请输入" style="font-size:11px;padding:3px 5px;font-family:monospace;width:100%" onchange="onParamVal(\''+prefix+'\','+toolIdx+',\''+p.name+'\',this.value)">' +
    '<button class="btn btn-ghost btn-xs" onclick="removeParamRow(\''+prefix+'\','+toolIdx+',\''+p.name+'\')" style="padding:2px 4px"><i class="fas fa-xmark" style="font-size:12px;color:var(--text-muted)"></i></button></div>';
}

function onParamSel(prefix, toolIdx, oldName, newName) {
  var tool = toolParamsState(prefix, toolIdx);
  if (!newName) return;
  if (newName === oldName) return;
  var val = tool._pv[oldName] || '';
  delete tool._pv[oldName];
  tool._pv[newName] = val;
  rerenderParams(prefix, toolIdx);
}

function onParamVal(prefix, toolIdx, pname, val) {
  var tool = toolParamsState(prefix, toolIdx);
  tool._pv[pname] = val;
}

function addParamRow(prefix, toolIdx) {
  var tool = toolParamsState(prefix, toolIdx);
  var removed = (tool.params||[]).filter(function(p){ return tool._removed.indexOf(p.name) >= 0; });
  if (removed.length === 0) { showToast('当前接口的参数已全部添加','','i'); return; }
  tool._removed = tool._removed.filter(function(n){ return n !== removed[0].name; });
  rerenderParams(prefix, toolIdx);
}

function removeParamRow(prefix, toolIdx, pname) {
  var tool = toolParamsState(prefix, toolIdx);
  if (tool._removed.indexOf(pname) < 0) tool._removed.push(pname);
  delete tool._pv[pname];
  rerenderParams(prefix, toolIdx);
}

function rerenderParams(prefix, toolIdx) {
  var tools = prefix === 'cn' ? window._cnDiscoveredTools : window._editDiscoveredTools;
  if (!tools || !tools[toolIdx]) return;
  var tool = tools[toolIdx];
  var area = document.getElementById(prefix + '_pp_' + toolIdx);
  if (!area) return;
  var holder = document.createElement('div');
  holder.innerHTML = buildParamPermArea(prefix, tool, toolIdx);
  area.parentNode.replaceChild(holder.firstChild, area);
}
