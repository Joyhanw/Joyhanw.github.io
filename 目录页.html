<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品方案评审 · 华消萧山消防</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%;
    background: #030b16;
    font-family: "Microsoft YaHei", sans-serif;
    overflow: hidden;
    color: #a9d3ff;
  }

  /* ---- 顶部 ---- */
  .top-bar {
    height: 52px; flex-shrink: 0;
    background: linear-gradient(180deg, rgba(0,20,40,0.95) 0%, rgba(3,11,22,0.95) 100%);
    border-bottom: 1px solid rgba(0,240,255,0.15);
    display: flex; align-items: center; padding: 0 16px; gap: 12px;
    z-index: 100; position: relative;
  }
  .top-bar .toggle-btn {
    background: rgba(0,240,255,0.08); border: 1px solid rgba(0,240,255,0.25);
    color: #00f0ff; width: 32px; height: 32px; border-radius: 4px;
    cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
    transition: all .2s; flex-shrink: 0;
  }
  .top-bar .toggle-btn:hover { background: rgba(0,240,255,0.18); }
  .top-bar .page-title {
    font-size: 16px; font-weight: bold; color: #fff;
    letter-spacing: 2px;
  }

  /* ---- 主体 ---- */
  .main-wrap {
    display: flex; height: calc(100% - 52px); position: relative;
  }

  /* ---- 侧边栏 ---- */
  .sidebar {
    width: 220px; flex-shrink: 0;
    background: rgba(3,11,22,0.9);
    border-right: 1px solid rgba(0,240,255,0.1);
    display: flex; flex-direction: column;
    padding: 12px 0;
    transition: width 0.25s ease, padding 0.25s ease;
    overflow: hidden;
  }
  .sidebar.collapsed {
    width: 0; padding: 12px 0; border-right: none;
  }
  .sidebar .nav-item {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; margin: 2px 8px;
    border-radius: 4px; cursor: pointer;
    font-size: 13px; color: #a9d3ff;
    transition: all 0.18s; white-space: nowrap;
    border: 1px solid transparent;
  }
  .sidebar .nav-item:hover {
    background: rgba(0,240,255,0.05);
    color: #fff;
  }
  .sidebar .nav-item.active {
    background: rgba(0,240,255,0.1);
    border: 1px solid rgba(0,240,255,0.25);
    color: #00f0ff; font-weight: bold;
  }
  .sidebar .nav-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(0,240,255,0.3); flex-shrink: 0;
  }
  .sidebar .nav-item.active .nav-dot {
    background: #00f0ff; box-shadow: 0 0 6px rgba(0,240,255,0.6);
  }

  /* ---- 内容区 ---- */
  .content-area {
    flex: 1; position: relative; background: #030b16;
  }
  .content-area iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: none; display: none;
  }
  .content-area iframe.active { display: block; }
</style>
</head>
<body>

<!-- 顶部 -->
<div class="top-bar">
  <button class="toggle-btn" onclick="toggleSidebar()" title="折叠/展开侧边栏">☰</button>
  <span class="page-title">华消萧山消防产品方案</span>
</div>

<!-- 主体 -->
<div class="main-wrap">
  <!-- 侧边栏 -->
  <div class="sidebar" id="sidebar">
    <div class="nav-item active" data-idx="0" onclick="switchPage(0)">
      <span class="nav-dot"></span> 基层治理风险隐患排查
    </div>
    <div class="nav-item" data-idx="1" onclick="switchPage(1)">
      <span class="nav-dot"></span> 单位列表-九小场所
    </div>
    <div class="nav-item" data-idx="2" onclick="switchPage(2)">
      <span class="nav-dot"></span> 统计分析-九小场所原型
    </div>
  </div>

  <!-- 内容区 -->
  <div class="content-area" id="contentArea">
    <iframe class="active" src="风险隐患排查-大屏.html" id="iframe0"></iframe>
    <iframe src="单位列表-九小场所.html" id="iframe1"></iframe>
    <iframe src="统计分析-九小场所原型.html" id="iframe2"></iframe>
  </div>
</div>

<script>
  const pages = [
    { name: '基层治理风险隐患排查', file: '风险隐患排查-大屏.html' },
    { name: '单位列表-九小场所', file: '单位列表-九小场所.html' },
    { name: '统计分析-九小场所原型', file: '统计分析-九小场所原型.html' }
  ];
  let currentIdx = 0;
  let sidebarOpen = true;

  function switchPage(idx) {
    currentIdx = idx;
    document.querySelectorAll('.content-area iframe').forEach((f, i) => {
      f.classList.toggle('active', i === idx);
    });
    document.querySelectorAll('.sidebar .nav-item').forEach((item, i) => {
      item.classList.toggle('active', i === idx);
    });
  }

  function toggleSidebar() {
    sidebarOpen = !sidebarOpen;
    document.getElementById('sidebar').classList.toggle('collapsed', !sidebarOpen);
  }
</script>

</body>
</html>
