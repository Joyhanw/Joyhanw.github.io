
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>味冠 · 周转分析智能体</title>
<style>
/* ============== 基础 ============== */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --bg: #F6F8FB;
    --bg-soft: #FBFCFE;
    --card: #FFFFFF;
    --border: #E6EAF0;
    --border-soft: #EFF2F6;
    --text: #1A2233;
    --text-2: #4C5670;
    --text-3: #8B95AB;
    --text-4: #B4BCC9;
    --primary: #2E6BFF;
    --primary-soft: #EAF1FF;
    --primary-grad: linear-gradient(135deg, #2E6BFF 0%, #7B5BFF 100%);
    --success: #10B981;
    --success-soft: #D1FAE5;
    --warning: #F59E0B;
    --warning-soft: #FEF3C7;
    --danger:  #E5484D;
    --danger-soft: #FEE2E2;
    --info: #6366F1;
    --info-soft: #E0E7FF;
    --shadow-sm: 0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.04);
    --shadow-md: 0 4px 12px rgba(16,24,40,0.05), 0 2px 6px rgba(16,24,40,0.04);
    --shadow-lg: 0 12px 32px rgba(16,24,40,0.08), 0 4px 12px rgba(16,24,40,0.04);
    --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg-soft);
    color: var(--text);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
}
button { border: none; background: none; cursor: pointer; font: inherit; color: inherit; }
input, textarea, select { font: inherit; color: inherit; outline: none; }
a { color: inherit; text-decoration: none; cursor: pointer; }
.hidden { display: none !important; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #D7DCE6; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #B4BCC9; }
::-webkit-scrollbar-track { background: transparent; }

/* ============== 顶部导航 ============== */
.topbar {
    height: 56px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark { display: flex; align-items: center; justify-content: center; }
.logo-name { font-size: 16px; font-weight: 700; letter-spacing: 0.2px; color: var(--text); }
.logo-name span { background: var(--primary-grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

/* ============== 对话页 ============== */
.view-chat { display: flex; height: calc(100vh - 56px); background: var(--bg-soft); }
.chat-sidebar {
    flex: 0 0 232px; background: #fff; border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
}
.new-chat-btn {
    margin: 14px 12px; padding: 9px 12px;
    background: var(--text); color: #fff; border-radius: 8px;
    display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500;
    transition: all .15s; justify-content: center;
}
.new-chat-btn:hover { background: #000; }
.new-chat-btn svg { stroke-width: 2.5; }

.history-section { flex: 1; overflow-y: auto; padding: 6px 12px 14px; }
.history-section-title { font-size: 11px; color: var(--text-3); margin: 10px 4px 8px; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: space-between; }
.history-section-title .hs-count { font-size: 10px; background: var(--bg); padding: 1px 8px; border-radius: 999px; }
.history-list { display: flex; flex-direction: column; gap: 2px; }
.h-item {
    padding: 7px 28px 7px 10px; border-radius: 6px; font-size: 12.5px; color: var(--text-2);
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: flex; align-items: center; gap: 6px; position: relative;
}
.h-item:hover { background: var(--border-soft); }
.h-item:hover .h-actions { display: flex; }
.h-item.active { background: var(--primary-soft); color: var(--primary); }
.h-item .h-ico { flex: 0 0 14px; }
.h-item .h-title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.h-actions { display: none; position: absolute; right: 4px; top: 50%; transform: translateY(-50%); gap: 2px; }
.h-actions button { width: 22px; height: 22px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-3); }
.h-actions button:hover { background: #fff; color: var(--text); }

.h-item.editing { background: var(--primary-soft); padding-right: 4px; }
.h-item.editing .h-title { display: none; }
.h-item.editing .h-actions { display: none; }
.h-edit-input { display: none; flex: 1; border: none; background: #fff; border-radius: 4px; padding: 2px 6px; font-size: 12.5px; outline: none; border: 1px solid var(--primary); }
.h-item.editing .h-edit-input { display: block; }

/* 主对话区 */
.chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.chat-header {
    padding: 12px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: #fff;
}
.chat-header-left { display: flex; align-items: center; gap: 12px; }
.agent-icon-sm { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.chat-title { font-size: 15px; font-weight: 600; }

/* 对话流 */
.chat-stream { flex: 1; overflow-y: auto; padding: 24px; }
.chat-stream-inner { max-width: 920px; margin: 0 auto; }

/* 欢迎屏 */
.welcome { max-width: 880px; margin: 24px auto; text-align: center; padding: 24px 16px; }
.welcome-avatar { width: 80px; height: 80px; border-radius: 20px; background: linear-gradient(135deg, #EAF1FF, #F4F0FF); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; box-shadow: var(--shadow-md); }
.welcome h2 { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
.welcome > p { font-size: 14px; color: var(--text-2); line-height: 1.8; margin-bottom: 28px; }

.suggest-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
.suggest-card { background: #fff; border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px; text-align: left; transition: all .15s; cursor: pointer; }
.suggest-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: #C7D5FF; }
.sc-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; margin-bottom: 8px; }
.sc-title { font-size: 13.5px; font-weight: 500; line-height: 1.5; color: var(--text); margin-bottom: 4px; }
.sc-sub { font-size: 11.5px; color: var(--text-3); line-height: 1.5; }

.welcome-foot { font-size: 12.5px; color: var(--text-3); padding-top: 18px; border-top: 1px solid var(--border-soft); }

/* 消息泡 */
.msg { display: flex; gap: 14px; margin-bottom: 24px; max-width: 920px; margin-left: auto; margin-right: auto; }
.msg.user { flex-direction: row-reverse; }
.msg-avatar { width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; }
.msg.user .msg-avatar { background: var(--primary-grad); color: #fff; }
.msg.ai .msg-avatar { background: linear-gradient(135deg,#EAF1FF,#F4F0FF); border: 1px solid #DCE5F5; }

.msg-body { flex: 1; min-width: 0; }
.msg.user .msg-body { text-align: right; }
.msg-meta { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-3); margin-bottom: 4px; }
.msg.user .msg-meta { justify-content: flex-end; }
.msg-meta b { color: var(--text-2); font-weight: 500; }
.msg-meta .tag-ai { background: var(--primary-soft); color: var(--primary); padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; }

.bubble.user-bubble {
    background: var(--primary); color: #fff;
    padding: 10px 14px; border-radius: 14px 14px 4px 14px;
    display: inline-block; max-width: 80%; line-height: 1.6; text-align: left;
}
.bubble.ai-bubble {
    background: #fff; border: 1px solid var(--border);
    border-radius: 4px 14px 14px 14px; padding: 16px 18px;
    line-height: 1.7; color: var(--text);
}
.bubble.ai-bubble > * + * { margin-top: 14px; }
.bubble.ai-bubble p { line-height: 1.75; }
.bubble.ai-bubble strong { color: var(--text); font-weight: 600; }
.bubble.ai-bubble em { font-style: normal; color: var(--primary); }

/* AI 结构化输出元素 */
.ai-thinking {
    display: flex; align-items: center; gap: 8px;
    background: linear-gradient(90deg, #F4F0FF, #EAF1FF);
    border-radius: 8px; padding: 8px 12px; font-size: 12.5px; color: var(--text-2);
    margin-bottom: 12px; border: 1px solid #E1E7F5;
}
.thinking-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); animation: blink 1.4s infinite both; }
.thinking-dot:nth-child(2) { animation-delay: .2s; }
.thinking-dot:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100% { opacity: 0.3; } 40% { opacity: 1; } }

.route-info {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--text-2);
    background: var(--bg); padding: 8px 12px; border-radius: 6px;
    border-left: 3px solid var(--primary);
}
.route-info .route-ico { font-size: 14px; }
.route-info code { background: #fff; border: 1px solid var(--border); padding: 1px 6px; border-radius: 3px; font-size: 11.5px; color: var(--primary); }

.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.kpi {
    background: linear-gradient(180deg, #FAFBFF 0%, #fff 100%);
    border: 1px solid var(--border); border-radius: var(--r-md);
    padding: 12px 14px;
}
.kpi-label { font-size: 11.5px; color: var(--text-3); margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
.kpi-value { font-size: 22px; font-weight: 700; color: var(--text); line-height: 1.2; display: flex; align-items: baseline; gap: 4px; }
.kpi-value .unit { font-size: 12px; font-weight: 500; color: var(--text-3); }
.kpi-delta { font-size: 11.5px; margin-top: 6px; display: flex; align-items: center; gap: 4px; }
.kpi-delta.up { color: var(--success); }
.kpi-delta.dn { color: var(--danger); }
.kpi-delta.warn { color: var(--warning); }

.kpi.danger { background: linear-gradient(180deg,#FFF5F5 0%, #fff 100%); border-color: #FECACA; }
.kpi.success { background: linear-gradient(180deg,#F0FDF4 0%, #fff 100%); border-color: #BBF7D0; }
.kpi.warning { background: linear-gradient(180deg,#FFFBEB 0%, #fff 100%); border-color: #FDE68A; }

/* 表格 */
.tbl-wrap {
    border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; background: #fff;
}
.tbl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tbl-head-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--bg-soft); border-bottom: 1px solid var(--border-soft); }
.tbl-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.tbl-title .tbl-emoji { font-size: 14px; }
.tbl-act { display: flex; align-items: center; gap: 6px; }
.tbl-act button { font-size: 11.5px; color: var(--text-2); padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); background: #fff; }
.tbl-act button:hover { color: var(--primary); border-color: var(--primary); }
.tbl-expand-btn { font-size: 11.5px; color: var(--primary); padding: 3px 8px; border-radius: 4px; border: 1px solid var(--primary); background: #fff; cursor: pointer; }
.tbl-expand-btn:hover { background: var(--primary-soft); }
.tbl-dl-btn { font-size: 11.5px; color: var(--success); padding: 3px 8px; border-radius: 4px; border: 1px solid var(--success); background: #fff; cursor: pointer; }
.tbl-dl-btn:hover { background: var(--success-soft); }

.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl thead { position: sticky; top: 0; z-index: 2; }
.tbl th {
    background: var(--bg-soft); text-align: left; padding: 8px 10px;
    font-weight: 600; font-size: 11.5px; color: var(--text-3);
    border-bottom: 1px solid var(--border-soft); white-space: nowrap;
}
.tbl td {
    padding: 8px 10px; border-bottom: 1px solid var(--border-soft);
    vertical-align: middle; white-space: nowrap; color: var(--text-2);
}
.tbl td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: "SF Mono","JetBrains Mono","Menlo",monospace; font-size: 12px; }
.tbl tr:hover td { background: #FAFBFD; }
.tbl tbody tr:last-child td { border-bottom: none; }
.tbl th.num { text-align: right; }

.tbl-foot {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; background: var(--bg-soft); border-top: 1px solid var(--border-soft);
    font-size: 11.5px; color: var(--text-3);
}
.tbl-page-btn { padding: 2px 8px; border-radius: 4px; font-size: 11.5px; border: 1px solid var(--border); background: #fff; margin: 0 1px; }
.tbl-page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.tbl-page-btn:hover:not(.active) { border-color: var(--primary); color: var(--primary); }

.sku-name { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.danger-cell { color: var(--danger) !important; font-weight: 600; }
.warn-cell { color: var(--warning) !important; font-weight: 500; }
.success-cell { color: var(--success) !important; font-weight: 500; }
.muted-cell { color: var(--text-3) !important; }
.badge {
    display: inline-block; padding: 1px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 500;
}
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.badge.warning { background: var(--warning-soft); color: #92400E; }
.badge.success { background: var(--success-soft); color: #065F46; }
.badge.info { background: var(--info-soft); color: #4338CA; }
.badge.gray { background: #F3F4F6; color: #6B7280; }

/* 场景标签 */
.scene-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 600; margin-bottom: 10px;
}
.scene-badge.s1 { background: var(--danger-soft); color: #991B1B; }
.scene-badge.s2 { background: var(--warning-soft); color: #92400E; }
.scene-badge.s3 { background: var(--success-soft); color: #065F46; }

/* 采购员信息条 */
.buyer-banner {
    display: flex; align-items: center; gap: 14px;
    background: #FAFBFD; border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px; font-size: 13px;
}
.buyer-avatar {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; color: #fff;
}
.buyer-info { flex: 1; }
.buyer-name { font-weight: 600; font-size: 15px; }
.buyer-detail { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }

/* 仓库列表 */
.wh-list {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px;
}
.wh-tag {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 8px; border-radius: 4px;
    background: var(--bg); border: 1px solid var(--border-soft);
    font-size: 11px; color: var(--text-3);
}

/* formula card */
.formula-card {
    border: 1px solid var(--border); border-radius: var(--r-md); background: #fff; overflow: hidden;
}
.formula-head {
    padding: 10px 14px; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none;
}
.formula-head:hover { background: var(--bg-soft); }
.fh-toggle { font-size: 10px; color: var(--text-3); transition: transform .2s; }
.formula-card.collapsed .fh-toggle { transform: rotate(-90deg); }
.formula-body { padding: 0 14px 14px; }
.formula-card.collapsed .formula-body { display: none; }
.formula-step { display: flex; gap: 10px; margin-top: 8px; font-size: 12.5px; line-height: 1.6; }
.fs-num {
    flex: 0 0 22px; height: 22px; border-radius: 50%;
    background: var(--primary-soft); color: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
}
.fs-body { flex: 1; color: var(--text-2); }
.fs-body code { background: var(--bg); border: 1px solid var(--border-soft); padding: 1px 6px; border-radius: 3px; font-size: 11px; color: var(--primary); }
.fs-body .ans { color: var(--primary); font-weight: 600; background: var(--primary-soft); padding: 1px 6px; border-radius: 3px; }
.formula-foot { padding: 8px 14px; background: var(--bg-soft); border-top: 1px solid var(--border-soft); font-size: 11.5px; color: var(--text-3); }

/* advise card */
.advise-card { border: 1px solid var(--border); border-radius: var(--r-md); background: #fff; overflow: hidden; }
.advise-head { padding: 10px 14px; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--border-soft); }
.advise-body { padding: 8px 14px 14px; }
.advise-item { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border-soft); }
.advise-item:last-child { border-bottom: none; }
.ai-prio {
    flex: 0 0 28px; height: 22px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 10.5px; font-weight: 700; margin-top: 1px;
}
.ai-prio.p0 { background: #FEE2E2; color: #C81E1E; }
.ai-prio.p1 { background: #FEF3C7; color: #92400E; }
.ai-prio.p2 { background: #E0E7FF; color: #4338CA; }
.ai-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.ai-desc { font-size: 12.5px; color: var(--text-2); line-height: 1.6; }

/* alert */
.alert {
    display: flex; gap: 12px; padding: 14px; border-radius: var(--r-md);
    font-size: 13px; line-height: 1.7;
}
.alert.danger { background: var(--danger-soft); color: #991B1B; border: 1px solid #FECACA; }
.alert.warning { background: var(--warning-soft); color: #92400E; border: 1px solid #FDE68A; }
.alert.info { background: var(--info-soft); color: #3730A3; border: 1px solid #C7D2FE; }
.alert-ico { font-size: 20px; flex-shrink: 0; }
.alert-title { font-weight: 600; margin-bottom: 4px; }
.alert-desc { font-size: 12.5px; }

/* fade animation */
.fade-in { animation: fadeIn .35s ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.fade-in-stagger > *:nth-child(1) { animation-delay: 0s; }
.fade-in-stagger > *:nth-child(2) { animation-delay: .08s; }
.fade-in-stagger > *:nth-child(3) { animation-delay: .16s; }
.fade-in-stagger > *:nth-child(4) { animation-delay: .24s; }
.fade-in-stagger > * { animation: fadeIn .35s ease both; }

/* 输入区 */
.chat-input-bar {
    padding: 12px 24px 16px; border-top: 1px solid var(--border);
    background: #fff;
}
.chat-input-inner { max-width: 920px; margin: 0 auto; }
.quick-cmds { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.qc {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 10px; border-radius: 6px;
    background: var(--bg); border: 1px solid var(--border);
    font-size: 12px; color: var(--text-2); white-space: nowrap;
    transition: all .15s;
}
.qc:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.qc-ico { font-size: 13px; }
.input-row {
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px 12px;
    transition: border-color .15s;
}
.input-row:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(46,107,255,0.1); }
.input-row textarea {
    flex: 1; background: none; border: none; resize: none;
    font-size: 14px; line-height: 1.5; min-height: 24px; max-height: 160px;
}
.input-row textarea::placeholder { color: var(--text-3); }
.send-btn {
    width: 34px; height: 34px; border-radius: 8px;
    background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all .15s;
}
.send-btn:hover { background: #1E5BD6; }
.send-btn svg { width: 16px; height: 16px; }

/* Responsive */
@media (max-width: 768px) {
    .chat-sidebar { display: none; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .suggest-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
    <defs>
        <linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2E6BFF"/>
            <stop offset="100%" stop-color="#7B5BFF"/>
        </linearGradient>
    </defs>
</svg>

<!-- ============== 顶部导航 ============== -->
<header class="topbar">

/* ============== 计算函数 ============== */

// 计算商品的完整指标
function computeProductMetrics(raw, queryDate) {
    const DAYS_2M = 52;  // 近2个月固定52天
    const DAYS_15 = 15;
    const LAST_YEAR_DAYS = 17;  // 去年取17天
    const LAST_YEAR_DIVISOR = 15;

    // 汇总4个固定仓库的库存
    var currentStock = 0;
    var whDetail = [];
    var whKeys = Object.keys(FIXED_WAREHOUSES);
    for (var i = 0; i < whKeys.length; i++) {
        var wh = whKeys[i];
        var qty = raw.stocks[wh] || 0;
        currentStock += qty;
        if (qty > 0) {
            whDetail.push({ code: wh, name: FIXED_WAREHOUSES[wh], qty: qty });
        }
    }

    // 今年日均销量 = 近2个月总销量 ÷ 52
    var dailyAvgSales = raw.recent2MonthsSales / DAYS_2M;

    // 今年15天平均销量 = 日均销量 × 15
    var recent15DayAvgSales = dailyAvgSales * DAYS_15;

    // 周转率 = 当前可用量 ÷ 今年15天平均销量
    var turnoverRate = recent15DayAvgSales > 0 ? currentStock / recent15DayAvgSales : 0;

    // 周转天数 = 当前可用量 ÷ 日均销量
    var turnoverDays = dailyAvgSales > 0 ? currentStock / dailyAvgSales : null;

    // 去年日均销量 = 去年同期17天总销量 ÷ 15
    var lastYearDailyAvg = raw.lastYear17DaysSales / LAST_YEAR_DIVISOR;

    // 去年15天平均销量 = 去年日均销量 × 15
    var lastYear15DayAvg = lastYearDailyAvg * DAYS_15;

    // 同比变化率
    var yoyChange = null;
    if (lastYearDailyAvg > 0) {
        yoyChange = (dailyAvgSales - lastYearDailyAvg) / lastYearDailyAvg * 100;
    }

    // 积压数量 = 当前可用量 - 今年15天平均销量 (仅当周转率 > 1 时有效)
    var overstockQty = currentStock - recent15DayAvgSales;

    return {
        name: raw.name,
        code: raw.code,
        spec: raw.spec,
        supplier: raw.supplier,
        currentStock: currentStock,
        whDetail: whDetail,
        dailyAvgSales: dailyAvgSales,
        recent2MonthsSales: raw.recent2MonthsSales,
        recent1MonthSales: raw.recent1MonthSales,
        recent15DayAvgSales: recent15DayAvgSales,
        turnoverRate: turnoverRate,
        turnoverDays: turnoverDays,
        lastYear17DaysSales: raw.lastYear17DaysSales,
        lastYearDailyAvg: lastYearDailyAvg,
        lastYear15DayAvg: lastYear15DayAvg,
        yoyChange: yoyChange,
        overstockQty: overstockQty
    };
}

// 获取采购员的完整商品列表（含计算指标）

    var rawList = BUYER_PRODUCTS[buyerName];
    if (!rawList) return null;
    return rawList.map(function(raw) {

    });
}

function parseQuery(query) {
    var q = query.trim();

    // 提取采购员
    var buyers = Object.keys(BUYER_PRODUCTS);
    var matchedBuyer = null;
    for (var i = 0; i < buyers.length; i++) {
        if (q.indexOf(buyers[i]) !== -1) {
            matchedBuyer = buyers[i];
            break;
        }
    }
    if (!matchedBuyer) return null;

    // 提取场景
    var sceneKey = null;
    // 缺货场景关键词
    if (q.indexOf('缺货') !== -1 || q.indexOf('断货') !== -1) {
        sceneKey = 'S02';
    }
    // 进货建议场景关键词
    else if (q.indexOf('进货建议') !== -1 || q.indexOf('补货') !== -1 || q.indexOf('采购建议') !== -1 || q.indexOf('进货') !== -1) {
        sceneKey = 'S03';
    }
    // 周转率场景关键词（默认）
    else if (q.indexOf('周转率') !== -1 || q.indexOf('滞销') !== -1 || q.indexOf('积压') !== -1 || q.indexOf('周转') !== -1) {
        sceneKey = 'S01';
    }
    // 兜底：无场景关键词时默认为周转率场景
    else {
        sceneKey = 'S01';
    }

    return { buyer: matchedBuyer, scene: sceneKey };
}

// 格式化数字
function fmtNum(v, decimals) {
    if (v === null || v === undefined || v === Infinity) return '-';
    decimals = decimals !== undefined ? decimals : 1;
    return Number(v.toFixed(decimals)).toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function fmtPct(v) {
    if (v === null || v === undefined) return '-';
    var prefix = v > 0 ? '+' : '';
    return prefix + v.toFixed(1) + '%';
}

function fmtInt(v) {
    if (v === null || v === undefined) return '-';
    return Math.round(v).toLocaleString();
}

            if (meta && meta.thinking && meta.thinking.length) {
                var tDiv = document.createElement('div');
                tDiv.className = 'ai-thinking';
                for (var i = 0; i < 3; i++) {
                    var dot = document.createElement('span');
                    dot.className = 'thinking-dot';
                    tDiv.appendChild(dot);
                }
                var tSpan = document.createElement('span');
                tSpan.style.marginLeft = '4px';
                tSpan.textContent = meta.thinking[meta.thinking.length - 1];
                tDiv.appendChild(tSpan);
                bubble.appendChild(tDiv);
            }

            if (meta && meta.blocks) {
                for (var i = 0; i < meta.blocks.length; i++) {
                    var el = renderBlock(meta.blocks[i], meta);
                    if (el) bubble.appendChild(el);
                }
            }

            body.appendChild(bubble);
        }

        div.appendChild(avatar);
        div.appendChild(body);
        return div;
    }

    function renderBlock(block, meta) {
        var div = document.createElement('div');
        div.className = 'fade-in';

        switch (block.type) {
        case 'route': {
            div.className += ' route-info';
            div.innerHTML = '<span class="route-ico">' + (block.icon || '→') + '</span> ' + block.text;
            return div;
        }
        case 'p': {
            div.innerHTML = '<p>' + block.text + '</p>';
            return div;
        }
        case 'scene-badge': {
            div.innerHTML = '<div class="scene-badge ' + block.cls + '">' + block.icon + ' ' + block.label + '</div>';
            return div;
        }
        case 'buyer-banner': {
            var b = block.buyer;
            div.innerHTML = '<div class="buyer-banner">' +
                '<div class="buyer-avatar" style="background:' + block.avatarColor + '">' + b.name[0] + '</div>' +
                '<div class="buyer-info">' +
                    '<div class="buyer-name">' + b.name + ' · 负责商品</div>' +
                    '<div class="buyer-detail">' + b.productCount + ' 个商品 · ' + b.warehouseDesc + '</div>' +
                '</div>' +
            '</div>';
            return div;
        }
        case 'wh-tags': {
            var whHtml = '';
            for (var i = 0; i < block.whList.length; i++) {
                var wh = block.whList[i];
                var c = WH_COLORS[wh.code] || { bg: '#F3F4F6', color: '#6B7280' };
                whHtml += '<span class="wh-tag" style="background:' + c.bg + ';color:' + c.color + '">' + wh.name + '</span>';
            }
            div.innerHTML = '<div class="wh-list">' + whHtml + '</div>';
            return div;
        }
        case 'kpis': {
            div.className += ' fade-in-stagger';
            var grid = document.createElement('div');
            grid.className = 'kpi-grid';
            for (var i = 0; i < block.items.length; i++) {
                var it = block.items[i];
                var k = document.createElement('div');
                k.className = 'kpi ' + (it.kind || '');
                var deltaHtml = '';
                if (it.delta) {
                    var dirCls = it.delta.dir === 'up' ? 'up' : (it.delta.dir === 'dn' ? 'dn' : 'warn');
                    var arrow = it.delta.dir === 'up' ? '▲' : (it.delta.dir === 'dn' ? '▼' : '●');
                    deltaHtml = '<div class="kpi-delta ' + dirCls + '">' + arrow + ' ' + it.delta.text + '</div>';
                }
                k.innerHTML = '<div class="kpi-label">' + it.label + '</div><div class="kpi-value">' + it.value + '<span class="unit">' + it.unit + '</span></div>' + deltaHtml;
                grid.appendChild(k);
            }
            div.appendChild(grid);
            return div;
        }
        case 'table': {
            var wrap = document.createElement('div');
            wrap.className = 'tbl-wrap';
            var pageSize = block.pageSize || block.rows.length;
            var totalRows = block.rows.length;
            var totalPages = Math.ceil(totalRows / pageSize);
            var currentPage = 1;
            var allRows = block.rows;
            var expandedAll = false;

            function renderTable(page, expanded) {
                var rowsToShow;
                if (expanded) {
                    rowsToShow = allRows;
                } else {
                    var start = (page - 1) * pageSize;
                    rowsToShow = allRows.slice(start, start + pageSize);
                }

                var headHtml = '';
                if (block.title) {
                    headHtml = '<div class="tbl-head-bar"><div class="tbl-title">' + block.title + '</div><div class="tbl-act"><button class="tbl-dl-btn" title="下载 Excel">📥 下载</button><button class="tbl-expand-btn">' + (expanded ? '收起' : '查看全部') + '</button></div></div>';
                }
                var colHtml = '<tr>';
                for (var i = 0; i < block.columns.length; i++) {
                    var c = block.columns[i];
                    colHtml += '<th' + (c.cls ? ' class="' + c.cls + '"' : '') + (c.w ? ' style="width:' + c.w + 'px"' : '') + '>' + c.label + '</th>';
                }
                colHtml += '</tr>';

                var rowHtml = '';
                for (var i = 0; i < rowsToShow.length; i++) {
                    var r = rowsToShow[i];
                    rowHtml += '<tr>';
                    for (var j = 0; j < block.columns.length; j++) {
                        var c = block.columns[j];
                        var val = r[c.k];
                        if (val === undefined || val === null) {
                            rowHtml += '<td></td>';
                        } else if (typeof val === 'object' && val !== null && ('v' in val || 'cls' in val || 'name' in val)) {
                            if (val.name) {
                                rowHtml += '<td><div class="sku-name">' + val.name + '</div></td>';
                            } else {
                                rowHtml += '<td class="num ' + (val.cls || '') + '">' + (val.v !== undefined ? val.v : '') + '</td>';
                            }
                        } else {
                            rowHtml += '<td' + (c.cls ? ' class="' + c.cls + '"' : '') + '>' + String(val) + '</td>';
                        }
                    }
                    rowHtml += '</tr>';
                }

                var footHtml = '';
                if (totalPages > 1) {
                    var pageBtns = '';
                    for (var p = 1; p <= totalPages; p++) {
                        pageBtns += '<button class="tbl-page-btn' + (p === page && !expanded ? ' active' : '') + '" data-page="' + p + '">' + p + '</button>';
                    }
                    footHtml = '<div class="tbl-foot"><span>共 ' + totalRows + ' 条结果' + (!expanded ? ' · 第 ' + page + '/' + totalPages + ' 页' : ' · 全部展开') + '</span><span>' + pageBtns + '</span></div>';
                } else if (block.foot) {
                    footHtml = '<div class="tbl-foot"><span>' + (block.foot.left || '') + '</span><span>' + (block.foot.right || '') + '</span></div>';
                }

                wrap.innerHTML = headHtml + '<div class="tbl-scroll"><table class="tbl"><thead>' + colHtml + '</thead><tbody>' + rowHtml + '</tbody></table></div>' + footHtml;

                var expandBtn = wrap.querySelector('.tbl-expand-btn');
                if (expandBtn) {
                    expandBtn.addEventListener('click', function() {
                        expandedAll = !expandedAll;
                        renderTable(currentPage, expandedAll);
                    });
                }

                var dlBtn = wrap.querySelector('.tbl-dl-btn');
                if (dlBtn) {
                    dlBtn.addEventListener('click', function() {
                        downloadExcel(block, allRows);
                    });
                }

                var pageBtns = wrap.querySelectorAll('.tbl-page-btn');
                for (var i = 0; i < pageBtns.length; i++) {
                    (function(btn) {
                        btn.addEventListener('click', function() {
                            currentPage = parseInt(btn.dataset.page);
                            expandedAll = false;
                            renderTable(currentPage, false);
                        });
                    })(pageBtns[i]);
                }
            }

            renderTable(currentPage, false);
            return wrap;
        }
        case 'formula': {
            var card = document.createElement('div');
            card.className = 'formula-card';
            if (block.collapsed) card.classList.add('collapsed');
            var stepsHtml = '';
            for (var i = 0; i < block.steps.length; i++) {
                var s = block.steps[i];
                stepsHtml += '<div class="formula-step"><div class="fs-num">' + (i + 1) + '</div><div class="fs-body">' + s.body + '</div></div>';
            }
            card.innerHTML = '<div class="formula-head">🧮 ' + (block.title || '计算逻辑') + '<span class="fh-toggle">▼</span></div><div class="formula-body">' + stepsHtml + '</div>' + (block.foot ? '<div class="formula-foot">' + block.foot + '</div>' : '');
            card.querySelector('.formula-head').addEventListener('click', function() {
                card.classList.toggle('collapsed');
            });
            return card;
        }
        case 'advise': {
            var card = document.createElement('div');
            card.className = 'advise-card';
            var itemsHtml = '';
            for (var i = 0; i < block.items.length; i++) {
                var it = block.items[i];
                itemsHtml += '<div class="advise-item"><div class="ai-prio ' + it.prio.toLowerCase() + '">' + it.prio + '</div><div class="ai-body"><div class="ai-title">' + it.title + '</div><div class="ai-desc">' + it.desc + '</div></div></div>';
            }
            card.innerHTML = '<div class="advise-head">' + (block.title || '💡 经营建议') + '</div><div class="advise-body">' + itemsHtml + '</div>';
            return card;
        }
        case 'alert': {
            div.className += ' fade-in';
            var alertEl = document.createElement('div');
            alertEl.className = 'alert ' + block.kind;
            alertEl.innerHTML = '<div class="alert-ico">' + (block.icon || '!') + '</div><div><div class="alert-title">' + block.title + '</div><div class="alert-desc">' + block.desc + '</div></div>';
            return alertEl;
        }
        case 'fallback-grid': {
            var grid = document.createElement('div');
            grid.className = 'suggest-grid';
            grid.style.marginTop = '8px';
            var suggestions = [
                { tag:'周转率场景', tagCls:'background:#FEE2E2;color:#991B1B', title:'查看张杰的周转率情况', sub:'张杰负责商品中周转率 > 1 的滞销分析' },
                { tag:'缺货场景', tagCls:'background:#FEF3C7;color:#92400E', title:'查看张杰的缺货情况', sub:'张杰负责商品中库存=0且月销量>50的缺货预警' },
                { tag:'进货建议场景', tagCls:'background:#D1FAE5;color:#065F46', title:'查看张杰的进货建议', sub:'张杰负责商品中周转率 < 1 的进货关注' }
            ];
            for (var i = 0; i < suggestions.length; i++) {
                var s = suggestions[i];
                var btn = document.createElement('button');
                btn.className = 'suggest-card';
                btn.dataset.q = s.title;
                btn.innerHTML = '<div class="sc-tag" style="' + s.tagCls + '">' + s.tag + '</div><div class="sc-title">' + s.title + '</div><div class="sc-sub">' + s.sub + '</div>';
                (function(q) {
                    btn.addEventListener('click', function() { submitQuery(q); });
                })(s.title);
                grid.appendChild(btn);
            }
            return grid;
        }
        default: return null;
        }
    }

    /* ──── 生成场景响应数据 ──── */
    function buildSceneResponse(buyerName, sceneKey, products) {
        var scene = SCENE_INFO[sceneKey];
        var filtered = [];
        for (var i = 0; i < products.length; i++) {
            if (scene.filter(products[i])) {
                filtered.push(products[i]);
            }
        }

        // 排序
        filtered.sort(function(a, b) {
            var va = a[scene.sortKey] || 0;
            var vb = b[scene.sortKey] || 0;
            return scene.sortDir === 'desc' ? vb - va : va - vb;
        });

        var blocks = [];

        // Table - all three scenes share same columns
        // 场景对应的标题
        var tableTitleMap = { S01: '周转分析综合表', S02: '缺货分析综合表', S03: '进货建议综合表' };

        var tableColumns = [
            { k:'rk', label:'#', w:38 },
            { k:'name', label:'商品名称', w:200 },
            { k:'turnoverRate', label:'周转率', cls:'num' },
            { k:'currentStock', label:'当前可用量', cls:'num' },
            { k:'recent1MonthSales', label:'近1个月销量', cls:'num' },
            { k:'recent15DayAvgSales', label:'今年15天平均销量', cls:'num' },
            { k:'lastYear15DayAvg', label:'去年15天平均销量', cls:'num' },
            { k:'yoyChange', label:'同比', cls:'num' },
            { k:'overstockQty', label:'积压数量', cls:'num' }
        ];

        var tableRows = [];
        for (var i = 0; i < filtered.length; i++) {
            var p = filtered[i];
            var trCls = '';
            if (p.turnoverRate > 1) trCls = 'danger-cell';
            else if (p.turnoverRate < 1 && p.currentStock === 0) trCls = 'danger-cell';
            else if (p.turnoverRate < 1) trCls = 'success-cell';

            var yoyDisplay = '-';
            if (p.yoyChange !== null) {
                yoyDisplay = { v: fmtPct(p.yoyChange), cls: p.yoyChange > 0 ? 'success-cell' : (p.yoyChange < 0 ? 'danger-cell' : '') };
            } else {
                yoyDisplay = { v: '去年无销量', cls: 'muted-cell' };
            }

            var overstockDisplay = '-';
            if (p.turnoverRate > 1) {
                overstockDisplay = { v: fmtNum(p.overstockQty, 0), cls: 'danger-cell' };
            } else {
                overstockDisplay = { v: '-', cls: 'muted-cell' };
            }

            var turnRateDisplay = { v: fmtNum(p.turnoverRate), cls: p.turnoverRate > 1 ? 'danger-cell' : (p.turnoverRate < 1 ? 'success-cell' : '') };

            tableRows.push({
                rk: i + 1,
                name: { name: p.name },
                turnoverRate: turnRateDisplay,
                currentStock: { v: fmtInt(p.currentStock), cls: p.currentStock === 0 ? 'danger-cell' : '' },
                recent1MonthSales: { v: fmtInt(p.recent1MonthSales), cls: '' },
                recent15DayAvgSales: { v: fmtNum(p.recent15DayAvgSales, 0) },
                lastYear15DayAvg: { v: fmtNum(p.lastYear15DayAvg, 0) },
                yoyChange: yoyDisplay,
                overstockQty: overstockDisplay
            });
        }

        blocks.push({
            type: 'table',
            title: tableTitleMap[sceneKey],
            pageSize: 10,
            columns: tableColumns,
            rows: tableRows,
            foot: null
        });

        // 经营建议
        if (filtered.length > 0) {
            var adviseItems = [];
            if (sceneKey === 'S01') {
                var totalOverstock = 0;
                for (var oi = 0; oi < filtered.length; oi++) {
                    if (filtered[oi].turnoverRate > 1) totalOverstock += filtered[oi].overstockQty;
                }
                adviseItems.push({
                    prio: 'P0',
                    title: buyerName + ' · 滞销商品共 ' + filtered.length + ' 个，积压 ' + fmtInt(totalOverstock) + ' 件',
                    desc: '建议按周转率从高到低逐一评估，对排名靠前的商品启动促销或调拨计划，减少积压库存。'
                });
            } else if (sceneKey === 'S02') {
                adviseItems.push({
                    prio: 'P0',
                    title: buyerName + ' · 缺货商品共 ' + filtered.length + ' 个，优先补货',
                    desc: '近1个月销量较高的缺货商品影响最大，建议立即向供应商下单或从其他仓库调拨补货。'
                });
            } else if (sceneKey === 'S03') {
                // 为进货建议生成更真实的建议
                // 按周转率从低到高（已排序），取排名靠前的商品
                var top3 = filtered.slice(0, Math.min(3, filtered.length));
                for (var t = 0; t < top3.length; t++) {
                    var tp = top3[t];
                    var dailyNeed = tp.recent15DayAvgSales / 15; // 日均消耗
                    var daysLeft = tp.currentStock > 0 && dailyNeed > 0 ? (tp.currentStock / dailyNeed) : 0;
                    var suggestQty = Math.ceil(tp.recent15DayAvgSales * 1.5); // 建议进货量 = 15天平均的1.5倍
                    var prioLabel = t === 0 ? 'P0' : (t === 1 ? 'P1' : 'P2');
                    var titleText = tp.name + ' · 建议进货 ' + suggestQty + ' 件';
                    var descText = '当前可用量 <b>' + fmtInt(tp.currentStock) + '</b> 件，近1个月销量 <b>' + fmtInt(tp.recent1MonthSales) + '</b> 件，15天平均销量 <b>' + fmtNum(tp.recent15DayAvgSales, 0) + '</b> 件。';
                    if (daysLeft > 0 && daysLeft < 30) {
                        descText += '预计可支撑约 <b>' + fmtNum(daysLeft, 0) + '</b> 天，建议尽快安排进货。';
                    } else if (tp.currentStock === 0) {
                        descText += '当前库存为 <b>0</b>，需紧急补货。';
                    } else {
                        descText += '建议关注库存消耗节奏，提前安排进货。';
                    }
                    adviseItems.push({
                        prio: prioLabel,
                        title: titleText,
                        desc: descText
                    });
                }
            }
            blocks.push({
                type: 'advise',
                title: '💡 ' + buyerName + ' · 经营建议',
                items: adviseItems
            });
        }

        // 计算逻辑面板 - 展示所有PRD定义的计算公式
        var formulaSteps = buildFormulaSteps(buyerName, sceneKey, filtered, products);
        blocks.push({
            type: 'formula',
            title: '🧮 完整计算逻辑（PRD公式参考）',
            collapsed: true,
            steps: formulaSteps,
            foot: '⚙ 全局口径：销量 = 出库数量（退货不计入）；库存 = 可用量（仅固定仓库01/03/04/05）；多仓库存按商品编号汇总展示一条'
        });

        return blocks;
    }

    /* ──── 构建计算逻辑步骤（开发/测试参考） ──── */
    function buildFormulaSteps(buyerName, sceneKey, filtered, allProducts) {
        var steps = [];
        var scene = SCENE_INFO[sceneKey];
        var example1 = filtered.length > 0 ? filtered[0] : allProducts[0];

        // 1. 仓库取值逻辑
        steps.push({
            body: '<b>📌 一、仓库取值逻辑</b><br/>' +
                  '仅查询以下4个固定仓库的库存数据：<br/>' +
                  '<table style="width:100%;border-collapse:collapse;margin-top:4px;font-size:12px">' +
                  '<tr style="background:#F3F4F6"><td style="padding:3px 6px;border:1px solid #E5E7EB"><b>仓库编码</b></td><td style="padding:3px 6px;border:1px solid #E5E7EB"><b>仓库名称</b></td></tr>' +
                  '<tr><td style="padding:3px 6px;border:1px solid #E5E7EB">01</td><td style="padding:3px 6px;border:1px solid #E5E7EB">发货区</td></tr>' +
                  '<tr><td style="padding:3px 6px;border:1px solid #E5E7EB">03</td><td style="padding:3px 6px;border:1px solid #E5E7EB">奥州外仓</td></tr>' +
                  '<tr><td style="padding:3px 6px;border:1px solid #E5E7EB">04</td><td style="padding:3px 6px;border:1px solid #E5E7EB">三农外仓</td></tr>' +
                  '<tr><td style="padding:3px 6px;border:1px solid #E5E7EB">05</td><td style="padding:3px 6px;border:1px solid #E5E7EB">西库一楼</td></tr>' +
                  '</table>' +
                  '· 非固定仓库库存不参与计算、不展示<br/>' +
                  '· 同一商品在多个固定仓库有库存时，按商品编号汇总库存<br/>' +
                  '· 列表展示：同一商品编号只展示一条，不按仓库拆分多条<br/>' +
                  '· 商品只在非固定仓库有库存 → 不参与计算'
        });

        // 2. 查询逻辑（筛选规则）
        var filterDesc = '';
        if (sceneKey === 'S01') {
            filterDesc = '只展示 <b>周转率 > 1</b> 的商品（15天卖不完，存在滞销/积压风险）';
        } else if (sceneKey === 'S02') {
            filterDesc = '只展示 <b>近1个月销量 > 50</b> 且 <b>当前可用量 = 0</b> 的商品';
        } else if (sceneKey === 'S03') {
            filterDesc = '只展示 <b>周转率 < 1</b> 的商品（当前库存小于15天平均销量，可做进货关注）';
        }
        steps.push({
            body: '<b>📌 二、查询逻辑（筛选规则）</b><br/>' +
                  '查询对象：按单个采购员查询（当前：<b>' + buyerName + '</b>）<br/>' +
                  '当前场景：<b>' + scene.label + '</b><br/>' +
                  '筛选条件：' + filterDesc + '<br/>' +
                  '· 未识别采购员 → 不执行查询，提示用户补充采购员<br/>' +
                  '· 商品停用/下架 → 不计入排序<br/>' +
                  '· 退货不计入销量'
        });

        // 3. 排序规则
        var sortDesc = '';
        if (sceneKey === 'S01') {
            sortDesc = '按 <b>周转率从高到低</b> 排序 → 周转率越高，库存越多，15天越卖不完，滞销风险越高，排在前面';
        } else if (sceneKey === 'S02') {
            sortDesc = '按 <b>近1个月销量从高到低</b> 排序 → 近1个月销量越高，库存为0时影响越大，排在前面';
        } else if (sceneKey === 'S03') {
            sortDesc = '按 <b>周转率从低到高</b> 排序 → 周转率越低，当前库存相对15天销量越少，越需要采购关注，排在前面';
        }
        steps.push({
            body: '<b>📌 三、排序规则</b><br/>' +
                  '当前场景：<b>' + scene.label + '</b><br/>' +
                  '排序方式：' + sortDesc
        });

        // 4. 近2个月总销量
        steps.push({
            body: '<b>📌 四、近2个月总销量</b><br/>' +
                  '公式：近2个月总销量 = 查询日期往前推2个月范围内的出库数量合计<br/>' +
                  '数据来源：销货单统计表（出库数量）<br/>' +
                  '退货规则：退货不计入销量<br/>' +
                  '示例：查询日期 <b>2026.07.10</b> → 统计范围 <b>2026.05.10 - 2026.07.10</b>，共 52 天<br/>' +
                  '示例商品「' + example1.name + '」：近2个月总销量 = <b class="ans">' + fmtInt(example1.recent2MonthsSales) + '</b>'
        });

        // 5. 今年日均销量 → 今年15天平均销量 → 周转率
        var exDaily = example1.recent2MonthsSales / 52;
        var ex15 = exDaily * 15;
        steps.push({
            body: '<b>📌 五、今年日均销量</b><br/>' +
                  '公式：今年日均销量 = 近2个月总销量 ÷ 52天<br/>' +
                  '示例商品「' + example1.name + '」：' + fmtInt(example1.recent2MonthsSales) + ' ÷ 52 = <b class="ans">' + fmtNum(exDaily) + '</b> 件/天<br/><br/>' +
                  '<b>今年15天平均销量</b> = 今年日均销量 × 15天<br/>' +
                  '示例商品：' + fmtNum(exDaily) + ' × 15 = <b class="ans">' + fmtNum(ex15) + '</b> 件'
        });

        // 6. 周转率 + 周转天数
        var exTurnRate = example1.turnoverRate;
        var exTurnDays = example1.turnoverDays;
        var turnDaysText = exTurnDays !== null ? fmtNum(exTurnDays, 0) + ' 天' : '无销量';
        steps.push({
            body: '<b>📌 六、周转率 & 周转天数</b><br/>' +
                  '<b>周转率</b> = 当前可用量 ÷ 今年15天平均销量<br/>' +
                  '示例商品「' + example1.name + '」：' + fmtInt(example1.currentStock) + ' ÷ ' + fmtNum(ex15) + ' = <b class="ans">' + fmtNum(exTurnRate) + '</b><br/>' +
                  '· 周转率 > 1 → 滞销/积压风险 &nbsp; · 周转率 < 1 → 可做进货关注<br/><br/>' +
                  '<b>周转天数</b> = 当前可用量 ÷ 今年日均销量<br/>' +
                  '示例商品：' + fmtInt(example1.currentStock) + ' ÷ ' + fmtNum(exDaily) + ' = <b class="ans">' + turnDaysText + '</b>'
        });

        // 7. 积压数量
        var exOverstock = example1.overstockQty;
        var overstockText = exTurnRate > 1
            ? '示例商品「' + example1.name + '」：' + fmtInt(example1.currentStock) + ' − ' + fmtNum(ex15) + ' = <b class="ans">' + fmtNum(exOverstock) + '</b> 件（积压）'
            : '示例商品「' + example1.name + '」：周转率 = ' + fmtNum(exTurnRate) + '，≤ 1，积压数量不适用';
        steps.push({
            body: '<b>📌 七、积压数量</b><br/>' +
                  '公式：积压数量 = 当前可用量 − 今年15天平均销量<br/>' +
                  '展示条件：仅当 周转率 > 1 时展示<br/>' +
                  overstockText
        });

        // 8. 近1个月销量
        steps.push({
            body: '<b>📌 八、近1个月销量（缺货场景使用）</b><br/>' +
                  '公式：近1个月销量 = 查询日期往前1个月范围内的出库数量合计<br/>' +
                  '示例商品「' + example1.name + '」：近1个月销量 = <b class="ans">' + fmtInt(example1.recent1MonthSales) + '</b>'
        });

        // 9. 同比
        var exLastDaily = example1.lastYearDailyAvg;
        var exLast15 = example1.lastYear15DayAvg;
        var exYoy = example1.yoyChange;
        var yoyText = exYoy !== null
            ? '示例商品「' + example1.name + '」：(' + fmtNum(exDaily) + ' − ' + fmtNum(exLastDaily) + ') ÷ ' + fmtNum(exLastDaily) + ' × 100% = <b class="ans">' + fmtPct(exYoy) + '</b>'
            : '示例商品「' + example1.name + '」：去年日均销量为0，同比展示为「去年无销量」';
        steps.push({
            body: '<b>📌 九、同比变化率</b><br/>' +
                  '<b>去年日均销量</b> = 去年同期当天往后推17天的总销量 ÷ 15天<br/>' +
                  '<b>去年15天平均销量</b> = 去年日均销量 × 15天<br/>' +
                  '<b>同比变化率</b> = (今年日均销量 − 去年日均销量) ÷ 去年日均销量 × 100%<br/>' +
                  '去年无销量时：同比展示为「去年无销量」<br/>' +
                  yoyText
        });

        return steps;
    }

    /* ──── 提交查询 ──── */
    function submitQuery(query) {
        if (!query || !query.trim()) return;
        if (dom.welcome && !dom.welcome.classList.contains('hidden')) {
            dom.welcome.classList.add('hidden');
        }

        var inner = dom.chatStream.querySelector('.chat-stream-inner');
        if (!inner) {
            var wrapper = document.createElement('div');
            wrapper.className = 'chat-stream-inner';
            dom.chatStream.appendChild(wrapper);
        }
        var target = dom.chatStream.querySelector('.chat-stream-inner');

        var userMeta = { time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) };
        target.appendChild(renderMsg('user', query, userMeta));

        setTimeout(function() {
            var parsed = parseQuery(query);

            if (parsed) {
                var products = getBuyerProducts(parsed.buyer);
                if (products) {
                    var blocks = buildSceneResponse(parsed.buyer, parsed.scene, products);
                    var scene = SCENE_INFO[parsed.scene];
                    var aiMeta = {
                        route: '采购员分析 · ' + scene.label,
                        thinking: ['识别采购员：' + parsed.buyer, '匹配场景：' + scene.label, '计算 ' + parsed.buyer + ' 负责商品各项指标', '按 ' + scene.sortKey + ' ' + (scene.sortDir === 'desc' ? '降序' : '升序') + ' 排序', '生成综合视图'],
                        blocks: blocks,
                        time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
                    };
                    target.appendChild(renderMsg('ai', '', aiMeta));
                    if (dom.chatTitle) dom.chatTitle.textContent = '周转分析智能体 · ' + parsed.buyer;
                } else {
                    // 采购员数据不存在（不应发生，但兜底）
                    var fbBlocks = [
                        { type: 'route', text: '未找到采购员 <b>' + parsed.buyer + '</b> 的商品数据', icon: '⚠' },
                        { type: 'alert', kind: 'warning', icon: '⚠', title: '暂无数据', desc: '当前系统中未找到采购员「' + parsed.buyer + '」负责的商品数据。' },
                        { type: 'fallback-grid' }
                    ];
                    var aiMeta = {
                        route: '采购员分析',
                        thinking: ['未找到采购员数据'],
                        blocks: fbBlocks,
                        time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
                    };
                    target.appendChild(renderMsg('ai', '', aiMeta));
                }
            } else {
                // 未识别采购员
                var fbBlocks = [
                    { type: 'route', text: '未识别到采购员，请补充采购员名称', icon: '⚠' },
                    { type: 'alert', kind: 'warning', icon: '⚠', title: '未识别采购员', desc: '请在查询中包含采购员名称，例如：<b>张杰</b>、<b>付超英</b>、<b>刘洋</b>、<b>任情情</b>。<br/><br/>支持场景：<br/>• <b>周转率场景</b>：查看[采购员]的周转率情况 / 滞销分析<br/>• <b>缺货场景</b>：查看[采购员]的缺货情况<br/>• <b>进货建议场景</b>：查看[采购员]的进货建议 / 补货建议' },
                    { type: 'p', text: '💡 试试以下查询：' },
                    { type: 'fallback-grid' }
                ];
                var aiMeta = {
                    route: '采购员分析',
                    thinking: ['解析查询参数', '未识别采购员', '提示用户补充采购员'],
                    blocks: fbBlocks,
                    time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
                };
                target.appendChild(renderMsg('ai', '', aiMeta));
            }

            setTimeout(function() {
                dom.chatStream.scrollTop = dom.chatStream.scrollHeight;
            }, 100);
        }, 600);

        setTimeout(function() {
            dom.chatStream.scrollTop = dom.chatStream.scrollHeight;
        }, 100);

        dom.chatInput.value = '';
        dom.chatInput.style.height = 'auto';

        addHistoryItem(query);
    }

    function addHistoryItem(query) {
        var shortTitle = query.length > 22 ? query.slice(0,22) + '…' : query;
        var icon = '🛒';

        var item = document.createElement('div');
        item.className = 'h-item';
        item.dataset.query = query;
        item.innerHTML = '<span class="h-ico">' + icon + '</span><span class="h-title">' + shortTitle + '</span><input class="h-edit-input" value="' + query.replace(/"/g, '&quot;') + '" style="display:none" /><span class="h-actions"><button class="h-rename" title="重命名">✎</button><button class="h-del" title="删除">✕</button></span>';
        item.title = query;

        item.querySelector('.h-title').addEventListener('click', function() {
            dom.welcome.classList.add('hidden');
            submitQuery(query);
        });
        item.querySelector('.h-ico').addEventListener('click', function() {
            dom.welcome.classList.add('hidden');
            submitQuery(query);
        });

        item.querySelector('.h-rename').addEventListener('click', function(e) {
            e.stopPropagation();
            startRename(item);
        });

        item.querySelector('.h-del').addEventListener('click', function(e) {
            e.stopPropagation();
            item.style.opacity = '0';
            item.style.transform = 'translateX(-12px)';
            item.style.transition = 'all .2s';
            setTimeout(function() { item.remove(); updateHistoryCount(); }, 200);
        });

        var firstItem = dom.historyList.firstChild;
        if (firstItem) {
            dom.historyList.insertBefore(item, firstItem);
        } else {
            dom.historyList.appendChild(item);
        }
        updateHistoryCount();
    }

    function startRename(item) {
        var titleSpan = item.querySelector('.h-title');
        var input = item.querySelector('.h-edit-input');
        item.classList.add('editing');
        input.style.display = 'block';
        input.value = item.dataset.query;
        input.focus();
        input.select();

        var finish = function() {
            var newVal = input.value.trim();
            if (newVal) {
                item.dataset.query = newVal;
                titleSpan.textContent = newVal.length > 22 ? newVal.slice(0,22) + '…' : newVal;
                item.title = newVal;
            }
            item.classList.remove('editing');
            input.style.display = 'none';
        };

        input.addEventListener('blur', finish);
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
            if (e.key === 'Escape') { input.value = item.dataset.query; input.blur(); }
        });
    }

    function updateHistoryCount() {
        var count = dom.historyList.querySelectorAll('.h-item').length;
        var el = document.querySelector('.hs-count');
        if (el) el.textContent = count;
    }

    /* ──── 下载 Excel ──── */
    function downloadExcel(block, rows) {
        // 下载时排除序号列(rk)
        var dlColumns = [];
        for (var di = 0; di < block.columns.length; di++) {
            if (block.columns[di].k !== 'rk') {
                dlColumns.push(block.columns[di]);
            }
        }

        var csv = '﻿';
        for (var i = 0; i < dlColumns.length; i++) {
            var c = dlColumns[i];
            csv += (c.label || c.k || '');
            if (i < dlColumns.length - 1) csv += ',';
        }
        csv += '\n';

        for (var i = 0; i < rows.length; i++) {
            var r = rows[i];
            for (var j = 0; j < dlColumns.length; j++) {
                var c = dlColumns[j];
                var v = r[c.k];
                if (v === undefined || v === null) { v = ''; }
                else if (typeof v === 'object' && v !== null) {
                    if (v.name) { v = v.name; }
                    else if (v.v !== undefined) { v = v.v; }
                    else { v = ''; }
                }
                v = String(v);
                if (v.includes(',') || v.includes('"') || v.includes('\n')) {
                    v = '"' + v.replace(/"/g, '""') + '"';
                }
                csv += v;
                if (j < dlColumns.length - 1) csv += ',';
            }
            csv += '\n';
        }

        var blob = new Blob([csv], { type: 'application/vnd.ms-excel;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        var title = (block.title || 'data').replace(/[^一-龥a-zA-Z0-9]/g, '_');
        a.download = title + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    /* ──── 输入事件 ──── */
    dom.sendBtn.addEventListener('click', function() {
        var q = dom.chatInput.value.trim();
        if (q) submitQuery(q);
    });

    dom.chatInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            var q = dom.chatInput.value.trim();
            if (q) submitQuery(q);
        }
    });

    dom.chatInput.addEventListener('input', function() {
        dom.chatInput.style.height = 'auto';
        dom.chatInput.style.height = Math.min(dom.chatInput.scrollHeight, 160) + 'px';
    });

    /* ──── 新建对话 ──── */
    dom.newChatBtn.addEventListener('click', function() {
        var inner = dom.chatStream.querySelector('.chat-stream-inner');
        if (inner) inner.remove();
        if (dom.welcome) dom.welcome.classList.remove('hidden');
        dom.chatStream.scrollTop = 0;
        dom.chatInput.value = '';
        dom.chatInput.focus();
    });

    /* ──── 快捷指令 ──── */
    dom.quickCmds.querySelectorAll('.qc').forEach(function(btn) {
        btn.addEventListener('click', function() {
            dom.chatInput.value = btn.dataset.q;
            submitQuery(btn.dataset.q);
        });
    });

    /* ──── 建议卡片 ──── */
    document.addEventListener('click', function(e) {
        var card = e.target.closest('.suggest-card');
        if (!card) return;
        var q = card.dataset.q;
        if (q) submitQuery(q);
    });

})();
</script>
