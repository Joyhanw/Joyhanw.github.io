<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>味冠 · 智能补货智能体</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F6F8FB;--bg-soft:#FBFCFE;--card:#FFFFFF;
  --border:#E6EAF0;--border-soft:#EFF2F6;
  --text:#1A2233;--text-2:#4C5670;--text-3:#8B95AB;--text-4:#B4BCC9;
  --primary:#2E6BFF;--primary-soft:#EAF1FF;--primary-grad:linear-gradient(135deg,#2E6BFF 0%,#7B5BFF 100%);
  --success:#10B981;--success-soft:#D1FAE5;
  --warning:#F59E0B;--warning-soft:#FEF3C7;
  --danger:#E5484D;--danger-soft:#FEE2E2;
  --rose:#E5484D;--amber:#F59E0B;--violet:#7B5BFF;--emerald:#10B981;
  --shadow-sm:0 1px 2px rgba(16,24,40,0.04),0 1px 3px rgba(16,24,40,0.04);
  --shadow-md:0 4px 12px rgba(16,24,40,0.05),0 2px 6px rgba(16,24,40,0.04);
  --r-sm:6px;--r-md:10px;--r-lg:14px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg-soft);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button{border:none;background:none;cursor:pointer;font:inherit;color:inherit}
input,textarea{font:inherit;color:inherit;outline:none}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#D7DCE6;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

.topbar{height:56px;background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.topbar-left{display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px}
.logo-name{font-size:16px;font-weight:700;color:var(--text)}
.logo-name span{background:var(--primary-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.role-switcher{display:flex;align-items:center;gap:2px;background:var(--bg);border-radius:8px;padding:2px}
.role-tab{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;color:var(--text-3);transition:all .15s;white-space:nowrap}
.role-tab:hover{color:var(--text)}
.role-tab.active{background:var(--card);color:var(--primary);box-shadow:var(--shadow-sm)}
.topbar-right{display:flex;align-items:center;gap:8px}
.user-avatar{width:28px;height:28px;border-radius:50%;background:var(--primary-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}

.view-chat{display:flex;height:calc(100vh - 56px);background:var(--bg-soft)}
.chat-sidebar{flex:0 0 240px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column}
.new-chat-btn{margin:14px 12px;padding:9px 12px;background:var(--text);color:#fff;border-radius:8px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;transition:all .15s;justify-content:center}
.new-chat-btn:hover{background:#000}
.history-section{flex:1;overflow-y:auto;padding:6px 12px 14px}
.history-section-title{font-size:11px;color:var(--text-3);margin:10px 4px 8px;display:flex;align-items:center;justify-content:space-between}
.hs-count{font-size:10px;background:var(--bg);padding:1px 8px;border-radius:999px}
.history-list{display:flex;flex-direction:column;gap:2px}
.h-item{padding:7px 10px;border-radius:6px;font-size:12.5px;color:var(--text-2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-item:hover{background:var(--border-soft)}
.h-item.active{background:var(--primary-soft);color:var(--primary)}

.chat-main{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-header{padding:10px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:#fff}
.chat-header-left{display:flex;align-items:center;gap:10px}
.agent-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.chat-title{font-size:15px;font-weight:600}
.chat-stream{flex:1;overflow-y:auto;padding:20px 24px}

.welcome{max-width:880px;margin:20px auto;text-align:center;padding:20px 16px}
.welcome-avatar{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,#FFE8E8,#FFF0E8);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:var(--shadow-md)}
.welcome h2{font-size:26px;font-weight:700;margin-bottom:8px}
.welcome>p{font-size:13.5px;color:var(--text-2);line-height:1.8;margin-bottom:24px}
.suggest-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
@media(max-width:900px){.suggest-grid{grid-template-columns:1fr 1fr}}
.suggest-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-md);padding:12px;text-align:left;transition:all .15s;cursor:pointer}
.suggest-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:#FECACA}
.sc-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10.5px;font-weight:500;margin-bottom:6px}
.sc-title{font-size:13px;font-weight:500;line-height:1.4;color:var(--text);margin-bottom:3px}
.sc-sub{font-size:11px;color:var(--text-3);line-height:1.4}
.welcome-foot{font-size:12px;color:var(--text-3);padding-top:14px;border-top:1px solid var(--border-soft)}

.msg{display:flex;gap:14px;margin-bottom:20px;max-width:960px;margin-left:auto;margin-right:auto}
.msg.user{flex-direction:row-reverse}
.msg-avatar{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.msg.user .msg-avatar{background:var(--primary-grad);color:#fff}
.msg.ai .msg-avatar{background:linear-gradient(135deg,#FFE8E8,#FFF0E8);border:1px solid #F5DCDC}
.msg-body{flex:1;min-width:0}
.msg.user .msg-body{text-align:right}
.msg-meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3);margin-bottom:4px}
.msg.user .msg-meta{justify-content:flex-end}
.msg-meta b{color:var(--text-2);font-weight:500}
.tag-ai{background:var(--primary-soft);color:var(--primary);padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600}
.bubble.user-bubble{background:var(--primary);color:#fff;padding:10px 14px;border-radius:14px 14px 4px 14px;display:inline-block;max-width:80%;line-height:1.6;text-align:left}
.bubble.ai-bubble{background:#fff;border:1px solid var(--border);border-radius:4px 14px 14px 14px;padding:14px 16px;line-height:1.7;color:var(--text)}
.bubble.ai-bubble>*+*{margin-top:12px}
.bubble.ai-bubble p{line-height:1.75}
.bubble.ai-bubble strong{color:var(--text);font-weight:600}

.ai-thinking{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#FFF0E8,#FFE8E8);border-radius:8px;padding:7px 12px;font-size:12px;color:var(--text-2);margin-bottom:10px;border:1px solid #F5DCDC}
.thinking-dot{width:6px;height:6px;border-radius:50%;background:var(--danger);animation:blink 1.4s infinite both}
.thinking-dot:nth-child(2){animation-delay:.2s}.thinking-dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

.route-info{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);background:var(--bg);padding:7px 12px;border-radius:6px;border-left:3px solid var(--danger)}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:768px){.kpi-row{grid-template-columns:1fr 1fr}}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px}
.kpi.danger{border-color:#FECACA;background:linear-gradient(180deg,#FFF5F5 0%,#fff 100%)}
.kpi.warning{border-color:#FDE68A;background:linear-gradient(180deg,#FFFBEB 0%,#fff 100%)}
.kpi.success{border-color:#BBF7D0;background:linear-gradient(180deg,#F0FDF4 0%,#fff 100%)}
.kpi-label{font-size:11.5px;color:var(--text-3);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.kpi-value{font-size:22px;font-weight:700;color:var(--text);line-height:1.2}
.kpi-value .unit{font-size:12px;font-weight:500;color:var(--text-3)}

/* 表格 */
.tbl-wrap{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:#fff}
.tbl-head-bar{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:var(--bg-soft);border-bottom:1px solid var(--border-soft)}
.tbl-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{background:var(--bg-soft);text-align:left;padding:7px 10px;font-weight:600;font-size:11.5px;color:var(--text-3);border-bottom:1px solid var(--border-soft);white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--border-soft);vertical-align:middle;white-space:nowrap;color:var(--text-2)}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:"SF Mono","JetBrains Mono",monospace}
.tbl tr:hover td{background:#FAFBFD}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl th.num{text-align:right}
.danger-cell{color:var(--danger)!important;font-weight:600}
.warn-cell{color:var(--warning)!important;font-weight:500}
.success-cell{color:var(--success)!important;font-weight:500}
.badge{display:inline-block;padding:1px 8px;border-radius:4px;font-size:10.5px;font-weight:500}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.warning{background:var(--warning-soft);color:#92400E}
.badge.success{background:var(--success-soft);color:#065F46}
.badge.info{background:#E0E7FF;color:#4338CA}
.sku-name{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sku-name-inner{font-weight:500;color:var(--text)}
.sku-code{font-size:10px;color:var(--text-3)}
.tbl-foot{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--bg-soft);border-top:1px solid var(--border-soft);font-size:11.5px;color:var(--text-3)}

/* 可折叠模块 */
.details-module{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:var(--card)}
.details-module>summary{padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;user-select:none;background:var(--bg-soft);border-bottom:1px solid var(--border-soft)}
.details-module>summary::-webkit-details-marker{display:none}
.details-module>summary::after{content:'▼';margin-left:auto;font-size:9px;transition:transform .2s;color:var(--text-3)}
.details-module[open]>summary::after{transform:rotate(180deg)}
.details-module[open]>summary{border-bottom:1px solid var(--border)}
.dm-body{padding:10px 14px;font-size:12px;line-height:1.8;color:var(--text-2)}
.dm-body .formula-item{margin-bottom:6px}
.dm-body .formula-item:last-child{margin-bottom:0}
.dm-body .formula-name{font-weight:600;color:var(--text)}
.dm-body .formula-expr{font-family:"SF Mono","JetBrains Mono",monospace;font-size:11px;color:var(--text-2);margin-left:4px}
.dm-body .formula-desc{font-size:11px;color:var(--text-3)}
.dm-body code{background:var(--bg);border:1px solid var(--border-soft);padding:1px 5px;border-radius:3px;font-size:10.5px;color:var(--primary)}
.dm-body .evolve-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10.5px;margin:2px 4px 2px 0}
.dm-body .evolve-tag.metric{background:#E0E7FF;color:#4338CA}
.dm-body .evolve-tag.factor{background:#FEF3C7;color:#92400E}
.dm-body .evolve-tag.direction{background:#D1FAE5;color:#065F46}

/* 推送选择器 */
.send-picker-btn{font-size:12px;padding:6px 14px;border-radius:6px;font-weight:500;background:var(--primary);color:#fff;border:1px solid var(--primary);transition:all .15s}
.send-picker-btn:hover{background:#1E5BD6}
.picker-panel{display:none;margin-top:8px;border:1px solid #C7D5FF;border-radius:var(--r-md);background:linear-gradient(135deg,#F4F8FF,#F0F5FF);padding:10px 14px}
.picker-panel.open{display:block}
.picker-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.picker-chip{padding:6px 12px;border-radius:8px;font-size:11.5px;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px}
.picker-chip:hover{border-color:var(--primary)}
.picker-chip.selected{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.picker-chip .pc-avatar{width:20px;height:20px;border-radius:50%;background:var(--primary-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
.picker-chip .pc-count{font-size:10px;color:var(--text-3)}
.picker-actions{display:flex;gap:6px}
.picker-actions .act-btn{font-size:11.5px}

/* 企业微信卡片 */
.wx-card{border:1px solid #C7D5FF;border-radius:var(--r-md);background:linear-gradient(135deg,#F4F8FF,#F0F5FF);overflow:hidden}
.wx-card-head{padding:9px 14px;background:#EAF1FF;border-bottom:1px solid #C7D5FF;display:flex;align-items:center;justify-content:space-between}
.wx-card-body{padding:10px 14px;font-size:12px;color:var(--text-2);line-height:1.8}
.wx-msg-bubble{background:#fff;border-radius:8px;padding:10px 14px;border:1px solid var(--border-soft);margin:6px 0}
.wx-card-foot{padding:7px 14px;background:#fff;border-top:1px solid #C7D5FF;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--text-3)}
.wx-status{display:flex;align-items:center;gap:4px}
.wx-status.sent{color:var(--success)}.wx-status.read{color:var(--primary)}

/* 回看报告 */
.recheck-card{border:1px solid #BBF7D0;border-radius:var(--r-md);background:linear-gradient(135deg,#F0FDF4,#F5FFF8);overflow:hidden}
.recheck-head{padding:9px 14px;background:#D1FAE5;border-bottom:1px solid #BBF7D0;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.recheck-body{padding:12px 14px;font-size:12px;color:var(--text-2);line-height:1.8}
.recheck-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.recheck-stat{text-align:center;padding:8px;border-radius:8px}
.recheck-stat.good{background:#D1FAE5;color:#065F46}
.recheck-stat.warn{background:#FEF3C7;color:#92400E}
.recheck-stat.bad{background:#FEE2E2;color:#991B1B}
.recheck-stat .rs-num{font-size:22px;font-weight:700}
.recheck-stat .rs-label{font-size:10.5px;margin-top:1px}

/* AI跟踪报告 */
.track-card{border:1px solid #D8B4FE;border-radius:var(--r-md);background:linear-gradient(135deg,#FAF5FF,#FDFAFF);overflow:hidden}
.track-head{padding:9px 14px;background:#F3E8FF;border-bottom:1px solid #D8B4FE;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.track-body{padding:12px 14px;font-size:12px;color:var(--text-2);line-height:1.8}
.track-section{margin-top:10px;border-top:1px solid #E9D5FF;padding-top:8px}
.track-section:first-child{margin-top:0;border-top:none;padding-top:0}
.track-section h4{font-size:12.5px;font-weight:600;color:var(--text);margin-bottom:4px}
.evolve-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:500;background:#E0E7FF;color:#4338CA;margin:1px 3px 1px 0}

/* 规则卡片 */
.rule-card{border:1px solid #D8B4FE;border-radius:var(--r-md);background:linear-gradient(135deg,#FAF5FF,#F5F0FF);overflow:hidden}
.rule-card-head{padding:9px 14px;background:#F3E8FF;border-bottom:1px solid #D8B4FE;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text)}
.rule-card-body{padding:10px 14px;font-size:12px;color:var(--text-2);line-height:1.8}
.rule-diff{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:6px 0}
.rule-old,.rule-new{padding:8px 12px;border-radius:6px;text-align:center;font-size:13px;font-weight:600}
.rule-old{background:#FEE2E2;color:#991B1B;text-decoration:line-through}
.rule-new{background:#D1FAE5;color:#065F46}
.rule-arrow{font-size:20px;color:var(--text-3)}

/* 操作按钮 */
.action-row{display:flex;gap:8px;flex-wrap:wrap}
.act-btn{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;border:1px solid var(--border);background:#fff;transition:all .15s}
.act-btn:hover{border-color:var(--primary);color:var(--primary)}
.act-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.act-btn.primary:hover{background:#1E5BD6}
.act-btn.warn{border-color:var(--warning);color:var(--warning)}
.act-btn.warn:hover{background:var(--warning-soft)}
.act-btn.confirm{background:var(--violet);color:#fff;border-color:var(--violet)}
.act-btn.confirm:hover{background:#6D3FD6}
.act-btn.cancel{border:1px solid var(--border);background:#fff;color:var(--text-2)}

/* 告警 */
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-md);font-size:12.5px;line-height:1.7}
.alert.danger{background:var(--danger-soft);color:#991B1B;border:1px solid #FECACA}
.alert.warning{background:var(--warning-soft);color:#92400E;border:1px solid #FDE68A}
.alert.info{background:#E0E7FF;color:#3730A3;border:1px solid #C7D2FE}
.alert-ico{font-size:18px;flex-shrink:0}

/* 输入区 */
.chat-input-bar{padding:12px 24px;border-top:1px solid var(--border);background:#fff}
.chat-input-inner{max-width:960px;margin:0 auto}
.quick-cmds{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.qc{padding:4px 10px;border-radius:6px;font-size:11.5px;color:var(--text-2);border:1px solid var(--border-soft);background:var(--bg-soft);display:flex;align-items:center;gap:4px;transition:all .15s}
.qc:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.input-row{display:flex;align-items:flex-end;gap:8px}
.input-row textarea{flex:1;border:1px solid var(--border);border-radius:10px;padding:9px 14px;resize:none;font-size:13.5px;line-height:1.5;max-height:120px}
.input-row textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.send-btn{width:34px;height:34px;border-radius:8px;background:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.send-btn:hover{background:var(--primary)}
.send-btn svg{stroke:#fff;width:18px;height:18px}
</style>
</head>
<body>

<svg style="display:none"><defs><linearGradient id="lg1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E5484D"/><stop offset="100%" stop-color="#F59E0B"/></linearGradient></defs></svg>

<header class="topbar">
  <div class="topbar-left">
    <div class="logo">
      <svg viewBox="0 0 32 32" width="28" height="28"><path fill="url(#lg1)" d="M16 2 L29 10 L29 22 L16 30 L3 22 L3 10 Z"/><path fill="#fff" opacity="0.95" d="M11 12 Q16 7 21 12 L21 20 Q16 25 11 20 Z"/><circle cx="13.5" cy="15" r="1.2" fill="#E5484D"/><circle cx="18.5" cy="15" r="1.2" fill="#E5484D"/></svg>
      <div class="logo-name">味冠 <span>· 智能补货</span></div>
    </div>
    <div class="role-switcher" id="roleSwitcher"></div>
  </div>
  <div class="topbar-right">
    <div class="user-avatar" id="userAvatar">唯</div>
    <span style="font-size:13px;font-weight:500;color:var(--text)" id="userName">唯安</span>
  </div>
</header>

<main class="view-chat">
  <aside class="chat-sidebar">
    <button class="new-chat-btn" id="newChatBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>新对话
    </button>
    <div class="history-section">
      <div class="history-section-title"><span>对话历史</span><span class="hs-count" id="hsCount">0</span></div>
      <div class="history-list" id="historyList"></div>
    </div>
  </aside>

  <section class="chat-main">
    <div class="chat-header">

/* ============== 场景匹配 ============== */
function matchScenario(query){
  var q=query.trim().toLowerCase();
  for(var i=0;i<SCENARIOS.length;i++){
    var s=SCENARIOS[i];
    if(s.match.indexOf('__fallback__')>=0)continue;
    for(var j=0;j<s.match.length;j++){var m=s.match[j].toLowerCase();if(q===m||q.indexOf(m)>=0||m.indexOf(q)>=0)return s}
  }
  return SCENARIOS.find(function(s){return s.match.indexOf('__fallback__')>=0});
}

/* ============== 提交 ============== */
function submitQuery(query){
  if(!query.trim())return;
  dom.welcome.classList.add('hidden');
  var now=new Date(),ts=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  dom.chatStream.appendChild(renderMsg('user',query,{time:ts}));
  dom.chatInput.value='';dom.chatInput.style.height='auto';
  setTimeout(function(){
    var scenario=matchScenario(query);
    var blocks=scenario.blocks;
    if(scenario.roleBlocks&&scenario.roleBlocks[currentRole]){
      var rb=scenario.roleBlocks[currentRole];
      var newBlocks=[];
      for(var bi=0;bi<blocks.length;bi++){
        var b=blocks[bi];
        if(b.type==='kpis'&&rb.kpis){newBlocks.push({type:'kpis',items:rb.kpis});continue}
        if(b.type==='table'&&rb.table){newBlocks.push(b);newBlocks.push(rb.table);continue}
        if(b.type==='details'&&rb.details){newBlocks.push(rb.details);continue}
        newBlocks.push(b);
      }
      blocks=newBlocks;
      if(rb.extraBlocks)blocks=blocks.concat(rb.extraBlocks);
    }
    var aiMeta={time:new Date().getHours().toString().padStart(2,'0')+':'+new Date().getMinutes().toString().padStart(2,'0'),thinking:scenario.thinking,blocks:blocks};
    dom.chatStream.appendChild(renderMsg('ai','',aiMeta));
    setTimeout(function(){dom.chatStream.scrollTop=dom.chatStream.scrollHeight;bindButtons()},100);
  },600);
  addHistory(query);
}

function addHistory(query){
  historyCount++;dom.hsCount.textContent=historyCount;
  var item=document.createElement('div');item.className='h-item';item.textContent=query.length>20?query.slice(0,20)+'…':query;
  item.addEventListener('click',function(){submitQuery(query)});dom.historyList.prepend(item);
}

        if(roleType==='buyer')itemList='<br><br>📋 <b>缺货清单（'+skus+'个SKU）：</b><br>• 安大100克整条鱿鱼串（黄胶带）— 缺口 8.5 件，可售 1.5 天<br>• 安大35克鱿鱼须串（红胶带）— 缺口 95 件，可售 2.1 天<br>• 川荣香辣鸭胗 — 缺口 69 件，可售 0.8 天<br>• ... 等共'+skus+'个SKU<br><br>📊 <b>汇总：</b>缺口合计 '+skus+' 个SKU<br>💡 <b>建议：</b>请关注补货区间，确认后安排采购<br>—— 智能补货智能体';
        else if(roleType==='warehouse')itemList='<br><br>📋 <b>需核实库存的SKU（'+skus+'个）：</b><br>请核实系统库存与实物是否一致，如有差异请反馈。<br>—— 智能补货智能体';
        else if(roleType==='sales')itemList='<br><br>📋 <b>影响客户预警：</b><br>以上商品缺货可能影响你负责的客户，请视情况告知预计到货时间。<br>—— 智能补货智能体';
        else if(roleType==='finance')itemList='<br><br>📋 <b>缺货损失预警：</b><br>以上缺货涉及金额较大，请关注对本月财务指标的影响。<br>—— 智能补货智能体';
        var wxBlock={type:'wxcard',receiver:{name:name,role:role,avatar:name.charAt(0)},roleType:roleType,content:{title:'🤖 智能补货建议（2026.07.07）',body:msgBody+itemList,link:'查看详情 →'},status:'sent',time:ts};
        cards+=renderBlock(wxBlock);
      });
      var meta={time:new Date().getHours().toString().padStart(2,'0')+':'+new Date().getMinutes().toString().padStart(2,'0'),blocks:[{type:'p',text:'✅ 已推送到 <b>'+names.join('、')+'</b> 的企业微信，消息内容如下：'}]};
      var div=document.createElement('div');div.className='msg ai';
      var av='<div class="msg-avatar"><span style="font-size:18px">⚠️</span></div>';
      var mh='<div class="msg-meta"><b>智能补货智能体</b><span class="tag-ai">AI</span><span>'+meta.time+'</span></div>';
      var bh='<div class="bubble ai-bubble">';
      for(var b=0;b<meta.blocks.length;b++)bh+=renderBlock(meta.blocks[b]);
      bh+=cards+'</div>';
      div.innerHTML=av+'<div class="msg-body">'+mh+bh+'</div>';
      dom.chatStream.appendChild(div);
      wrap.querySelector('.picker-panel').classList.remove('open');
      wrap.querySelectorAll('.picker-chip').forEach(function(c){c.classList.remove('selected')});
      setTimeout(function(){dom.chatStream.scrollTop=dom.chatStream.scrollHeight},100);
    };
  });
  document.querySelectorAll('[data-action="close-picker"]').forEach(function(btn){
    btn.onclick=function(e){e.stopPropagation();var panel=this.closest('.picker-panel');panel.classList.remove('open');panel.querySelectorAll('.picker-chip').forEach(function(c){c.classList.remove('selected')})};
  });
  document.querySelectorAll('[data-action="select-all"]').forEach(function(btn){
    btn.onclick=function(e){
      e.stopPropagation();
      var wrap=this.closest('.send-picker-wrap');
      var chips=wrap.querySelectorAll('.picker-chip');
      var allSelected=true;
      chips.forEach(function(c){if(!c.classList.contains('selected'))allSelected=false});
      chips.forEach(function(c){if(allSelected)c.classList.remove('selected');else c.classList.add('selected')});
      this.textContent=allSelected?'全选':'取消全选';
    };
  });
  // 其他按钮
  document.querySelectorAll('.act-btn[data-handler]').forEach(function(btn){
    btn.onclick=function(){
      var handler=btn.dataset.handler;
      if(handler==='pushWarehouse')submitQuery('推送补货建议给仓库李四');
      else if(handler==='pushSales')submitQuery('推送补货建议给销售张伟');
      else if(handler==='ruleCategory')submitQuery('把串类的缺货提前量调为5天');
      else if(handler==='remindBuyer')showRemindCard();
      else if(handler==='acceptOptimize')submitQuery('牛肉粒误报太多 把提前量从2天调整为5天');
      else if(handler==='showTrack')submitQuery('AI跟踪报告');
      else if(handler==='confirmGlobalRule'||handler==='confirmCategoryRule'||handler==='confirmSkuRule')showRuleConfirm();
      else if(handler==='cancelRule')showCancel();
      else if(handler==='narrowToCategory')submitQuery('把串类的缺货提前量调为5天');
      else if(handler==='expandToGlobal')submitQuery('把所有商品的缺货提前量从2天调为3天');
      else if(handler==='gotoStockout')submitQuery('缺货总览');
      else if(handler==='gotoSlowMoving')submitQuery('滞销预警');
      else if(handler==='gotoMargin')submitQuery('毛利分析');
	      else if(handler==='gotoWarehouse')submitQuery('发货区缺货分析');
	      else if(handler==='gotoPush')submitQuery('推送智能补货建议给采购付超英');
	      else if(handler==='gotoRule')submitQuery('把所有商品的缺货提前量从2天调为3天');
      else if(handler==='expandToCategory')submitQuery('把串类的缺货提前量调为5天');
      else if(handler==='gotoSupplier')submitQuery('安大食品的缺货商品');
      else if(handler==='gotoCustomerLoss')submitQuery('客户断货预警');
      else if(handler==='addNote')showAddNote();
    };
  });
}

function showRemindCard(){
  var now=new Date(),ts=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  var meta={time:ts,thinking:['再次提醒指令','生成个性化提醒消息','发送企业微信'],blocks:[
    {type:'p',text:'✅ 已<b>再次提醒付超英</b>确认安大35克鱿鱼须串（缺口95件）的补货状态。'},
    {type:'wxcard',receiver:{name:'付超英',role:'采购员',avatar:'付'},roleType:'buyer',content:{title:'🔔 再次提醒：智能补货建议（2026.07.07）',body:'<b>付超英，你好！</b><br><br>7月4日推送的缺货清单中，<b>安大35克鱿鱼须串（红胶带）</b>仍未恢复库存（缺口 95 件，可售 2.1 天）。<br><br>请确认是否已安排补货。如有疑问可回复此消息。<br>—— 智能补货智能体',link:'查看详情 →'},status:'sent',time:ts},
    {type:'p',text:'📌 当前为手动再次提醒。当AI误报率降低到可接受水平后，可开放"自动再次提醒"功能。'}
  ]};
  dom.chatStream.appendChild(renderMsg('ai','',meta));setTimeout(function(){dom.chatStream.scrollTop=dom.chatStream.scrollHeight;bindButtons()},100);
}

function showRuleConfirm(){
  var now=new Date(),ts=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  var meta={time:ts,thinking:['规则已确认','记录规则变更日志','启动14天试运行监控'],blocks:[
    {type:'p',text:'✅ <b>规则已生效！</b>试运行 <b>14天</b>（至 2026.07.21），到期AI会自动生成回看报告。'},
    {type:'alert',kind:'info',icon:'📋',title:'试运行监控计划',desc:'• 期间按新规则触发补货预警<br>• 14天后自动对比：误报率/漏报率/缺货实际发生次数<br>• 若效果改善 → 建议固化<br>• 若效果不理想 → 建议回退或调整<br><br>📌 规则调整历史已记录在AI跟踪报告中。'},
    {type:'action-row',actions:[{text:'查看AI跟踪报告',cls:'',handler:'showTrack'},{text:'追加备注',cls:'',handler:'addNote'}]}
  ]};
  dom.chatStream.appendChild(renderMsg('ai','',meta));setTimeout(function(){dom.chatStream.scrollTop=dom.chatStream.scrollHeight;bindButtons()},100);
}

function showCancel(){
  var meta={time:new Date().getHours().toString().padStart(2,'0')+':'+new Date().getMinutes().toString().padStart(2,'0'),blocks:[{type:'p',text:'已取消本次规则调整，当前规则不变。'}]};
  dom.chatStream.appendChild(renderMsg('ai','',meta));setTimeout(function(){dom.chatStream.scrollTop=dom.chatStream.scrollHeight},100);}

function showAddNote(){
  var now=new Date(),ts=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  var noteInput='<div class="wx-msg-bubble" style="margin:6px 0"><div style="font-weight:600;margin-bottom:4px">✏️ 追加备注</div><textarea id="noteTextarea" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 12px;resize:none;font-size:13px;line-height:1.5;min-height:60px" placeholder="输入你的备注，如：鱿鱼串优先补货，刘记烧烤催了三次..."></textarea><div style="margin-top:8px;display:flex;gap:6px"><button class="act-btn confirm" onclick="submitNote()">提交备注</button><button class="act-btn cancel" onclick="cancelNote()">取消</button></div></div>';
  var meta={time:ts,blocks:[{type:'p',text:noteInput}]};
  dom.chatStream.appendChild(renderMsg('ai','',meta));setTimeout(function(){dom.chatStream.scrollTop=dom.chatStream.scrollHeight;bindButtons()},100);
}

function submitNote(){
  var textarea=document.getElementById('noteTextarea');
  var note=textarea?textarea.value.trim():'';
  if(!note){alert('请输入备注内容');return}
  var now=new Date(),ts=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  var meta={time:ts,thinking:['接收老板备注','分析备注关键词','更新建议优先级','通知对应责任人'],blocks:[
    {type:'route',text:'已收到老板备注，智能补货智能体已更新建议。',icon:'📝'},
    {type:'p',text:'<b>📝 老板备注：</b>"'+escHtml(note)+'"'},
    {type:'alert',kind:'info',icon:'🤖',title:'AI已更新建议',desc:'已记录备注内容。根据备注中的优先级指示，AI已自动调整相关建议的优先级权重。'},
    {type:'p',text:'<b>✅ 已执行：</b><br>• 备注已记录到AI知识库<br>• 相关建议优先级已更新<br>• 如涉及具体责任人，已标记为下次推送时通知<br>• 老板可在「AI跟踪报告」中查看备注历史'},
    {type:'action-row',actions:[{text:'查看AI跟踪报告',cls:'',handler:'showTrack'},{text:'继续追加备注',cls:'',handler:'addNote'}]}
  ]};
  dom.chatStream.appendChild(renderMsg('ai','',meta));setTimeout(function(){dom.chatStream.scrollTop=dom.chatStream.scrollHeight;bindButtons()},100);
}

function cancelNote(){
  var meta={time:new Date().getHours().toString().padStart(2,'0')+':'+new Date().getMinutes().toString().padStart(2,'0'),blocks:[{type:'p',text:'已取消备注。'}]};
  dom.chatStream.appendChild(renderMsg('ai','',meta));setTimeout(function(){dom.chatStream.scrollTop=dom.chatStream.scrollHeight;bindButtons()},100);
}

function bindWelcomeCards(){
  document.querySelectorAll('.suggest-card[data-q]').forEach(function(card){card.addEventListener('click',function(){submitQuery(card.dataset.q)})});
}

/* ============== 事件监听 ============== */
dom.sendBtn.addEventListener('click',function(){submitQuery(dom.chatInput.value)});
dom.chatInput.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitQuery(dom.chatInput.value)}});
dom.chatInput.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'});
dom.newChatBtn.addEventListener('click',function(){dom.welcome.classList.remove('hidden');while(dom.chatStream.children.length>1)dom.chatStream.lastChild.remove();historyCount=0;dom.hsCount.textContent='0';dom.historyList.innerHTML='';renderWelcome()});
document.addEventListener('click',function(e){if(!e.target.closest('.picker-panel')&&!e.target.closest('.send-picker-btn')){document.querySelectorAll('.picker-panel.open').forEach(function(p){p.classList.remove('open')})}});

/* ============== 启动 ============== */
initRoles();renderWelcome();renderQuickCmds();
</script>
