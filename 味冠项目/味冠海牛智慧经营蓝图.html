
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>味冠海牛智慧经营智能体平台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --blue:#2563eb;--blue-dark:#1d4ed8;--blue-light:#eff6ff;--blue-soft:#dbeafe;
  --amber:#d97706;--amber-light:#fffbeb;--amber-soft:#fef3c7;
  --emerald:#059669;--emerald-light:#ecfdf5;--emerald-soft:#d1fae5;
  --violet:#7c3aed;--violet-light:#f5f3ff;--violet-soft:#ede9fe;
  --rose:#e11d48;--rose-light:#fff1f2;--rose-soft:#ffe4e6;
  --cyan:#0891b2;--cyan-light:#ecfeff;
  --slate:#475569;--slate-light:#f8fafc;--slate-border:#e2e8f0;
  --text:#0f172a;--text-secondary:#475569;--text-muted:#94a3b8;
  --bg:#fafbfc;--card:#ffffff;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 6px rgba(0,0,0,.05),0 2px 4px rgba(0,0,0,.04);
  --radius:10px;--radius-lg:16px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}

.topnav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--slate-border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:50px}
.topnav-brand{font-size:14px;font-weight:700;color:var(--blue);letter-spacing:-.3px;white-space:nowrap}
.topnav-tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.topnav-tabs::-webkit-scrollbar{display:none}
.topnav-tab{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;color:var(--text-secondary);cursor:pointer;transition:all .15s;border:none;background:none;white-space:nowrap;flex-shrink:0}
.topnav-tab:hover{background:var(--blue-light);color:var(--blue)}
.topnav-tab.active{background:var(--blue);color:#fff}

.page-wrap{padding-top:50px}
.page{display:none;min-height:calc(100vh - 50px);padding:32px 20px 100px;max-width:1080px;margin:0 auto;width:100%}
.page.active{display:block}

.page-title{text-align:center;margin-bottom:22px}
.page-title h1{font-size:26px;font-weight:700;letter-spacing:-.5px}
.page-title p{font-size:14px;color:var(--text-secondary);margin-top:4px;max-width:600px;margin-left:auto;margin-right:auto}

.flow-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1000px;margin:0 auto}
.flow-node{flex:1;min-width:110px;max-width:170px;padding:14px 10px;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);text-align:center;transition:transform .15s,box-shadow .15s}
.flow-node:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.flow-node .fn-icon{font-size:20px;margin-bottom:4px}
.flow-node .fn-title{font-size:12px;font-weight:600;margin-bottom:2px}
.flow-node .fn-desc{font-size:10px;color:var(--text-muted);line-height:1.4}

.sc-flow{max-width:1000px;margin:0 auto 24px;padding:18px 22px;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);border-left:4px solid var(--blue)}
.sc-flow h3{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sc-flow .sc-steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px}
.sc-step{padding:4px 10px;border-radius:12px;font-weight:500;white-space:nowrap}
.sc-step.ai{background:var(--blue-light);color:var(--blue)}
.sc-step.human{background:var(--amber-light);color:var(--amber)}
.sc-step.result{background:var(--emerald-light);color:var(--emerald)}
.sc-arrow{color:var(--text-muted);font-size:10px}
.sc-boundary{margin-top:8px;font-size:11px;color:var(--text-muted);padding:5px 10px;background:var(--slate-light);border-radius:6px}
.sc-highlights{margin-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.sc-hl{padding:7px 10px;background:var(--slate-light);border-radius:6px;font-size:10px}
.sc-hl strong{display:block;font-size:11px;color:var(--text);margin-bottom:2px}

.scenario-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:1000px;margin:0 auto}
@media(max-width:768px){.scenario-grid{grid-template-columns:repeat(2,1fr)}}
.scenario-card{padding:16px 12px;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);text-align:center;transition:transform .15s}
.scenario-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.scenario-card .sc-icon{font-size:26px;margin-bottom:4px}
.scenario-card .sc-name{font-size:13px;font-weight:600;margin-bottom:2px}
.scenario-card .sc-desc{font-size:10px;color:var(--text-muted);line-height:1.4;margin-bottom:6px}
.scenario-card .sc-role-main{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600;background:var(--blue-light);color:var(--blue)}
.scenario-card .sc-role-coord{display:block;margin-top:3px;font-size:10px;color:var(--text-muted)}

.matrix-wrap{max-width:1000px;margin:0 auto;overflow-x:auto}
.matrix-table{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);font-size:12px}
.matrix-table th{text-align:center;padding:10px 8px;font-weight:600;background:var(--slate-light);border-bottom:1px solid var(--slate-border);font-size:11px}
.matrix-table th:first-child{text-align:left;min-width:90px}
.matrix-table td{text-align:center;padding:9px 8px;border-bottom:1px solid var(--slate-border);font-size:11px}
.matrix-table tr:last-child td{border-bottom:none}
.matrix-table .role-col{font-weight:600;text-align:left;color:var(--text)}
.matrix-label{font-size:9px;color:var(--text-muted);display:block;margin-top:1px}

.role-scenarios{max-width:1000px;margin:0 auto 20px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.role-scenarios .rs-label{font-size:12px;font-weight:600;color:var(--text-secondary)}
.role-scenarios .rs-tag{padding:4px 12px;border-radius:14px;font-size:11px;font-weight:500;background:var(--blue-light);color:var(--blue)}

.value-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:860px;margin:0 auto}
@media(max-width:768px){.value-grid{grid-template-columns:1fr}}
.value-card{padding:18px;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);text-align:center;border-top:3px solid var(--blue)}
.value-card .vc-icon{font-size:26px;margin-bottom:6px}
.value-card .vc-title{font-size:14px;font-weight:600;margin-bottom:4px}
.value-card .vc-desc{font-size:12px;color:var(--text-secondary);line-height:1.5}

.boundary-box{max-width:860px;margin:22px auto;padding:16px 18px;background:linear-gradient(135deg,var(--amber-light),#fff);border-radius:var(--radius-lg);border:1px solid var(--amber-soft)}
.boundary-box h4{font-size:13px;font-weight:600;color:var(--amber);margin-bottom:6px}
.boundary-box ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px}
.boundary-box li{font-size:11px;color:var(--text-secondary);padding:3px 0 3px 12px;position:relative}
.boundary-box li::before{content:'•';position:absolute;left:0;color:var(--amber)}

.phase-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:1000px;margin:0 auto}
@media(max-width:768px){.phase-grid{grid-template-columns:1fr}}
.phase-card{padding:18px;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);border-top:3px solid var(--blue)}
.phase-card .ph-num{font-size:11px;font-weight:700;color:var(--blue);margin-bottom:4px}
.phase-card .ph-title{font-size:15px;font-weight:600;margin-bottom:6px}
.phase-card .ph-items{list-style:none}
.phase-card .ph-items li{font-size:11px;color:var(--text-secondary);padding:2px 0 2px 10px;position:relative}
.phase-card .ph-items li::before{content:'-';position:absolute;left:0;color:var(--text-muted)}
.phase-card.p2{border-top-color:var(--amber)}
.phase-card.p3{border-top-color:var(--emerald)}

.collab-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:1000px;margin:0 auto}
@media(max-width:900px){.collab-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
.collab-card{padding:12px;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);text-align:center;transition:transform .15s}
.collab-card:hover{transform:translateY(-2px)}
.cc-step{display:inline-block;padding:2px 10px;border-radius:12px;font-size:10px;font-weight:700;color:#fff;margin-bottom:4px}
.cc-ai{font-size:10px;color:var(--text-secondary);line-height:1.4;margin-bottom:4px;padding-bottom:4px;border-bottom:1px dashed var(--slate-border)}
.cc-human{font-size:9px;color:var(--text-muted);margin-bottom:3px}
.cc-value{font-size:9px;color:var(--emerald);font-weight:500}

.summary-hero{max-width:760px;margin:22px auto;padding:24px;background:linear-gradient(135deg,var(--blue-light),#f0f9ff);border-radius:var(--radius-lg);text-align:center}
.summary-hero .sh-title{font-size:16px;font-weight:700;color:var(--blue-dark);margin-bottom:6px}
.summary-hero .sh-desc{font-size:13px;color:var(--text-secondary);line-height:1.7}

/* Boss 5 questions table */
.q-table{max-width:860px;margin:22px auto;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
.q-table table{width:100%;border-collapse:collapse}
.q-table th{padding:10px 16px;background:var(--blue-light);color:var(--blue-dark);font-size:12px;font-weight:600;text-align:left;border-bottom:1px solid var(--blue-soft)}
.q-table td{padding:10px 16px;border-bottom:1px solid var(--slate-border);font-size:12px;vertical-align:top}
.q-table tr:last-child td{border-bottom:none}
.q-table .q-q{font-weight:600;color:var(--text);width:30%}
.q-table .q-a{color:var(--text-secondary)}

/* Demo screen */
.demo-section{max-width:1000px;margin:20px auto 0;padding:18px 20px;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);border-top:3px solid var(--cyan)}
.demo-section .ds-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--slate-border)}
.demo-section .ds-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.demo-section .ds-badge{font-size:10px;padding:2px 10px;border-radius:10px;background:var(--cyan-light);color:var(--cyan);font-weight:500}
.demo-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media(max-width:768px){.demo-stats{grid-template-columns:repeat(2,1fr)}}
.demo-stat{padding:12px;background:var(--slate-light);border-radius:var(--radius);text-align:center}
.demo-stat .ds-num{font-size:20px;font-weight:700;color:var(--text)}
.demo-stat .ds-label{font-size:10px;color:var(--text-muted);margin-top:2px}
.demo-stat.warn .ds-num{color:#dc2626}
.demo-stat.info .ds-num{color:var(--blue)}
.demo-table{width:100%;border-collapse:collapse;font-size:11px}
.demo-table th{text-align:left;padding:7px 10px;background:var(--slate-light);color:var(--text-muted);font-weight:600;border-bottom:1px solid var(--slate-border);font-size:10px}
.demo-table td{padding:7px 10px;border-bottom:1px solid var(--slate-border);color:var(--text-secondary)}
.demo-table tr:last-child td{border-bottom:none}
.tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:500}
.tag.red{background:#fef2f2;color:#dc2626}
.tag.amber{background:var(--amber-light);color:var(--amber)}
.tag.violet{background:var(--violet-light);color:var(--violet)}
.tag.green{background:var(--emerald-light);color:var(--emerald)}
.tag.blue{background:var(--blue-light);color:var(--blue)}
.tag.slate{background:var(--slate-light);color:var(--slate)}
.status{display:inline-flex;align-items:center;gap:4px;font-size:10px}
.status::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%}
.status.pending::before{background:#dc2626}
.status.doing::before{background:var(--amber)}
.status.done::before{background:var(--emerald)}

.pagination{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--slate-border);padding:8px 20px;display:flex;align-items:center;justify-content:center;gap:6px}
.pg-dot{width:7px;height:7px;border-radius:50%;background:var(--slate-border);cursor:pointer;transition:all .2s}
.pg-dot.active{background:var(--blue);width:18px;border-radius:4px}
.pg-prev,.pg-next{padding:4px 12px;border-radius:6px;font-size:11px;font-weight:500;color:var(--text-secondary);cursor:pointer;border:1px solid var(--slate-border);background:var(--card);transition:all .15s}
.pg-prev:hover,.pg-next:hover{border-color:var(--blue);color:var(--blue)}
.pg-label{font-size:10px;color:var(--text-muted);margin:0 4px;white-space:nowrap}


.factor-panel{margin:0 auto 12px;max-width:1000px;padding:10px 14px;background:var(--slate-light);border-radius:var(--radius);border-left:3px solid var(--blue)}
.fp-section{margin-bottom:8px}
.fp-label{font-size:11px;font-weight:600;color:var(--text);margin-bottom:5px;letter-spacing:.3px}
.fp-note{font-size:10px;color:var(--amber);font-weight:400}
.fp-tags{display:flex;flex-wrap:wrap;gap:4px}
.fp-tag{padding:2px 8px;border-radius:6px;font-size:10px;background:var(--card);color:var(--text-secondary);border:1px solid var(--slate-border)}
.fp-formula{font-size:10px;color:var(--text-secondary);padding:2px 0;font-family:"SF Mono",Menlo,monospace;overflow-wrap:break-word;word-break:break-all}
.fp-formula strong{color:var(--text);font-weight:600}
.fp-evolve{display:flex;flex-wrap:wrap;gap:4px}
.fp-ev-item{padding:2px 9px;border-radius:8px;font-size:10px;background:var(--emerald-light);color:var(--emerald);border:1px solid var(--emerald-soft)}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:1000px;margin:0 auto}
@media(max-width:768px){.kpi-grid{grid-template-columns:1fr}}
.kpi-card{padding:18px;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);border-top:3px solid var(--blue)}
.kpi-card.k2{border-top-color:var(--amber)}.kpi-card.k3{border-top-color:var(--violet)}.kpi-card.k4{border-top-color:var(--rose)}.kpi-card.k5{border-top-color:var(--emerald)}
.kpi-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.kpi-icon{font-size:24px}.kpi-name{font-size:15px;font-weight:600}.kpi-question{font-size:11px;color:var(--text-muted);margin-bottom:10px;line-height:1.5}
.kpi-factors{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.kpi-factor{padding:2px 8px;border-radius:6px;font-size:10px;background:var(--slate-light);color:var(--text-secondary)}
.kpi-formulas{font-size:10px;color:var(--text-secondary);margin-bottom:10px;line-height:1.7}
.kpi-formulas div{font-family:"SF Mono",Menlo,monospace;overflow-wrap:break-word;word-break:break-all;padding:1px 0}
.kpi-evolve-label{font-size:10px;font-weight:600;color:var(--emerald);margin-bottom:5px}
.kpi-evolve-items{display:flex;flex-wrap:wrap;gap:4px}
.kpi-ev{padding:2px 8px;border-radius:8px;font-size:10px;background:var(--emerald-light);color:var(--emerald);border:1px solid var(--emerald-soft)}
.kpi-formulas-label{font-size:10px;font-weight:600;color:var(--text);margin-bottom:4px}
.kpi-formulas-note{font-size:9px;color:var(--amber);font-weight:400}
.kpi-exception{margin-top:10px;border:1px solid var(--rose-soft);border-radius:var(--radius);overflow:hidden}
.kpi-exception>summary{padding:6px 10px;background:var(--rose-light);font-size:11px;font-weight:600;color:var(--rose);cursor:pointer;list-style:none;display:flex;align-items:center;gap:4px;user-select:none}
.kpi-exception>summary::-webkit-details-marker{display:none}
.kpi-exception>summary::after{content:'▼';margin-left:auto;font-size:9px;transition:transform .2s;color:var(--rose)}
.kpi-exception[open]>summary::after{transform:rotate(180deg)}
.kpi-exception-table{width:100%;border-collapse:collapse;font-size:10px}
.kpi-exception-table th{padding:5px 8px;background:var(--slate-light);text-align:left;font-weight:600;color:var(--text-secondary);border-bottom:1px solid var(--slate-border);font-size:10px}
.kpi-exception-table td{padding:5px 8px;border-bottom:1px solid var(--slate-border);color:var(--text-secondary);vertical-align:top}
.kpi-exception-table td:first-child{font-weight:600;color:var(--text);white-space:nowrap;width:35%}
.kpi-exception-table tr:last-child td{border-bottom:none}
.role-value-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:1000px;margin:0 auto}
@media(max-width:900px){.role-value-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.role-value-grid{grid-template-columns:1fr}}
.role-value-card{padding:14px;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);border-top:3px solid var(--blue)}
.role-value-card.r2{border-top-color:var(--emerald)}.role-value-card.r3{border-top-color:var(--amber)}.role-value-card.r4{border-top-color:var(--slate)}.role-value-card.r5{border-top-color:var(--violet)}.role-value-card.r6{border-top-color:var(--cyan)}
.rvc-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rvc-icon{font-size:20px}.rvc-name{font-size:13px;font-weight:600}
.rvc-question{font-size:10px;color:var(--text-muted);margin-bottom:6px;padding:4px 8px;background:var(--slate-light);border-radius:6px;line-height:1.4}
.rvc-section{margin-bottom:5px}
.rvc-label{font-size:9px;font-weight:600;color:var(--text-muted);margin-bottom:2px;letter-spacing:.3px}
.rvc-items{font-size:10px;color:var(--text-secondary);line-height:1.6}
.rvc-value{font-size:10px;color:var(--emerald);font-weight:500;padding:4px 8px;background:var(--emerald-light);border-radius:6px;margin-top:4px}
.collab-example{max-width:1000px;margin:20px auto 0;padding:16px 18px;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);border-top:3px solid var(--blue)}
.collab-example h4{font-size:13px;font-weight:600;margin-bottom:10px;text-align:center}
.collab-flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;font-size:10px}
.collab-node{padding:6px 10px;border-radius:8px;text-align:center;min-width:80px}
.collab-node .cn-role{font-size:9px;font-weight:600;margin-bottom:2px}
.collab-node .cn-action{font-size:10px;color:var(--text-secondary);line-height:1.3}
.collab-arrow{color:var(--text-muted);font-size:11px}
.role-compact{margin-bottom:14px;padding:12px 14px;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.role-compact h4{font-size:13px;font-weight:600;margin-bottom:6px}
.role-flow-mini{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:10px}
.rfm-step{padding:3px 8px;border-radius:10px;font-weight:500;white-space:nowrap;font-size:9px}
.rfm-step.ai{background:var(--blue-light);color:var(--blue)}
.rfm-step.human{background:var(--amber-light);color:var(--amber)}
.rfm-arrow{color:var(--text-muted);font-size:8px}
@media print{.topnav,.pagination{display:none}.page{display:block!important;page-break-after:always;padding:16px}.page-wrap{padding-top:0}}
</style>
</head>
<body>

<nav class="topnav">
  <span class="topnav-brand">味冠海牛智慧经营智能体平台</span>
  <div class="topnav-tabs" id="topnavTabs"></div>
</nav>

<div class="page-wrap" id="pageWrap"></div>

<div class="pagination" id="pagination">
  <button class="pg-prev" id="pgPrev" onclick="nav(-1)">← 上一页</button>
  <span id="pgDots"></span>
  <span class="pg-label" id="pgLabel"></span>
  <button class="pg-next" id="pgNext" onclick="nav(1)">下一页 →</button>
</div>

<script>
var pages = [
  {id:'pos',title:'项目定位'},
  {id:'kpi',title:'五大指标体系'},
  {id:'evolve',title:'AI自我进化'},
  {id:'loop',title:'全景+场景'},
  {id:'scenes',title:'场景闭环详解'},
  {id:'roles',title:'角色协同'}
];

function node(icon,title,desc,color){
  return '<div class="flow-node" style="border-top:3px solid '+color+'"><div class="fn-icon">'+icon+'</div><div class="fn-title">'+title+'</div><div class="fn-desc">'+desc+'</div></div>';
}
function collab(step,color,ai,human,value){
  return '<div class="collab-card"><div class="cc-step" style="background:'+color+'">'+step+'</div><div class="cc-ai">'+ai+'</div><div class="cc-human">'+human+'</div><div class="cc-value">'+value+'</div></div>';
}
function scFlow(icon,title,color,steps,highlights,boundary){
  var h='<div class="sc-flow" style="border-left-color:'+color+'"><h3>'+icon+' '+title+'</h3><div class="sc-steps">';
  for(var i=0;i<steps.length;i++){
    if(i>0)h+='<span class="sc-arrow">→</span>';
    var cls=(i<=1?'ai':(i>=steps.length-2?'result':'human'));
    h+='<span class="sc-step '+cls+'">'+(i+1)+'. '+steps[i]+'</span>';
  }
  h+='</div>';
  if(highlights&&highlights.length){
    h+='<div class="sc-highlights">';
    var labels=['风险发现','原因/依据','人工确认','结果跟踪'];
    for(var j=0;j<Math.min(highlights.length,labels.length);j++){
      h+='<div class="sc-hl"><strong>'+labels[j]+'</strong>'+highlights[j]+'</div>';
    }
    h+='</div>';
  }
  if(boundary)h+='<div class="sc-boundary">'+boundary+'</div>';
  h+='</div>';return h;
}
function factorPanel(factors,formulas,evolution,status){
  var statusLabel=status||'<span class="fp-note">【当前推测，待客户确认】</span>';
  var h='<div class="factor-panel">';
  h+='<div class="fp-section"><div class="fp-label">影响因子</div><div class="fp-tags">';
  for(var i=0;i<factors.length;i++)h+='<span class="fp-tag">'+factors[i]+'</span>';
  h+='</div></div>';
  h+='<div class="fp-section"><div class="fp-label">核心指标与初始计算逻辑 '+statusLabel+'</div>';
  for(var j=0;j<formulas.length;j++)h+='<div class="fp-formula"><strong>'+formulas[j].name+'</strong> = '+formulas[j].formula+'</div>';
  h+='</div>';
  h+='<div class="fp-section"><div class="fp-label">AI进化方向</div><div class="fp-evolve">';
  for(var k=0;k<evolution.length;k++)h+='<span class="fp-ev-item">'+evolution[k]+'</span>';
  h+='</div></div></div>';
  return h;
}

function buildPage(id){

// Render
var wrap=document.getElementById('pageWrap'),tabs=document.getElementById('topnavTabs'),dots=document.getElementById('pgDots');
var allHtml='',tabsHtml='',dotsHtml='';
for(var i=0;i<pages.length;i++){
  allHtml+=buildPage(pages[i].id);
  tabsHtml+='<button class="topnav-tab'+(i===0?' active':'')+'" data-idx="'+i+'">'+pages[i].title+'</button>';
  dotsHtml+='<span class="pg-dot'+(i===0?' active':'')+'" data-idx="'+i+'" onclick="goPage('+i+')"></span>';
}
wrap.innerHTML=allHtml;tabs.innerHTML=tabsHtml;dots.innerHTML=dotsHtml;

var currentPage=0,totalPages=pages.length;
function goPage(idx){if(idx<0||idx>=totalPages||idx===currentPage)return;currentPage=idx;updateUI();}
function nav(dir){goPage(currentPage+dir);}
function updateUI(){
  var allPages=document.querySelectorAll('.page');for(var i=0;i<allPages.length;i++)allPages[i].classList.toggle('active',i===currentPage);
  var allTabs=document.querySelectorAll('.topnav-tab');for(var i=0;i<allTabs.length;i++)allTabs[i].classList.toggle('active',i===currentPage);
  var allDots=document.querySelectorAll('.pg-dot');for(var i=0;i<allDots.length;i++)allDots[i].classList.toggle('active',i===currentPage);
  document.getElementById('pgLabel').textContent=(currentPage+1)+' / '+totalPages;
  document.getElementById('pgPrev').style.visibility=currentPage===0?'hidden':'visible';
  document.getElementById('pgNext').style.visibility=currentPage===totalPages-1?'hidden':'visible';
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('topnavTabs').addEventListener('click',function(e){var tab=e.target.closest('.topnav-tab');if(!tab)return;goPage(parseInt(tab.dataset.idx,10));});
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();nav(1);}if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();nav(-1);}});
updateUI();
</script>
