<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大金（中国）· 数字化课题调研</title>
<style>
  :root{
    --ink:#1f2937; --ink2:#4b5563; --ink3:#9ca3af;
    --line:#e5e7eb; --bg:#f6f8f7; --card:#ffffff;
    /* 大金绿主题（对齐 SE 能力平台） */
    --green:#059669; --green-d:#047857; --green-dd:#065f46; --green-l:#ecfdf5; --green-l2:#d1fae5;
    --blue:#2563eb; --blue-l:#eff4ff;
    --orange:#d97706; --orange-l:#fdf6ec;
    --purple:#7c3aed; --purple-l:#f5f0ff;
    --gray:#9ca3af; --gray-l:#f3f4f6;
    --r:10px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px; line-height:1.65;
  }
  /* ===== 顶栏 ===== */
  .topbar{
    position:sticky; top:0; z-index:50; height:52px;
    background:#fff; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:14px; padding:0 28px;
  }
  .brand{font-size:15px; font-weight:700; letter-spacing:.5px; display:flex; align-items:center; gap:10px;}
  .brand .mark{width:8px; height:22px; border-radius:2px; background:linear-gradient(180deg,var(--green),var(--green-dd));}
  .crumb{color:var(--ink3); font-size:13px;}
  .crumb b{color:var(--ink2); font-weight:600;}
  .topbar .sp{flex:1;}
  .btn-back{
    display:none; align-items:center; gap:6px; cursor:pointer; user-select:none;
    font-size:13px; color:var(--ink2); border:1px solid var(--line); border-radius:8px;
    padding:6px 14px; background:#fff; transition:.15s;
  }
  .btn-back:hover{border-color:var(--green); color:var(--green);}
  .btn-print{
    cursor:pointer; user-select:none; font-size:13px; color:#fff;
    background:var(--green); border-radius:8px; padding:6px 16px; transition:.15s;
  }
  .btn-print:hover{background:var(--green-d);}
  /* ===== 视图切换 ===== */
  .view{display:none;}
  .view.on{display:block;}
  /* ===== 入口页 ===== */
  .home{max-width:1080px; margin:0 auto; padding:56px 28px 80px;}
  .home-tag{font-size:13px; color:var(--green); font-weight:600; letter-spacing:2px; margin-bottom:10px;}
  .home-h1{font-size:30px; font-weight:700; line-height:1.35; margin-bottom:16px;}
  .home-lead{
    max-width:860px; color:var(--ink2); font-size:15px; line-height:1.9; margin-bottom:44px;
    border-left:3px solid var(--green); padding-left:18px;
  }
  .entry-grid{display:grid; grid-template-columns:1fr 1fr; gap:22px;}
  .entry{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:30px 30px 26px; cursor:pointer; transition:.2s; position:relative; overflow:hidden;
  }
  .entry:hover{border-color:var(--green); box-shadow:0 8px 28px rgba(6,95,70,.10); transform:translateY(-2px);}
  .entry .no{
    font-size:12px; font-weight:700; color:var(--green); letter-spacing:1px; margin-bottom:12px;
    display:flex; align-items:center; gap:10px;
  }
  .entry .no::after{content:""; flex:1; height:1px; background:var(--line);}
  .entry h2{font-size:20px; font-weight:700; line-height:1.5; margin-bottom:10px; min-height:60px;}
  .entry p{color:var(--ink2); font-size:13.5px; margin-bottom:18px;}
  .entry ul{list-style:none; margin-bottom:20px;}
  .entry li{
    font-size:13px; color:var(--ink2); padding:7px 0 7px 20px; position:relative;
    border-top:1px dashed var(--line);
  }
  .entry li::before{content:""; position:absolute; left:4px; top:15px; width:6px; height:6px; border-radius:50%; background:#6ee7b7;}
  .entry .go{font-size:13px; font-weight:600; color:var(--green); display:flex; align-items:center; gap:6px;}
  .entry .go::after{content:"→"; transition:.2s;}
  .entry:hover .go::after{transform:translateX(4px);}
  .entry.disabled{cursor:default; opacity:.62;}
  .entry.disabled:hover{border-color:var(--line); box-shadow:none; transform:none;}
  .entry.disabled .go{color:var(--ink3);}
  .entry.disabled .go::after{content:"";}
  .entry .wait{font-size:12px; color:var(--ink3); background:var(--gray-l); border-radius:20px; padding:3px 12px;}
  .home-foot{margin-top:46px; color:var(--ink3); font-size:12.5px;}
  /* ============================================================
     课题一 · 空调：故事线全景
     ============================================================ */
  .topic{max-width:1400px; margin:0 auto; padding:36px 28px 90px;}
  /* 头部结论 */
  .n-head{text-align:center; margin-bottom:8px;}
  .n-tag{font-size:12.5px; font-weight:700; color:var(--green); letter-spacing:2px; margin-bottom:8px;}
  .n-h1{font-size:26px; font-weight:700; letter-spacing:1px;}
  .n-route{display:flex; justify-content:center; align-items:center; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .n-route span{font-size:11.5px; color:var(--ink2); background:#fff; border:1px solid var(--line); border-radius:20px; padding:4px 14px; letter-spacing:.5px; font-weight:600;}
  .n-route i{color:#c4cdc5; font-style:normal; font-size:11px;}
  .n-concl{
    max-width:1020px; margin:18px auto 0; background:#fff; border:1px solid var(--line);
    border-left:4px solid var(--green); border-radius:0 10px 10px 0; padding:15px 22px;
    font-size:14.5px; color:var(--ink2); line-height:1.9; text-align:left;
  }
  .n-concl b{color:var(--ink);}
  .trends{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:14px;}
  .trend{font-size:12.5px; font-weight:600; color:var(--green-d); background:var(--green-l); border:1px solid var(--green-l2); border-radius:20px; padding:6px 16px;}
  /* 主线分隔 */
  .trunk{display:flex; flex-direction:column; align-items:center; margin-top:26px;}
  .vline{width:2px; height:16px; background:#c9d4cc;}
  .vlabel{font-size:13px; color:var(--ink2); background:#fff; border:1px solid var(--line); border-radius:20px; padding:6px 22px; font-weight:700; letter-spacing:1px;}
  /* 对标厂商 */
  .venders{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; max-width:1280px; margin:16px auto 0;}
  .vd{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px;}
  .vd .co{font-size:14.5px; font-weight:700; margin-bottom:2px;}
  .vd .cs{font-size:11.5px; color:var(--ink3); margin-bottom:9px;}
  .vd.self{background:linear-gradient(135deg,var(--green-dd),var(--green-d)); border-color:var(--green-d); color:#fff;}
  .vd.self .cs{color:rgba(255,255,255,.66);}
  .vd .kw{display:flex; flex-wrap:wrap; gap:5px;}
  .vd .kw span{font-size:11px; padding:2px 8px; border-radius:5px; background:var(--gray-l); color:var(--ink2);}
  .vd.self .kw span{background:rgba(255,255,255,.13); color:#fff;}
  /* 分组段 */
  .seg{display:flex; align-items:center; gap:14px; max-width:1340px; margin:30px auto 12px;}
  .seg .sg{font-size:13px; font-weight:700; color:#fff; background:var(--green-d); border-radius:20px; padding:5px 18px; letter-spacing:1px; white-space:nowrap;}
  .seg .ln{flex:1; height:1px; background:var(--line);}
  .seg .sn{font-size:12px; color:var(--ink3); white-space:nowrap;}
  /* 节点行 */
  .nrow{display:flex; align-items:stretch; gap:0; max-width:1340px; margin:0 auto;}
  .nb{
    flex:1; background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 13px;
    display:flex; flex-direction:column; min-width:0;
  }
  .nb:hover{border-color:#b8d5c8;}
  .nar{display:flex; align-items:center; padding:0 7px; color:#b6c4ba; font-size:16px; font-weight:700; flex:none;}
  .nb .no{display:flex; align-items:baseline; gap:8px; margin-bottom:2px;}
  .nb .no em{font-style:normal; font-size:11px; font-weight:700; color:var(--green); letter-spacing:.5px;}
  .nb .nm{font-size:14.5px; font-weight:700;}
  .nb .ds{font-size:11.5px; color:var(--ink3); margin-bottom:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .nb .gp{display:flex; flex-direction:column; gap:6px;}
  .gp-lb{font-size:10.5px; color:var(--ink3); letter-spacing:1px; margin-bottom:-2px;}
  /* 标签（可点开抽屉） */
  .tk{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:4px 10px;
    border-radius:6px; background:var(--gray-l); color:var(--ink2); cursor:pointer;
    border:1px solid transparent; transition:.15s; line-height:1.5; text-align:left;
  }
  .tk:hover{transform:translateY(-1px); box-shadow:0 3px 10px rgba(6,95,70,.14);}
  .tk .dot{width:7px; height:7px; border-radius:50%; flex:none;}
  .tk.ind{background:#fff; border-color:var(--line);}
  .tk.ind .dot{background:var(--blue);}
  .tk.st1{background:var(--green-l); color:var(--green-dd);} .tk.st1 .dot{background:var(--green);}
  .tk.st2{background:var(--blue-l); color:#1d4fa8;} .tk.st2 .dot{background:var(--blue);}
  .tk.st3{background:var(--orange-l); color:#a05a08;} .tk.st3 .dot{background:var(--orange);}
  .tk.st4{background:var(--gray-l); color:var(--ink2);} .tk.st4 .dot{background:var(--gray);}
  .tk.op1{background:var(--green-d); color:#fff;} .tk.op1 .dot{background:#a7f3d0;}
  .tk.op2{background:var(--blue); color:#fff;} .tk.op2 .dot{background:#bfdbfe;}
  .tk.op3{background:var(--purple); color:#fff;} .tk.op3 .dot{background:#ddd6fe;}
  /* 图例 */
  .legend{display:flex; flex-direction:column; gap:8px; align-items:center; margin:22px 0 6px;}
  .legend .lgrow{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .lg{display:flex; align-items:center; gap:7px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:5px 12px;}
  .lg .dot{width:8px; height:8px; border-radius:50%;}
  .lg .nm{font-size:12px; font-weight:700; color:var(--ink);}
  .lg .ex{font-size:10.5px; color:var(--ink3);}
  .lg.tkb{padding:0; border:none; background:none;}
  .lg.tkb .tk{cursor:default;} .lg.tkb .tk:hover{transform:none; box-shadow:none;}
  /* 能力底座 */
  .basebar{max-width:1340px; margin:14px auto 0; background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px;}
  .basebar .bt{font-size:12px; font-weight:700; color:var(--green-d); letter-spacing:2px; text-align:center; margin-bottom:10px;}
  .basegrid{display:grid; grid-template-columns:repeat(6,1fr); gap:10px;}
  .bcell{background:var(--gray-l); border-radius:9px; padding:10px 12px;}
  .bcell b{display:block; font-size:12.5px; margin-bottom:2px;}
  .bcell span{font-size:11px; color:var(--ink3); line-height:1.55; display:block;}
  /* 重点方向 */
  .five{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; max-width:1340px; margin:16px auto 0;}
  .fcard{background:#fff; border:1px solid var(--line); border-top:3px solid var(--green-d); border-radius:10px; padding:14px 15px; display:flex; flex-direction:column;}
  .fcard .fn{font-size:13px; font-weight:700; line-height:1.5; margin-bottom:6px;}
  .fcard .fj{font-size:12px; color:var(--ink2); line-height:1.7; flex:1;}
  .fcard .fk{margin-top:10px; display:flex; flex-wrap:wrap; gap:5px;}
  .fcard .fk .tk{font-size:11px; padding:3px 8px;}
  .fcard .fo{margin-top:9px;}
  .fcard .fo .tk{cursor:default;}
  /* 下一步 */
  .nextline{display:flex; justify-content:center; align-items:center; gap:14px; margin-top:26px; flex-wrap:wrap;}
  .nx{font-size:12.5px; color:var(--ink2); background:#fff; border:1px solid var(--line); border-radius:20px; padding:6px 18px;}
  .nx b{color:var(--green-d); margin-right:6px;}
  .nextline i{color:#b6c4ba; font-style:normal;}
  .endnote{text-align:center; color:var(--ink3); font-size:12px; margin-top:16px;}
  /* ===== 抽屉 ===== */
  .dmask{position:fixed; inset:0; background:rgba(6,40,28,.38); opacity:0; pointer-events:none; transition:opacity .25s; z-index:90;}
  .dmask.on{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; right:0; height:100vh; width:min(580px,94vw); background:#fff;
    box-shadow:-8px 0 30px rgba(0,0,0,.18); transform:translateX(105%); transition:transform .28s ease;
    z-index:100; display:flex; flex-direction:column;
  }
  .drawer.on{transform:none;}
  .d-head{padding:18px 22px 14px; border-bottom:1px solid var(--line); flex-shrink:0;}
  .d-tags{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .db{color:#fff; font-size:11px; font-weight:600; border-radius:5px; padding:2px 9px; letter-spacing:.5px;}
  .d-x{margin-left:auto; border:none; background:var(--gray-l); border-radius:6px; width:26px; height:26px; cursor:pointer; color:var(--ink2); font-size:13px; line-height:1;}
  .d-x:hover{background:var(--line); color:var(--ink);}
  .d-name{font-size:19px; font-weight:800; margin-top:10px; line-height:1.35;}
  .d-node{font-size:12px; color:var(--ink3); margin-top:3px;}
  .d-body{overflow-y:auto; padding:18px 22px 30px; flex:1;}
  .d-pitch{background:var(--green-l); border-left:4px solid var(--green); border-radius:0 8px 8px 0; padding:10px 14px; font-size:13px; font-weight:600; color:var(--green-dd); line-height:1.7;}
  .d-sec{margin-top:14px; background:#fafbfa; border:1px solid var(--line); border-radius:8px; padding:11px 14px;}
  .d-lb{font-size:11.5px; font-weight:700; letter-spacing:1px; margin-bottom:6px; color:var(--ink2);}
  .d-sec p{font-size:12.8px; line-height:1.8; color:var(--ink);}
  .d-src{font-size:11px; color:var(--ink3); margin-top:6px;}
  .d-chk{margin-top:14px; background:var(--orange-l); border:1px solid #f3e3c8; border-radius:8px; padding:11px 14px;}
  .d-chk .d-lb{color:var(--orange);}
  .d-chk li{font-size:12.5px; line-height:1.8; color:var(--ink2); margin-left:18px;}
  /* ===== 课题二（沿用结构样式，绿主题） ===== */
  .topic2{max-width:1180px; margin:0 auto; padding:34px 28px 90px;}
  .topic-head{margin-bottom:8px;}
  .topic-tag{font-size:12.5px; font-weight:700; color:var(--green); letter-spacing:1.5px; margin-bottom:8px;}
  .topic-h1{font-size:24px; font-weight:700; line-height:1.45;}
  .topic-lead{
    background:var(--card); border:1px solid var(--line); border-left:3px solid var(--green);
    border-radius:0 var(--r) var(--r) 0; padding:16px 22px; margin:18px 0 10px;
    color:var(--ink2); font-size:14.5px; line-height:1.9;
  }
  .sec{margin-bottom:44px;}
  .sec-h{display:flex; align-items:baseline; gap:14px; margin-bottom:16px;}
  .sec-h .st{font-size:18px; font-weight:700; white-space:nowrap;}
  .sec-h .st::before{content:""; display:inline-block; width:4px; height:16px; background:var(--green); border-radius:2px; margin-right:10px; vertical-align:-2px;}
  .sec-h .sd{font-size:13px; color:var(--ink3);}
  .sec-h .ln{flex:1; height:1px; background:var(--line); align-self:center;}
  .why-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  .why{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px;}
  .why b{display:block; font-size:14.5px; margin-bottom:8px;}
  .why p{font-size:13px; color:var(--ink2);}
  .tri-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  .tri{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; border-top:3px solid var(--green-d);}
  .tri:nth-child(2){border-top-color:#34b38a;}
  .tri:nth-child(3){border-top-color:#8fd9bd;}
  .tri b{display:block; font-size:14.5px; margin-bottom:4px;}
  .tri .en{font-size:12px; color:var(--ink3); margin-bottom:8px; display:block;}
  .tri p{font-size:13px; color:var(--ink2); margin-bottom:8px;}
  .tri .ex{font-size:12.5px; color:var(--green-dd); background:var(--green-l); border-radius:6px; padding:6px 10px;}
  .lc-wrap{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:26px 22px 20px;}
  .lc{display:grid; grid-template-columns:repeat(7,1fr); gap:0;}
  .lc-node{position:relative; padding:0 8px; text-align:center;}
  .lc-node::before{content:""; position:absolute; top:13px; left:0; right:0; height:2px; background:var(--line);}
  .lc-node:first-child::before{left:50%;} .lc-node:last-child::before{right:50%;}
  .lc-dot{
    position:relative; z-index:1; width:26px; height:26px; border-radius:50%; margin:0 auto 10px;
    background:#fff; border:2px solid var(--green); color:var(--green);
    font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .lc-node b{display:block; font-size:13.5px; margin-bottom:4px;}
  .lc-node span{font-size:12px; color:var(--ink2); line-height:1.55; display:block;}
  .bench{background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  .b-head{background:#f7faf8; border-bottom:1px solid var(--line); display:grid; grid-template-columns:130px 1fr 1fr;}
  .b-head > div{padding:11px 18px; font-size:13px; font-weight:600; color:var(--ink2); border-right:1px solid var(--line);}
  .b-head > div:last-child{border-right:none;}
  .b-row{display:grid; grid-template-columns:130px 1fr 1fr; border-bottom:1px solid var(--line);}
  .b-row:last-child{border-bottom:none;}
  .b-row:hover{background:#fafcfb;}
  .b-co{padding:15px 18px; border-right:1px solid var(--line); display:flex; flex-direction:column; justify-content:center; gap:3px;}
  .b-co b{font-size:14px;}
  .b-co span{font-size:12px; color:var(--ink3);}
  .b-cell{padding:14px 18px; border-right:1px solid var(--line); font-size:13px; color:var(--ink2);}
  .b-cell:last-child{border-right:none;}
  .chips{display:flex; flex-wrap:wrap; gap:10px;}
  .chips .chip{font-size:12.5px; padding:6px 14px; border-radius:6px; background:var(--green-l); color:var(--green-dd);}
  .insight{background:var(--green-l); border-radius:var(--r); padding:16px 22px; margin-bottom:16px; font-size:14px; color:var(--green-dd); line-height:1.9;}
  .insight b{font-weight:700;}
  .ask-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .ask{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px 18px; display:flex; gap:12px; align-items:flex-start;}
  .ask .an{flex:none; width:22px; height:22px; border-radius:50%; background:var(--orange-l); color:var(--orange); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px;}
  .ask b{font-size:13.5px; display:block; margin-bottom:2px;}
  .ask p{font-size:12.5px; color:var(--ink2);}
  /* ===== 机会总览矩阵（抽屉内表格） ===== */
  .mx{width:100%; border-collapse:collapse; margin-top:12px;}
  .mx th{font-size:11.5px; color:var(--ink2); background:#fafbfa; border:1px solid var(--line); padding:7px 9px; text-align:left; font-weight:600;}
  .mx td{font-size:12px; color:var(--ink); border:1px solid var(--line); padding:7px 9px; line-height:1.6;}
  .mx td.jd{font-weight:600; color:var(--green-dd); white-space:nowrap;}
  /* ===== 响应式 ===== */
  @media (max-width:1100px){
    .venders{grid-template-columns:1fr 1fr;}
    .nrow{flex-direction:column;}
    .nar{transform:rotate(90deg); padding:4px 0;}
    .five{grid-template-columns:1fr 1fr;}
    .basegrid{grid-template-columns:repeat(3,1fr);}
    .why-grid,.tri-grid,.ask-grid{grid-template-columns:1fr;}
    .lc{grid-template-columns:repeat(2,1fr); gap:18px 0;}
    .b-row,.b-head{grid-template-columns:1fr;}
    .b-co,.b-cell{border-right:none; border-bottom:1px dashed var(--line);}
  }
  @media print{
    .topbar,.n-route,.btn-print,.dmask,.drawer{display:none !important;}
    body{background:#fff;}
    .view{display:block !important;}
    .sec,.nb,.fcard{break-inside:avoid;}
  }

  /* 子页顶栏品牌 + 入口页卡片 */
  .brandtag{font-size:13px; font-weight:700; color:var(--green-d); letter-spacing:2px;}
  .home2{min-height:calc(100vh - 52px); display:flex; align-items:center; justify-content:center; padding:40px 28px;}
  .hgrid{display:grid; grid-template-columns:1fr 1fr; gap:26px; max-width:980px; width:100%;}
  .hcard{

 chk:["故障预测所需的运行数据完备度"]},
o_energy:{nm:"智能节能运营",node:"10 设备运维与客户经营",k:"opp",ot:2,
 pitch:"以数据优化设备运行策略。",
 ind:"海尔智慧楼宇物联多联机系统节能 50%（有第三方检测），行业节能价值已验证。",
 val:"使用习惯 + 天气 + 空间环境 + 设备状态 → 推荐 / 自动优化运行策略。",
 chk:["能耗数据的采集与计量基础","节能服务的商业模式"]},
/* —— 机会总览矩阵 —— */
m_overview:{nm:"机会总览矩阵",node:"机会盘点",k:"ind",
 pitch:"按「行业成熟度 × 大金公开基础 × 业务结合度」盘点 8 个方向，供内部讨论排序。"}
};
var MATRIX=[
 ["AI 辅助选型 / 方案","高","较强（BIM + 提案）","高","值得深入"],
 ["AI 制造质检","高","待确认","中高","需确认制造现状"],
 ["设备预测性维护","高","集团已有实践","高","重点关注"],
 ["AI 安装质量","中高","已有公开基础","很高","重点关注"],
 ["AI 维修诊断","高","售后基础强","很高","重点关注"],
 ["智能客户经营","中高","Daikin Care 较强","高","可深化"],
 ["AI 人才培养","中","SE 系统建设中","高","可延伸"],
 ["AI 供应链","高","信息不足","待确认","先调研"]
];

/* ===== 抽屉渲染 ===== */
var drawer=document.getElementById("drawer"),dmask=document.getElementById("dmask"),
    dHead=document.getElementById("dHead"),dBody=document.getElementById("dBody");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function openCap(id){
  var c=CAPS[id]; if(!c) return;
  var tags="";
  if(c.k==="dj"&&c.st) tags+='<span class="db" style="background:'+ST[c.st][1]+'">'+ST[c.st][0]+"</span>";
  if(c.k==="opp"&&c.ot) tags+='<span class="db" style="background:'+OT[c.ot][1]+'">'+OT[c.ot][0]+"</span>";
  tags+='<span class="db" style="background:'+KIND[c.k][1]+'">'+KIND[c.k][0]+"</span>";
  var h='<div class="d-tags">'+tags+'<button class="d-x" onclick="closeCap()">✕</button></div>'+
        '<div class="d-name">'+esc(c.nm)+'</div><div class="d-node">'+esc(c.node)+"</div>";
  var b="";
  if(c.pitch) b+='<div class="d-pitch">'+esc(c.pitch)+"</div>";
  if(c.ind)   b+='<div class="d-sec"><div class="d-lb">行业实践</div><p>'+esc(c.ind)+"</p>"+(c.src?'<div class="d-src">'+esc(c.src)+"</div>":"")+"</div>";
  if(c.dj)    b+='<div class="d-sec"><div class="d-lb">大金现状</div><p>'+esc(c.dj)+"</p></div>";
  if(c.val)   b+='<div class="d-sec"><div class="d-lb">'+(c.k==="opp"?"机会与价值":"对大金的启发")+"</div><p>"+esc(c.val)+"</p></div>";
  if(c.chk){ b+='<div class="d-chk"><div class="d-lb">待客户确认</div><ul>';
    c.chk.forEach(function(q){ b+="<li>"+esc(q)+"</li>"; });
    b+="</ul></div>"; }
  if(id==="m_overview"){
    b+='<table class="mx"><tr><th>方向</th><th>行业成熟度</th><th>大金公开基础</th><th>业务结合度</th><th>当前判断</th></tr>';
    MATRIX.forEach(function(r){ b+="<tr><td class='jd'>"+r[0]+"</td><td>"+r[1]+"</td><td>"+r[2]+"</td><td>"+r[3]+"</td><td>"+r[4]+"</td></tr>"; });
    b+="</table>";
  }
  dHead.innerHTML=h; dBody.innerHTML=b; dBody.scrollTop=0;
  drawer.classList.add("on"); dmask.classList.add("on");
  document.body.style.overflow="hidden";
}
function closeCap(){
  drawer.classList.remove("on"); dmask.classList.remove("on");
  document.body.style.overflow="";
}
window.closeCap=closeCap; window.openCap=openCap;
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-cap]"); if(t) openCap(t.dataset.cap);
});
dmask.addEventListener("click",closeCap);
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeCap(); });
</script>
</body>
</html>
