<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>实操台账导入模板</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f0f3f6;color:#1a1d2e;padding:0 0 60px}
.top{height:46px;background:#217346;color:#fff;display:flex;align-items:center;gap:10px;padding:0 20px}
.top .file-ic{width:22px;height:22px;border-radius:4px;background:#fff;color:#217346;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.top .t{font-size:14px;font-weight:700}
.top .s{font-size:12px;color:rgba(255,255,255,.75);margin-left:auto}
.sheet{max-width:1240px;margin:24px auto 0;background:#fff;border:1px solid #d5dbe3;box-shadow:0 2px 14px rgba(15,23,42,.08);border-radius:6px;overflow:hidden}
.scroll{overflow:auto;max-height:calc(100vh - 190px)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:640px}
th,td{border-right:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;padding:8px 12px;font-size:13px;line-height:1.7;text-align:left;vertical-align:top;background:#fff;white-space:nowrap}
th:last-child,td:last-child{border-right:none}
/* 列字母行 */
.cols th{background:#f8fafc;color:#94a3b8;font-size:11px;font-weight:500;text-align:center;padding:4px 0}
/* 冻结标题行 */
.head th{position:sticky;top:0;z-index:2;background:#edf2ee;color:#217346;font-weight:600;font-size:12.5px;border-bottom:2px solid #217346}
/* 行号列 */
td.rn,th.rn{background:#f8fafc;color:#94a3b8;font-size:11px;text-align:center;width:36px;min-width:36px;padding:8px 0}
.head th.rn{z-index:3}
th.rn{z-index:4}
.sheet-foot{display:flex;align-items:center;gap:0;border-top:1px solid #d5dbe3;background:#f8fafc;padding:0}
.tab{padding:7px 18px;font-size:12.5px;color:#1a1d2e;background:#fff;border-right:1px solid #d5dbe3;border-top:2px solid #217346;font-weight:600}
.tab-sp{flex:1}
.tab-r{padding:0 14px;font-size:11.5px;color:#94a3b8}
</style>
</head>
<body>
<div class="top">
  <div class="file-ic">X</div>
  <div class="t">实操台账导入模板.xlsx</div>
  <div class="s">实操台账 · 批量导入模板</div>
</div>
<div class="sheet">
  <div class="scroll">
    <table>
      <tr class="cols">
        <th class="rn"></th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th>
      </tr>
      <tr class="head">
        <th class="rn"></th>
        <th>姓名</th><th>工号</th><th>考试项目</th><th>实操分数</th><th>年度</th>
      </tr>
      <tr>
        <td class="rn">2</td>
        <td>张三</td><td>SE001</td><td>空调安装实操</td><td>88</td><td>2026</td>
      </tr>
      <tr>
        <td class="rn">3</td>
        <td>张三</td><td>SE001</td><td>故障诊断实操</td><td>92</td><td>2026</td>
      </tr>
      <tr>
        <td class="rn">4</td>
        <td>张三</td><td>SE001</td><td>多联机调试实操</td><td>85</td><td>2026</td>
      </tr>
      <tr>
        <td class="rn">5</td>
        <td>李四</td><td>SE002</td><td>空调安装实操</td><td>86</td><td>2026</td>
      </tr>
      <tr>
        <td class="rn">6</td>
        <td>李四</td><td>SE002</td><td>故障诊断实操</td><td>89</td><td>2026</td>
      </tr>
    </table>
  </div>
  <div class="sheet-foot">
    <div class="tab">实操台账导入模板</div>
    <div class="tab-sp"></div>
    <div class="tab-r">年度填写4位年份，如 2026</div>
  </div>
</div>
</body>
</html>
