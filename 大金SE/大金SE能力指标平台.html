function sortNotices(list) {
  return list.slice().sort((a, b) => (b.time > a.time ? 1 : b.time < a.time ? -1 : 0));
}

/* 新增 / 编辑草稿 */
function openNoticeEdit(id) {
  const n = id ? DEMO.notices.find(x => x.id === id) : null;
  if (n && n.status !== '草稿') { toast('已发布公告不可直接编辑，请先下架', 'error'); return; }
  openModal(modalHead(n ? '编辑公告' : '新增公告', '', true) + `
    <div class="modal-body">
      <div class="form-grid">
        <div class="field2 full"><label><span class="req">*</span>公告标题</label>
          <input class="input" id="nt-title" value="${n ? esc(n.title) : ''}" placeholder="如：关于开展 Q4 理论考试的通知"></div>
        <div class="field2 full"><label><span class="req">*</span>公告内容</label>
          <textarea class="textarea" id="nt-content" style="min-height:130px" placeholder="请输入公告正文">${n ? esc(n.content) : ''}</textarea></div>
        <div class="field2 full" id="nt-range-box"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-act="close-modal">取消</button>
      <button class="btn" data-act="nt-save" data-id="${id || ''}">保存草稿</button>
      <button class="btn btn-primary" data-act="nt-save-publish" data-id="${id || ''}">发布</button></div>`);
  const initVals = n && Array.isArray(n.rangeVals) ? n.rangeVals.slice() : (n && n.rangeVal ? [n.rangeVal] : []);
  window.__ntEdit = { range: (n && n.scopeRange) || '全部', vals: initVals };
  renderNoticeRange();
}
function renderNoticeRange() {
  const box = $('#nt-range-box'); if (!box) return;
  const st = window.__ntEdit || { range: '全部', vals: [] };
  const regions = CONFIG.org.map(r => r.name);
  const offices = CONFIG.org.reduce((a, r) => a.concat(r.offices.map(o => o.name)), []);
  const opts = st.range === '指定地区' ? regions : st.range === '指定事务所' ? offices : [];
  box.innerHTML = `<label><span class="req">*</span>发布范围</label>
    <div class="flex gap8 wrap" style="align-items:flex-start">
      <select class="select" id="nt-range" style="flex:0 0 160px">${['全部', '指定地区', '指定事务所'].map(s => `<option${st.range === s ? ' selected' : ''}>${s}</option>`).join('')}</select>
      ${opts.length ? `<div style="flex:1;min-width:220px;display:flex;flex-wrap:wrap;gap:6px 12px;padding:6px 10px;border:1px solid var(--g200);border-radius:6px;background:#fff">
        ${opts.map(s => `<label style="display:inline-flex;align-items:center;gap:4px;font-size:13px;cursor:pointer">
          <input type="checkbox" data-act="nt-range-val" value="${esc(s)}"${st.vals.includes(s) ? ' checked' : ''}>${esc(s)}</label>`).join('')}
      </div>` : ''}
    </div>`;
  const rs = $('#nt-range');
  if (rs) rs.addEventListener('change', () => {
    window.__ntEdit = { range: rs.value, vals: [] };
    renderNoticeRange();
  });
  box.querySelectorAll('input[data-act="nt-range-val"]').forEach(cb => {
    cb.addEventListener('change', () => {
      const s = window.__ntEdit;
      const v = cb.value;
      const i = s.vals.indexOf(v);
      if (cb.checked && i < 0) s.vals.push(v);
      else if (!cb.checked && i >= 0) s.vals.splice(i, 1);
    });
  });
}
function doNoticeSave(id, publish) {
  const title = (($('#nt-title') || {}).value || '').trim();
  const content = (($('#nt-content') || {}).value || '').trim();
  const st = window.__ntEdit || { range: '全部', vals: [] };
  const range = st.range;
  const vals = st.vals.slice();
  if (range !== '全部' && vals.length === 0) { toast('请选择具体的' + range.replace('指定', ''), 'error'); return; }
  if (!title) { toast('请填写公告标题', 'error'); return; }
  if (!content) { toast('请填写公告内容', 'error'); return; }
  const patch = { title, content, scopeRange: range, rangeVals: vals };
  let n;
  if (id) {
    n = DEMO.notices.find(x => x.id === id);
    Object.assign(n, patch);
  } else {
    const num = DEMO.notices.reduce((m, x) => Math.max(m, +x.id.slice(2)), 0) + 1;
    n = Object.assign({ id: 'NT' + String(num).padStart(2, '0'), status: '草稿', time: '', read: false }, patch);
    DEMO.notices.push(n);
  }
  closeModal();
  if (publish) { publishNotice(n.id); return; }
  n.status = '草稿';
  toast('公告已保存为草稿');
  renderView(APP.view);
}
/* 发布：写入发布时间 + 同步消息中心（不生成待办） */
function publishNotice(id) {
  const n = DEMO.notices.find(x => x.id === id); if (!n) return;
  n.status = '已发布';
  n.time = noticeStamp();
  n.read = false;
  DEMO.msgs.unshift({
    type: '系统公告', cat: '系统', icon: 'ri-megaphone-line',
    text: n.title, time: n.time.slice(5, 16), read: false, todo: false, noticeId: n.id,
  });
  closeModal();
  toast('公告已发布，已同步至相关角色首页与消息中心');
  renderView(APP.view);
}
function noticeStamp() {
  const d = new Date();
  const p = x => String(x).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* 当前角色可见的已发布公告（按发布时间倒序），供顶部公告铃使用 */
function noticesForRole(role, limit) {
  const myOffice = (APP.user && APP.user.office) || '';
  const myRegion = (CONFIG.org.find(r => r.offices.some(o => o.name === myOffice)) || {}).name || '';
  const inRange = n => {
    if (role === 'hq_admin') return true;
    if (!n.scopeRange || n.scopeRange === '全部') return true;
    const vals = Array.isArray(n.rangeVals) ? n.rangeVals : (n.rangeVal ? [n.rangeVal] : []);
    if (n.scopeRange === '指定地区') return vals.includes(myRegion);
    if (n.scopeRange === '指定事务所') return vals.includes(myOffice);
    return true;
  };
  const list = sortNotices(DEMO.notices.filter(n => n.status === '已发布' && inRange(n)));
  return limit ? list.slice(0, limit) : list;
}
/* 顶部公告铃下拉：只展示标题 + 发布时间 + 未读红点，底部「查看更多公告」进入公告列表 */

/* 开始考试（模拟答题） */
let examState = { q: 0, sel: {} };
/* 倒计时独立于答题渲染：仅切题时重置，选中答案重渲染不重置 */
function startExamTimer(sec) {
  clearInterval(window.__examTimer);
  examState.deadline = Date.now() + sec * 1000;
  window.__examTimer = setInterval(() => {
    const remain = Math.max(0, Math.ceil((examState.deadline - Date.now()) / 1000));
    const t = $('#exam-timer');
    if (t) {
      t.innerHTML = `<i class="ri-time-line"></i> 倒计时 ${remain}s`;
      t.className = remain <= 10 ? 'badge badge-red' : 'badge badge-amber';
    }
    if (remain <= 0) { clearInterval(window.__examTimer); openExamResult(); }
  }, 1000);
}
function openExamTaking() {
  examState = { q: 0, sel: {} };
  const qs = [
    { type: '单选', text: '售后服务工程师在与客户沟通时，以下哪种做法是正确的？', opts: ['A. 直接告知客户无法解决', 'B. 专业解答并告知处理进度', 'C. 使用技术术语不作解释', 'D. 只处理故障不回应咨询'], ans: 1 },
    { type: '判断', text: '售后维修完成后，即使故障已排除，也必须进行试运行确认，并请客户签字确认。', opts: ['A. 正确', 'B. 错误'], ans: 0 },
    { type: '单选', text: '多台室外机地址设置冲突，应优先进行以下哪项操作？', opts: ['A. 更换主机', 'B. 检查并重新设置地址拨码', 'C. 调整室内温度设定', 'D. 重启电源'], ans: 1 },
  ];
  window.__examQs = qs;
  renderExamStep(qs, true);
}
function renderExamStep(qs, resetTimer) {
  const q = examState.q;
  const item = qs[q];
  const sel = examState.sel[q];
  const total = qs.length;
  const sec = Math.max(1, 60 - q * 12);
  if (resetTimer) startExamTimer(sec);
  openModal(modalHead('2026年Q3空调基础能力测评', `共 ${total} 题 · 每题限时`, '') + `
    <div class="modal-body">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <span class="badge badge-blue">${item.type}</span>
        <span style="font-size:12px;color:var(--g500)">第 ${q + 1} / ${total} 题</span>
        <div style="flex:1"></div>
        <span class="badge badge-amber" id="exam-timer"><i class="ri-time-line"></i> 倒计时 ${sec}s</span>
      </div>
      <div class="q-card"><div style="font-size:14.5px;font-weight:600;color:var(--g800);line-height:1.7">${item.text}</div>
        ${item.opts.map((o, i) => `<div class="opt${sel === i ? ' sel' : ''}" data-exam-opt="${i}">
          <span class="o-tag">${String.fromCharCode(65 + i)}</span><span>${o}</span>
          ${sel === i ? '<i class="ri-check-line" style="margin-left:auto;color:var(--e500)"></i>' : ''}</div>`).join('')}
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-exam-prev ${q === 0 ? 'disabled' : ''}>上一题</button>
      <div style="flex:1"></div>
      <button class="btn btn-primary" data-exam-${q === total - 1 ? 'submit' : 'next'}>${q === total - 1 ? '交卷' : '下一题'}</button></div>`);
  // 绑定答题事件
  $$('[data-exam-opt]').forEach(el => el.addEventListener('click', () => {
    examState.sel[q] = +el.dataset.examOpt;
    renderExamStep(qs, false);
  }));
  $$('[data-exam-prev]').forEach(el => el.addEventListener('click', () => { if (examState.q > 0) { examState.q--; renderExamStep(qs, true); } }));
  $$('[data-exam-next]').forEach(el => el.addEventListener('click', () => { examState.q++; renderExamStep(qs, true); }));
  $$('[data-exam-submit]').forEach(el => el.addEventListener('click', () => openExamResult()));
}
function openExamResult() {
  clearInterval(window.__examTimer);
  const right = 3;
  const score = 95;

}

    const remain = Math.max(0, Math.round((examSEState.deadline - Date.now()) / 1000));
    const t = $('#se-exam-timer');
    if (t) {
      const mm = String(Math.floor(remain / 60)).padStart(2, '0');

      t.innerHTML = `<i class="ri-time-line"></i> ${mm}:${ss}`;
      t.className = remain <= 60 ? 'badge badge-red' : 'badge badge-amber';
    }
    if (remain <= 0) { clearInterval(window.__seTimer); submitSEExam(true); }
  };
  tick();
  window.__seTimer = setInterval(tick, 1000);
}

      <button class="btn" data-act="exam-se-prev" ${q === 0 ? 'disabled' : ''}><i class="ri-arrow-left-line"></i>上一题</button>
      <div style="flex:1"></div>
      <button class="btn" data-act="exam-se-next" ${q === total - 1 ? 'disabled' : ''}>下一题<i class="ri-arrow-right-line"></i></button>
      <button class="btn btn-primary" data-act="exam-se-confirm"><i class="ri-send-plane-line"></i>提交试卷</button>
    </div>`);
  // 选项点击：单选替换，多选切换
  $$('[data-se-opt]').forEach(el => el.addEventListener('click', () => {
    const i = +el.dataset.seOpt;
    const arr = examSEState.sel[q] || [];
    if (isMulti) {
      const p = arr.indexOf(i);
      if (p >= 0) arr.splice(p, 1); else arr.push(i);

}

/* 阅卷、写入本次会话记录、展示成绩 */
function submitSEExam(auto) {
  clearInterval(window.__seTimer);
  const st = examSEState;
  const qs = st.qs;
  const detail = qs.map((q, qi) => {
    const given = (st.sel[qi] || []).slice().sort((a, b) => a - b);
    const ok = given.length > 0 && JSON.stringify(given) === JSON.stringify(q.ans.slice().sort((a, b) => a - b));
    return { given, ok, gain: ok ? q.score : 0 };
  });
  const score = detail.reduce((s, d) => s + d.gain, 0);
  const rightCnt = detail.filter(d => d.ok).length;
  const usedMin = Math.max(1, Math.round((Date.now() - st.startAt) / 60000));
  // 写入本会话补充记录，供已完成 tab 与答卷复用
  window.__seExtra = window.__seExtra || {};
  const arr = window.__seExtra[st.id] = window.__seExtra[st.id] || [];
  const baseTries = (st.rec.tries || 0);
  const nextT = baseTries + arr.length + 1;
  const stamp = seNowStamp();
  arr.push({ t: nextT, score, detail, dur: usedMin, done: stamp });
  const rec = seExams().find(r => r.id === st.id);
  const passed = score >= st.rec.passLine;
  openModal(modalHead(auto ? '已自动交卷' : '交卷成功', esc(st.rec.title)) + `
    <div class="modal-body" style="text-align:center;padding:30px 22px">
      <div style="width:88px;height:88px;border-radius:50%;background:${passed ? 'var(--e100)' : '#fef3c7'};display:flex;align-items:center;justify-content:center;margin:0 auto 14px">
        <i class="${passed ? 'ri-check-line' : 'ri-close-line'}" style="font-size:40px;color:${passed ? 'var(--e600)' : 'var(--a600)'}"></i></div>
      <div style="font-size:15px;font-weight:700;color:var(--g800)">考试完成</div>
      <div style="font-size:42px;font-weight:800;color:${passed ? 'var(--e600)' : 'var(--a600)'};margin-top:16px">${score}<small style="font-size:16px">/ ${st.rec.total}</small></div>
      <div style="margin-top:8px"><span class="badge ${passed ? 'badge-green' : 'badge-red'}">${passed ? '通过' : '未通过'}</span></div>
    </div>
    <div class="modal-foot"><button class="btn" data-act="exam-se-viewsheet" data-id="${st.id}"><i class="ri-file-list-2-line"></i>查看答题详情</button>
      <button class="btn btn-primary" data-act="exam-se-done">返回我的考试</button></div>`);
}

/* 会话内交卷时间戳（避免 Date 依赖，采用截止/当前描述） */
function seNowStamp() {

}

function doPlanSaveModal(publish) {
  planPull();
  const d = APP.planDraft; if (!d) return;
  if (!d.title) { toast('请填写考试名称', 'error'); return; }
  if (d.pass <= 0 || d.pass > 100) { toast('及格分数线须在 1~100 之间', 'error'); return; }
  let total = 0, scopeLabel;
  if (d.mode === '固定选题') {
    const fx = planFixedSummary();
    if (publish && fx.cnt === 0) { toast('请先选择试题', 'error'); return; }
    total = fx.sum;
  } else {
    if (publish && d.cats.length === 0) { toast('请选择题目分类范围', 'error'); return; }
    const tc = d.types.单选 + d.types.多选 + d.types.判断;
    if (publish && tc === 0) { toast('请设置题型数量', 'error'); return; }
  }
  scopeLabel = d.region ? `${d.region} · ${d.office || '全部事务所'}` : (d.office ? `全部区域 · ${d.office}` : '全部区域 · 全部事务所');
  const people = scopeMatchCount();
  const rec = {
    title: d.title, desc: d.desc, start: d.start, end: d.end,
    dur: d.dur, pass: d.pass, maxTry: d.maxtry, cool: d.cool,
    mode: d.mode, cats: d.cats.slice(), qids: d.qids.slice(),
    types: Object.assign({}, d.types), diff: Object.assign({}, d.diff),
    scope: scopeLabel, people: publish ? people : 0,
    status: publish ? '未开始' : '草稿',
    paper: planPaperLabel(d),
  };
  if (d.id) {
    const p = DEMO.examPlans.find(x => x.id === d.id);
    rec.created = p.created;
    if (!publish) rec.status = p.status === '草稿' ? '草稿' : p.status;
    Object.assign(p, rec);
  } else {
    rec.id = DEMO.examPlans.reduce((m, x) => Math.max(m, +x.id), 100) + 1;
    rec.created = '2026-08-26';
    DEMO.examPlans.push(rec);
  }
  APP.planDraft = null;
  closeModal();
  toast(publish ? '考试已发布' : '草稿已保存');
  renderView(APP.view);
}
function planPaperLabel(d) {
  if (d.mode === '固定选题') {
    const qs = d.qids.map(id => DEMO.questions.find(q => q.id === id)).filter(Boolean);
    const c = t => qs.filter(q => q.type === t).length;
    return `固定选题（单选×${c('单选')} · 多选×${c('多选')} · 判断×${c('判断')}）`;
  }
  return `随机抽题（单选×${d.types.单选} · 多选×${d.types.多选} · 判断×${d.types.判断}）`;
}

    const s = examStats(p);
    members = s.rows;

    // 未开始 / 草稿：按范围展示计划参考人员（未作答）
    const parts = examParticipants(p);

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 32px">
        ${[['考试名称', p.title], ['状态', p.status], ['开始时间', p.start || '—'], ['结束时间', p.end || '—'],
           ['考试时长', p.dur + ' 分钟'], ['参考人数', (p.people || 0) + ' 人'],
           ['总分', tot + ' 分'], ['及格分', p.pass + ' 分'],
           ['最大考试次数', p.maxTry + ' 次'], ['补考间隔', p.cool + ' 天'],
           ['组卷方式', p.mode || '固定选题'], ['参考范围', p.scope],
           ['创建人', p.creator || '张敏'], ['创建时间', p.created]].map(r =>
          `<div class="kv"><span class="k">${r[0]}</span><span class="v">${esc(String(r[1]))}</span></div>`).join('')}
      </div>
      <div class="kv"><span class="k">考试说明</span><span class="v">${esc(p.desc || '—')}</span></div>
      <div class="kv" style="border-bottom:none"><span class="k">试题情况</span><span class="v">共 ${pqs.length} 题　单选 ${cnt('单选')}　多选 ${cnt('多选')}　判断 ${cnt('判断')}</span></div>
    </div>
    <div class="card"><div class="card-title">人员明细<span class="sub">共 ${members.length} 人</span></div>
      <div style="max-height:340px;overflow:auto;border:1px solid var(--g200);border-radius:8px">
        <table class="tbl" style="margin:0">
          <tr><th>SE姓名</th><th>地区</th><th>事务所</th>${started ? '<th class="right">成绩</th><th>是否通过</th>' : '<th>状态</th>'}</tr>
          ${members.map(r => `<tr>
            <td class="fw600">${esc(r.name)}</td>
            <td style="color:var(--g500)">${esc(r.region)}</td>
            <td style="color:var(--g500)">${esc(r.office)}</td>
            ${started

                  ? `<td class="right num"><b>${r.best}</b><span style="color:var(--g400)">/${r.total}</span></td><td><span class="badge ${r.pass ? 'badge-green' : 'badge-red'}">${r.pass ? '通过' : '未通过'}</span></td>`

function h32(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; }
function srand() { return h32(Array.prototype.join.call(arguments, '|')); }
function regionOf(office) { const r = CONFIG.org.find(g => g.offices.some(o => o.name === office)); return r ? r.name : '—'; }
const SURNAMES = '张王李赵陈刘杨黄周吴徐孙马朱胡林郭何高罗郑梁谢宋唐许韩冯邓曹彭曾肖田董袁潘于蒋蔡余杜叶程苏魏吕丁任沈姚卢姜崔钟谭陆汪范金石廖贾夏韦付方白邹孟熊秦邱江';
const GIVEN = '伟芳娜秀英敏静丽强磊军洋勇艳杰娟涛明超秀霞平刚桂英建华文博宇轩浩然子涵一鸣佳怡思远晓峰志强雅婷嘉豪梓萱俊杰';
function planOffices(p) {
  const sc = p.scope || '';
  let names = CONFIG.org.flatMap(g => g.offices.map(o => o.name));
  if (sc.indexOf('华东') >= 0) names = (CONFIG.org.find(g => g.name === '华东区域') || { offices: [] }).offices.map(o => o.name);
  else if (sc.indexOf('华南') >= 0) names = (CONFIG.org.find(g => g.name === '华南区域') || { offices: [] }).offices.map(o => o.name);
  return names.length ? names : CONFIG.org.flatMap(g => g.offices.map(o => o.name));
}
/* 发布后试卷冻结：固定选题取所选题目；随机抽题按分类范围+题型数量+难度分布确定性抽取（seed=计划id，全部考生同卷） */
function planQuestions(p) {
  const active = DEMO.questions.filter(q => q.status === '启用');
  if (!p) return active;
  if (p.mode === '固定选题' && p.qids && p.qids.length) {
    return p.qids.map(id => active.find(q => q.id === id)).filter(Boolean);
  }
  if (p.mode === '随机抽题' && p.types) {
    const cats = (p.cats && p.cats.length) ? p.cats : BANK_CATS();
    const pool = active.filter(q => cats.includes(q.cat));
    const pick = [];
    [['单选', p.types.单选], ['多选', p.types.多选], ['判断', p.types.判断]].forEach(([tp, n]) => {
      const cand = pool.filter(q => q.type === tp).sort((a, b) => srand(p.id, 'pick', a.id) - srand(p.id, 'pick', b.id));
      for (let i = 0; i < Math.min(n || 0, cand.length); i++) pick.push(cand[i]);
    });
    return pick.length ? pick : active;
  }
  return active;
}
function tryAnswers(sid, t, qs, skill) {
  return qs.map(q => {
    const correct = srand(sid, 'c', t, q.id) < Math.min(0.85, skill + (q.diff === '简单' ? 0.08 : q.diff === '困难' ? -0.2 : 0));
    let given;
    if (correct) given = q.ans.slice();
    else {
      const wrong = q.opts.map((_, i) => i).filter(i => q.ans.indexOf(i) < 0);
      if (q.type === '多选') { const cnt = 1 + Math.floor(srand(sid, 'w', t, q.id) * Math.max(1, q.opts.length - 1)); given = q.opts.map((_, i) => i).sort((a, b) => srand(sid, a, q.id) - srand(sid, b, q.id)).slice(0, cnt).sort((a, b) => a - b); if (JSON.stringify(given) === JSON.stringify(q.ans.slice().sort())) given = wrong.length ? [wrong[0]] : [0]; }
      else given = wrong.length ? [wrong[Math.floor(srand(sid, 'w', t, q.id) * wrong.length)]] : [0];
    }
    const ok = JSON.stringify(given.slice().sort()) === JSON.stringify(q.ans.slice().sort());
    return { given, ok, gain: ok ? q.score : 0 };
  });
}
function examParticipants(p) {
  const offices = planOffices(p);
  const qs = planQuestions(p);
  const total = qs.reduce((s, q) => s + q.score, 0);
  const passLine = Math.ceil(p.pass / 100 * total);
  const rows = [];
  for (let i = 0; i < p.people; i++) {
    const sid = p.id + '-' + i;
    const office = offices[i % offices.length];
    const name = SURNAMES[Math.floor(srand(sid, 'sn') * SURNAMES.length)] + GIVEN[Math.floor(srand(sid, 'g1') * GIVEN.length)] + (srand(sid, 'g2') < 0.55 ? GIVEN[Math.floor(srand(sid, 'g3') * GIVEN.length)] : '');
    const attempted = srand(sid, 'att') < (p.status === '进行中' ? 0.78 : 0.9);
    const base = 0.3 + srand(sid, 'sk') * 0.4;
    let tries = 0;
    if (attempted) { tries = 1; if (p.maxTry > 1 && srand(sid, 't2') < 0.4) tries = 2; if (p.maxTry > 2 && tries === 2 && srand(sid, 't3') < 0.25) tries = 3; }
    const attempts = [];
    for (let t = 1; t <= tries; t++) {
      const skill = Math.min(0.97, base + (t - 1) * 0.12);
      const detail = tryAnswers(sid, t, qs, skill);
      const score = detail.reduce((s, d) => s + d.gain, 0);
      const dur = Math.round(p.dur * (0.45 + srand(sid, 'tm', t) * 0.5));
      attempts.push({ t, score, dur, detail });
    }
    let best = 0, bestTry = 0;
    attempts.forEach(a => { if (a.score >= best) { best = a.score; bestTry = a.t; } });
    const lastSubmit = attempted ? ((p.start || '2026-08-10 09:00').slice(0, 10) + ' ' + String(9 + (i % 8)).padStart(2, '0') + ':' + String((i * 7) % 60).padStart(2, '0')) : '';
    rows.push({ sid, name, office, region: regionOf(office), attempted, tries, attempts, best, bestTry, total, passLine, pass: attempted && best >= passLine, lastSubmit });
  }
  rows.sort((a, b) => (b.attempted - a.attempted) || (b.best - a.best) || (a.sid < b.sid ? -1 : 1));
  let rk = 0, prev = null;
  rows.forEach((r, idx) => { if (r.attempted) { if (prev === null || r.best !== prev) rk = idx + 1; r.rank = rk; prev = r.best; } else r.rank = '—'; });
  return rows;
}
function examStats(p) {
  const rows = examParticipants(p);
  const done = rows.filter(r => r.attempted);
  const avg = done.length ? Math.round(done.reduce((s, r) => s + r.best, 0) / done.length) : 0;
  const passed = done.filter(r => r.pass).length;
  return { people: rows.length, done: done.length, avg, passed, passRate: done.length ? Math.round(passed / done.length * 100) : 0, rows, total: rows.length ? rows[0].total : 0 };
}

          <div style="font-size:11.5px;color:var(--g500);margin-top:2px">含字段：${meta.fields}</div></div>
          <button class="btn btn-outline btn-sm" data-act="toast" data-msg="模板已下载"><i class="ri-download-2-line"></i>下载模板</button>
        </div>
      </div>
      <div class="upload-box mt16" data-act="perf-imp-step" data-kind="${kind}" data-step="2">
        <i class="ri-upload-cloud-2-line"></i><div class="up-t">点击上传整理好的数据文件</div>
        <div class="up-s">支持 .xlsx / .csv，单文件 ≤ 10MB</div></div>
    </div>
    <div class="modal-foot"><button class="btn" data-act="close-modal">取消</button>
      <button class="btn btn-primary" data-act="perf-imp-step" data-kind="${kind}" data-step="2">下一步：上传</button></div>`);
}
function perfImpSteps(cur) {
  return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:20px">
    ${['下载模板', '上传文件', '校验', '导入'].map((s, i) => `
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:${i + 1 <= cur ? 'var(--e600)' : 'var(--g400)'}">
        <span style="width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:${i + 1 <= cur ? 'var(--e500)' : 'var(--g200)'};color:${i + 1 <= cur ? '#fff' : 'var(--g500)'}">${i + 1}</span>${s}</div>
      ${i < 3 ? '<div style="flex:1;height:1px;background:var(--g200)"></div>' : ''}`).join('')}
  </div>`;
}
function perfImpStep2(kind) {
  const meta = PERF_IMPORT_META[kind] || PERF_IMPORT_META.order;
  const fail = 5, ok = meta.total - fail;
  openModal(modalHead('导入' + meta.title, '') + `
    <div class="modal-body">
      ${perfImpSteps(3)}
      <div class="card" style="box-shadow:none;border:1px solid var(--g200);display:flex;align-items:center;gap:12px">
        <div class="stat-ic ic-green"><i class="ri-file-excel-2-line"></i></div>
        <div style="flex:1"><div style="font-size:13.5px;font-weight:600">${meta.file.replace('模板', '_' + (kind === 'kpi' ? '2026-07' : '2026年7月'))}</div>
        <div style="font-size:12px;color:var(--e600)">校验完成：成功 ${ok} 条 · 失败 ${fail} 条</div></div>
        <span class="badge badge-green">已上传</span></div>
      <div class="divider"></div>
      <div style="display:flex;align-items:center;margin-bottom:8px"><div style="font-size:13px;font-weight:700;color:var(--g700)">失败明细</div>
        <div style="flex:1"></div><button class="btn btn-sm" data-act="toast" data-msg="下载失败数据明细"><i class="ri-download-2-line"></i>下载失败数据</button></div>
      <table class="tbl"><tr><th>行号</th><th>${kind === 'order' ? '作业单号' : 'SE编码'}</th><th>失败原因</th></tr>
        ${(kind === 'order'
          ? [['12', 'WO2026080123', 'SE编码无法匹配'], ['45', 'WO2026080377', '日期格式错误'], ['67', 'WO2026080512', '产值为空（必填）'], ['88', 'WO2026080690', '重复数据'], ['103', 'WO2026080844', '事务所/地区无法匹配']]
          : [['7', 'SE010', 'SE编码无法匹配'], ['15', 'SE017', '一次完成率格式错误'], ['22', 'SE022', '统计周期为空（必填）'], ['31', 'SE031', '重复数据（同周期已存在）'], ['40', 'SE040', '事务所/地区无法匹配']]
        ).map(r => `<tr><td>${r[0]}</td><td class="mono">${r[1]}</td><td style="color:var(--a600)">${r[2]}</td></tr>`).join('')}
      </table>
    </div>
    <div class="modal-foot"><button class="btn" data-act="perf-import" data-kind="${kind}">上一步</button>
      <button class="btn btn-primary" data-act="perf-imp-step" data-kind="${kind}" data-step="4">确认导入 ${ok} 条</button></div>`);
}
function perfImpStep4(kind) {
  const meta = PERF_IMPORT_META[kind] || PERF_IMPORT_META.order;
  const fail = 5, ok = meta.total - fail;
  openModal(modalHead('导入完成', '') + `
    <div class="modal-body">
      ${perfImpSteps(4)}
      <div style="text-align:center;padding:10px 0 4px">
        <div style="width:84px;height:84px;border-radius:50%;background:var(--e100);display:flex;align-items:center;justify-content:center;margin:0 auto 14px">
          <i class="ri-check-line" style="font-size:38px;color:var(--e600)"></i></div>
        <div style="font-size:15px;font-weight:700;color:var(--g800)">导入成功</div>
        <div style="font-size:12.5px;color:var(--g500);margin-top:6px">成功 ${ok} 条 · 失败 ${fail} 条</div>
      </div>
    </div>
    <div class="modal-foot">${fail ? '<button class="btn" data-act="toast" data-msg="下载失败数据明细">下载失败数据</button>' : ''}<button class="btn btn-primary" data-act="close-modal">完成</button></div>`);
}
/* 季度评分 */
function genQuarter() {
  openModal(modalHead('生成季度评分', '') + `
    <div class="modal-body">
      <div class="alert alert-blue" style="margin-bottom:0"><i class="ri-information-line"></i>将为 <b>386</b> 名工程师固化 <b>2026年Q3</b> 技术力评分，生成后历史结果不可修改。</div>
      <div class="kv mt16" style="border:none"><span class="k">评分范围</span><span class="v">全部 SE（全国）</span></div>

/* 个人中心 */
function openProfile() {

    <div class="card" style="box-shadow:none;border:1px solid var(--g200)">
      <div style="display:flex;align-items:center;gap:16px;padding:4px 0 14px;border-bottom:1px solid var(--g100)">
        <div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#10b981,#047857);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700">${u.name[0]}</div>
        <div><div style="font-size:17px;font-weight:800;color:var(--g900)">${esc(u.name)}</div>
        <div style="margin-top:6px"><span class="badge badge-green">${roleName(u.role)}</span></div></div>
      </div>
      <div style="padding-top:8px">
        <div class="kv"><span class="k">登录账号</span><span class="v">${esc(u.user)}</span></div>
        <div class="kv"><span class="k">邮箱</span><span class="v">${esc(u.email)}</span></div>
        <div class="kv"><span class="k">手机号</span><span class="v">${esc(u.phone)}</span></div>
        <div class="kv"><span class="k">所属组织</span><span class="v">${esc(u.office)}</span></div>
        <div class="kv"><span class="k">最后登录</span><span class="v">2026-08-25 10:42</span></div>
      </div>
    </div>
    ${u.role === 'se' ? (() => { const me = DEMO.members[SE_SELF_IDX]; const up = !!me.idCard; return `
    <div class="card mt16" style="box-shadow:none;border:1px solid var(--g200)">
      <div class="card-title"><i class="ri-idcard-line" style="color:var(--e500)"></i>身份证<span class="sub">个人公共材料，上传一次全部证书复用</span></div>
      <div class="m-row"><div><div class="ml">身份证正面（人像面）</div><div class="mh">${up ? '已上传' : '未上传'}</div></div>${up ? '<div><span class="badge badge-green">已上传</span> <button class="btn btn-sm" data-act="toast" data-msg="查看身份证正面">查看</button> <button class="btn btn-sm" data-act="toast" data-msg="选择身份证正面图片重新上传">重新上传</button></div>' : '<button class="btn btn-sm btn-primary" data-act="toast" data-msg="选择身份证正面图片">上传</button>'}</div>
      <div class="m-row" style="border-bottom:none"><div><div class="ml">身份证反面（国徽面）</div><div class="mh">${up ? '已上传' : '未上传'}</div></div>${up ? '<div><span class="badge badge-green">已上传</span> <button class="btn btn-sm" data-act="toast" data-msg="查看身份证反面">查看</button> <button class="btn btn-sm" data-act="toast" data-msg="选择身份证反面图片重新上传">重新上传</button></div>' : '<button class="btn btn-sm btn-primary" data-act="toast" data-msg="选择身份证反面图片">上传</button>'}</div>
    </div>`; })() : ''}
    `);
}

/* 修改密码 */
function openPwdModal() {
  openModal(modalHead('修改密码', '') + `
    <div class="modal-body">
      <div class="field2" style="margin-bottom:16px"><label>当前密码</label><input class="input" type="password" placeholder="请输入当前密码"></div>
      <div class="field2" style="margin-bottom:16px"><label>新密码</label><input class="input" type="password" placeholder="请输入新密码（8 位以上）"></div>
      <div class="field2"><label>确认新密码</label><input class="input" type="password" placeholder="请再次输入新密码"></div>
    </div>
    <div class="modal-foot"><button class="btn" data-act="close-modal">取消</button>
      <button class="btn btn-primary" data-act="save-toast" data-msg="密码修改成功">确认修改</button></div>`);
}

/* 指标下钻 */
function metricDetail(idx) {
  const m = CONFIG.metrics[idx];
  const dim = dimName(m.dim);
  openDrawer(drawerHead(m.label[0], '指标明细 — ' + esc(m.label), `所属维度：${dim}`) + `
    <div class="grid grid-3">
      <div class="card" style="padding:14px;box-shadow:none;border:1px solid var(--g200)"><div class="stat-lab">得分</div><div class="stat-val" style="font-size:20px">${m.score}</div></div>
      <div class="card" style="padding:14px;box-shadow:none;border:1px solid var(--g200)"><div class="stat-lab">权重</div><div class="stat-val" style="font-size:20px">${m.weight}</div></div>
      <div class="card" style="padding:14px;box-shadow:none;border:1px solid var(--g200)"><div class="stat-lab">加权得分</div><div class="stat-val" style="font-size:20px;color:var(--e600)">${m.weighted}</div></div>
    </div>
    <div class="card mt16"><div class="card-title"><i class="ri-information-line" style="color:var(--e500)"></i>得分说明</div>
      <p style="font-size:13px;color:var(--g600);line-height:1.9">${m.label} 当前原始数据为 <b>${m.raw}</b>，按评分规则映射为 <b>${m.score} 分</b>。该项在「${dim}」维度下权重 ${m.weight}，对综合技术力贡献 <b>${m.weighted}</b>。</p>
    </div>
    <div class="card mt16"><div class="card-title"><i class="ri-line-chart-line" style="color:var(--e500)"></i>近 6 个月趋势</div>
      ${lineChartHTML([76, 79, 80, 82, 85, m.score].map((v, i) => ({ label: ['2月', '3月', '4月', '5月', '6月', '7月'][i], value: v })), { id: 'md' + idx })}</div>`);
}

/* ================= 启动 ================= */
/* 演示模式：打开即自动登录为售后工程师视角（免输入账号密码）；右上角"退出登录"可返回登录页切换其他角色 */
(function autoLogin() {
  const acct = ACCOUNTS.find(a => a.role === 'se');
  APP.user = acct;
  APP.role = acct.role;
  APP.view = firstView(acct.role);
  APP.tab = {};
  renderShell();
  toast('演示账号已自动登录：售后工程师 张明辉（可退出后切换其他角色）', 'info');
})();

</script>
