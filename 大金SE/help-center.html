<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SE能力评价系统帮助中心</title>
<style>
:root{
  --green:#0f7a4d; --green-dark:#0a5a38; --green-deep:#073d26;
  --green-bg:#eef7f2; --line:#e4e9e6; --text:#24312a; --muted:#6b7a72;
  --note-bg:#fff8e6; --note-line:#e6c96a; --note-text:#7a5c12;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;color:var(--text);background:#fff;font-size:14px;line-height:1.75}

/* ---------- 顶栏 ---------- */
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:var(--green-deep);color:#fff;display:flex;align-items:center;gap:16px;padding:0 20px;z-index:50}
.topbar .brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;white-space:nowrap}
.topbar .brand .logo{width:26px;height:26px;border-radius:6px;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:14px}
.menu-btn{display:none;background:none;border:1px solid rgba(255,255,255,.35);border-radius:6px;color:#fff;width:32px;height:32px;cursor:pointer;font-size:16px}
.search-wrap{position:relative;flex:1;max-width:460px}
.search-wrap input{width:100%;height:34px;border-radius:17px;border:none;padding:0 16px 0 36px;font-size:13px;background:rgba(255,255,255,.12);color:#fff;outline:none}
.search-wrap input::placeholder{color:rgba(255,255,255,.55)}
.search-wrap .icon{position:absolute;left:12px;top:9px;opacity:.7}
.search-results{position:absolute;top:40px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:380px;overflow:auto;display:none;z-index:60}
.search-results .sr-item{padding:9px 14px;cursor:pointer;border-bottom:1px solid #f2f4f3}
.search-results .sr-item:last-child{border-bottom:none}
.search-results .sr-item:hover{background:var(--green-bg)}
.search-results .sr-item .t{font-weight:600;font-size:13px}
.search-results .sr-item .r{color:var(--muted);font-size:12px;margin-left:8px}
.search-results .sr-item .snip{color:var(--muted);font-size:12px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.search-results .sr-empty{padding:14px;color:var(--muted);font-size:13px;text-align:center}
.back-home{white-space:nowrap;background:var(--green);border:none;color:#fff;border-radius:17px;padding:7px 16px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block;margin-left:auto}
.back-home:hover{background:var(--green-dark)}

/* ---------- 布局 ---------- */
.layout{display:flex;padding-top:56px;min-height:100vh}
.sidebar{width:264px;flex-shrink:0;border-right:1px solid var(--line);position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;background:#fafbfa;padding:12px 0 40px}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:980px}

/* ---------- 目录 ---------- */
.cat{margin-bottom:4px}
.cat-head{display:flex;align-items:center;gap:8px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:14px;color:var(--green-deep);border-radius:8px;user-select:none}
.cat-head:hover{background:var(--green-bg)}
.cat-head .arrow{margin-left:auto;font-size:11px;color:var(--muted);transition:transform .2s}
.cat.open .cat-head .arrow{transform:rotate(90deg)}
.cat-body{display:none;padding:2px 0 4px}
.cat.open .cat-body{display:block}
.grp-label{padding:8px 16px 3px 32px;font-size:12px;color:var(--muted);font-weight:600}
.nav-item{display:block;padding:7px 16px 7px 40px;color:var(--text);cursor:pointer;font-size:13px;text-decoration:none;border-left:3px solid transparent}
.nav-item:hover{background:var(--green-bg);color:var(--green-dark)}
.nav-item.active{background:var(--green-bg);color:var(--green-dark);font-weight:600;border-left-color:var(--green)}
.nav-item .no{color:var(--muted);font-size:12px;margin-right:6px}
.nav-item.active .no{color:var(--green)}

/* ---------- 面包屑 ---------- */
.crumb{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.crumb b{color:var(--green-dark);font-weight:600}
.pending-tag{display:inline-block;background:var(--note-bg);border:1px solid var(--note-line);color:var(--note-text);font-size:11px;border-radius:4px;padding:1px 7px;margin-left:8px;vertical-align:2px}

/* ---------- 内容 ---------- */
.f-title{font-size:22px;font-weight:700;color:var(--green-deep);margin:0 0 20px;padding-bottom:12px;border-bottom:2px solid var(--green)}
.block{margin-bottom:14px}
.block.kv{padding:10px 14px;background:var(--green-bg);border-left:3px solid var(--green);border-radius:0 8px 8px 0;color:var(--green-deep)}
.block.note{padding:10px 14px;background:var(--note-bg);border-left:3px solid var(--note-line);border-radius:0 8px 8px 0;color:var(--note-text)}
.step-h{font-size:15px;font-weight:700;color:var(--green-dark);margin:22px 0 8px;padding-left:10px;border-left:4px solid var(--green)}
.fig{margin:14px 0 20px;text-align:center}
.fig img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 10px rgba(10,90,56,.08);cursor:zoom-in;transition:box-shadow .15s}
.fig img:hover{box-shadow:0 4px 18px rgba(10,90,56,.2)}
.fig .cap{font-size:12px;color:var(--muted);margin-top:6px}
.fig .cap::before{content:"▣ ";color:var(--green)}

/* ---------- 图片放大 ---------- */
.lightbox{position:fixed;inset:0;background:rgba(7,30,20,.82);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;padding:30px;cursor:zoom-out}
.lightbox.show{display:flex}
.lightbox img{max-width:94vw;max-height:86vh;border-radius:6px;background:#fff}
.lightbox .lb-cap{color:#fff;font-size:13px;margin-top:12px;opacity:.85}
.lightbox .lb-close{position:absolute;top:16px;right:22px;color:#fff;font-size:28px;cursor:pointer;opacity:.8}
.lightbox .lb-close:hover{opacity:1}

/* ---------- 遮罩（移动端目录） ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:none}
.mask.show{display:block}

footer{color:var(--muted);font-size:12px;padding:24px 0 30px;border-top:1px solid var(--line);margin-top:40px}

@media (max-width:860px){
  .menu-btn{display:block}
  .sidebar{position:fixed;left:-280px;z-index:45;transition:left .25s;box-shadow:4px 0 16px rgba(0,0,0,.15)}
  .sidebar.show{left:0}
  .main{padding:20px 16px 60px}
  .search-wrap{max-width:none}
  .back-home{padding:7px 10px}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="menu-btn" id="menuBtn" title="目录">☰</button>
  <div class="brand"><span class="logo">📖</span>SE能力评价系统帮助中心</div>
  <div class="search-wrap">
    <span class="icon">🔍</span>
    <input id="searchInput" type="text" placeholder="搜索功能名称或正文关键词" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
  <a class="back-home" href="./demo.html#/login">返回首页</a>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>
<div class="mask" id="mask"></div>
<div class="lightbox" id="lightbox"><span class="lb-close">✕</span><img id="lbImg" alt=""><div class="lb-cap" id="lbCap"></div></div>

<script src="./data/help-content.js"></script>
<script>
(function(){
'use strict';
var D = window.HELP_DATA;
var $ = function(s){ return document.querySelector(s); };
var sidebar = $('#sidebar'), main = $('#main');
var IMG = './assets/help/images/';

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---------- 构建左侧目录 ---------- */
/* 序号：按角色菜单顺序连续编号。无分组标头的一级分类用 1,2,3…；有分组标头的用「组序.项序」 */
var NO = {}; /* roleKey/fid -> 显示序号 */
function computeNos(){
  NO = {};
  D.toc.forEach(function(cat){
    var gIdx = 0;
    cat.groups.forEach(function(g){
      var labeled = !!g.label;
      if (labeled) gIdx++;
      g.items.forEach(function(it, i){
        NO[cat.key + '/' + (it.feature || it.placeholder)] = labeled ? (gIdx + '.' + (i+1)) : String(i+1);
      });
    });
  });
}
function tocItemHtml(roleKey, it, no){
  var f = D.features[it.feature];
  var label = it.label || (f ? f.title : it.feature);
  var href = '#/' + roleKey + '/' + (it.feature || it.placeholder);
  return '<a class="nav-item" data-role="' + roleKey + '" data-fid="' + esc(it.feature||'') + '" data-ph="' + esc(it.placeholder||'') + '" href="' + href + '">' + (no?'<span class="no">'+no+'</span>':'') + esc(label) + '</a>';
}
function buildSidebar(){
  computeNos();
  var html = '';
  D.toc.forEach(function(cat, ci){
    html += '<div class="cat' + (ci===0?' open':'') + '" data-ci="' + ci + '">';
    html += '<div class="cat-head"><span>' + cat.icon + '</span><span>' + esc(cat.label) + '</span><span class="arrow">▶</span></div>';
    html += '<div class="cat-body">';
    cat.groups.forEach(function(g){
      if (g.label) html += '<div class="grp-label">' + esc(g.label) + '</div>';
      g.items.forEach(function(it){ html += tocItemHtml(cat.key, it, NO[cat.key + '/' + (it.feature || it.placeholder)]); });
    });
    html += '</div></div>';
  });
  sidebar.innerHTML = html;
}

/* ---------- 渲染右侧内容 ---------- */
function blocksFromStep(blocks, fromStep){
  if (!fromStep) return blocks;
  var idx = -1;
  for (var i=0;i<blocks.length;i++){ if (blocks[i].type==='step' && blocks[i].text===fromStep){ idx=i; break; } }
  if (idx<0) return blocks;
  var out = blocks.slice(0, idx).filter(function(b){ return b.type==='text'; });
  return out.concat(blocks.slice(idx));
}
function findTocItem(roleKey, fid){
  for (var i=0;i<D.toc.length;i++){ var cat=D.toc[i];
    if (cat.key!==roleKey) continue;
    for (var j=0;j<cat.groups.length;j++){ var g=cat.groups[j];
      for (var k=0;k<g.items.length;k++){ var it=g.items[k];
        if ((it.feature||'')===fid || it.placeholder===fid) return {cat:cat, group:g, item:it};
      }
    }
  }
  return null;
}
function renderFeature(roleKey, fid){
  var hit = findTocItem(roleKey, fid);
  if (!hit){ main.innerHTML = '<footer></footer>'; return; }
  var it = hit.item, cat = hit.cat;
  var html = '<div class="crumb">' + esc(cat.label) + (hit.group.label ? ' › ' + esc(hit.group.label) : '') + ' › <b>' + esc(it.label||'') + '</b></div>';

  if (it.placeholder){
    html += '<h1 class="f-title">' + esc(it.label) + '<span class="pending-tag">待核对</span></h1>';
    (it.content||[]).forEach(function(t, i){
      var cls = t.indexOf('注意事项')===0 || t.indexOf('注意')===0 ? 'block note' : 'block kv';
      html += '<div class="' + cls + '">' + esc(t) + '</div>';
    });
  } else {
    var f = D.features[it.feature];
    var label = it.label || f.title;
    var dispNo = NO[roleKey + '/' + it.feature] || f.id;
    html += '<h1 class="f-title">' + esc(dispNo) + ' ' + esc(label) + '</h1>';
    var blocks = blocksFromStep(f.blocks, it.fromStep);
    if (it.fromStep && it.sub) html += '<div class="block kv">本页操作流程：' + esc(it.sub) + '</div>';
    blocks.forEach(function(b, bi){
      if (b.type==='step'){
        html += '<div class="step-h" id="blk-' + bi + '">' + esc(b.text) + '</div>';
      } else if (b.type==='figure'){
        html += '<figure class="fig" id="blk-' + bi + '"><img src="' + IMG + esc(b.src) + '" alt="' + esc(b.caption||'系统截图') + '" loading="lazy" data-cap="' + esc(b.caption||'') + '">' + (b.caption ? '<figcaption class="cap">' + esc(b.caption) + '</figcaption>' : '') + '</figure>';
      } else {
        var t = b.text, cls = 'block';
        if (t.indexOf('注意事项')===0) cls='block note';
        else if (t.indexOf('入口')===0) cls='block kv';
        else if (t.indexOf('说明')===0) cls='block kv';
        html += '<div class="' + cls + '" id="blk-' + bi + '">' + esc(t) + '</div>';
      }
    });
  }
  main.innerHTML = html;
  bindImages();
}

/* ---------- 图片放大 ---------- */
var lightbox = $('#lightbox');
function bindImages(){
  main.querySelectorAll('.fig img').forEach(function(img){
    img.addEventListener('click', function(){
      $('#lbImg').src = img.src;
      $('#lbCap').textContent = img.getAttribute('data-cap') || '';
      lightbox.classList.add('show');
    });
  });
}
lightbox.addEventListener('click', function(){ lightbox.classList.remove('show'); });
document.addEventListener('keydown', function(e){ if (e.key==='Escape') lightbox.classList.remove('show'); });

/* ---------- 目录高亮 / 路由 ---------- */
function setActive(roleKey, fid){
  sidebar.querySelectorAll('.nav-item').forEach(function(a){
    a.classList.toggle('active', a.getAttribute('data-role')===roleKey && a.getAttribute('data-fid')===fid);
  });
  var act = sidebar.querySelector('.nav-item.active');
  if (act) act.scrollIntoView({block:'nearest'});
  var cat = act && act.closest('.cat');
  if (cat && !cat.classList.contains('open')) cat.classList.add('open');
}
function route(){
  var m = (location.hash||'').match(/^#\/(\w+)\/(.+)$/);
  if (m && findTocItem(m[1], m[2])) { renderFeature(m[1], m[2]); setActive(m[1], m[2]); }
  else {
    var first = D.toc[0];
    location.replace('#/' + first.key + '/' + first.groups[0].items[0].feature);
  }
  window.scrollTo(0,0);
  closeSidebar();
}
sidebar.addEventListener('click', function(e){
  var head = e.target.closest('.cat-head');
  if (head) { head.parentElement.classList.toggle('open'); }
});

/* ---------- 搜索 ---------- */
var index = [];
function buildIndex(){
  index = [];
  D.toc.forEach(function(cat){
    cat.groups.forEach(function(g){
      g.items.forEach(function(it){
        if (it.placeholder){
          (it.content||[]).forEach(function(t){ index.push({role:cat.key, fid:it.placeholder, label:it.label, roleLabel:cat.label, text:t}); });
          return;
        }
        var f = D.features[it.feature];
        var label = it.label || f.title;
        index.push({role:cat.key, fid:it.feature, label:label, roleLabel:cat.label, text:((NO[cat.key+'/'+it.feature]||f.id) + ' ' + label + ' ' + f.title)});
        blocksFromStep(f.blocks, it.fromStep).forEach(function(b){
          if (b.type==='figure' && b.caption) index.push({role:cat.key, fid:it.feature, label:label, roleLabel:cat.label, text:b.caption});
          else if (b.text) index.push({role:cat.key, fid:it.feature, label:label, roleLabel:cat.label, text:b.text});
        });
      });
    });
  });
}
var srBox = $('#searchResults'), input = $('#searchInput'), srTimer = null;
input.addEventListener('input', function(){
  clearTimeout(srTimer);
  srTimer = setTimeout(doSearch, 180);
});
input.addEventListener('blur', function(){ setTimeout(function(){ srBox.style.display='none'; }, 200); });
function doSearch(){
  var q = input.value.trim().toLowerCase();
  if (!q){ srBox.style.display='none'; return; }
  var seen = {}, hits = [];
  index.forEach(function(r){
    var t = r.text.toLowerCase();
    var pos = t.indexOf(q);
    if (pos < 0) return;
    var key = r.role + '/' + r.fid + '/' + r.label;
    if (seen[key]) { if (hits[seen[key]].snip.length < 60) return; }
    else { seen[key] = hits.length; hits.push({role:r.role, fid:r.fid, label:r.label, roleLabel:r.roleLabel, snip:''}); }
    var h = hits[seen[key]];
    if (!h.snip) h.snip = (pos>20 ? '…' : '') + r.text.substring(Math.max(0,pos-20), pos+40) + '…';
    else if (h.snip.length < 80) h.snip += '；' + r.text.substring(Math.max(0,pos-10), pos+30);
  });
  var html = hits.length
    ? hits.slice(0,20).map(function(h){
        var href = '#/' + h.role + '/' + h.fid;
        return '<div class="sr-item" data-href="' + href + '"><div><span class="t">' + esc(h.label) + '</span><span class="r">' + esc(h.roleLabel) + '</span></div><div class="snip">' + esc(h.snip) + '</div></div>';
      }).join('')
    : '<div class="sr-empty">未找到相关内容</div>';
  srBox.innerHTML = html;
  srBox.style.display = 'block';
}
srBox.addEventListener('mousedown', function(e){
  var it = e.target.closest('.sr-item');
  if (it){ location.hash = it.getAttribute('data-href'); srBox.style.display='none'; input.value=''; }
});

/* ---------- 移动端目录 ---------- */
var mask = $('#mask');
function closeSidebar(){ sidebar.classList.remove('show'); mask.classList.remove('show'); }
$('#menuBtn').addEventListener('click', function(){ sidebar.classList.toggle('show'); mask.classList.toggle('show'); });
mask.addEventListener('click', closeSidebar);

/* ---------- 启动 ---------- */
buildSidebar();
buildIndex();
window.addEventListener('hashchange', route);
route();
})();
</script>
</body>
</html>
