<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创联 · 清单方案编制智能体</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#F6F8FB;--card:#fff;--border:#E5EAF1;--border2:#EEF2F7;--text:#1B2434;--muted:#687385;--weak:#9AA4B2;
 --primary:#0EA5E9;--primary2:#6366F1;--success:#10B981;--warning:#F59E0B;--danger:#E5484D;
 --primary-soft:#E0F2FE;--success-soft:#D1FAE5;--warning-soft:#FEF3C7;--danger-soft:#FEE2E2;--shadow:0 12px 32px rgba(16,24,40,.08);
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:#FBFCFE;color:var(--text);font-size:14px;overflow:hidden}
button,input,textarea,select{font:inherit}button{border:0;background:none;cursor:pointer;color:inherit}
.hidden{display:none!important}
.topbar{height:56px;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:0 24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}.logo-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:flex;align-items:center;justify-content:center;color:#fff}
.logo span{background:linear-gradient(135deg,var(--primary),var(--primary2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.user-chip{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.layout{height:calc(100vh - 56px);display:flex}
.sidebar{width:236px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column}
.new-task{margin:14px 12px;padding:10px 12px;border-radius:9px;background:#111827;color:white;font-weight:600;font-size:13px}
.history-title{font-size:12px;color:var(--weak);padding:10px 16px 6px;display:flex;justify-content:space-between}.history-list{padding:0 12px;overflow:auto}.h-item{padding:8px 10px;border-radius:7px;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.h-item:hover{background:var(--border2);color:var(--text)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}.chat-head{height:56px;background:#fff;border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between}.chat-title{font-weight:700}
.stream{flex:1;overflow:auto;padding:24px}.inner{max-width:1040px;margin:0 auto}
.welcome{max-width:920px;margin:22px auto;text-align:center;padding:20px 0}.welcome-icon{width:82px;height:82px;margin:0 auto 18px;border-radius:22px;background:linear-gradient(135deg,#E0F2FE,#E0E7FF);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 6px 18px rgba(99,102,241,.14)}.welcome h1{font-size:28px;margin-bottom:10px}.welcome p{color:var(--muted);line-height:1.8;margin-bottom:22px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;text-align:left;transition:.16s;cursor:pointer}.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(16,24,40,.08);border-color:#7DD3FC}.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700;margin-bottom:8px}.card h3{font-size:14px;margin-bottom:6px}.card p{font-size:12px;color:var(--weak);line-height:1.5;margin:0}
.msg{display:flex;gap:12px;margin-bottom:22px}.msg.user{flex-direction:row-reverse}.msg-avatar{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700}.msg.user .msg-avatar{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}.msg.ai .msg-avatar{background:#E0F2FE;color:#0369A1;border:1px solid #BAE6FD}.msg-body{flex:1;min-width:0}.msg.user .msg-body{text-align:right}.meta{font-size:12px;color:var(--weak);margin-bottom:5px}.bubble{display:inline-block;text-align:left;line-height:1.7}.user .bubble{background:var(--primary);color:#fff;border-radius:14px 14px 4px 14px;padding:10px 14px;max-width:78%;white-space:pre-wrap}.ai .bubble{width:100%;background:#fff;border:1px solid var(--border);border-radius:4px 14px 14px 14px;padding:16px 18px}.ai .bubble>*+*{margin-top:14px}
.route{background:#F8FAFC;border-left:3px solid var(--primary);padding:9px 12px;border-radius:7px;color:var(--muted);font-size:13px}.steps{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12px;color:var(--weak)}.dot{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}.done{background:var(--success);color:#fff}.active{background:var(--primary);color:#fff}.pending{background:#E5E7EB;color:#6B7280}.step-l.done-t{color:var(--success);font-weight:700}.step-l.active-t{color:var(--primary);font-weight:700}
.panel{border:1px solid var(--border);background:#fff;border-radius:12px;overflow:hidden}.panel-head{padding:10px 14px;background:#F8FAFC;border-bottom:1px solid var(--border2);font-weight:700;display:flex;justify-content:space-between;align-items:center}.panel-body{padding:12px 14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px}.field{display:flex;gap:10px;align-items:center;min-height:34px}.field label{width:96px;color:var(--weak);font-size:12.5px}.field .v{flex:1;color:var(--text);font-weight:600}.field input,.field select{flex:1;border:1px solid var(--border);border-radius:7px;padding:6px 8px;background:#fff}
.match-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.match-card{border:1px solid var(--border2);border-radius:10px;background:#FAFBFE;padding:10px}.match-card b{display:block;margin-bottom:4px}.match-card span{font-size:12px;color:var(--muted);line-height:1.5}
.alert{padding:12px 14px;border-radius:10px;display:flex;gap:10px;font-size:13px;line-height:1.65}.alert.warning{background:var(--warning-soft);border:1px solid #FDE68A;color:#92400E}.alert.success{background:var(--success-soft);border:1px solid #BBF7D0;color:#065F46}.alert.danger{background:var(--danger-soft);border:1px solid #FECACA;color:#991B1B}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;transition:.15s}.btn.primary{background:var(--primary);color:#fff}.btn.success{background:var(--success);color:#fff}.btn.outline{background:#fff;border:1px solid var(--border);color:var(--muted)}.btn.warn{background:var(--warning);color:#fff}.btn:hover{opacity:.9;transform:translateY(-1px)}
.doc-shell{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff}.doc-toolbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#F8FAFC;border-bottom:1px solid var(--border2)}.doc-summary{display:grid;grid-template-columns:200px 1fr;gap:16px;padding:14px}.doc-cover{border:1px solid #E5E7EB;min-height:270px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:24px 16px;font-family:SimSun,serif}.doc-cover .brand{font-weight:700;color:#0EA5E9}.doc-cover h2{font-size:20px;line-height:2;font-weight:500}.doc-cover .foot{font-size:15px;line-height:2}.doc-list{padding:4px 0}.doc-list li{margin-left:18px;line-height:1.9;color:var(--muted)}.doc-full{border-top:1px solid var(--border2);padding:0 14px 16px;max-height:520px;overflow:auto}.doc-page{max-width:760px;margin:18px auto;background:white;border:1px solid #E5E7EB;padding:34px 44px;box-shadow:0 4px 14px rgba(0,0,0,.04);font-family:SimSun,serif;line-height:1.9}.doc-page h2{text-align:center;font-size:22px;margin:22px 0}.doc-page h3{font-size:18px;margin:16px 0 8px}.doc-page p{white-space:pre-wrap}.doc-editor{width:100%;min-height:360px;border:1px solid var(--border);border-radius:8px;padding:12px;font-family:SimSun,serif;line-height:1.8}
.sigbar{display:flex;justify-content:flex-end;gap:18px;background:#FAFBFC;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12.5px}.sigbar span{font-weight:700}.sigbar input{border:1px solid var(--border);border-radius:5px;padding:3px 6px;width:82px}
.table-wrap{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff}.table-head{padding:10px 14px;background:#F8FAFC;border-bottom:1px solid var(--border2);display:flex;justify-content:space-between;align-items:center}.table-title{font-weight:800}.table-scroll{overflow:auto;max-height:520px}table{border-collapse:collapse;width:100%;font-size:12px}th{position:sticky;top:0;background:#F8FAFC;z-index:1;color:#607086;font-weight:800}th,td{border-bottom:1px solid var(--border2);border-right:1px solid var(--border2);padding:7px 8px;vertical-align:top;white-space:pre-wrap;min-width:70px}td.num{text-align:right;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}tr:hover td{background:#FCFCFD}.editable td[contenteditable="true"]{background:#FFFBEB;outline:1px dashed #F59E0B}.flag{display:inline-block;border-radius:5px;padding:2px 6px;font-size:11px;font-weight:800}.flag.ok{background:var(--success-soft);color:#065F46}.flag.review{background:var(--warning-soft);color:#92400E}.flag.missing{background:var(--danger-soft);color:#991B1B}.risk-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.risk-card{border:1px solid var(--border);border-radius:10px;padding:10px;background:#fff}.risk-num{font-size:24px;font-weight:900}.risk-card span{color:var(--weak);font-size:12px}

.table-hint{padding:7px 14px;border-bottom:1px solid var(--border2);font-size:12px;color:var(--weak);background:#fff}.table-actions{justify-content:flex-end;flex:none}.sig-panel.list-sign{border-left:0;border-right:0;border-bottom:0;border-radius:0;margin:0;background:#FAFBFC}.list-sig-grid{grid-template-columns:repeat(4,minmax(160px,1fr));align-items:center}.doc-shell>.sig-panel{margin:0;border-left:0;border-right:0;border-bottom:0;border-radius:0;background:#FAFBFC}.doc-shell>.sig-panel .sig-title{background:#F8FAFC}
.inputbar{flex:none;background:#fff;border-top:1px solid var(--border);padding:14px 24px 18px}.input-inner{max-width:1040px;margin:0 auto}.quick{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.qc{padding:6px 12px;border:1px solid var(--border);border-radius:999px;background:#fff;font-size:12.5px;color:var(--muted)}.qc:hover{background:var(--primary-soft);color:var(--primary);border-color:#7DD3FC}.input-row{border:1px solid var(--border);border-radius:14px;padding:10px 12px;background:#fff;display:flex;align-items:flex-end;gap:10px;box-shadow:0 1px 2px rgba(16,24,40,.03)}.input-row:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(14,165,233,.08)}textarea{flex:1;resize:none;border:0;outline:0;min-height:26px;max-height:130px;font-size:15px}.send{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-weight:900}.tools{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--weak)}.tool{border:1px solid var(--border);background:#F8FAFC;border-radius:8px;padding:5px 10px}.file-tags{display:flex;gap:6px;flex-wrap:wrap}.file-tag{background:#F8FAFC;border:1px solid var(--border2);border-radius:6px;padding:4px 7px;color:var(--muted)}.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.36);display:flex;align-items:center;justify-content:center;z-index:99}.modal{background:#fff;border-radius:14px;width:460px;padding:18px;box-shadow:var(--shadow)}.modal h3{margin-bottom:8px}.modal p{color:var(--muted);line-height:1.7;margin-bottom:14px}
@media(max-width:900px){.sidebar{display:none}.cards,.match-grid,.risk-list{grid-template-columns:1fr}.doc-summary{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}

.match-collapse{border:1px solid var(--border);background:#fff;border-radius:12px;overflow:hidden}.match-collapse summary{list-style:none;cursor:pointer;padding:11px 14px;background:#F8FAFC;font-weight:800;border-bottom:1px solid var(--border2)}.match-collapse summary::-webkit-details-marker{display:none}.match-collapse summary span{font-size:12px;color:var(--weak);font-weight:500;margin-left:8px}.match-collapse .match-grid{padding:12px 14px}
.sig-panel{border:1px solid var(--border);border-radius:10px;margin:12px 14px;background:#FAFBFC;overflow:hidden}.sig-title{font-weight:800;padding:9px 12px;border-bottom:1px solid var(--border2);background:#F8FAFC}.sig-grid{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:10px 18px;padding:10px 12px;font-size:13px}.sig-grid input{border:1px solid var(--border);border-radius:6px;padding:5px 7px;min-width:110px;background:#fff}.mini-btn{margin-left:6px;padding:4px 8px;border-radius:6px;background:var(--primary);color:#fff;font-size:12px;font-weight:700}.list-title-wrap{display:flex;align-items:center;gap:8px;flex:1;min-width:0}.list-title-wrap label{font-weight:800;white-space:nowrap}.list-title-wrap input{flex:1;min-width:240px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;background:#fff;font-weight:700}.list-title-wrap input:disabled{border-color:transparent;background:transparent;color:var(--text);padding-left:0}.judge-note{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.45}.file-tag button{margin-left:5px;border:1px solid var(--border);background:#fff;border-radius:5px;padding:1px 5px;font-size:11px;color:var(--muted)}.file-tag button:hover{color:var(--primary);border-color:#7DD3FC}.doc-page pre{font-family:SimSun,serif}
</style>
</head>
<body>
<header class="topbar">
 <div class="logo"><div class="logo-mark">AI</div><div>创联 <span>· 清单方案编制智能体</span></div></div>
 <div class="user-chip"><div class="avatar">创</div><span>创联 AI</span></div>
</header>
<div class="layout">
 <aside class="sidebar">
   <button class="new-task" id="newTask">＋ 新建任务</button>
   <div class="history-title"><span>生成记录</span><span id="histCount">0</span></div>
   <div class="history-list" id="history"></div>
 </aside>
 <main class="main">
   <div class="chat-head"><div class="chat-title" id="chatTitle">清单方案编制智能体</div><div style="font-size:12px;color:var(--weak)">AI辅助生成 · 风险提示 · 人工确认</div></div>
   <section class="stream" id="stream">
    <div class="welcome" id="welcome">
     <div class="welcome-icon">📋</div>
     <h1>你好，我是清单方案编制智能体</h1>
     <p>基于任务单、车型、产品型号、数量、模板和特殊说明，辅助生成施工方案和设备清单。<br>生成结果支持预览、编辑、风险提示和下载，最终由人工确认后使用。</p>
     <div class="cards">
      <button class="card quick-card" data-q="客户：广深铁路股份有限公司广州电务段，车型：GCY-300II，车号：12327，产品：GYK-160G轨道车运行控制设备（分布式），1套">
       <span class="tag" style="background:#E0F2FE;color:#0369A1">任务单生成</span>
       <h3>生成施工方案 + 设备清单</h3><p>按正式任务流程：识别任务 → 生成方案 → 生成设备清单</p>
      </button>
      <button class="card quick-card" data-q="仅生成施工方案，客户：广深铁路股份有限公司广州工务段，车型：CDC-16，车号：12675，产品：GYK-160G轨道车运行控制设备（分布式），1套">
       <span class="tag" style="background:#E0E7FF;color:#3730A3">仅方案</span>
       <h3>生成施工方案初稿</h3><p>适合商务/售前或仅需要方案说明的场景</p>
      </button>
      <button class="card" id="uploadCard">
       <span class="tag" style="background:#D1FAE5;color:#065F46">上传资料</span>
       <h3>上传任务单和模板资料</h3><p>支持 PDF、Word、Excel、图片，模拟资料识别和匹配过程</p>
      </button>
     </div>
     <p style="margin-top:18px;font-size:12px;color:var(--weak)">快捷指令：输入“第一个”走完整流程；输入“第二个”仅生成施工方案。</p>
    </div>
   </section>
   <section class="inputbar">
    <div class="input-inner">
     <div class="quick">
      <button class="qc" data-q="客户：广深铁路股份有限公司广州电务段，车型：GCY-300II，车号：12327，产品：GYK-160G轨道车运行控制设备（分布式），1套">📋 施工方案+设备清单</button>
      <button class="qc" data-q="仅生成施工方案，客户：广深铁路股份有限公司广州工务段，车型：CDC-16，车号：12675，产品：GYK-160G轨道车运行控制设备（分布式），1套">📄 仅生成施工方案</button>
     </div>
     <div class="input-row"><textarea id="input" rows="1" placeholder="输入任务信息，例如：客户：XXX，车型：XXX，车号：XXX，产品：GYK-160G分布式，X套"></textarea><button class="send" id="send">➤</button></div>
     <div class="tools"><button class="tool" id="uploadBtn">📎 上传资料</button><span>支持 PDF · Word · Excel · 图片</span><div class="file-tags" id="fileTags"></div></div>
     <input type="file" id="fileInput" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg,.txt" style="display:none">
    </div>
   </section>
 </main>

const PLAN_SECTIONS = [{"title": "封面", "content": "GYK-160G 型轨道车运行控制设备\n安装方案\n广州工务段 CDC-16（12675）\n高新兴创联科技股份有限公司\n2025 年 07 月"}, {"title": "编制/审核/批准与修订记录", "content": "编制：徐乐生    日期：2025.7.06\n审核：张峰      日期：2025.7.06\n批准：李军      日期：2025.7.06\n\n修订记录：\n2024.06.25  徐乐生  V1.0  初稿\n2025.07.06  徐乐生  V1.1  修订主机安装示意图\n2025.11.25  徐乐生  V1.2  更新设备安装示意图"}, {"title": "目录", "content": "1、GYK-160G 构成及原理\n  1.1 设备组成\n  1.2 装车配置表\n  1.3 设备连接示意图\n2、GYK-160G 设备的安装位置及工艺要求\n  2.1 机柜\n  2.2 GYK-160G 主机安装\n  2.3 制动隔离装置\n  2.4 UPS 主机安装\n  2.5 DMI 控制盒\n  2.6 警惕按钮\n  2.7 机车信号机\n  2.8 速度传感器安装\n3、设备连接\n4、线缆布线和接线要求\n5、验收\n附表1：工具\n附表2：GYK-160G 设备安装调试报告"}, {"title": "1、GYK-160G 构成及原理", "content": "1.1 设备组成\nGYK-160G 系统包括主机、人机界面单元（DMI）、机车信号机及有关接口。接口分为主机与机车信号接收线圈、压力传感器、速度传感器、制动隔离装置和电磁阀、UPS 电源、BTM 设备（可选）等外围设备的接口，主机与车辆、GMS 车载设备、CIR 设备、轴温报警设备、调车监控相关设备等其他系统或设备的接口。\n\n1.2 装车配置表\nGYK-160G 主机 1 个（机柜）；DMI 控制盒 2 个（两端操作台）；机车信号机 2 个（两端操作台挡风玻璃中间）；双路机车信号接收线圈 4 个（两端车底两侧）；压力传感器 6 个；常用/紧急电磁阀各 1 个；旁路阀 2 个；扬声器 2 个；警惕按钮 2 个；配套电缆 1 套。"}, {"title": "2、设备安装位置及工艺要求", "content": "2.1 机柜\nGYK-160G 主机需安装于装机柜内，并预留足够维护空间。主机采用后出线方式，后部出线空间不小于 200mm，两侧和顶部应预留维护空间，主机应可靠接地。\n\n2.2 GYK-160G 主机安装\n主机托盘需固定在柜体或地板上，安装螺钉按要求锁紧，主机安装位置应便于维护、拆卸和散热，避免安装在大幅震动、高温高湿环境。\n\n2.3 制动隔离装置\n隔离盒安装在机柜内或操作台下具有防护空间，距 GYK-160G 主机距离不大于 2m，安装固定后需便于维修检测。\n\n2.4 UPS 主机安装\nUPS 电源安装在机柜内或操作台下，安装固定牢靠，主机安装应可靠接地。"}, {"title": "3、设备连接", "content": "主机通过 GX2 工况制动、GX7 电源输入、DMI 主控/副控电缆、I/II 端信号灯、录音电缆、管压速度电缆、机车信号电缆、机感线圈电缆、GMS 通信线等与外部设备连接。\n\n设备连接时需确保端子标识清晰、线缆走向符合规范、接口连接正确，电缆两端标识应与图纸一致。"}, {"title": "4、线缆布线和接线要求", "content": "布线尽量避免打孔，尽量利用车辆原有过线孔。电缆走线应遵循捆绑牢固、穿孔防护、护套保护、避免在车辆活动部件捆绑、避免高温高湿环境、便于维护、做好与原有电气线路隔离等原则。\n\n电源接线端子接入前必须用万用表测试输出电压符合 GYK-160G 使用要求，电源接线与车辆接入端子之间必须有隔离措施。"}, {"title": "5、验收", "content": "验收人员由设备管理部门、轨道车管理部门、轨道车使用单位、设备厂家技术人员、设备安装人员等组成。\n\n5.1 静态检验\n检查主机、DMI、机车信号机、传感器安装位置是否合理紧固；检查各接线端是否可靠；检查线束布置是否符合布线标准。\n\n5.2 上电检测\n检查设备安装是否符合规范要求，上电后是否能正常开机；检查车辆通排风、发动机启停、工况切换、GYK-160G 工况、相位、熄火、保压、转储、下载、发码是否正常。\n\n5.3 设备安装注意事项\n单套 GYK-160G 的施工及调试工期预计 5-7 个自然日，本次车辆安装 GYK-160G 需使用单位配合提供 220V 电源。"}, {"title": "附表1：工具", "content": "斜口钳 1 把、M20 外六角扳手 1 把、M8 外六角扳手 1 把、M6 外六角扳手 1 把、M6 内六角扳手 1 把、大/小十字螺丝刀各 1 把、大/小一字螺丝刀各 1 把、活动扳手 1 把、管钳 1 把、万用表 1 个、FMQ-IV 型发码器 1 个、记号笔 1 支、手电钻 1 把、工作服 1 套、扭矩扳手 1 把。"}, {"title": "附表2：GYK-160G 设备安装调试报告", "content": "单位、车号、车型、厂家、地点、日期、施工人员；设备安装示意图；设备信息；版本信息；安装信息；管理参数；设备检查（关机/开机）等检查表项。"}];

function parseTask(q){
 let lower=q.toLowerCase();
 if(q.includes('第一个')) q='客户：广深铁路股份有限公司广州电务段，车型：GCY-300II，车号：12327，产品：GYK-160G轨道车运行控制设备（分布式），1套';

 const onlyPlan = /仅生成施工方案|商务侧|仅方案|售前/.test(q);
 const client=(q.match(/客户[：:]\s*([^，,\n]+)/)||[])[1]||'';
 const model=(q.match(/车型[：:]\s*([^，,\n]+)/)||[])[1]||'';
 const carNo=(q.match(/车号[：:]\s*([^，,\n]+)/)||[])[1]||'';
 const qtyMatch=q.match(/(\d+)\s*套/); const qty=qtyMatch?parseInt(qtyMatch[1]):1;
 if(!client && !model) return null;
 const product=(q.match(/产品[：:]\s*([^，,\n]+)/)||[])[1]||'GYK-160G轨道车运行控制设备（分布式）';
 const sale=(q.match(/XS-\d{12,}/)||[])[0] || 'XS-2025062000064';
 const task={client, model, carNo, qty, product, saleNo:sale, onlyPlan, bureau: client.includes('工务')?'广州工务段':'广州电务段', special: uploadedFiles.some(f=>/说明|特殊|函/.test(f.name))?'已上传':'未上传'};
 task._source={client:task.client,model:task.model,carNo:task.carNo,qty:task.qty,product:task.product,saleNo:task.saleNo,bureau:task.bureau,special:task.special};
 task.listTitle=buildListTitle(task); task.planConfirmed=false; task.listConfirmed=false; return task;
}

 const body = EQUIPMENT_ROWS.map((r,idx)=>`<tr data-idx="${idx}">${cols.map(c=>{
   let cls = c==='w-数量'?'num':'';
   let val = r[c];

   return `<td class="${cls}" data-col="${esc(c)}">${nl(val)}</td>`;
 }).join('')}</tr>`).join('');
 return `<div class="table-wrap" id="tableWrap"><div class="table-head"><div class="list-title-wrap"><label>设备清单标题：</label><input id="listTitle" value="${esc(t.listTitle||DEMO_TITLE)}" disabled></div><div class="actions table-actions"><button class="btn outline" data-action="edit-list">✎ 编辑清单</button><button class="btn success hidden" data-action="save-list">💾 保存清单</button></div></div><div class="table-hint">最后一列为页面辅助校验列，下载文件不包含该列</div><div class="table-scroll"><table id="eqTable"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>${signPanel('list','设备清单签名区')}</div>`;
}
function listResponse(t){
 return `${steps(5)}<div class="route">✅ 施工方案已确认，已生成设备清单草稿。请核对清单内容，必要时点击右上角“编辑清单”修改标题、签名栏和表格内容。</div>
 ${renderTable(t)}
 <div class="alert warning"><b>下载前确认：</b><span>当前仍存在需确认/缺失项，建议人工复核后下载；下载文件将隐藏“AI判断”列，仅保留正式业务字段。</span></div>
 <div class="actions bottom-actions"><button class="btn primary" data-action="download-list">📥 下载设备清单</button></div>`;
}

function submit(q){
 q=(q||'').trim(); if(!q) return;
 if(q==='上传资料'){ $('#fileInput').click(); return; }
 const userFile = uploadedFiles.length?`📎 已上传：${uploadedFiles.map(f=>f.name).join('、')}\n`:''; addMsg('user',esc(userFile+q),'');
 const task=parseTaskSafe(q);
 if(!task){ addMsg('ai',`<div class="alert warning"><b>未识别任务</b><span>请按格式输入：客户：XXX，车型：XXX，车号：XXX，产品：GYK-160G分布式，X套</span></div>`,'清单方案编制'); return; }
 currentTask=task; addHistory(q);
 setTimeout(()=>addMsg('ai',taskConfirmHtml(currentTask),'清单方案编制 · 任务识别'),400);
}

document.addEventListener('click',e=>{
 const btn=e.target.closest('button'); if(!btn) return;
 if(btn.id==='newTask'){ const inner=$('.inner'); if(inner) inner.remove(); welcome.classList.remove('hidden'); input.value=''; currentTask=null; return; }
 if(btn.id==='uploadBtn' || btn.id==='uploadCard'){ $('#fileInput').click(); return; }
 if(btn.classList.contains('quick-card')||btn.classList.contains('qc')){ submit(btn.dataset.q); return; }
 const act=btn.dataset.action; if(!act) return;
 if(act==='preview-file'){ const f=uploadedFiles[parseInt(btn.dataset.idx)]; if(f?.url) window.open(f.url,'_blank'); return; }
 if(act==='remove-file'){ const i=parseInt(btn.dataset.idx); if(uploadedFiles[i]?.url) URL.revokeObjectURL(uploadedFiles[i].url); uploadedFiles.splice(i,1); renderFileTags(); return; }
 if(act==='confirm-task'){
   if(!currentTask){ toast('请先输入或上传任务信息'); return; }
   const changed=readConfirmInputs();
   if(changed && !currentTask.onlyPlan){ const ok=confirm('你修改了影响模板匹配的关键信息，系统将基于修改后的信息重新匹配施工方案模板和设备清单模板。是否继续？'); if(!ok) return; }
   if(changed && currentTask.onlyPlan){ toast('已按修改后的任务信息重新匹配施工方案模板。'); }
   setTimeout(()=>addMsg('ai',planResponse(currentTask), currentTask.onlyPlan?'施工方案生成':'清单方案编制 · 生成方案'),120); return;
 }
 if(act==='toggle-full'){ $('#docFull')?.classList.toggle('hidden'); btn.textContent=$('#docFull')?.classList.contains('hidden')?'预览全文':'收起全文'; return; }
 if(act==='edit-plan'){ $('#planEditor')?.classList.remove('hidden'); $('#docFull')?.classList.add('hidden'); btn.classList.add('hidden'); document.querySelector('[data-action="save-plan"]')?.classList.remove('hidden'); return; }
 if(act==='save-plan'){ currentTask.planContent=$('#planEditor')?.value||''; const df=$('#docFull'); if(df) df.innerHTML=renderSavedPlanPreview(currentTask.planContent); $('#planEditor')?.classList.add('hidden'); btn.classList.add('hidden'); document.querySelector('[data-action="edit-plan"]')?.classList.remove('hidden'); toast('施工方案修改已保存，下载将以修改后内容为准。'); return; }
 if(act==='download-plan'){ downloadPlan(); return; }
 if(act==='confirm-reviewer'){ const p=btn.dataset.target; const inp=$(`#${p}Reviewer`); if(inp) inp.value='张俊'; toast('审核人已确认'); return; }
 if(act==='confirm-plan'){ currentTask.planConfirmed=true; addMsg('ai',listResponse(currentTask),'清单方案编制 · 生成清单'); return; }
 if(act==='edit-list'){ $('#listTitle') && ($('#listTitle').disabled=false); $('#eqTable')?.classList.add('editable'); document.querySelectorAll('#eqTable tbody td[data-col]').forEach(td=>td.contentEditable='true'); btn.classList.add('hidden'); document.querySelector('[data-action="save-list"]')?.classList.remove('hidden'); return; }
 if(act==='save-list'){ saveTableEdits(); if($('#listTitle')){ currentTask.listTitle=$('#listTitle').value.trim()||currentTask.listTitle; $('#listTitle').disabled=true; } $('#eqTable')?.classList.remove('editable'); document.querySelectorAll('#eqTable tbody td').forEach(td=>td.contentEditable='false'); btn.classList.add('hidden'); document.querySelector('[data-action="edit-list"]')?.classList.remove('hidden'); toast('设备清单修改已保存，下载将隐藏 AI 判断列。'); return; }
 if(act==='download-list'){ const unresolved=EQUIPMENT_ROWS.filter(r=>r._flag!=='ok').length; showDownloadConfirm(unresolved); return; }
 if(act==='confirm-download-list'){ $('.modal-mask')?.remove(); downloadList(); return; }
 if(act==='cancel-modal'){ $('.modal-mask')?.remove(); return; }
});

function saveTableEdits(){
 document.querySelectorAll('#eqTable tbody tr').forEach(tr=>{
  const idx=parseInt(tr.dataset.idx); if(isNaN(idx)) return;
  tr.querySelectorAll('td[data-col]').forEach(td=>{ const c=td.dataset.col; EQUIPMENT_ROWS[idx][c]=td.innerText.trim(); });
 });
}
function showDownloadConfirm(unresolved){
 const mask=document.createElement('div'); mask.className='modal-mask';
 mask.innerHTML=`<div class="modal"><h3>下载前确认</h3><p>当前设备清单仍有 <b style="color:#D97706">${unresolved}</b> 项 AI 判断为“需确认/缺失”。下载文件将不包含“AI判断”列，仅导出正式业务字段。是否继续下载？</p><div class="actions" style="justify-content:flex-end"><button class="btn outline" data-action="cancel-modal">取消</button><button class="btn primary" data-action="confirm-download-list">继续下载</button></div></div>`; document.body.appendChild(mask);
}
function toast(msg){ const m=document.createElement('div'); m.style.cssText='position:fixed;right:24px;top:72px;background:#111827;color:#fff;padding:10px 14px;border-radius:10px;z-index:120;box-shadow:var(--shadow)'; m.textContent=msg; document.body.appendChild(m); setTimeout(()=>m.remove(),2000);}

function downloadPlan(){
 const sig=getSig('plan');
 const content=currentTask?.planContent || ($('#planEditor')?.value) || getPlanBodyText();
 const title=`GYK-160G轨道车运行控制设备（分布式）安装方案${currentTask?.bureau||'广州工务段'}${currentTask?.model||'CDC-16'}（${currentTask?.carNo||'12675'}）`;
 const html=`<html><head><meta charset="utf-8"><style>body{font-family:SimSun,serif;font-size:12pt;line-height:1.8;padding:36px}h1{text-align:center;font-size:22pt;line-height:2.2}.sig{width:100%;border-collapse:collapse;margin:20px 0}.sig td{border:1px solid #333;padding:10px}pre{white-space:pre-wrap;font-family:SimSun,serif}
.match-collapse{border:1px solid var(--border);background:#fff;border-radius:12px;overflow:hidden}.match-collapse summary{list-style:none;cursor:pointer;padding:11px 14px;background:#F8FAFC;font-weight:800;border-bottom:1px solid var(--border2)}.match-collapse summary::-webkit-details-marker{display:none}.match-collapse summary span{font-size:12px;color:var(--weak);font-weight:500;margin-left:8px}.match-collapse .match-grid{padding:12px 14px}
.sig-panel{border:1px solid var(--border);border-radius:10px;margin:12px 14px;background:#FAFBFC;overflow:hidden}.sig-title{font-weight:800;padding:9px 12px;border-bottom:1px solid var(--border2);background:#F8FAFC}.sig-grid{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:10px 18px;padding:10px 12px;font-size:13px}.sig-grid input{border:1px solid var(--border);border-radius:6px;padding:5px 7px;min-width:110px;background:#fff}.mini-btn{margin-left:6px;padding:4px 8px;border-radius:6px;background:var(--primary);color:#fff;font-size:12px;font-weight:700}.list-title-wrap{display:flex;align-items:center;gap:8px;flex:1;min-width:0}.list-title-wrap label{font-weight:800;white-space:nowrap}.list-title-wrap input{flex:1;min-width:240px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;background:#fff;font-weight:700}.list-title-wrap input:disabled{border-color:transparent;background:transparent;color:var(--text);padding-left:0}.judge-note{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.45}.file-tag button{margin-left:5px;border:1px solid var(--border);background:#fff;border-radius:5px;padding:1px 5px;font-size:11px;color:var(--muted)}.file-tag button:hover{color:var(--primary);border-color:#7DD3FC}.doc-page pre{font-family:SimSun,serif}
</style></head><body><h1>GYK-160G 型轨道车运行控制设备<br>安装方案<br>${esc(currentTask?.bureau||'广州工务段')} ${esc(currentTask?.model||'CDC-16')}（${esc(currentTask?.carNo||'12675')}）</h1><p style="text-align:center">高新兴创联科技股份有限公司<br>${today().slice(0,7).replace('-',' 年 ')} 月</p><table class="sig"><tr><td>编制</td><td>${esc(sig.creator)}</td><td>日期</td><td>${esc(sig.creatorDate)}</td></tr><tr><td>审核</td><td>${esc(sig.reviewer)}</td><td>日期</td><td>${esc(sig.reviewerDate)}</td></tr><tr><td>批准</td><td>${esc(sig.approver)}</td><td>日期</td><td>${esc(sig.approverDate)}</td></tr></table><pre>${esc(content)}</pre></body></html>`;
 downloadBlob(html, title.replace(/[\\/:*?"<>|]/g,'_')+'.doc','application/msword;charset=utf-8');
}
function downloadList(){
 const sig=getListSig(); const title=$('#listTitle')?.value?.trim() || currentTask?.listTitle || DEMO_TITLE;
 const rows=EQUIPMENT_ROWS.map((r,idx)=>FORMAL_HEADERS.map(h=>{
   if(h==='清单编号') return idx===0?(currentTask?.saleNo||'XS-2025062000064'):'';
   if(h==='使用单位') return idx===0?(currentTask?.client||''):'';
   if(h==='车次号') return idx===0?((currentTask?.model||'')+'（'+(currentTask?.carNo||'')+'）'):'';
   if(h==='w-车型') return currentTask?.model || r[h] || '';
   return r[h] ?? '';
 }));
 let tableRows=rows.map(r=>`<tr>${r.map(v=>`<td>${nl(v)}</td>`).join('')}</tr>`).join('');
 const sigText=`编制：${esc(sig.creator)}　　审核：${esc(sig.reviewer)}　　批准：${esc(sig.approver)}　　日期：${esc(sig.date)}`;
 const html=`<html><head><meta charset="utf-8"><style>table{border-collapse:collapse;font-family:SimSun,serif;font-size:10pt}td,th{border:1px solid #000;padding:5px;white-space:pre-wrap}.title{font-size:14pt;font-weight:bold;text-align:center}.sig{text-align:left}
.match-collapse{border:1px solid var(--border);background:#fff;border-radius:12px;overflow:hidden}.match-collapse summary{list-style:none;cursor:pointer;padding:11px 14px;background:#F8FAFC;font-weight:800;border-bottom:1px solid var(--border2)}.match-collapse summary::-webkit-details-marker{display:none}.match-collapse summary span{font-size:12px;color:var(--weak);font-weight:500;margin-left:8px}.match-collapse .match-grid{padding:12px 14px}
.sig-panel{border:1px solid var(--border);border-radius:10px;margin:12px 14px;background:#FAFBFC;overflow:hidden}.sig-title{font-weight:800;padding:9px 12px;border-bottom:1px solid var(--border2);background:#F8FAFC}.sig-grid{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:10px 18px;padding:10px 12px;font-size:13px}.sig-grid input{border:1px solid var(--border);border-radius:6px;padding:5px 7px;min-width:110px;background:#fff}.mini-btn{margin-left:6px;padding:4px 8px;border-radius:6px;background:var(--primary);color:#fff;font-size:12px;font-weight:700}.list-title-wrap{display:flex;align-items:center;gap:8px;flex:1;min-width:0}.list-title-wrap label{font-weight:800;white-space:nowrap}.list-title-wrap input{flex:1;min-width:240px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;background:#fff;font-weight:700}.list-title-wrap input:disabled{border-color:transparent;background:transparent;color:var(--text);padding-left:0}.judge-note{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.45}.file-tag button{margin-left:5px;border:1px solid var(--border);background:#fff;border-radius:5px;padding:1px 5px;font-size:11px;color:var(--muted)}.file-tag button:hover{color:var(--primary);border-color:#7DD3FC}.doc-page pre{font-family:SimSun,serif}
</style></head><body><table><tr><td colspan="12" class="title">${esc(title)}<br>（电缆要防鼠材料！！）</td></tr><tr>${FORMAL_HEADERS.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${tableRows}<tr><td colspan="12" class="sig">${sigText}</td></tr></table></body></html>`;
 downloadBlob(html, title.replace(/[\\/:*?"<>|]/g,'_')+'.xls','application/vnd.ms-excel;charset=utf-8');
}
function downloadBlob(content, filename, type){ const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);}

function renderFileTags(){
 const box=$('#fileTags'); if(!box) return; box.innerHTML='';
 uploadedFiles.forEach((f,i)=>{const tag=document.createElement('span');tag.className='file-tag'; const icon=/pdf$/i.test(f.name)?'📕 ':/doc/i.test(f.name)?'📝 ':/xls/i.test(f.name)?'📊 ':'📎 '; tag.innerHTML=`${icon}${esc(f.name)} <button data-action="preview-file" data-idx="${i}">预览</button><button data-action="remove-file" data-idx="${i}">×</button>`; box.appendChild(tag);});
}
$('#send').onclick=()=>{submit(input.value); input.value=''; input.style.height='auto';};
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#send').click();}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,130)+'px';});
$('#fileInput').addEventListener('change',e=>{ uploadedFiles.forEach(f=>{ if(f.url) URL.revokeObjectURL(f.url); }); uploadedFiles=[...e.target.files].map(f=>{f.url=URL.createObjectURL(f); return f;}); renderFileTags(); if(uploadedFiles.length){hideWelcome(); toast('资料已上传，可在输入框底部预览。');} e.target.value='';});
</script>
</body>
