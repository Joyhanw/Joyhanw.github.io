
<!DOCTYPE html>

<title>创联 · 清单方案编制智能体</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:#FBFCFE;color:var(--text);font-size:14px;overflow:hidden}button,input,textarea{font:inherit}button{border:0;background:none;cursor:pointer;color:inherit}.hidden{display:none!important}
.topbar{height:56px;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:0 24px}.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}.logo-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:flex;align-items:center;justify-content:center;color:#fff}.logo span{background:linear-gradient(135deg,var(--primary),var(--primary2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.user-chip{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.layout{height:calc(100vh - 56px);display:flex}.sidebar{width:236px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column}.new-task{margin:14px 12px;padding:10px 12px;border-radius:9px;background:#111827;color:white;font-weight:600;font-size:13px}.history-title{font-size:12px;color:var(--weak);padding:10px 16px 6px;display:flex;justify-content:space-between}.history-list{padding:0 12px;overflow:auto}.h-item{padding:8px 10px;border-radius:7px;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.h-item:hover{background:var(--border2);color:var(--text)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}.chat-head{height:56px;background:#fff;border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between}.chat-title{font-weight:700}.stream{flex:1;overflow:auto;padding:24px}.inner{max-width:1100px;margin:0 auto}
.welcome{max-width:960px;margin:22px auto;text-align:center;padding:20px 0}.welcome-icon{width:82px;height:82px;margin:0 auto 18px;border-radius:22px;background:linear-gradient(135deg,#E0F2FE,#E0E7FF);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 6px 18px rgba(99,102,241,.14)}.welcome h1{font-size:28px;margin-bottom:10px}.welcome p{color:var(--muted);line-height:1.8;margin-bottom:22px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;text-align:left;transition:.16s;cursor:pointer}.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(16,24,40,.08);border-color:#7DD3FC}.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700;margin-bottom:8px}.card h3{font-size:14px;margin-bottom:6px}.card p{font-size:12px;color:var(--weak);line-height:1.5;margin:0}
.msg{display:flex;gap:12px;margin-bottom:22px}.msg.user{flex-direction:row-reverse}.msg-avatar{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700}.msg.user .msg-avatar{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}.msg.ai .msg-avatar{background:#E0F2FE;color:#0369A1;border:1px solid #BAE6FD}.msg-body{flex:1;min-width:0}.msg.user .msg-body{text-align:right}.meta{font-size:12px;color:var(--weak);margin-bottom:5px}.bubble{display:inline-block;text-align:left;line-height:1.7}.user .bubble{background:var(--primary);color:#fff;border-radius:14px 14px 4px 14px;padding:10px 14px;max-width:78%;white-space:pre-wrap}.ai .bubble{width:100%;background:#fff;border:1px solid var(--border);border-radius:4px 14px 14px 14px;padding:16px 18px}.ai .bubble>*+*{margin-top:14px}
.steps{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12px;color:var(--weak)}.dot{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}.done{background:var(--success);color:#fff}.active{background:var(--primary);color:#fff}.pending{background:#E5E7EB;color:#6B7280}.step-l.done-t{color:var(--success);font-weight:700}.step-l.active-t{color:var(--primary);font-weight:700}
.panel{border:1px solid var(--border);background:#fff;border-radius:12px;overflow:hidden}.panel-head{padding:10px 14px;background:#F8FAFC;border-bottom:1px solid var(--border2);font-weight:700;display:flex;justify-content:space-between;align-items:center}.panel-body{padding:12px 14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px}.field{display:flex;gap:10px;align-items:center;min-height:34px}.field label{width:96px;color:var(--weak);font-size:12.5px}.field input{flex:1;border:1px solid var(--border);border-radius:7px;padding:6px 8px;background:#fff}.field input:disabled{background:#F8FAFC;color:#64748B;border-style:dashed}.route{background:#F8FAFC;border-left:3px solid var(--primary);padding:9px 12px;border-radius:7px;color:var(--muted);font-size:13px}.alert{padding:12px 14px;border-radius:10px;display:flex;gap:10px;font-size:13px;line-height:1.65}.alert.warning{background:var(--warning-soft);border:1px solid #FDE68A;color:#92400E}.alert.success{background:var(--success-soft);border:1px solid #BBF7D0;color:#065F46}.alert.danger{background:var(--danger-soft);border:1px solid #FECACA;color:#991B1B}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;transition:.15s}.btn.primary{background:var(--primary);color:#fff}.btn.success{background:var(--success);color:#fff}.btn.outline{background:#fff;border:1px solid var(--border);color:var(--muted)}.btn:hover{opacity:.9;transform:translateY(-1px)}
details.logic{border:1px solid var(--border);background:#fff;border-radius:12px;overflow:hidden}details.logic summary{list-style:none;cursor:pointer;padding:11px 14px;background:#F8FAFC;font-weight:800;border-bottom:1px solid var(--border2)}details.logic summary::-webkit-details-marker{display:none}.logic-body{padding:12px 14px}.logic-body ol{margin-left:18px;color:var(--muted);line-height:1.9}.match-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.match-card{border:1px solid var(--border2);border-radius:10px;background:#FAFBFE;padding:10px}.match-card b{display:block;margin-bottom:4px}.match-card span{font-size:12px;color:var(--muted);line-height:1.5}.mini-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}.mini-table th,.mini-table td{border:1px solid var(--border2);padding:7px 8px;text-align:left}.mini-table th{background:#F8FAFC;color:#607086}
.doc-shell{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff}.doc-toolbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#F8FAFC;border-bottom:1px solid var(--border2)}.plan-title-wrap{display:flex;align-items:center;gap:8px;flex:1;min-width:0}.plan-title-wrap label{font-weight:800;white-space:nowrap}.plan-title-wrap input{flex:1;min-width:260px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;background:#fff;font-weight:700}.plan-title-wrap input:disabled{border-color:transparent;background:transparent;color:var(--text);padding-left:0}.doc-summary{display:grid;grid-template-columns:200px 1fr;gap:16px;padding:14px}.doc-cover{border:1px solid #E5E7EB;min-height:270px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:24px 16px;font-family:SimSun,serif}.doc-cover .brand{font-weight:700;color:#0EA5E9}.doc-cover h2{font-size:20px;line-height:2;font-weight:500}.doc-cover .foot{font-size:15px;line-height:2}.doc-list{padding:4px 0}.doc-list li{margin-left:18px;line-height:1.9;color:var(--muted)}.doc-full{border-top:1px solid var(--border2);padding:0 14px 16px;max-height:520px;overflow:auto}.doc-page{max-width:760px;margin:18px auto;background:white;border:1px solid #E5E7EB;padding:34px 44px;box-shadow:0 4px 14px rgba(0,0,0,.04);font-family:SimSun,serif;line-height:1.9}.doc-page h3{font-size:18px;margin:16px 0 8px}.doc-page p{white-space:pre-wrap}.doc-editor{width:100%;min-height:360px;border:1px solid var(--border);border-radius:8px;padding:12px;font-family:SimSun,serif;line-height:1.8}.sig-panel{border-top:1px solid var(--border2);background:#FAFBFC;padding:12px 14px}.sig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 16px;font-size:13px}.sig-line{border-bottom:1px solid #CBD5E1;min-height:22px;display:inline-block;min-width:100px;vertical-align:middle}
.table-wrap{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff}.table-head{padding:10px 14px;background:#F8FAFC;border-bottom:1px solid var(--border2);display:flex;justify-content:space-between;align-items:center}.list-title-wrap{display:flex;align-items:center;gap:8px;flex:1;min-width:0}.list-title-wrap label{font-weight:800;white-space:nowrap}.list-title-wrap input{flex:1;min-width:240px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;background:#fff;font-weight:700}.list-title-wrap input:disabled{border-color:transparent;background:transparent;color:var(--text);padding-left:0}.table-hint{padding:7px 14px;border-bottom:1px solid var(--border2);font-size:12px;color:var(--weak);background:#fff}.table-scroll{overflow:auto;max-height:520px}table{border-collapse:collapse;width:100%;font-size:12px}th{position:sticky;top:0;background:#F8FAFC;z-index:1;color:#607086;font-weight:800}th,td{border-bottom:1px solid var(--border2);border-right:1px solid var(--border2);padding:7px 8px;vertical-align:top;white-space:pre-wrap;min-width:70px}td.num{text-align:right;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}tr:hover td{background:#FCFCFD}.editable td[contenteditable="true"]{background:#FFFBEB;outline:1px dashed #F59E0B}.flag{display:inline-block;border-radius:5px;padding:2px 6px;font-size:11px;font-weight:800}.flag.ok{background:var(--success-soft);color:#065F46}.flag.review{background:var(--warning-soft);color:#92400E}.flag.missing{background:var(--danger-soft);color:#991B1B}.judge-note{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.45}.special-note{border:1px solid #BAE6FD;background:#F0F9FF;border-radius:12px;padding:12px 14px;line-height:1.7;color:#075985}.special-note b{display:block;margin-bottom:4px;color:#0369A1}.list-sign{border-top:1px solid var(--border2);background:#FAFBFC;padding:10px 14px;font-size:13px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.list-sign span{font-weight:700}.list-sign input{border:1px solid var(--border);border-radius:6px;padding:5px 7px;background:#fff}.list-sign input:disabled{background:#F8FAFC;color:#64748B;border-style:dashed}.inputbar{flex:none;background:#fff;border-top:1px solid var(--border);padding:14px 24px 18px}.input-inner{max-width:1040px;margin:0 auto}.quick{display:flex;gap:8px;margin-bottom:10px;flex-wrap:nowrap;overflow-x:auto;align-items:center;padding-bottom:2px}.qc{flex:none;padding:6px 12px;border:1px solid var(--border);border-radius:999px;background:#fff;font-size:12.5px;color:var(--muted)}.qc:hover{background:var(--primary-soft);color:var(--primary);border-color:#7DD3FC}.input-row{border:1px solid var(--border);border-radius:14px;padding:10px 12px;background:#fff;display:flex;align-items:flex-end;gap:10px;box-shadow:0 1px 2px rgba(16,24,40,.03)}.input-row:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(14,165,233,.08)}textarea{flex:1;resize:none;border:0;outline:0;min-height:26px;max-height:130px;font-size:15px}.send{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-weight:900}.tools{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--weak)}.tool{border:1px solid var(--border);background:#F8FAFC;border-radius:8px;padding:5px 10px}.file-tags{display:flex;gap:6px;flex-wrap:wrap}.file-tag{background:#F8FAFC;border:1px solid var(--border2);border-radius:6px;padding:4px 7px;color:var(--muted)}.file-tag button{margin-left:5px;border:1px solid var(--border);background:#fff;border-radius:5px;padding:1px 5px;font-size:11px;color:var(--muted)}.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.36);display:flex;align-items:center;justify-content:center;z-index:99}.modal{background:#fff;border-radius:14px;width:480px;padding:18px;box-shadow:var(--shadow)}.modal h3{margin-bottom:8px}.modal p{color:var(--muted);line-height:1.7;margin-bottom:14px}
@media(max-width:900px){.sidebar{display:none}.cards,.match-grid,.grid2,.doc-summary{grid-template-columns:1fr}.sig-grid,.list-sign{grid-template-columns:1fr}.stream{padding:14px}}

/* 客户演示增强：施工方案左侧标题区、统一签名区、逻辑说明模块 */
.plan-left-card{border:1px solid #D9E6F2;border-radius:14px;background:linear-gradient(180deg,#F8FBFF 0%,#FFFFFF 100%);min-height:270px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 6px 18px rgba(14,165,233,.08)}
.plan-left-card .mini-tag{display:inline-flex;align-items:center;width:max-content;border-radius:999px;background:#E0F2FE;color:#0369A1;font-size:12px;font-weight:800;padding:3px 9px;margin-bottom:10px}
.plan-left-card h2{font-size:18px;line-height:1.55;margin-bottom:12px;color:#0F172A}
.plan-left-card .plan-meta{display:grid;gap:8px;margin-top:8px}.plan-left-card .meta-row{display:grid;grid-template-columns:72px 1fr;gap:8px;font-size:12.5px;line-height:1.55}.plan-left-card .meta-row span:first-child{color:#94A3B8}.plan-left-card .meta-row span:last-child{font-weight:700;color:#334155}.plan-left-card .output-chip{margin-top:12px;border-top:1px dashed #CBD5E1;padding-top:10px;color:#64748B;font-size:12px}
.logic-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}.logic-card{border:1px solid var(--border2);border-radius:10px;background:#FAFBFE;padding:10px}.logic-card b{display:block;margin-bottom:5px}.logic-card span{font-size:12px;color:var(--muted);line-height:1.55}.logic-section-title{font-weight:800;margin:12px 0 6px;color:#334155}.sign-title{font-weight:800;color:#334155;margin-bottom:8px}.sig-panel .sig-grid{grid-template-columns:repeat(2,minmax(220px,1fr))}.sig-panel{padding:12px 14px}.list-sign-like{border-top:1px solid var(--border2);background:#FAFBFC;padding:12px 14px}.list-sign-like .sig-grid{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:8px 16px;font-size:13px}
@media(max-width:900px){.logic-grid{grid-template-columns:1fr}.sig-panel .sig-grid,.list-sign-like .sig-grid{grid-template-columns:1fr}}


/* v3：施工方案标题区改为单栏展示；逻辑说明改为开发友好型步骤说明 */
.doc-summary{display:block!important;padding:0 14px 16px!important;}
.plan-title-card{border:1px solid #D9E6F2;border-radius:16px;background:linear-gradient(180deg,#F8FBFF 0%,#FFFFFF 100%);padding:18px 18px 14px;margin:14px 0 14px;box-shadow:0 6px 18px rgba(14,165,233,.08);max-width:520px;}
.plan-title-card .mini-tag{display:inline-flex;align-items:center;width:max-content;border-radius:999px;background:#E0F2FE;color:#0369A1;font-size:12px;font-weight:800;padding:3px 10px;margin-bottom:12px;}
.plan-title-card h2{font-size:22px;line-height:1.55;margin:0;color:#0F172A;font-weight:900;letter-spacing:.2px;}
.plan-title-card .output-chip{margin-top:14px;border-top:1px dashed #CBD5E1;padding-top:10px;color:#64748B;font-size:12px;}
.doc-preview-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 10px;padding:10px 12px;border:1px solid var(--border2);border-radius:10px;background:#F8FAFC;}
.doc-preview-head b{font-size:14px;color:#334155}.doc-preview-head span{font-size:12px;color:var(--weak)}
.doc-full{border-top:0!important;padding:0 0 12px!important;max-height:560px!important;overflow:auto!important;background:#F8FAFC;border-radius:12px;border:1px solid var(--border2);}
.doc-page{margin:18px auto!important;}
.logic-body.clean{padding:14px 16px;}
.logic-block-title{font-weight:900;color:#1F2937;margin:4px 0 10px;display:flex;align-items:center;gap:6px;}
.logic-flow{display:grid;gap:10px;margin-bottom:14px;}
.logic-step{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:flex-start;}
.logic-num{width:22px;height:22px;border-radius:999px;background:#E0F2FE;color:#2563EB;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;margin-top:1px;}
.logic-step b{display:block;color:#111827;margin-bottom:2px;}
.logic-step span{display:block;color:#607086;font-size:13px;line-height:1.65;}
.logic-note-table{width:100%;border-collapse:collapse;margin:8px 0 4px;font-size:12.5px;background:#fff;}
.logic-note-table th,.logic-note-table td{border:1px solid #E5EAF1;padding:8px 10px;text-align:left;vertical-align:top;}
.logic-note-table th{background:#F8FAFC;color:#475569;font-weight:800;}
.logic-note-table td{color:#607086;line-height:1.6;}
.logic-tip{margin-top:10px;padding:10px 12px;border-radius:10px;background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;font-size:12.5px;line-height:1.7;}
@media(max-width:900px){.plan-title-card{max-width:none}.doc-preview-head{align-items:flex-start;flex-direction:column}}


/* v4：施工方案草稿区优化：正文默认收缩 + Word预览 */
.plan-cover-card{border:1px solid #D9E6F2;border-radius:16px;background:linear-gradient(180deg,#F8FBFF 0%,#FFFFFF 100%);padding:18px 20px;margin:14px 14px 12px;box-shadow:0 6px 18px rgba(14,165,233,.08)}
.plan-cover-card .mini-tag{display:inline-flex;border-radius:999px;background:#E0F2FE;color:#0369A1;font-size:12px;font-weight:800;padding:3px 10px;margin-bottom:12px}
.plan-cover-card h2{font-size:22px;line-height:1.55;margin:0;color:#0F172A;font-weight:900;letter-spacing:.2px;max-width:760px}
.plan-cover-card .cover-note{margin-top:12px;border-top:1px dashed #CBD5E1;padding-top:10px;color:#64748B;font-size:12px}
.doc-summary{display:block!important;padding:0 0 14px!important}
.doc-preview-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 14px 12px;padding:12px 14px;border:1px solid var(--border2);border-radius:12px;background:#F8FAFC}
.doc-preview-head b{font-size:14px;color:#334155}.doc-preview-head span{font-size:12px;color:var(--weak);margin-left:8px}.doc-preview-actions{display:flex;gap:8px;flex:none}
.doc-full{margin:0 14px 14px!important;border-top:0!important;padding:0 0 12px!important;max-height:560px!important;overflow:auto!important;background:#F8FAFC;border-radius:12px;border:1px solid var(--border2)}
.doc-page{margin:18px auto!important}
.preview-modal{width:min(860px,92vw);max-height:88vh;overflow:auto;padding:0}.preview-toolbar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;z-index:2}.preview-body{padding:22px;background:#F8FAFC}.word-page{max-width:720px;min-height:880px;margin:0 auto;background:#fff;border:1px solid #E5E7EB;box-shadow:0 8px 26px rgba(15,23,42,.10);padding:54px 64px;font-family:SimSun,serif;color:#111827}.word-brand{text-align:center;color:#0EA5E9;font-weight:700;margin-bottom:26px}.word-title{text-align:center;font-size:24px;line-height:2.1;margin:0 0 36px}.word-meta{text-align:center;line-height:2;margin-bottom:32px}.word-sign{width:100%;border-collapse:collapse;margin:22px 0}.word-sign td{border:1px solid #222;padding:10px}.word-content{white-space:pre-wrap;line-height:1.9;font-size:14px}
@media(max-width:900px){.plan-cover-card h2{font-size:19px}.doc-preview-head{align-items:flex-start;flex-direction:column}.doc-preview-actions{width:100%;justify-content:flex-start}.word-page{padding:34px 28px;min-height:760px}}


/* v5 施工方案结果容器优化：编辑在顶部，预览/下载/生成清单在底部 */
.plan-doc{border-radius:14px;border:1px solid var(--border);box-shadow:0 4px 14px rgba(16,24,40,.04)}
.plan-doc .doc-toolbar{padding:13px 16px;background:#fff;border-bottom:1px solid var(--border2)}
.plan-doc-head{display:flex;align-items:center;gap:10px;font-weight:900;color:var(--text)}
.plan-doc-head .status-pill{font-size:12px;font-weight:800;color:#0369A1;background:#E0F2FE;border-radius:999px;padding:2px 8px}
.plan-doc-body{padding:16px;background:#fff}

const PLAN_SECTIONS = [{"title": "封面", "content": "GYK-160G 型轨道车运行控制设备\n安装方案\n广州工务段 CDC-16（12675）\n高新兴创联科技股份有限公司\n2025 年 07 月"}, {"title": "编制/审核/批准与修订记录", "content": "编制：徐乐生    日期：2025.7.06\n审核：张峰      日期：2025.7.06\n批准：李军      日期：2025.7.06\n\n修订记录：\n2024.06.25  徐乐生  V1.0  初稿\n2025.07.06  徐乐生  V1.1  修订主机安装示意图\n2025.11.25  徐乐生  V1.2  更新设备安装示意图"}, {"title": "目录", "content": "1、GYK-160G 构成及原理\n  1.1 设备组成\n  1.2 装车配置表\n  1.3 设备连接示意图\n2、GYK-160G 设备的安装位置及工艺要求\n  2.1 机柜\n  2.2 GYK-160G 主机安装\n  2.3 制动隔离装置\n  2.4 UPS 主机安装\n  2.5 DMI 控制盒\n  2.6 警惕按钮\n  2.7 机车信号机\n  2.8 速度传感器安装\n3、设备连接\n4、线缆布线和接线要求\n5、验收\n附表1：工具\n附表2：GYK-160G 设备安装调试报告"}, {"title": "1、GYK-160G 构成及原理", "content": "1.1 设备组成\nGYK-160G 系统包括主机、人机界面单元（DMI）、机车信号机及有关接口。接口分为主机与机车信号接收线圈、压力传感器、速度传感器、制动隔离装置和电磁阀、UPS 电源、BTM 设备（可选）等外围设备的接口，主机与车辆、GMS 车载设备、CIR 设备、轴温报警设备、调车监控相关设备等其他系统或设备的接口。\n\n1.2 装车配置表\nGYK-160G 主机 1 个（机柜）；DMI 控制盒 2 个（两端操作台）；机车信号机 2 个（两端操作台挡风玻璃中间）；双路机车信号接收线圈 4 个（两端车底两侧）；压力传感器 6 个；常用/紧急电磁阀各 1 个；旁路阀 2 个；扬声器 2 个；警惕按钮 2 个；配套电缆 1 套。"}, {"title": "2、设备安装位置及工艺要求", "content": "2.1 机柜\nGYK-160G 主机需安装于装机柜内，并预留足够维护空间。主机采用后出线方式，后部出线空间不小于 200mm，两侧和顶部应预留维护空间，主机应可靠接地。\n\n2.2 GYK-160G 主机安装\n主机托盘需固定在柜体或地板上，安装螺钉按要求锁紧，主机安装位置应便于维护、拆卸和散热，避免安装在大幅震动、高温高湿环境。\n\n2.3 制动隔离装置\n隔离盒安装在机柜内或操作台下具有防护空间，距 GYK-160G 主机距离不大于 2m，安装固定后需便于维修检测。\n\n2.4 UPS 主机安装\nUPS 电源安装在机柜内或操作台下，安装固定牢靠，主机安装应可靠接地。"}, {"title": "3、设备连接", "content": "主机通过 GX2 工况制动、GX7 电源输入、DMI 主控/副控电缆、I/II 端信号灯、录音电缆、管压速度电缆、机车信号电缆、机感线圈电缆、GMS 通信线等与外部设备连接。\n\n设备连接时需确保端子标识清晰、线缆走向符合规范、接口连接正确，电缆两端标识应与图纸一致。"}, {"title": "4、线缆布线和接线要求", "content": "布线尽量避免打孔，尽量利用车辆原有过线孔。电缆走线应遵循捆绑牢固、穿孔防护、护套保护、避免在车辆活动部件捆绑、避免高温高湿环境、便于维护、做好与原有电气线路隔离等原则。\n\n电源接线端子接入前必须用万用表测试输出电压符合 GYK-160G 使用要求，电源接线与车辆接入端子之间必须有隔离措施。"}, {"title": "5、验收", "content": "验收人员由设备管理部门、轨道车管理部门、轨道车使用单位、设备厂家技术人员、设备安装人员等组成。\n\n5.1 静态检验\n检查主机、DMI、机车信号机、传感器安装位置是否合理紧固；检查各接线端是否可靠；检查线束布置是否符合布线标准。\n\n5.2 上电检测\n检查设备安装是否符合规范要求，上电后是否能正常开机；检查车辆通排风、发动机启停、工况切换、GYK-160G 工况、相位、熄火、保压、转储、下载、发码是否正常。\n\n5.3 设备安装注意事项\n单套 GYK-160G 的施工及调试工期预计 5-7 个自然日，本次车辆安装 GYK-160G 需使用单位配合提供 220V 电源。"}, {"title": "附表1：工具", "content": "斜口钳 1 把、M20 外六角扳手 1 把、M8 外六角扳手 1 把、M6 外六角扳手 1 把、M6 内六角扳手 1 把、大/小十字螺丝刀各 1 把、大/小一字螺丝刀各 1 把、活动扳手 1 把、管钳 1 把、万用表 1 个、FMQ-IV 型发码器 1 个、记号笔 1 支、手电钻 1 把、工作服 1 套、扭矩扳手 1 把。"}, {"title": "附表2：GYK-160G 设备安装调试报告", "content": "单位、车号、车型、厂家、地点、日期、施工人员；设备安装示意图；设备信息；版本信息；安装信息；管理参数；设备检查（关机/开机）等检查表项。"}];
const FORMAL_HEADERS = ["清单编号", "使用单位", "车次号", "w-整机料号", "w-整机品名", "w-车型", "w-品名", "w-规格型号", "w-备注", "w-数量", "w-料号", "w-产品线"];

const $=s=>document.querySelector(s), stream=$('#stream'), welcome=$('#welcome'), input=$('#input'), history=$('#history');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}function nl(s){return esc(s).replace(/\n/g,'<br>');}function now(){return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}function hideWelcome(){if(welcome)welcome.classList.add('hidden');if(!$('.inner')){const div=document.createElement('div');div.className='inner';stream.appendChild(div);}}
function addMsg(role,html,route=''){hideWelcome();const inner=$('.inner');const div=document.createElement('div');div.className='msg '+role;div.innerHTML=`<div class="msg-avatar">${role==='user'?'创':'AI'}</div><div class="msg-body"><div class="meta"><b>${role==='user'?'创联 · 你':'创联 AI'}</b> ${route?`<span style="background:#E0F2FE;color:#0369A1;border-radius:4px;padding:1px 6px;margin-left:4px">${route}</span>`:''} <span style="margin-left:4px">${now()}</span></div><div class="bubble">${html}</div></div>`;inner.appendChild(div);setTimeout(()=>stream.scrollTop=stream.scrollHeight,50);return div;}
function addHistory(q){const item=document.createElement('div');item.className='h-item';item.textContent=q.length>28?q.slice(0,28)+'…':q;item.title=q;item.onclick=()=>submit(q);history.prepend(item);$('#histCount').textContent=history.children.length;}
function steps(active,labels=['识别任务','确认信息','模板匹配','生成结果','确认下载']){return `<div class="steps">${labels.map((l,i)=>{let n=i+1,cls=n<active?'done':n===active?'active':'pending',t=n<active?'done-t':n===active?'active-t':'';return `<span class="dot ${cls}">${n<active?'✓':n}</span><span class="step-l ${t}">${l}</span>${i<labels.length-1?'<span style="color:#CBD5E1">→</span>':''}`}).join('')}</div>`;}
function buildListTitle(t){return `设备清单-${t.saleNo||'XS-2025062000064'}-${t.product||'GYK-160轨道车运行控制设备（分布式）'}-${t.model||'GCY-300II'}（${t.carNo||'12327'}）-${t.qty||1}套-${t.client||'广深铁路股份有限公司广州电务段'}-${today().replace(/-/g,'.')}`;}function buildPlanTitle(t){return `${t.product||'GYK-160G轨道车运行控制设备（分布式）'}安装方案-${t.client||'客户单位'}-${t.model||'车型'}（${t.carNo||'车号'}）-${today().replace(/-/g,'.')}`;}
function parseTask(q){if(q.includes('第一个'))q='客户：广深铁路股份有限公司广州电务段，车型：GCY-300II，车号：12327，产品：GYK-160G轨道车运行控制设备（分布式），料号：159110100388，1套';if(q.includes('第二个'))q='仅生成施工方案，客户：广深铁路股份有限公司广州工务段，车型：CDC-16，车号：12675，产品：GYK-160G轨道车运行控制设备（分布式），1套';const onlyPlan=/仅生成施工方案|仅方案|商务|售前/.test(q), onlyItem=/仅生成设备清单项|仅生成设备清单|仅清单|清单项/.test(q);const client=(q.match(/客户[：:]\s*([^，,\n]+)/)||[])[1]||'';const model=(q.match(/车型[：:]\s*([^，,\n]+)/)||[])[1]||'';const carNo=(q.match(/车号[：:]\s*([^，,\n]+)/)||[])[1]||'12327';const materialNo=(q.match(/料号[：:]\s*([^，,\n]+)/)||[])[1]||'159110100388';const qtyMatch=q.match(/(\d+)\s*套/);const qty=qtyMatch?parseInt(qtyMatch[1]):1;if(!client&&!model&&!onlyPlan&&!onlyItem)return null;const product=(q.match(/产品[：:]\s*([^，,\n]+)/)||[])[1]||'GYK-160G轨道车运行控制设备（分布式）';const sale=(q.match(/XS-\d{8,}/)||[])[0]||'XS-2025062000064';const t={client:client||'广深铁路股份有限公司广州电务段',model:model||'GCY-300II',carNo,qty,product,saleNo:sale,materialNo,onlyPlan,onlyItem,bureau:(client||'').includes('工务')?'广州工务段':'广州电务段',special:'已匹配特殊说明模板'};t.specialRedNote=pendingSpecialNote;t.notifiedReviewer="";t.listTitle=buildListTitle(t);t.planTitle=buildPlanTitle(t);return t;}
function field(label,key,value,disabled=false){return `<div class="field"><label>${label}</label><input data-key="${key}" value="${esc(value)}" ${disabled?'disabled':''}></div>`;}
function taskConfirmHtml(t){const mode=t.onlyPlan?'仅生成施工方案':(t.onlyItem?'仅生成设备清单项':'施工方案 + 设备清单');return `${steps(2)}<div class="panel"><div class="panel-head">📋 任务信息确认 <span style="font-size:12px;color:var(--weak)">当前模式：${mode}</span></div><div class="panel-body"><div class="grid2">${field('客户单位','client',t.client)}${field('销售单号','saleNo',t.saleNo)}${field('车型','model',t.model)}${field('车号','carNo',t.carNo)}${field('产品型号','product',t.product,true)}${field('料号','materialNo',t.materialNo)}${field('数量','qty',t.qty+'套')}${field('路局/车辆厂','bureau',t.bureau)}${field('特殊说明','special',t.special)}</div><div class="actions" style="margin-top:12px"><button class="btn primary" data-action="confirm-task">✅ 确认任务信息</button></div></div></div>`;}
function readInputs(){document.querySelectorAll('.panel input[data-key]').forEach(inp=>{const k=inp.dataset.key;let v=inp.value.trim();if(k==='qty')v=parseInt(v)||currentTask.qty;currentTask[k]=v;});currentTask.listTitle=buildListTitle(currentTask);currentTask.planTitle=buildPlanTitle(currentTask);}
function matchDetails(t){const conditions=[`产品型号：${t.product}`,`客户单位：${t.client}`,`销售单号：${t.saleNo}`,`车型：${t.model}`,`料号：${t.materialNo}`,`车号：${t.carNo}`,`路局/车辆厂：${t.bureau}`,`数量：${t.qty}套`,`特殊说明：${t.special}`];return `<details class="logic"><summary>🔗 模板匹配结果 / 逻辑说明</summary><div class="logic-body"><div class="match-grid"><div class="match-card"><b>本次匹配条件</b><span>${conditions.map(esc).join('<br>')}</span></div><div class="match-card"><b>${t.onlyItem?'设备清单项匹配':'施工方案模板'}</b><span>${t.onlyItem?'在内置设备清单模板中匹配对应清单项':'已匹配内置施工方案模板'}</span></div><div class="match-card"><b>${t.onlyPlan?'配置清单 Excel':'设备清单模板'}</b><span>${t.onlyPlan?'仅生成施工方案场景需上传配置清单 Excel':'已匹配内置设备清单模板'}</span></div></div><ol><li>产品型号为核心匹配字段，页面置灰不可修改。</li><li>系统优先按完整条件匹配；如果无法完整匹配，则根据已匹配信息降级匹配并展示条件。</li><li>如果匹配到多个模板或多个清单项，提示用户补充料号、车型、规格型号等信息后重新匹配。</li><li>如果完全匹配不到，提示用户确认输入或补充模板。</li></ol></div></details>`;}
function getPlanBodyText(){return PLAN_SECTIONS.filter(s=>!['封面','编制/审核/批准与修订记录'].includes(s.title)).map(s=>s.title+'\n'+s.content).join('\n\n');}
function renderPlanContent(text){return `<div class="doc-page"><pre style="white-space:pre-wrap;font-family:SimSun,serif;line-height:1.9">${esc(text||'')}</pre></div>`;}
function planLogic(t){
 const imgs=uploadedFiles.filter(f=>/\.(zip|png|jpg|jpeg|webp)$/i.test(f.name));
 let imgRows=imgs.length?imgs.slice(0,5).map(f=>{let c=/主机/.test(f.name)?'2.2 GYK-160G 主机安装':/机柜/.test(f.name)?'2.1 机柜':/UPS/i.test(f.name)?'2.4 UPS 主机安装':'待人工选择章节';return `<tr><td>${esc(f.name)}</td><td>${esc(c)}</td><td>${c==='待人工选择章节'?'需人工确认':'已匹配'}</td></tr>`;}).join(''):`<tr><td>主机安装示意图.png</td><td>2.2 GYK-160G 主机安装</td><td>演示匹配</td></tr><tr><td>机柜安装位置图.png</td><td>2.1 机柜</td><td>演示匹配</td></tr>`;
 return `<details class="logic"><summary>📌 施工方案生成逻辑 / 注意事项</summary><div class="logic-body clean">
  <div class="logic-block-title">一、生成流程</div>

    <div class="logic-step"><div class="logic-num">1</div><div><b>模板来源</b><span>${t.onlyPlan?'仅生成施工方案时，由用户上传施工方案模板和配置清单 Excel；系统按上传模板生成商务/售前方案。':'正式任务流程使用系统内置施工方案模板；用户只需录入或上传任务信息，模板由系统自动匹配。'}</span></div></div>
    <div class="logic-step"><div class="logic-num">2</div><div><b>匹配规则</b><span>以产品型号为核心字段，结合客户单位、销售单号、车型、料号、车号、路局/车辆厂、数量和特殊说明进行匹配。匹配到多个模板时，需要补充信息后再生成。</span></div></div>
    <div class="logic-step"><div class="logic-num">3</div><div><b>生成结果</b><span>系统生成施工方案草稿，包含标题区、正文、签名区和图片插入结果。标题和正文支持编辑，保存后下载 Word 使用最新内容。</span></div></div>
    <div class="logic-step"><div class="logic-num">4</div><div><b>签名区</b><span>施工方案签名区默认留白，不做线上审批流程，由客户线下或内部流程补充编制、审核、批准和日期。</span></div></div>
    <div class="logic-step"><div class="logic-num">5</div><div><b>图片插入</b><span>图片压缩包为可选；如上传，系统在施工方案模板确认后，根据图片名称和章节名称匹配插入位置。匹配不到时由用户人工确认章节。</span></div></div>
  </div>
  <div class="logic-block-title">二、本次匹配条件</div>
  <table class="logic-note-table"><tbody>
    <tr><th>产品型号</th><td>${esc(t.product)}</td><th>客户单位</th><td>${esc(t.client)}</td></tr>
    <tr><th>销售单号</th><td>${esc(t.saleNo)}</td><th>车型/车号</th><td>${esc(t.model)} / ${esc(t.carNo)}</td></tr>
    <tr><th>料号</th><td>${esc(t.materialNo)}</td><th>路局/车辆厂</th><td>${esc(t.bureau)}</td></tr>
    <tr><th>数量</th><td>${esc(t.qty)}套</td><th>特殊说明</th><td>${esc(t.special)}</td></tr>
  </tbody></table>
  <div class="logic-block-title">三、图片匹配结果</div>

  <div class="logic-tip">开发说明：该模块仅展示生成规则和匹配依据，不作为客户日常主操作入口；默认收缩，方便演示时展开解释。</div>
 </div></details>`;

 </div>`;

function aiJudgeCell(r){const fl=r._flag||'ok';if(fl==='ok')return '<span class="flag ok">正常</span>';const label=fl==='review'?'需确认':'缺失';return `<span class="flag ${fl}">${label}</span><div class="judge-note">${esc(String(r['AI判断']||'').replace(/^需确认[:：]?|^缺失[:：]?/,'').replace(/^正常[:：]?/,''))}</div>`;}

function redNoteHtml(note){return note?`<span class="red-title-note">（${esc(note)}）</span>`:'';}
function redNoteExcel(note){return note?`<span class="excel-special">（${esc(note)}）</span>`:'';}
function updateSpecialNoteUI(){const note=getSpecialNote();const inp=document.getElementById('listSpecialInput');if(inp)inp.value=note;document.querySelectorAll('.red-title-note').forEach(el=>{el.innerHTML=note?`（${esc(note)}）`:'';el.classList.toggle('hidden',!note);});const editing=!!(document.getElementById('listTitle')&&!document.getElementById('listTitle').disabled);document.querySelectorAll('.list-note-delete').forEach(el=>el.classList.toggle('hidden',!(note&&editing)));}
function listSignHtml(mode='full'){
 return `<div class="list-sign-panel"><div class="sig-title">${mode==='item'?'清单项签名区':'设备清单签名区'}</div><div class="list-sign-grid">
  <div class="sign-field"><label>编制</label><input id="listCreator" value="唯安" disabled><button class="mini-notify" data-action="toggle-notify">通知审核</button></div>
  <div class="sign-field"><label>日期</label><input id="listCreateDate" value="" disabled></div>
  <div class="sign-field"><label>审核</label><input id="listReviewer" value="${esc((currentTask&&currentTask.notifiedReviewer)||'')}" disabled></div>
  <div class="sign-field"><label>日期</label><input id="listReviewDate" value="" disabled></div>
  <div class="sign-field"><label>批准</label><input id="listApprover" value="" disabled></div>
  <div class="sign-field"><label>日期</label><input id="listApproveDate" value="" disabled></div>
  <div class="notify-select hidden" id="notifyPeople"><span class="hint">选择一位审核人发送提醒：</span><button class="notify-person" data-action="notify-person" data-person="张俊">张俊</button><button class="notify-person" data-action="notify-person" data-person="张峰">张峰</button></div>
  <div class="notify-result hidden" id="notifyResult"></div>
 </div></div>`;

function getVisibleListRows(){return [...document.querySelectorAll('#eqTable tbody tr')].map(tr=>FORMAL_HEADERS.map(h=>{const td=[...tr.querySelectorAll('td[data-col]')].find(x=>x.dataset.col===h);return td?td.innerText:'';}));}
function buildExcelPreviewTable(rows){return `<table class="excel-preview-table"><thead><tr>${FORMAL_HEADERS.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${nl(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
function specialNote(t){return `<div class="special-note"><b>特殊说明</b><div>已根据客户单位、车型、路局/车辆厂匹配到特殊说明模板：电缆需采用防鼠材料，压力传感器同单位型号需保持一致。请核对是否适用于当前清单。</div></div>`;}
function tableHtml(t,mode='full'){
 const cols=[...FORMAL_HEADERS,'AI判断'];
 let rows= mode==='item'?EQUIPMENT_ROWS.filter(r=>String(r['w-整机料号']).includes(t.materialNo)||String(r['w-料号']).includes(t.materialNo)).slice(0,1):EQUIPMENT_ROWS;
 if(!rows.length) rows=EQUIPMENT_ROWS.slice(0,1);
 const note=(t&&t.specialRedNote)||pendingSpecialNote||'';
 const body=rows.map((r,idx)=>`<tr data-idx="${EQUIPMENT_ROWS.indexOf(r)}">${cols.map(c=>{let v=r[c],cls=c==='w-数量'?'num':'';if(c==='清单编号')v=idx===0?t.saleNo:'';if(c==='使用单位')v=idx===0?t.client:'';if(c==='车次号')v=idx===0?`${t.model}（${t.carNo}）`:'';if(c==='w-车型')v=t.model||v;if(c==='AI判断')return `<td>${aiJudgeCell(r)}</td>`;return `<td class="${cls}" data-col="${esc(c)}">${nl(v)}</td>`;}).join('')}</tr>`).join('');
 return `<div class="table-wrap" id="tableWrap"><div class="table-head"><div class="list-title-wrap"><label>${mode==='item'?'清单项标题':'设备清单标题'}：</label><input id="listTitle" value="${esc(t.listTitle)}" disabled><span class="red-title-note ${note?'':'hidden'}">${note?`（${esc(note)}）`:''}</span><button class="list-note-delete hidden" data-action="clear-list-special">删除说明</button></div><div class="actions"><button class="btn outline" data-action="edit-list">✎ 编辑</button><button class="btn success hidden" data-action="save-list">💾 保存</button></div></div><div class="table-hint">保留客户模板字段和空列；AI 判断列仅页面展示，下载时不导出。标题后的红色括号说明来自底部“标题特殊说明”。</div><div class="table-scroll"><table id="eqTable"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>${listSignHtml(mode)}</div>`;
}
function listLogic(mode='full'){
 return `<details class="logic"><summary>📌 ${mode==='item'?'清单项匹配逻辑':'设备清单生成逻辑'} / 注意事项</summary><div class="logic-body clean">
  <div class="logic-block-title">一、生成流程</div>
  <div class="logic-flow">
    <div class="logic-step"><div class="logic-num">1</div><div><b>${mode==='item'?'清单项匹配':'设备清单生成'}</b><span>${mode==='item'?'仅生成设备清单项为局部匹配场景，系统根据统一任务字段在内置设备清单模板中匹配对应行，只展示匹配到的清单项。':'完整设备清单基于内置设备清单模板和任务信息生成，保留客户模板字段和空列。'}</span></div></div>
    <div class="logic-step"><div class="logic-num">2</div><div><b>特殊说明</b><span>特殊说明模板匹配成功后，直接展示在设备清单草稿最上方，便于业务人员先核对关键业务要求。</span></div></div>
    <div class="logic-step"><div class="logic-num">3</div><div><b>AI 判断列</b><span>AI 判断列仅用于页面复核，标记正常、需确认、缺失等情况；下载 Excel 时不导出该列。</span></div></div>
    <div class="logic-step"><div class="logic-num">4</div><div><b>下载规则</b><span>下载时按客户模板格式导出 Excel，保留业务系统需要的字段顺序和空列；下载前提醒用户确认已完成内部复核。</span></div></div>
  </div>
  <div class="logic-block-title">二、签名区取值逻辑</div>
  <table class="logic-note-table"><thead><tr><th>字段</th><th>取值逻辑</th></tr></thead><tbody>
    <tr><td>编制</td><td>当前操作人自动回填，当前原型显示为“唯安”。</td></tr>
    <tr><td>编制日期</td><td>按客户最终规则取生成日期或提交日期，当前原型留空展示。</td></tr>
    <tr><td>审核</td><td>点击“通知审核”后选择一位审核人，系统提示已提醒该人员审核；本期不模拟完整审批流。</td></tr>
    <tr><td>审核日期</td><td>审核通过时由客户内部流程确认。</td></tr>
    <tr><td>批准</td><td>审核通过后进入批准，批准人按客户内部流程确认。</td></tr>
    <tr><td>批准日期</td><td>批准通过后回填日期，该日期作为设备清单最终日期。</td></tr>
  </tbody></table>
  <div class="logic-tip">开发说明：设备清单不做复杂审批流按钮，仅保留签名区样式、通知审核提醒、取值逻辑说明和下载前确认提示。标题后的红色括号说明由用户在底部“标题特殊说明”输入后自动带入，预览和下载均可见。</div>
 </div></details>`;
}
function listResponse(t,mode='full'){return `${steps(4)}<div class="route">${mode==='item'?'已根据当前条件匹配到 1 条设备清单项。':'已生成设备清单草稿。'}</div>${specialNote(t)}${tableHtml(t,mode)}${listLogic(mode)}<div class="list-special-editor hidden" id="listSpecialEditor"><span class="hint">标题特殊说明</span><input id="listSpecialInput" placeholder="例如：电缆需采用防鼠材料！！" value="${esc(getSpecialNote())}"><button class="btn primary" data-action="apply-list-special">确定</button><button class="btn outline" data-action="clear-list-special">删除</button></div><div class="actions bottom-actions"><button class="btn redline" data-action="toggle-list-special">➕标题特殊说明</button><button class="btn outline" data-action="preview-list">预览 Excel 效果</button><button class="btn primary" data-action="download-list">📥 下载 Excel</button></div>`;}
function submit(q){q=(q||'').trim();if(!q)return;const fileText=uploadedFiles.length?`📎 已上传：${uploadedFiles.map(f=>f.name).join('、')}\n`:'';addMsg('user',esc(fileText+q));const task=parseTask(q);if(!task){addMsg('ai','<div class="alert warning"><b>未识别任务</b><span>请补充客户、车型、产品型号等任务信息。</span></div>','任务识别');return;}currentTask=task;addHistory(q);setTimeout(()=>addMsg('ai',taskConfirmHtml(currentTask),'任务识别'),300);}
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.id==='newTask'){const inner=$('.inner');if(inner)inner.remove();welcome.classList.remove('hidden');input.value='';currentTask=null;return;}if(btn.id==='uploadBtn'){document.getElementById('fileInput').click();return;}if(btn.classList.contains('quick-card')||btn.classList.contains('qc')){submit(btn.dataset.q);return;}const act=btn.dataset.action;if(!act)return;if(act==='preview-file'){const f=uploadedFiles[parseInt(btn.dataset.idx)];if(f?.url)window.open(f.url,'_blank');return;}if(act==='remove-file'){const i=parseInt(btn.dataset.idx);if(uploadedFiles[i]?.url)URL.revokeObjectURL(uploadedFiles[i].url);uploadedFiles.splice(i,1);renderFileTags();return;}if(act==='confirm-task'){readInputs();if(currentTask.onlyItem){addMsg('ai',listResponse(currentTask,'item'),'清单项匹配');return;}addMsg('ai',planResponse(currentTask),currentTask.onlyPlan?'施工方案生成':'生成施工方案');return;}if(act==='toggle-full'){const shell=btn.closest('.doc-shell');const d=shell?.querySelector('#docFull')||$('#docFull');if(d){if(!d.innerHTML.trim()){d.innerHTML=(PLAN_SECTIONS||[]).filter(s=>!['封面','编制/审核/批准与修订记录'].includes(s.title)).map(sec=>`<div class="doc-page"><h3>${esc(sec.title)}</h3><p>${nl(sec.content)}</p></div>`).join('');}d.classList.toggle('hidden');btn.textContent=d.classList.contains('hidden')?'展开正文':'收起正文';}return;}if(act==='preview-plan'){showPlanPreview();return;}if(act==='preview-list'){showListPreview();return;}if(act==='toggle-list-special'){const box=document.getElementById('listSpecialEditor');const inp=document.getElementById('listSpecialInput');if(inp)inp.value=getSpecialNote();if(box)box.classList.toggle('hidden');return;}if(act==='apply-list-special'){const v=(document.getElementById('listSpecialInput')?.value||'').trim();pendingSpecialNote=v;if(currentTask)currentTask.specialRedNote=v;updateSpecialNoteUI();const box=document.getElementById('listSpecialEditor');if(box)box.classList.add('hidden');toast(v?'标题特殊说明已添加':'请输入标题特殊说明');return;}if(act==='clear-list-special'){pendingSpecialNote='';if(currentTask)currentTask.specialRedNote='';const inp=document.getElementById('listSpecialInput');if(inp)inp.value='';updateSpecialNoteUI();const box=document.getElementById('listSpecialEditor');if(box)box.classList.add('hidden');toast('标题特殊说明已删除');return;}if(act==='toggle-notify'){const panel=btn.closest('.list-sign-panel');const box=panel?.querySelector('#notifyPeople');if(box)box.classList.toggle('hidden');return;}if(act==='notify-person'){const person=btn.dataset.person;currentTask.notifiedReviewer=person;const panel=btn.closest('.list-sign-panel');const reviewer=panel?.querySelector('#listReviewer')||document.getElementById('listReviewer');if(reviewer)reviewer.value=person;(panel||document).querySelectorAll('.notify-person').forEach(x=>x.classList.toggle('active',x.dataset.person===person));const res=panel?.querySelector('#notifyResult')||document.getElementById('notifyResult');if(res){res.classList.remove('hidden');res.textContent=`已提醒 ${person} 审核当前设备清单。`; }return;}if(act==='edit-plan'){const shell=btn.closest('.doc-shell');const title=shell?.querySelector('#planTitle')||$('#planTitle');const editor=shell?.querySelector('#planEditor')||$('#planEditor');const full=shell?.querySelector('#docFull')||$('#docFull');if(title)title.disabled=false;if(editor)editor.classList.remove('hidden');if(full)full.classList.add('hidden');btn.classList.add('hidden');shell?.querySelector('[data-action="save-plan"]')?.classList.remove('hidden');return;}if(act==='save-plan'){const shell=btn.closest('.doc-shell');const title=shell?.querySelector('#planTitle')||$('#planTitle');const editor=shell?.querySelector('#planEditor')||$('#planEditor');const full=shell?.querySelector('#docFull')||$('#docFull');currentTask.planTitle=title?.value.trim()||currentTask.planTitle;currentTask.planContent=editor?.value||currentTask.planContent;if(title)title.disabled=true;if(editor)editor.classList.add('hidden');if(full && currentTask.planContent){full.innerHTML=renderPlanContent(currentTask.planContent);}btn.classList.add('hidden');shell?.querySelector('[data-action="edit-plan"]')?.classList.remove('hidden');toast('施工方案已保存');return;}if(act==='confirm-plan'){addMsg('ai',listResponse(currentTask,'full'),'生成设备清单');return;}if(act==='edit-list'){$('#listTitle').disabled=false;$('#eqTable').classList.add('editable');document.querySelectorAll('#eqTable tbody td[data-col]').forEach(td=>td.contentEditable='true');updateSpecialNoteUI();btn.classList.add('hidden');document.querySelector('[data-action="save-list"]').classList.remove('hidden');return;}if(act==='save-list'){saveTableEdits();currentTask.listTitle=$('#listTitle').value.trim()||currentTask.listTitle;$('#listTitle').disabled=true;$('#eqTable').classList.remove('editable');document.querySelectorAll('#eqTable tbody td').forEach(td=>td.contentEditable='false');updateSpecialNoteUI();btn.classList.add('hidden');document.querySelector('[data-action="edit-list"]').classList.remove('hidden');toast('清单已保存');return;}if(act==='download-plan'){downloadPlan();return;}if(act==='download-list'){showDownloadConfirm();return;}if(act==='confirm-download-list'){$('.modal-mask').remove();downloadList();return;}if(act==='cancel-modal'){$('.modal-mask').remove();return;}});
function saveTableEdits(){document.querySelectorAll('#eqTable tbody tr').forEach(tr=>{const idx=parseInt(tr.dataset.idx);if(isNaN(idx))return;tr.querySelectorAll('td[data-col]').forEach(td=>{EQUIPMENT_ROWS[idx][td.dataset.col]=td.innerText.trim();});});}
function showListPreview(){
 const note=getSpecialNote();
 const title=$('#listTitle')?.value?.trim()||currentTask?.listTitle||'设备清单';
 const rows=getVisibleListRows();
 const mask=document.createElement('div');mask.className='modal-mask';
 mask.innerHTML=`<div class="modal preview-modal wide"><div class="preview-toolbar"><h3>设备清单 Excel 预览</h3><div class="actions"><button class="btn outline" data-action="cancel-modal">关闭</button><button class="btn primary" data-action="download-list">下载 Excel</button></div></div><div class="preview-body"><div class="excel-page"><div class="excel-preview-title">${esc(title)}${redNoteExcel(note)}</div>${buildExcelPreviewTable(rows)}<table class="excel-preview-table" style="border-top:0"><tbody><tr><td style="width:70px">编制</td><td>唯安</td><td style="width:70px">日期</td><td>____</td></tr><tr><td>审核</td><td>${esc((currentTask&&currentTask.notifiedReviewer)||'____')}</td><td>日期</td><td>____</td></tr><tr><td>批准</td><td>____</td><td>日期</td><td>____</td></tr></tbody></table></div></div></div>`;
 document.body.appendChild(mask);
}
function showDownloadConfirm(){const unresolved=EQUIPMENT_ROWS.filter(r=>r._flag!=='ok').length;const mask=document.createElement('div');mask.className='modal-mask';mask.innerHTML=`<div class="modal"><h3>下载前确认</h3><p>设备清单将按客户模板格式导出为 Excel，空列会保留，AI 判断列不会导出。当前存在 <b style="color:#D97706">${unresolved}</b> 项需确认/缺失内容，请确认已完成内部复核后继续下载。</p><div class="actions" style="justify-content:flex-end"><button class="btn outline" data-action="cancel-modal">返回检查</button><button class="btn primary" data-action="confirm-download-list">继续下载</button></div></div>`;document.body.appendChild(mask);}
function toast(msg){const m=document.createElement('div');m.style.cssText='position:fixed;right:24px;top:72px;background:#111827;color:#fff;padding:10px 14px;border-radius:10px;z-index:120;box-shadow:var(--shadow)';m.textContent=msg;document.body.appendChild(m);setTimeout(()=>m.remove(),1800);}
function showPlanPreview(){
 const title=($('#planTitle')?.value?.trim() || currentTask?.planTitle || '施工方案').replace(/-/g,' ');
 const content=currentTask?.planContent || $('#planEditor')?.value || getPlanBodyText();
 const mask=document.createElement('div');
 mask.className='modal-mask';
 mask.innerHTML=`<div class="modal preview-modal"><div class="preview-toolbar"><h3>施工方案 Word 预览</h3><div class="actions"><button class="btn outline" data-action="cancel-modal">关闭</button><button class="btn primary" data-action="download-plan">下载 Word</button></div></div><div class="preview-body"><div class="word-page"><div class="word-brand">GOSUNCN 高新兴 · 创联科技</div><h1 class="word-title">${esc(title)}</h1><div class="word-meta">高新兴创联科技股份有限公司<br>${today().slice(0,7).replace('-',' 年 ')} 月</div><table class="word-sign"><tr><td>编制</td><td></td><td>日期</td><td></td></tr><tr><td>审核</td><td></td><td>日期</td><td></td></tr><tr><td>批准</td><td></td><td>日期</td><td></td></tr></table><div class="word-content">${esc(content).slice(0,4200)}</div></div></div></div>`;
 document.body.appendChild(mask);
}

 const content=currentTask?.planContent||getPlanBodyText();
 const title=(currentTask?.planTitle||'施工方案').replace(/[\\/:*?"<>|]/g,'_');
 const html=`<html><head><meta charset="utf-8"><style>body{font-family:SimSun,serif;font-size:12pt;line-height:1.8;padding:36px}h1{text-align:center;font-size:22pt;line-height:2.2}.sig{width:100%;border-collapse:collapse;margin:20px 0}.sig td{border:1px solid #333;padding:10px}pre{white-space:pre-wrap;font-family:SimSun,serif}

function downloadList(){
 const note=getSpecialNote();
 const title=($('#listTitle')?.value?.trim()||currentTask?.listTitle||'设备清单').replace(/[\/:*?"<>|]/g,'_');
 const rows=getVisibleListRows();
 const tableRows=rows.map(r=>`<tr>${r.map(v=>`<td>${nl(v)}</td>`).join('')}</tr>`).join('');
 const reviewer=(currentTask&&currentTask.notifiedReviewer)||'____';
 const sigRows=`<tr><td colspan="2">编制</td><td colspan="4">唯安</td><td colspan="2">日期</td><td colspan="4">____</td></tr><tr><td colspan="2">审核</td><td colspan="4">${esc(reviewer)}</td><td colspan="2">日期</td><td colspan="4">____</td></tr><tr><td colspan="2">批准</td><td colspan="4">____</td><td colspan="2">日期</td><td colspan="4">____</td></tr>`;
 const html=`<html><head><meta charset="utf-8"><style>table{border-collapse:collapse;font-family:SimSun,serif;font-size:10pt}td,th{border:1px solid #000;padding:5px;white-space:pre-wrap}.title{font-size:14pt;font-weight:bold;text-align:center}.sig{text-align:left}.red{color:#d00;font-weight:bold}</style></head><body><table><tr><td colspan="12" class="title">${esc(title)}${note?`<span class="red">（${esc(note)}）</span>`:''}</td></tr><tr>${FORMAL_HEADERS.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${tableRows}${sigRows}</table></body></html>`;
 downloadBlob(html,title+'.xls','application/vnd.ms-excel;charset=utf-8');
}
function downloadBlob(content,filename,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);}function renderFileTags(){const box=$('#fileTags');box.innerHTML='';uploadedFiles.forEach((f,i)=>{const tag=document.createElement('span');tag.className='file-tag';const icon=/\.zip$/i.test(f.name)?'🗜️ ':/pdf$/i.test(f.name)?'📕 ':/doc/i.test(f.name)?'📝 ':/xls/i.test(f.name)?'📊 ':'📎 ';tag.innerHTML=`${icon}${esc(f.name)} <button data-action="preview-file" data-idx="${i}">预览</button><button data-action="remove-file" data-idx="${i}">×</button>`;box.appendChild(tag);});}
$('#send').onclick=()=>{submit(input.value);input.value='';input.style.height='auto';};input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#send').click();}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,130)+'px';});$('#fileInput').addEventListener('change',e=>{uploadedFiles.forEach(f=>{if(f.url)URL.revokeObjectURL(f.url);});uploadedFiles=[...e.target.files].map(f=>{f.url=URL.createObjectURL(f);return f;});renderFileTags();if(uploadedFiles.length){hideWelcome();toast('资料已上传，可在输入框底部预览。');}e.target.value='';});
</script>
